رِيبُ اغْفِرْ لِي وَارْحَمْنِي بِرَحْمَتِكَ الَّتِي وَسِعْتَ بِهَا كُلَّ شَيْءٍ وَيَسِّرْ لِي أَمْرِي وَسَخِّرْ لِي جَمِيعَ خَلْقِكَ مِنَ الْأَرْوَاحِ الرُّوحَانِيَّةِ إِنَّكَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ فَلَكَ الْعِزَّةُ وَالْقَهْرُ وَبِيَدِكَ الْخَلْقُ وَالْأَمْرُ وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِكَ يَا قَوِيُّ يَا قَهَّارُ يَا قَرِيبُ يَا مُجِيبَ الدُّعَاءِ .)\n\nوَفَّقَكُمُ اللهُ لِمَا فِيهِ الْخَيْرُ إِنَّهُ عَلَى كُلِّ شَيْءٍ قَدِيرٌ", "latin": "Da'watut-taskhīri nas'alullāhal-ijābata.\n\nAs-salāmu 'alaikum wa rahmatullāhi wa barakātuhū.\n\nHādzihī da'watut-taskhīri tutlā marratan wāhidatan qabla kulli 'amalin:\n\n( Allāhumma yā Musakhkhiras-samāwātis-sab'i wal-aradhīnas-sab'i wa man fīhinna wa man 'alaihinna sakhkhir lī kulla 'ibādika mimmā fī barrika wa bahrika yā Rabbal-'ālamīna hattā lā yakūna fil-kauni syai'un mutaharrikun au sākinun nāthiqun au shāmitun zhāhirun au bāthinun illā sakhkhartahū lī wa yakūna thau'a amrī bibarakatismikal-makhzūnil-maknūni yā Allāhu yā Hayyu yā Qayyūmu innamā amruhū idzā arāda syai'an an yaqūla lahū kun fayakūnu. Ilāhī jūduka dallanī 'alaika wa ihsānuka qarrabanī ilaika asykū ilaika mā lā yakhfā 'alaika wa as'aluka mā lā ya'suru 'alaika idz 'ilmuka bihālī yughnī 'an su'ālī yā Mufarrijan 'an kulli makrūbin karbahū wa munjiyahū farrij 'annī karbī wa mā anā fīhi yā man laisa bighā'ibin fa-antazhirahū wa lā binā'imin fa-ūqizhahū wa lā bighāfilin fa-unabbihahū wa lā bināsin fa-udzakkirahū wa lā bi'ājizin fa-umhilahū yā 'Āliman bil-jumlati wa Ghaniyyan 'anit-tafshīli wa yā Sāmi'an lil-qā'ili wal-qīli kafā 'ilmuka 'anil-maqāli wanqatha'ar-rajā'u illā minka yā Muta'āli wa khābatil-āmālu illā fīka yā Dzal-jalāli wal-ikrāmi wa suddatith-thuruqu illā ilaika yā Mifdhālu yā Allāhu yā Samī'u yā Mujību yā Qarību ighfir lī warhamnī birahmatikal-latī wasi'ta bihā kulla syai'in wa yassir lī amrī wa sakhkhir lī jamī'a khalqika minal-arwāhir-rūhāniyyati innaka 'alā kulli syai'in qadīrun falakal-'izzatu wal-qahru wa biyadikal-khalqu wal-amru wa lā haula wa lā quwwata illā bika yā Qawiyyu yā Qahhāru yā Qarību yā Mujībad-du'ā'i. )\n\nWaffaqakumullāhu limā fīhil-khairu innahū 'alā kulli syai'in qadīrun.", "terj": "Doa Taskhīr (penundukan), kami memohon kepada Allah pengabulannya.\n\nAssalamu'alaikum warahmatullahi wabarakatuh.\n\nInilah Doa Taskhīr yang dibaca satu kali sebelum setiap amalan:\n\n( Ya Allah, wahai Dzat Yang Menundukkan tujuh lapis langit dan tujuh lapis bumi beserta siapa saja yang berada di dalamnya dan di atasnya, tundukkanlah bagiku seluruh hamba-Mu dari apa yang ada di daratan-Mu dan di lautan-Mu, wahai Tuhan semesta alam; sehingga tidak ada sesuatu pun di alam semesta ini, baik yang bergerak maupun yang diam, yang berbicara maupun yang bisu, yang tampak lahir maupun yang tersembunyi batin, melainkan Engkau telah menundukkannya bagiku dan menjadikannya patuh pada urusanku dengan keberkahan Nama-Mu yang tersimpan lagi terjaga rapat; wahai Allah, wahai Yang Maha Hidup, wahai Yang Maha Berdiri Sendiri mengurus makhluk-Nya; Sesungguhnya urusan-Nya apabila Dia menghendaki sesuatu hanyalah berkata kepadanya: “Jadilah!” maka terjadilah ia — QS. Yāsīn: 82. Tuhanku, kemurahan-Mu telah menunjukiku kepada-Mu, dan kebaikan-Mu telah mendekatkanku kepada-Mu; aku mengadukan kepada-Mu apa yang tidak tersembunyi bagi-Mu, dan aku memohon kepada-Mu apa yang tidak sulit bagi-Mu, karena sesungguhnya pengetahuan-Mu tentang keadaanku telah mencukupkan aku dari permintaanku. Wahai Dzat Yang Melapangkan kesusahan dari setiap orang yang dirundung duka serta menyelamatkannya, lapangkanlah dariku kesusahanku dan apa yang sedang aku alami; wahai Dzat yang tidak pernah gaib (tidak hadir) sehingga aku harus menunggu-Nya, tidak pernah tidur sehingga aku harus membangunkan-Nya, tidak pernah lalai sehingga aku harus menyadarkan-Nya, tidak pernah lupa sehingga aku harus mengingatkan-Nya, dan tidak pernah lemah sehingga aku harus memberi-Nya tangguh; wahai Dzat Yang Maha Mengetahui secara keseluruhan dan tidak membutuhkan perincian, wahai Dzat Yang Maha Mendengar orang yang berkata maupun perkataan yang diucapkan; cukuplah ilmu-Mu tanpa perlu untaian kata-kata, telah terputus segala harapan kecuali dari-Mu wahai Yang Maha Tinggi, telah hampa segala cita-cita kecuali kepada-Mu wahai Pemilik Keagungan dan Kemuliaan, dan telah tertutup seluruh jalan kecuali menuju kepada-Mu wahai Yang Maha Melimpahkan karunia. Wahai Allah, wahai Yang Maha Mendengar, wahai Yang Maha Mengabulkan, wahai Yang Maha Dekat; ampunilah aku dan rahmatilah aku dengan rahmat-Mu yang dengannya Engkau meliputi segala sesuatu, mudahkanlah bagiku urusanku, dan tundukkanlah bagiku seluruh makhluk-Mu dari kalangan ruh-ruh ruhaniyyah; sesungguhnya Engkau Maha Kuasa atas segala sesuatu. Maka hanya milik-Mu kemuliaan dan keperkasaan penundukan, di tangan-Mu segala penciptaan dan perintah, serta tiada daya dan tiada kekuatan melainkan dengan pertolongan-Mu, wahai Yang Maha Kuat, wahai Yang Maha Menundukkan, wahai Yang Maha Dekat, wahai Yang Maha Mengabulkan doa ).\n\nSemoga Allah memberikan taufik kepada kalian menuju apa yang di dalamnya terdapat kebaikan; sesungguhnya Dia Maha Kuasa atas segala sesuatu.", "syarah": "1. **Perpaduan Munajat Para Wali & Taskhīr Ruhaniyyah**:\n   - Paragraf tengah doa ini (`إِلَهِي جُودُكَ دَلَّنِي عَلَيْكَ... كَفَى عِلْمُكَ عَنِ الْمَقَالِ`) merupakan munajat agung para ulama sufi dan auliya' yang menegaskan adab penghambaan tertinggi: bahwa penundukan (*taskhīr*) alam semesta maupun arwah ruhaniyyah hanya terjadi ketika seorang hamba menyadari kefakiran mutlaknya di hadapan ilmu dan kekuasaan Allah (`إِنَّمَا أَمْرُهُ إِذَا أَرَادَ شَيْئًا أَنْ يَقُولَ لَهُ كُنْ فَيَكُونُ`).", "khus": "1. **Langkah ke-7 dalam Urutan Baku Amalan Ruhani (SOP Halaman 33)**:\n   - Sebagaimana telah ditetapkan Syeikh al-Basyir pada Halaman 33, *Da'watut-Taskhīr* ini dibaca **cukup 1 kali (`مَرَّةً وَاحِدَةً قَبْلَ كُلِّ عَمَلٍ`)** tepat pada langkah ke-7: yaitu setelah menyelesaikan *Tahshīn* (langkah ke-5) dan *Ishrāful-'Ummār* (langkah ke-6), serta tepat sebelum memulai amalan inti yang dituju (langkah ke-8).\n2. **Fungsi Utama**: Membuka pintu izin Ilahi agar seluruh anasir alam, huruf, angka wafaq, serta *al-arwāhur-rūhāniyyah* (ruh-ruh pelaksana amalan) tunduk dan patuh menjalankan hajat pengamal tanpa hambatan."}, {"hal": "40", "title": "HALAMAN 40 — الدَّعْوَةُ الْقَاهِرَةُ", "imgs": ["hal_40.png"], "arab": "الدَّعْوَةُ الْقَاهِرَةُ\n\nالسَّلَامُ عَلَيْكُمْ وَرَحْمَةُ اللهِ وَبَرَكَاتُهُ ، إِخْوَتِي فِي اللهِ أَضَعُ بَيْنَ أَيْدِيكُمْ دَعْوَةً كَثِيرًا وَقَعَ فِيهَا التَّحْرِيفُ إِمَّا فِيهَا أَوْ فِي الْأَعْمَالِ الْمَنْسُوبَةِ إِلَيْهَا أَوْ فِي تَسْمِيَتِهَا بِدَعْوَةِ حَرْفِ الْقَافِ وَلَيْسَ هَذَا اسْمَهَا بَلْ هِيَ الدَّعْوَةُ الْقَاهِرَةُ ، وَهِيَ تَصْلُحُ لِكُلِّ طَالِبِ عِلْمِ الرُّوحَانِيَّاتِ يَتَّخِذُهَا وِرْدًا دُبُرَ صَلَاةِ الصُّبْحِ وَالْعِشَاءِ يَتْلُوهَا ٣ مَرَّةً وَهِيَ نَافِعَةٌ بِإِذْنِ اللهِ لِطُلَّابِ هَذَا الْعِلْمِ وَالدَّعْوَةُ هِيَ كَالتَّالِي\n\n[ إِلَهِي أَنْتَ الْقَائِمُ عَلَى كُلِّ نَفْسٍ وَالْقَيُّومُ فِي كُلِّ مَعْنًى وَحِسٍّ قَدَرْتَ فَقَهَرْتَ وَعَلَوْتَ فَقَدَرْتَ فَلَكَ الْعِزَّةُ وَالْقَهْرُ وَبِيَدِكَ الْخَلْقُ وَالْأَمْرُ أَنْتَ مَعَ كُلِّ شَيْءٍ بِالْقُرْبِ وَوَرَاءَهُ بِالْقُدْرَةِ وَالْإِحَاطَةِ وَأَنْتَ الْقَائِلُ وَاللهُ مِنْ وَرَائِهِمْ مُحِيطٌ إِلَهِي أَسْأَلُكَ مَدَدًا رُوحَانِيًّا مِنْ أَسْمَائِكَ الْقَهْرِيَّةِ تَقْوَى بِهِ قُوَايَ الْقَلْبِيَّةُ وَالْقَابِلِيَّةُ حَتَّى لَا يَلْقَانِي صَاحِبُ قَلْبٍ إِلَّا انْقَلَبَ عَلَى عَقِبَيْهِ مَقْهُورًا وَأَسْأَلُكَ إِلَهِي لِسَانًا نَاطِقًا وَقَوْلًا صَادِقًا وَفَهْمًا لَائِقًا وَسِرًّا ذَائِقًا وَقَلْبًا قَابِلًا وَعَقْلًا عَاقِلًا وَفِكْرًا مُشْرِقًا وَطَرْفًا مُطْرِقًا وَشَوْقًا مُحْرِقًا وَهَبْنِي يَدًا قَادِرَةً وَقُوَّةً قَاهِرَةً وَنَفْسًا مُطْمَئِنَّةً وَجَوَارِحَ لِطَاعَتِكَ لَيِّنَةً وَقَدِّسْنِي لِلْقُدُومِ عَلَيْكَ وَارْزُقْنِي التَّقَرُّبَ إِلَيْكَ إِلَهِي قَلْبِي أَقْبَلَ إِلَيْكَ فِي فَقْرِ الْفَقْرِ يَقُودُهُ الشَّوْقُ وَيَسُوقُهُ التَّوْقُ زَادُهُ الْخَوْفُ وَرَفِيقُهُ الْقَلَقُ وَقَصْدُهُ الْقَبُولُ وَالتَّقَرُّبُ وَعِنْدَكَ زُلْفَى الْقَاصِدِينَ إِلَهِي أَلْقِ عَلَيَّ السَّكِينَةَ وَالْوَقَارَ وَجَنِّبْنِي الْعَظَمَةَ وَالِاسْتِكْبَارَ وَأَوْقِفْنِي فِي مَقَامِ الْقَبُولِ وَالْإِنَابَةِ وَقَابِلْ قَوْلِي بِالْإِجَابَةِ إِلَهِي قَرِّبْنِي إِلَيْكَ قُرْبَ الْعَارِفِينَ وَقَدِّسْنِي مِنْ عَلَائِقِ الطَّبْعِ وَأَزِلْ عَنِّي عَلَائِقَ الذَّمِّ وَأَكُونَ مِنَ الْمُتَطَهِّرِينَ وَقَابِلْنِي بِنُورٍ مِنْ عِنَايَتِكَ يَمْلَأُ وُجُودِي ظَاهِرًا وَبَاطِنًا وَأَسْأَلُكَ إِلَهِي مَدَدًا رُوحَانِيًّا تَقْوَى بِهِ قُوَايَ الْكُلِّيَّةُ وَالْجُزْئِيَّةُ حَتَّى أَقْهَرَ كُلَّ نَفْسٍ قَاهِرَةٍ فَيَنْقَبِضَ لِي رَقَائِقُهَا انْقِبَاضًا تَسْقُطُ بِهِ قُوَاهَا فَلَا يَبْقَى فِي الْكَوْنِ ذُو رُوحٍ إِلَّا وَنَارُ الْقَهْرِ قَدْ أَخْمَدَتْ ظُهُورَهُ يَا شَدِيدَ الْبَطْشِ يَا قَهَّارُ وَأَوْقِفْنِي مَوَاقِفَ الْعِزِّ يَا قَيُّومُ يَا قَدِيرُ تَقَدَّسَ مَجْدُكَ يَا ذَا الْقُوَّةِ الْمَتِينُ يَا قُدُّوسُ إِلَهِي أَسْأَلُكَ الْأُنْسَ بِمُقَابَلَاتِ سِرِّ الْقُدْرَةِ أُنْسًا يَمْحُو آثَارَ الْفِكْرِ عَنِّي حَتَّى يَطِيبَ قَلْبِي بِكَ فَيَطِيبَ وَقْتِي لَكَ فَلَا يَتَحَرَّكَ ذُو طَبْعٍ لِمُخَالَفَتِي إِلَّا هُمَّ لِعَظَمَتِكَ وَقُصِمَ لِكِبْرِيَائِكَ أَنْتَ جَبَّارُ الْأَرْضِ وَالسَّمَاءِ وَقَاهِرُ الْكُلِّ بِقَهْرِكَ يَا قَوِيُّ يَا قَهَّارُ يَا قَرِيبُ يَا مُجِيبَ الدُّعَاءِ ]\n\nتَمَّتِ الدَّعْوَةُ إِخْوَتِي فِي اللهِ نَفَعَنِي اللهُ وَإِيَّاكُمْ بِالْقُرْآنِ الْعَظِيمِ وَصَلَّى اللهُ وَسَلَّمَ عَلَى سَيِّدِنَا مُحَمَّدٍ وَعَلَى آلِهِ وَصَحْبِهِ أَجْمَعِينَ", "latin": "Ad-da'watul-qāhiratu.\n\nAs-salāmu 'alaikum wa rahmatullāhi wa barakātuhū, ikhwatī fillāhi adha'u baina aidīkum da'watan katsīran waqa'a fīhat-tahrīfu immā fīhā au fil-a'mālil-mansūbati ilaihā au fī tasmiyatihā bida'wati harfil-qāfi wa laisa hādzā-smahā bal hiyad-da'watul-qāhiratu, wa hiya tashluhu likulli thālibi 'ilmir-rūhāniyyāti yattakhidzuhā wirdan dubura shalātish-shubhi wal-'isyā'i yatlūhā 3 marratan wa hiya nāfi'atun bi-idznillāhi lithullābi hādzal-'ilmi wad-da'watu hiya kat-tālī:\n\n[ Ilāhī antal-Qā'imu 'alā kulli nafsin wal-Qayyūmu fī kulli ma'nan wa hissin qadarta faqaharta wa 'alauta faqadarta falakal-'izzatu wal-qahru wa biyadikal-khalqu wal-amru anta ma'a kulli syai'in bil-qurbi wa warā'ahū bil-qudrati wal-ihāthati wa antal-qā'ilu wallāhu min warā'ihim muhīthun. Ilāhī as'aluka madadan rūhāniyyan min asmā'ikal-qahriyyati taqwā bihī quwāyal-qalbiyyatu wal-qābiliyyatu hattā lā yalqānī shāhibu qalbin illanqalaba 'alā 'aqibaihi maqhūran wa as'aluka ilāhī lisānan nāthiqan wa qaulan shādiqan wa fahman lā'iqan wa sirran dzā'iqan wa qalban qābilan wa 'aqlan 'āqilan wa fikran musyriqan wa tharfan muthriqan wa syauqan muhriqan wa habnī yadan qādiratan wa quwwatan qāhiratan wa nafsan muthma'innatan wa jawāriha lithā'atika layyinatan wa qaddisnī lil-qudūmi 'alaika warzuqnit-taqarruba ilaika. Ilāhī qalbī aqbala ilaika fī faqril-faqri yaqūduhusy-syauqu wa yasūquhut-tauqu zāduhul-khaufu wa rafīquhul-qalaqu wa qashduhul-qabūlu wat-taqarrubu wa 'indaka zulfal-qāshidīna. Ilāhī alqi 'alayyas-sakīnata wal-waqāra wa jannibnil-'azhamata wal-istikbāra wa auqifnī fī maqāmil-qabūli wal-inābati wa qābil qaulī bil-ijābati. Ilāhī qarribnī ilaika qurbal-'ārifīna wa qaddisnī min 'alā'iqith-thab'i wa azil 'annī 'alā'iqadz-dzammi wa akūna minal-mutathahhirīna wa qābilnī binūrin min 'ināyatika yamla'u wujūdī zhāhiran wa bāthinan. Wa as'aluka ilāhī madadan rūhāniyyan taqwā bihī quwāyal-kulliyyatu wal-juz'iyyatu hattā aqhara kulla nafsin qāhiratin fayanqabidha lī raqā'iquhā-nqibādhan tasquthu bihī quwāhā falā yabqā fil-kauni dzū rūhin illā wa nārul-qahri qad akhmadat zhuhūrahū yā Syadīdal-bathsyi yā Qahhāru wa auqifnī mawāqifal-'izzi yā Qayyūmu yā Qadīru taqaddasa majduka yā Dzal-quwwatil-Matīnu yā Quddūsu. Ilāhī as'alukal-unsa bimuqābalāti sirril-qudrati unsan yamhū ātsāral-fikri 'annī hattā yathība qalbī bika fayathība waqtī laka falā yataharraka dzū thab'in limukhālafatī illā humma li'azhamatika wa qushima likibriyā'ika anta Jabbārul-ardhi was-samā'i wa Qāhirul-kulli biqahrika yā Qawiyyu yā Qahhāru yā Qarību yā Mujībad-du'ā'i ]\n\nTammatid-da'watu ikhwatī fillāhi nafa'aniyallāhu wa iyyākum bil-Qur'ānil-'azhīmi wa shallallāhu wa sallama 'alā sayyidinā Muhammadin wa 'alā ālihī wa shahbihī ajma'īna.", "terj": "Doa al-Qāhirah (yang menundukkan dengan perkasa).\n\nAssalamu'alaikum warahmatullahi wabarakatuh. Wahai saudara-saudaraku karena Allah, aku letakkan di hadapan kalian sebuah doa yang sering kali mengalami penyimpangan (tahrīf), baik pada lafaz di dalamnya, pada amalan-amalan yang dinisbatkan kepadanya, maupun pada penamaannya dengan “Doa Huruf [ ق ] [Rajah Huruf — tidak diterjemahkan]”; padahal bukan itu namanya, melainkan ia adalah “Ad-Da'watul-Qāhirah”. Doa ini sangat patut bagi setiap penuntut ilmu ruhaniyyah untuk dijadikan wirid setiap selesai shalat Subuh dan Isya dengan membacanya sebanyak 3 kali, dan ia sangat bermanfaat dengan izin Allah bagi para penuntut ilmu ini. Adapun doanya adalah sebagai berikut:\n\n[ Tuhanku, Engkaulah Yang Mengawasi setiap jiwa, dan Yang Maha Berdiri Sendiri mengurus segala sesuatu pada setiap makna maupun indra; Engkau berkuasa lalu Engkau menundukkan, dan Engkau Maha Tinggi lalu Engkau berkuasa; maka hanya milik-Mu kemuliaan dan keperkasaan penundukan, serta di tangan-Mu segala penciptaan dan perintah. Engkau bersama segala sesuatu dengan kedekatan ilmu-Mu, dan di balik semuanya dengan kekuasaan serta peliputan-Mu; dan Engkaulah Yang berfirman: Padahal Allah mengepung dari belakang mereka — QS. al-Burūj: 20. Tuhanku, aku memohon kepada-Mu pancaran bantuan ruhani (madad rūhānī) dari Asma-Asma-Mu yang bersifat Qahriyyah (menundukkan), yang dengannya dikuatkan daya-daya kalbuku dan daya penerimaanku, sehingga tidak seorang pun pemilik hati (keberanian) yang berhadapan denganku melainkan ia berbalik ke belakang dalam keadaan tunduk takluk! Dan aku memohon kepada-Mu, Tuhanku, lisan yang fasih berbicara, perkataan yang benar, pemahaman yang patut, batin terdalam (sirr) yang merasakan manisnya ma'rifat, hati yang menerima kebenaran, akal yang cerdas memahami, pikiran yang bersinar terang, pandangan mata yang menunduk tawadhu', serta kerinduan yang membakar; dan karuniakanlah kepadaku tangan yang berkuasa, kekuatan yang menundukkan, jiwa yang tenang (nafs muthma'innah), serta anggota-anggota tubuh yang lembut patuh untuk menaati-Mu; sucikanlah aku untuk menghadap kepada-Mu, dan anugerahkanlah kepadaku kedekatan menuju-Mu. Tuhanku, hatiku datang menghadap kepada-Mu dalam puncak kefakiran, dituntun oleh kerinduan dan digiring oleh dambaan; bekalnya adalah rasa takut (khauf), temannya adalah kegelisahan harap, dan tujuannya adalah diterima serta didekatkan di sisi-Mu, sedangkan di sisi-Mu terdapat kedekatan derajat bagi orang-orang yang menuju kepada-Mu. Tuhanku, limpahkanlah ke atas diriku ketenangan (sakīnah) dan kewibawaan (waqār), jauhkanlah aku dari sifat angkuh merasa besar diri dan kesombongan (istikbār), tegakkanlah aku pada maqam diterima dan kembali bertaubat (inābah), serta sambutlah ucapanku dengan pengabulan (ijābah). Tuhanku, dekatkanlah aku kepada-Mu dengan kedekatan para 'ārifīn, sucikanlah aku dari ikatan-ikatan tabiat nafsu, hilangkanlah dariku ikatan-ikatan sifat tercela sehingga aku termasuk golongan orang-orang yang menyucikan diri, dan sambutlah aku dengan cahaya dari pertolongan perhatian-Mu ('ināyah) yang memenuhi seluruh keberadaanku secara lahir maupun batin. Dan aku memohon kepada-Mu, Tuhanku, pancaran bantuan ruhani yang dengannya dikuatkan daya-dayaku secara menyeluruh (kulliyyah) maupun terperinci (juz'iyyah), sehingga aku dapat menundukkan setiap jiwa yang menentang dengan perkasa, lalu menyusutlah lapisan-lapisan halusnya di hadapanku dengan penyusutan yang meruntuhkan kekuatan-kekuatannya, sehingga tidak tersisa di alam semesta ini satu makhluk bernyawa pun melainkan api keperkasaan (nārul-qahr) telah memadamkan penampakannya; wahai Dzat Yang Sangat Keras siksaan-Nya, wahai Yang Maha Menundukkan! Dan tegakkanlah aku di tempat-tempat kemuliaan, wahai Yang Maha Berdiri Sendiri, wahai Yang Maha Kuasa; Mahasuci keagungan kemuliaan-Mu, wahai Pemilik Kekuatan lagi Maha Kokoh, wahai Yang Mahasuci. Tuhanku, aku memohon kepada-Mu ketenteraman batin (al-uns) dalam menyaksikan tajalli rahasia kekuasaan-Mu, dengan ketenteraman yang menghapuskan jejak-jejak kerisauan pikiran dariku, sehingga hatiku menjadi tenteram bersama-Mu dan waktuku menjadi baik bagi-Mu; maka tidaklah bergerak satu pemilik tabiat pun untuk menentangku melainkan ia diluluhkan karena keagungan-Mu dan dipatahkan karena kebesaran-Mu; Engkaulah Penguasa Yang Maha Perkasa di bumi dan di langit serta Penakluk segala sesuatu dengan keperkasaan-Mu; wahai Yang Maha Kuat, wahai Yang Maha Menundukkan, wahai Yang Maha Dekat, wahai Yang Maha Mengabulkan doa ].\n\nSelesailah doa tersebut, wahai saudara-saudaraku karena Allah. Semoga Allah memberikan manfaat kepadaku dan kepada kalian dengan Al-Qur'an yang agung, serta semoga Allah melimpahkan shalawat dan salam atas junjungan kita Muhammad beserta keluarga dan seluruh sahabat beliau.", "syarah": "1. **Pelurusan Sejarah Teks: *Ad-Da'watul-Qāhirah* (Hizb al-Qahr Syādzilī) vs “Da'wah Harf Qāf”**:\n   - Syeikh al-Basyir memberikan catatan filologis yang sangat berharga: banyak salinan manuskrip keliru menamai doa ini sebagai *Da'watu Harfil-Qāf* karena banyaknya kata berhuruf *Qāf* (`القائم، القيوم، قدرت، فقهرت، القرب، القدرة، القائل، القهرية، القلبية، القابلية...`). Padahal nama aslinya di kalangan para masyaikh thariqah dan ahli hikmah adalah **`الدَّعْوَةُ الْقَاهِرَةُ`** (*Ad-Da'watul-Qāhirah*), yang memadukan tawadhu' penghambaan (*faqrul-faqr*, dijauhkan dari *al-'azhamah wal-istikbār*) dengan pancaran wibawa *al-Qahhār*.", "khus": "1. **Wirid Harian Penuntut Ilmu Ruhani (`Wirdan Dubura Shalātish-Shubhi wal-'Isyā'`)**:\n   - Dibaca secara istiqamah sebanyak **3 kali setiap selesai shalat Subuh** dan **3 kali setiap selesai shalat Isya**.\n2. **Khasiat Utama (`Taqwiyatul-Quwal-Qalbiyyah wal-Haibah`)**:\n   - Menguatkan daya batin (*al-quwal-qalbiyyah wal-qābiliyyah*) sehingga pengamal tidak mudah goyah, takut, atau terpengaruh oleh intimidasi musuh maupun gangguan jin pembangkang, sekaligus menanamkan *sakīnah* (ketenangan) dan *waqār* (wibawa ruhani)."}, {"hal": "41", "title": "HALAMAN 41 — وَإِلَيْكُمُ التَّحْصِينُ الْمَوْعُودُ بِهِ", "imgs": ["hal_41.png"], "arab": "وَإِلَيْكُمُ التَّحْصِينُ الْمَوْعُودُ بِهِ\n\nالسَّلَامُ عَلَيْكُمْ وَرَحْمَةُ اللهِ وَبَرَكَاتُهُ ، إِخْوَتِي فِي اللهِ إِلَيْكُمُ التَّحْصِينُ\n\nالْفَاتِحَةُ ١ الم إِلَى الْمُفْلِحُونَ ١ آيَةُ الْكُرْسِيِّ إِلَى خَالِدُونَ ١ لِلَّهِ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ إِلَى آخِرِ الْبَقَرَةِ ١ بِسْمِ اللهِ وَبِاللهِ وَمِنَ اللهِ وَإِلَى اللهِ وَفِي اللهِ وَلَا إِلَهَ إِلَّا اللهُ وَمَا النَّصْرُ إِلَّا مِنْ عِنْدِ اللهِ وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللهِ الْعَلِيِّ الْعَظِيمِ بِاسْمِ اللهِ احْتَجَبْتُ وَبِحَوْلِ اللهِ اعْتَصَمْتُ وَبِقُوَّةِ اللهِ اسْتَمْسَكْتُ مَا شَاءَ اللهُ لَا قُوَّةَ إِلَّا بِاللهِ تَوَكَّلْتُ عَلَى اللهِ وَحَسْبِيَ اللهُ وَلَا إِلَهَ إِلَّا اللهُ الْحَيُّ الْقَيُّومُ الْعَلِيُّ الْعَظِيمُ اللَّهُمَّ احْجُبْنِي مِنْ جَمِيعِ أَصْنَافِ الْجِنِّ وَأَنْوَاعِهَا وَأَجْنَاسِهَا بِكَلِمَاتِكَ التَّامَّاتِ الْمُبَارَكَاتِ وَبِاسْمِكَ الْعَظِيمِ الْأَعْظَمِ الْمُبَجَّلِ الْمُكَرَّمِ حِجَابًا مَانِعًا سَقْفُهُ مَدَدُ نُورِ اسْمِكَ الْحَيِّ الْقَيُّومِ حِيطَانُهُ سَلَامٌ قَوْلًا مِنْ رَبٍّ رَحِيمٍ دَائِرَتُهُ لَهُ مُعَقِّبَاتٌ مِنْ بَيْنِ يَدَيْهِ وَمِنْ خَلْفِهِ يَحْفَظُونَهُ مِنْ أَمْرِ اللهِ وَاللهُ مِنْ وَرَائِهِمْ مُحِيطٌ إِنَّ عِبَادِي لَيْسَ لَكَ عَلَيْهِمْ سُلْطَانٌ وَكَفَى بِرَبِّكَ وَكِيلًا اللَّهُمَّ احْفَظْنِي مِنْ فَوْقِي وَمِنْ تَحْتِي وَمِنْ أَمَامِي وَمِنْ خَلْفِي وَعَنْ يَمِينِي وَعَنْ شِمَالِي بِمَا حَفِظْتَ بِهِ الذِّكْرَ الْحَكِيمَ إِنَّكَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ وَصَلِّ اللَّهُمَّ عَلَى سَيِّدِنَا مُحَمَّدٍ وَعَلَى آلِهِ وَصَحْبِهِ وَسَلِّمْ تَسْلِيمًا .\n\nيُتْلَى ٧ مَرَّاتٍ قَبْلَ كُلِّ عَمَلٍ ، وَإِنْ أَرَدْتَهُ وِرْدًا فَتِلَاوَتُهُ ٥ مَرَّاتٍ بَعْدَ صَلَاةِ الصُّبْحِ ٥ مَرَّاتٍ بَعْدَ صَلَاةِ الْمَغْرِبِ وَفَّقَكُمُ اللهُ لِمَا يُحِبُّهُ وَيَرْضَاهُ", "latin": "Wa ilaikumut-tahshīnul-mau'ūdu bihī.\n\nAs-salāmu 'alaikum wa rahmatullāhi wa barakātuhū, ikhwatī fillāhi ilaikumut-tahshīnu:\n\nAl-Fātihata 1, [ الم ] [Rajah Huruf — tidak diterjemahkan] ilal-muflihūna 1, Āyatal-Kursiyyi ilā khālidūna 1, Lillāhi mā fis-samāwāti wa mā fil-ardhi ilā ākhiril-Baqarati 1, bismillāhi wa billāhi wa minallāhi wa ilallāhi wa fillāhi wa lā ilāha illallāhu wa man-nashru illā min 'indillāhi wa lā haula wa lā quwwata illā billāhil-'Aliyyil-'Azhīmi, bismillāhi-htajabtu wa bihaulillāhi-'tashamtu wa biquwwatillāhi-stamsaktu mā syā'allāhu lā quwwata illā billāhi tawakkaltu 'alallāhi wa hasbiyallāhu wa lā ilāha illallāhul-Hayyul-Qayyūmul-'Aliyyul-'Azhīmu, Allāhummahjubnī min jamī'i ashnāfil-jinni wa anwā'ihā wa ajnāsihā bikalimātikat-tāmmātil-mubārakāti wa bismikal-'azhīmil-a'zhamil-mubajjalil-mukarrami hijāban māni'an saqfuhū madadu nūrismikal-Hayyil-Qayyūmi hīthānuhū salāmun qaulan min Rabbin Rahīmin dā'iratuhū lahū mu'aqqibātun min baini yadaihi wa min khalfihī yahfazhūnahū min amrillāhi wallāhu min warā'ihim muhīthun inna 'ibādī laisa laka 'alaihim sulthānun wa kafā birabbika wakīlan, Allāhummahfazhnī min fauqī wa min tahtī wa min amāmī wa min khalfī wa 'an yamīnī wa 'an syimālī bimā hafizhta bihidz-dzikral-hakīma innaka 'alā kulli syai'in qadīrun wa shallillāhumma 'alā sayyidinā Muhammadin wa 'alā ālihī wa shahbihī wa sallim taslīman.\n\nYutlā 7 marrātin qabla kulli 'amalin, wa in aradtahū wirdan fatilāwatuhū 5 marrātin ba'da shalātish-shubhi 5 marrātin ba'da shalātil-maghribi waffaqakumullāhu limā yuhibbuhū wa yardhāhu.", "terj": "Dan inilah untuk kalian Tahshīn (benteng penjagaan diri) yang telah dijanjikan.\n\nAssalamu'alaikum warahmatullahi wabarakatuh. Wahai saudara-saudaraku karena Allah, inilah bacaan Tahshīn:\n\nMembaca Surah al-Fatihah 1 kali, [ الم ] [Rajah Huruf — tidak diterjemahkan] hingga al-muflihūn (QS. al-Baqarah: 1–5) 1 kali, Ayat Kursi hingga khālidūn (QS. al-Baqarah: 255–257) 1 kali, Lillāhi mā fis-samāwāti wa mā fil-ardh hingga akhir Surah al-Baqarah (QS. al-Baqarah: 284–286) 1 kali. Dengan menyebut nama Allah, dengan pertolongan Allah, dari Allah, menuju kepada Allah, dan di jalan Allah; tidak ada tuhan yang berhak disembah selain Allah, tidak ada kemenangan melainkan dari sisi Allah, serta tiada daya dan tiada kekuatan melainkan dengan pertolongan Allah Yang Maha Tinggi lagi Maha Agung. Dengan nama Allah aku berhijab (membentengi diri), dengan daya upaya Allah aku berlindung teguh, dan dengan kekuatan Allah aku berpegang erat; atas kehendak Allah (mā syā'allāh), tiada kekuatan melainkan dengan pertolongan Allah; aku bertawakal kepada Allah, cukuplah Allah bagiku, dan tidak ada tuhan selain Allah Yang Maha Hidup, Yang Maha Berdiri Sendiri mengurus makhluk-Nya, Yang Maha Tinggi, lagi Maha Agung. Ya Allah, hijablah (bentengilah) aku dari seluruh golongan jin beserta segala macam dan jenisnya dengan kalimat-kalimat-Mu yang sempurna lagi diberkahi, dan dengan Nama-Mu Yang Maha Agung lagi Paling Agung, yang diagungkan lagi dimuliakan, dengan hijab (benteng) yang kokoh menghalangi: yang atapnya adalah pancaran cahaya Nama-Mu al-Hayyul-Qayyūm; dinding-dindingnya adalah firman-Mu: “(Kepada mereka dikatakan): Salām (keselamatan), sebagai ucapan dari Tuhan Yang Maha Penyayang” (QS. Yāsīn: 58); dan lingkarannya adalah firman-Mu: “Baginya (manusia) ada malaikat-malaikat yang selalu menjaganya bergiliran, dari depan dan belakangnya; mereka menjaganya atas perintah Allah” (QS. ar-Ra'd: 11), “Padahal Allah mengepung dari belakang mereka” (QS. al-Burūj: 20), serta “Sesungguhnya hamba-hamba-Ku, tidak ada kekuasaan bagimu atas mereka; dan cukuplah Tuhanmu sebagai Penjaga” (QS. al-Isrā': 65 / al-Hijr: 42). Ya Allah, jagalah aku dari arah atasku, dari arah bawahku, dari arah depanku, dari arah belakangku, dari sebelah kananku, dan dari sebelah kiriku, sebagaimana Engkau telah menjaga adz-Dzikrul-Hakīm (Al-Qur'an yang penuh hikmah); sesungguhnya Engkau Maha Kuasa atas segala sesuatu. Dan limpahkanlah shalawat, ya Allah, atas junjungan kita Muhammad beserta keluarga dan para sahabat beliau, serta limpahkanlah keselamatan yang sebenar-benarnya.\n\nDibaca sebanyak 7 kali sebelum setiap amalan; dan apabila engkau menginginkannya sebagai wirid harian, maka bacaannya adalah 5 kali setelah shalat Subuh dan 5 kali setelah shalat Maghrib. Semoga Allah memberikan taufik kepada kalian menuju apa yang dicintai dan diridhai-Nya.", "syarah": "1. **Arsitektur Benteng Ruhani Berlapis (*Al-Hijābul-Māni'*)**:\n   - *Tahshīn* yang dijanjikan Syeikh al-Basyir sejak halaman-halaman awal kitab ini memiliki struktur penjagaan yang sangat lengkap:\n     - **Fondasi Qur'ani**: Surah al-Fatihah + 11 ayat pilihan Surah al-Baqarah (ayat 1–5, 255–257, 284–286) yang dalam hadis-hadis sahih dikenal sebagai penjaga rumah dan pengamal dari gangguan setan.\n     - **Atap Benteng (`سَقْفُهُ`)**: Pancaran cahaya Ism *al-Hayyul-Qayyūm*.\n     - **Dinding Benteng (`حِيطَانُهُ`)**: Ayat *Salāmun qaulan min Rabbin Rahīm* (QS. Yāsīn: 58).\n     - **Sabuk Lingkaran Luar (`دَائِرَتُهُ`)**: Tiga ayat penjagaan malaikat dan perlindungan Ilahi (QS. ar-Ra'd: 11, QS. al-Burūj: 20, dan QS. al-Isrā': 65) ditambah penjagaan 6 arah mata angin dengan pemeliharaan *adz-Dzikrul-Hakīm* (QS. al-Hijr: 9).", "khus": "1. **Sebagai Benteng Sebelum Amalan Ruhani (Langkah ke-5 SOP Halaman 33)**:\n   - Dibaca sebanyak **7 kali** tepat sebelum melakukan *Ishrāful-'Ummār* dan amalan inti (baik saat menulis wafaq maupun membaca *da'wah*).\n2. **Sebagai Wirid Penjagaan Diri Harian**:\n   - Dibaca sebanyak **5 kali setiap selesai shalat Subuh** dan **5 kali setiap selesai shalat Maghrib** untuk menjaga diri dan keluarga dari serangan sihir, gangguan jin dari segala jenis (*ashnāf, anwā', ajnās*), serta bahaya lahir batin sepanjang siang dan malam."}, {"hal": "42", "title": "HALAMAN 42 — دَعْوَةُ آيَةِ الْكُرْسِيِّ الشَّرِيفَةِ", "imgs": ["hal_42.png"], "arab": "دَعْوَةُ آيَةِ الْكُرْسِيِّ الشَّرِيفَةِ\n\nإِخْوَتِي فِي اللهِ أَضَعُ لَكُمُ الْيَوْمَ دَعْوَةً مِنْ أَهَمِّ الدَّعَوَاتِ الْمُوَصِّلَاتِ بِإِذْنِ اللهِ إِلَى حَضْرَةِ السَّادَاتِ ، وَمَا يُمَيِّزُ هَذِهِ الدَّعْوَةَ هُوَ أَنَّ لَهَا رُوحَانِيَّةً ذَاتَ أَنْوَارٍ سَاطِعَاتٍ يَكْشِفُهَا اللهُ لِمَنْ شَاءَ مِنْ عِبَادِهِ الْمُؤْمِنِينَ ، وَمَنْ دَاوَمَ عَلَى قِرَاءَتِهَا بِحُضُورِ قَلْبِهِ رَأَى سِرَّ اللهِ الْمُودَعَ فِي آيَاتِ كِتَابِهِ وَأَسْبَلَ عَلَيْهِ كَثِيفَ أَنْوَارِهِ ، وَالدَّعْوَةُ هِيَ لِآيَةِ الْكُرْسِيِّ الشَّرِيفَةِ .\n\nبِسْمِ اللهِ الرَّحْمَنِ الرَّحِيمِ\n\nالْحَمْدُ لِلَّهِ الَّذِي خَلَقَ الْعَالَمَ وَيَسَّرَ الْعُلُومَ وَأَجْرَى الْأَفْلَاكَ وَسَخَّرَ النُّجُومَ وَاسْتَوَى فِي عِلْمِهِ الْمَنْطُوقُ وَالْمَفْهُومُ وَيَعْلَمُ الْأَمْرَ الظَّاهِرَ وَالْبَاطِنَ وَالسِّرَّ الْمَكْتُومَ وَلِكُلِّ حَيٍّ عِنْدَهُ رِزْقٌ مَقْسُومٌ وَأَجَلٌ مَحْتُومٌ لِيَوْمٍ مَعْلُومٍ سُبْحَانَهُ هُوَ اللهُ لَا إِلَهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ أَفْنَى الْقُرُونَ الْمَاضِيَةَ قَوْمًا بَعْدَ قَوْمٍ وَأَبَادَ الدُّهُورَ الْخَالِيَةَ يَوْمًا بَعْدَ يَوْمٍ وَعَدَلَ فِي حُكْمِهِ فَلَمْ يَلْحَقْهُ لَوْمٌ سُبْحَانَهُ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ تَعَبَّدَهُ الْبَرَايَا فَرْضًا بَعْدَ فَرْضٍ وَأَجْزَلَ الْعَطَايَا فَأَفْضَلَ فِي الْبَسْطِ وَعَدَلَ فِي الْقَبْضِ وَهُوَ الْقَابِضُ الْبَاسِطُ سُبْحَانَهُ لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ أَسْبَلَ عَلَى الْعُصَاةِ كَثِيفَ سِتْرِهِ بِجَمِيلِ فَضْلِهِ وَمَنِّهِ وَسَكَّنَ رَوْعَاتِ الْخَائِفِينَ مِنْهُ بِأَمْنِهِ وَمَنَّ عَلَى الْمُؤْمِنِينَ بِلُطْفِهِ وَيَسَّرَ الطَّاعَةَ لِعِبَادِهِ بِحُسْنِ عَوْنِهِ وَتَوْفِيقِهِ سُبْحَانَهُ مَنْ ذَا الَّذِي يَشْفَعُ عِنْدَهُ إِلَّا بِإِذْنِهِ خَلَقَ الْعِبَادَ وَرَزَقَهُمْ وَأَهْلَ الرَّشَادِ لِطَاعَتِهِ وَفَّقَهُمْ وَلِمَرْضَاتِهِ اصْطَفَاهُمْ وَاجْتَبَاهُمْ وَشَرَّفَهُمْ وَأَهْلَ الْعِنَادِ بِعَذَابِهِ خَوَّفَهُمْ وَعَذَّبَهُمْ سُبْحَانَهُ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ خَلَقَ مَا شَاءَ كَمَا شَاءَ وَاخْتَصَّ مَنْ شَاءَ بِمَا شَاءَ وَنَصَرَ مَنْ شَاءَ بِمَا شَاءَ وَحَكَمَ عَلَى مَنْ شَاءَ بِمَا شَاءَ وَقَدَّرَ الْأَشْيَاءَ كَيْفَ شَاءَ وَيَفْعَلُ فِي مُلْكِهِ مَا يَشَاءُ سُبْحَانَهُ وَلَا يُحِيطُونَ بِشَيْءٍ مِنْ عِلْمِهِ إِلَّا بِمَا شَاءَ مُكَوِّنُ الدَّارَيْنِ وَخَالِقُهُمَا وَمُنْشِئُ الثَّقَلَيْنِ وَمَالِكُهُمَا رَبُّ الْمَشْرِقَيْنِ وَالْمَغْرِبَيْنِ وَمَا بَيْنَهُمَا سُبْحَانَهُ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ وَلَا يَئُودُهُ حِفْظُهُمَا فَتَبَارَكَ اللهُ رَبُّنَا ذُو الْجَلَالِ وَالْإِكْرَامِ الرَّحْمَنُ الرَّحِيمُ الْحَيُّ الْقَيُّومُ الْعَلِيُّ الْعَظِيمُ لَمْ يُشَارِكْهُ أَحَدٌ فِي الْأَزَلِ قَدِيمُ الْإِحْسَانِ خَلَقَ الْجَنَّةَ فَأَعَدَّهَا لِعِبَادِهِ الْمُؤْمِنِينَ وَأَمَدَّهُمْ فِيهَا بِالتَّنْعِيمِ وَرَحِمَهُمْ وَقَرَّبَهُمْ وَأَكْرَمَهُمْ فِيهَا بِالنَّظَرِ إِلَى وَجْهِهِ الْكَرِيمِ وَخَلَقَ النَّارَ وَسَمَّاهَا بِالْجَحِيمِ وَأَعَدَّهَا لِأَعْدَائِهِ وَعَذَّبَهُمْ فِيهَا بِالْعَذَابِ الْأَلِيمِ يُضِلُّ مَنْ يَشَاءُ وَيَهْدِي مَنْ يَشَاءُ إِلَى صِرَاطٍ مُسْتَقِيمٍ سُبْحَانَهُ وَهُوَ الْعَلِيُّ الْعَظِيمُ اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ عَبْدِكَ وَرَسُولِكَ الْمُخْتَارِ صَاحِبِ الْمُعْجِزَاتِ وَالْآثَارِ وَالدَّلَالَاتِ وَالْأَسْرَارِ وَالْكَرَامَاتِ وَالْأَنْوَارِ صَلَّى اللهُ عَلَيْهِ وَعَلَى آلِهِ الْأَخْيَارِ وَعَلَى صَحَابَتِهِ الْأَبْرَارِ وَالتَّابِعِينَ لَهُمْ بِإِحْسَانٍ إِلَى يَوْمِ الدِّينِ اللَّهُمَّ أَنْزِلْ عَلَيْنَا يَا رَبَّنَا فِي هَذِهِ السَّاعَةِ وَفِي كُلِّ سَاعَةٍ مِنْ خَيْرِكَ وَبَرَكَاتِكَ أَفْضَلَ مَا أَنْزَلْتَهُ عَلَى عِبَادِكَ وَأَوْلِيَائِكَ وَخَصَصْتَ بِهِ أَحِبَّاءَكَ وَأَصْفِيَاءَكَ وَظَلِّلْنَا بِرِضَاءِ عَفْوِكَ وَلَذِّذْنَا بِحَلَاوَةِ مَغْفِرَتِكَ وَانْشُرْ عَلَيْنَا رَحْمَتَكَ الَّتِي وَسِعْتَ بِهَا كُلَّ شَيْءٍ وَارْزُقْنَا مِنْكَ مَحَبَّةً وَقَبُولًا وَتَوْبَةً نَصُوحًا وَإِنَابَةً وَإِجَابَةً تَعُمُّ الْحَاضِرِينَ وَالْغَائِبِينَ بِرَحْمَتِكَ يَا أَرْحَمَ الرَّاحِمِينَ يَا رَبَّ الْعَالَمِينَ اللَّهُمَّ لَا تُخَيِّبْنَا فِيمَا سَأَلْنَاكَ وَلَا تَحْرِمْنَا فِيمَا رَجَوْنَاكَ وَاحْفَظْنَا فِي الْمَحْيَا وَالْمَمَاتِ يَا قَرِيبُ يَا سَمِيعُ يَا مُجِيبَ الدَّعَوَاتِ وَأَكْرِمْنَا بِجَمِيعِ الْخَيْرَاتِ فَإِنَّهُ لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِكَ فِي جَمِيعِ الْحَالَاتِ وَصَلِّ اللَّهُمَّ عَلَى سَيِّدِنَا مُحَمَّدٍ وَعَلَى آلِهِ وَسَلِّمْ تَسْلِيمًا . تَمَّتِ الدَّعْوَةُ الْمُبَارَكَةُ أَسْأَلُ اللهَ الْعَلِيَّ الْقَدِيرَ أَنْ يَنْفَعَكُمْ بِهَا وَيُسْبِلَ عَلَيْكُمْ أَنْوَارَهَا إِنَّهُ وَلِيُّ ذَلِكَ وَالْقَادِرُ عَلَيْهِ .\n\nإِخْوَتِي فِي اللهِ أَرْجُو مِنْكُمُ الْمَعْذِرَةَ لِنِسْيَانِي عَدَدَ التِّلَاوَةِ ؛ وَلَهَا ٣ أَعْدَادٍ وَهُمْ\n٧ أَوْ ١١ أَوْ ٤٩ وَكُلُّهَا نَافِعَةٌ بِإِذْنِ اللهِ", "latin": "Da'watu Āyatil-Kursiyyisy-syarīfati.\n\nIkhwatī fillāhi adha'u lakumul-yauma da'watan min ahammid-da'awātil-muwashshilāti bi-idznillāhi ilā hadhratis-sādāti, wa mā yumayyizu hādzihid-da'wata huwa anna lahā rūhāniyyatan dzāta anwārin sāthi'ātin yaksyifuhallāhu liman syā'a min 'ibādihil-mu'minīna, wa man dāwama 'alā qirā'atihā bihudhūri qalbihī ra'ā sirrallāhil-mūda'a fī āyāti kitābihī wa asbala 'alaihi katsīfa anwārihī, wad-da'watu hiya li-Āyatil-Kursiyyisy-syarīfati.\n\nBismillāhir-rahmānir-rahīmi.\n\nAl-hamdu lillāhil-ladzī khalaqal-'ālama wa yassaral-'ulūma wa ajral-aflāka wa sakhkharan-nujūma wastawā fī 'ilmihil-manthūqu wal-mafhūmu wa ya'lamul-amrazh-zhāhira wal-bāthina was-sirral-maktūma wa likulli hayyin 'indahū rizqun maqsūmun wa ajalun mahtūmun liyaumin ma'lūmin subhānahū huwallāhu lā ilāha illā huwal-Hayyul-Qayyūmu. Afnal-qurūnal-mādhiyata qauman ba'da qaumin wa abādad-duhūral-khāliyata yauman ba'da yaumin wa 'adala fī hukmihī falam yalhaqhu laumun subhānahū lā ta'khudzuhū sinatun wa lā naumun. Ta'abbadahul-barāyā fardhan ba'da fardhin wa ajzalal-'athāyā fa-afdhala fil-basthi wa 'adala fil-qabdhi wa huwal-Qābidhul-Bāsithu subhānahū lahū mā fis-samāwāti wa mā fil-ardhi. Asbala 'alal-'ushāti katsīfa sitrihī bijamīli fadhlihī wa mannihī wa sakkana rau'ātil-khā'ifīna minhu bi-amnihī wa manna 'alal-mu'minīna biluthfihī wa yassarath-thā'ata li'ibādihī bihusni 'aunihī wa taufīqihī subhānahū man dzal-ladzī yasyfa'u 'indahū illā bi-idznihī. Khalaqal-'ibāda wa razaqahum wa ahlar-rasyādi lithā'atihī waffaqahum wa limardhātihi-shhafāhum wajtabāhum wa syarrafahum wa ahlal-'inādi bi'adzābihī khawwafahum wa 'adzdzabahum subhānahū ya'lamu mā baina aidīhim wa mā khalfahum. Khalaqa mā syā'a kamā syā'a wakhtashsha man syā'a bimā syā'a wa nashara man syā'a bimā syā'a wa hakama 'alā man syā'a bimā syā'a wa qaddaral-asyyā'a kaifa syā'a wa yaf'alu fī mulkihī mā yasyā'u subhānahū wa lā yuhīthūna bisyai'in min 'ilmihī illā bimā syā'a. Mukawwinud-dāraini wa khāliquhumā wa munsyi'uts-tsaqalaini wa mālikuhumā Rabbul-masyriqaini wal-maghribaini wa mā bainahumā subhānahū wasi'a kursiyyuhus-samāwāti wal-ardha wa lā ya'ūduhū hifzhuhumā. Fatabārakallāhu Rabbunā Dzul-jalāli wal-ikrāmi ar-Rahmānur-Rahīmul-Hayyul-Qayyūmul-'Aliyyul-'Azhīmu lam yusyārik-hu ahadun fil-azali qadīmul-ihsāni khalaqal-jannata fa-a'addahā li'ibādihil-mu'minīna wa amaddahum fīhā bit-tan'īmi wa rahimahum wa qarrabahum wa akramahum fīhā bin-nazhari ilā wajhihil-karīmi wa khalaqan-nāra wa sammāhā bil-jahīmi wa a'addahā li-a'dā'ihī wa 'adzdzabahum fīhā bil-'adzābil-alīmi yudhillu man yasyā'u wa yahdī man yasyā'u ilā shirāthin mustaqīmin subhānahū wa huwal-'Aliyyul-'Azhīmu. Allāhumma shalli 'alā sayyidinā Muhammadin 'abdika wa rasūlikal-mukhtāri shāhibil-mu'jizāti wal-ātsāri wad-dalālāti wal-asrāri wal-karāmāti wal-anwāri shallallāhu 'alaihi wa 'alā ālihil-akhyāri wa 'alā shahābatihil-abrāri wat-tābi'īna lahum bi-ihsānin ilā yaumid-dīni. Allāhumma anzil 'alainā yā Rabbanā fī hādzihis-sā'ati wa fī kulli sā'atin min khairika wa barakātika afdhala mā anzaltahū 'alā 'ibādika wa auliyā'ika wa khashashta bihī ahibbā'aka wa ashfiyā'aka wa zhallilnā biridhā'i 'afwika wa ladzdzidznā bihalāwati maghfiratika wansyur 'alainā rahmatakal-latī wasi'ta bihā kulla syai'in warzuqnā minka mahabbatan wa qabūlan wa taubatan nashūhan wa inābatan wa ijābatan ta'ummul-hādhirīna wal-ghā'ibīna birahmatika yā Arhamar-rāhimīna yā Rabbal-'ālamīna. Allāhumma lā tukhayyibnā fīmā sa'alnāka wa lā tahrimnā fīmā rajaunāka wahfazhnā fil-mahyā wal-mamāti yā Qarību yā Samī'u yā Mujībad-da'awāti wa akrimnā bijamī'il-khairāti fa-innahū lā haula wa lā quwwata illā bika fī jamī'il-hālāti wa shallillāhumma 'alā sayyidinā Muhammadin wa 'alā ālihī wa sallim taslīman. Tammatid-da'watul-mubārakatu as'alullāhal-'Aliyyal-Qadīra an yanfa'akum bihā wa yusbila 'alaikum anwārahā innahū waliyyu dzālika wal-qādiru 'alaihi.\n\nIkhwatī fillāhi arjū minkumul-ma'dzirata linisyānī 'adadat-tilāwati; wa lahā 3 a'dādin wa hum:\n7 au 11 au 49 wa kulluhā nāfi'atun bi-idznillāhi.", "terj": "Doa Ayat Kursi yang mulia.\n\nWahai saudara-saudaraku karena Allah, pada hari ini aku letakkan untuk kalian sebuah doa yang termasuk doa-doa terpenting yang dapat menyampaikan pengamalnya dengan izin Allah ke hadirat para pemimpin wali (hadhratus-sādāt). Adapun keistimewaan doa ini ialah bahwa ia memiliki ruhaniyyah yang memancarkan cahaya-cahaya yang terang benderang, yang disingkapkan oleh Allah bagi siapa saja yang dikehendaki-Nya di antara hamba-hamba-Nya yang beriman. Barang siapa mendawamkan (merutinkan) pembacaannya dengan kehadiran hatinya, niscaya ia akan menyaksikan rahasia Allah yang dititipkan di dalam ayat-ayat Kitab-Nya, dan Allah akan mencurahkan ke atasnya limpahan cahaya-Nya yang lebat. Adapun doa ini adalah Doa Ayat Kursi yang mulia:\n\nDengan menyebut nama Allah Yang Maha Pengasih lagi Maha Penyayang.\n\nSegala puji bagi Allah yang telah menciptakan alam semesta, memudahkan berbagai ilmu, memperjalankan falak-falak, dan menundukkan bintang-bintang; sama jelas di dalam ilmu-Nya apa yang terucap maupun apa yang tersirat (dipahami); Dia mengetahui perkara yang tampak lahir, yang tersembunyi batin, maupun rahasia yang tersimpan rapat; dan bagi setiap makhluk hidup di sisi-Nya terdapat rezeki yang telah dibagikan serta batas ajal yang telah ditetapkan untuk suatu hari yang telah ditentukan. Mahasuci Dia: “Dialah Allah, tidak ada tuhan yang berhak disembah selain Dia, Yang Maha Hidup lagi Maha Berdiri Sendiri mengurus makhluk-Nya” (QS. al-Baqarah: 255). Dia telah membinasakan generasi-generasi terdahulu umat demi umat, dan mengakhiri masa-masa yang lampau hari demi hari, serta berlaku adil dalam ketetapan hukum-Nya sehingga tiada celaan sedikit pun yang menyentuh-Nya. Mahasuci Dia: “Tidak mengantuk dan tidak pula tidur”. Seluruh makhluk menghambakan diri kepada-Nya dari satu kewajiban ke kewajiban berikutnya, dan Dia melimpahkan pemberian-pemberian yang besar; maka Dia Maha Melimpahkan karunia saat melapangkan (al-basth) dan Maha Adil saat menyempitkan (al-qabdh), dan Dialah Yang Maha Menyempitkan lagi Maha Melapangkan. Mahasuci Dia: “Milik-Nyalah apa yang ada di langit dan apa yang ada di bumi”. Dia menurunkan tirai penutup aib-Nya yang rapat ke atas para pelaku maksiat berkat keindahan karunia dan kemurahan-Nya, menenangkan ketakutan orang-orang yang gentar kepada-Nya dengan jaminan keamanan-Nya, menganugerahkan nikmat kepada orang-orang mukmin dengan kelembutan-Nya, serta memudahkan ketaatan bagi hamba-hamba-Nya dengan kebaikan pertolongan dan taufik-Nya. Mahasuci Dia: “Tiada yang dapat memberi syafaat di sisi-Nya tanpa izin-Nya”. Dia menciptakan hamba-hamba dan memberi mereka rezeki; terhadap ahli petunjuk, Dia memberi mereka taufik untuk menaati-Nya, serta untuk meraih keridhaan-Nya Dia memilih mereka, mendekatkan mereka, dan memuliakan mereka; sedangkan terhadap ahli pembangkangan, dengan azab-Nya Dia mempertakuti mereka dan mengazab mereka. Mahasuci Dia: “Dia mengetahui apa yang ada di hadapan mereka dan apa yang ada di belakang mereka”. Dia menciptakan apa yang dikehendaki-Nya sebagaimana yang dikehendaki-Nya, mengkhususkan siapa yang dikehendaki-Nya dengan apa yang dikehendaki-Nya, menolong siapa yang dikehendaki-Nya dengan apa yang dikehendaki-Nya, menetapkan hukum atas siapa yang dikehendaki-Nya dengan apa yang dikehendaki-Nya, menetapkan ukuran segala sesuatu bagaimana pun yang dikehendaki-Nya, dan Dia berbuat di dalam kerajaan-Nya apa saja yang dikehendaki-Nya. Mahasuci Dia: “Dan mereka tidak mengetahui sesuatu apa pun dari ilmu-Nya melainkan apa yang dikehendaki-Nya”. Dialah Pembentuk dua negeri (dunia dan akhirat) sekaligus Pencipta keduanya, Pencipta dua bangsa yang dibebani syariat (manusia dan jin) sekaligus Pemilik keduanya, serta Tuhan dua timur dan dua barat beserta apa yang ada di antara keduanya. Mahasuci Dia: “Kursi-Nya meliputi langit dan bumi, dan Dia tidak merasa berat memelihara keduanya”. Maka Mahaberkah Allah, Tuhan kami, Pemilik Keagungan dan Kemuliaan, Yang Maha Pengasih, Maha Penyayang, Maha Hidup, Maha Berdiri Sendiri, Maha Tinggi, lagi Maha Agung; tiada seorang pun yang bersekutu dengan-Nya sejak zaman azali, Yang Qadim (Terdahulu tanpa awal) kebaikan-Nya; Dia telah menciptakan surga lalu menyiapkannya bagi hamba-hamba-Nya yang beriman, melimpahi mereka di dalamnya dengan kenikmatan, merahmati mereka, mendekatkan mereka, dan memuliakan mereka di dalamnya dengan memandang kepada Wajah-Nya Yang Mulia; dan Dia telah menciptakan neraka serta menamakannya dengan al-Jahīm, menyiapkannya bagi musuh-musuh-Nya, dan mengazab mereka di dalamnya dengan azab yang pedih; Dia menyesatkan siapa yang dikehendaki-Nya dan memberi petunjuk siapa yang dikehendaki-Nya ke jalan yang lurus. Mahasuci Dia: “Dan Dia Maha Tinggi lagi Maha Agung”. Ya Allah, limpahkanlah shalawat atas junjungan kita Muhammad, hamba-Mu dan utusan-Mu yang terpilih, pemilik berbagai mukjizat, jejak-jejak peninggalan mulia, bukti-bukti kenabian, rahasia-rahasia, karamah-karamah, dan cahaya-cahaya; semoga Allah melimpahkan shalawat atas beliau, atas keluarga beliau yang terpilih, atas para sahabat beliau yang berbakti, serta orang-orang yang mengikuti mereka dengan kebaikan hingga hari pembalasan. Ya Allah, turunkanlah ke atas kami, wahai Tuhan kami, pada saat ini dan pada setiap saat, dari kebaikan-Mu dan keberkahan-keberkahan-Mu, seutama-utama apa yang telah Engkau turunkan ke atas hamba-hamba-Mu dan para wali-Mu serta yang Engkau khususkan dengannya para kekasih-Mu dan hamba-hamba pilihan-Mu; naungilah kami dengan keridhaan maaf-Mu, rasakanlah kepada kami lezatnya manisnya ampunan-Mu, bentangkanlah ke atas kami rahmat-Mu yang dengannya Engkau meliputi segala sesuatu, dan anugerahkanlah kepada kami dari sisi-Mu kecintaan, penerimaan, taubat nasuha, kembalinya hati kepada-Mu (inābah), serta pengabulan doa yang mencakup seluruh yang hadir maupun yang tidak hadir, dengan rahmat-Mu wahai Dzat Yang Paling Penyayang di antara para penyayang, wahai Tuhan semesta alam. Ya Allah, janganlah Engkau kecewakan kami dalam apa yang kami mohonkan kepada-Mu, janganlah Engkau halangi kami dari apa yang kami harapkan kepada-Mu, dan jagalah kami dalam kehidupan maupun kematian, wahai Yang Maha Dekat, wahai Yang Maha Mendengar, wahai Yang Maha Mengabulkan doa-doa; dan muliakanlah kami dengan seluruh kebaikan, karena sesungguhnya tiada daya dan tiada kekuatan melainkan dengan pertolongan-Mu dalam segala keadaan; dan limpahkanlah shalawat, ya Allah, atas junjungan kita Muhammad beserta keluarga beliau, serta limpahkanlah keselamatan yang sebenar-benarnya. Selesailah doa yang diberkahi ini. Aku memohon kepada Allah Yang Maha Tinggi lagi Maha Kuasa agar memberikan manfaat kepada kalian dengannya dan mencurahkan ke atas kalian cahaya-cahayanya; sesungguhnya Dia adalah Pelindung dalam hal itu dan Maha Kuasa atasnya.\n\nWahai saudara-saudaraku karena Allah, aku memohon maaf kepada kalian atas kelupaanku mencantumkan jumlah bacaannya; doa ini memiliki 3 pilihan jumlah bilangan, yaitu:\n7 atau 11 atau 49 kali, dan semuanya bermanfaat dengan izin Allah.", "syarah": "1. **Keindahan Struktur *Tashmīth / Tazhyīl* Sembilan Kalimat Ayat Kursi**:\n   - *Da'watu Āyatil-Kursī asy-Syarīfah* ini disusun dengan seni sastra munajat tingkat tinggi: setiap kalimat dari 9 kalimat Ayat Kursi didahului oleh untaian kalimat pujian (*tahmīd & tanzīh*) yang berima senada dengan huruf akhir penggalan Ayat Kursi tersebut, lalu dijembatani dengan kata **`سُبْحَانَهُ`**:\n     1) Rima *Mīm* (`العلوم، النجوم، المفهوم، المكتوم، مقسوم، محتوم، معلوم`) → ditutup `سُبْحَانَهُ هُوَ اللهُ لَا إِلَهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ`.\n     2) Rima *Mīm* (`قوم، يوم، لوم`) → ditutup `سُبْحَانَهُ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ`.\n     3) Rima *Dhād* (`فرض، القبض`) → ditutup `سُبْحَانَهُ لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ`.\n     4) Rima *Hā'* (`منه، بأمنه، بلطفه، وتوفيقه`) → ditutup `سُبْحَانَهُ مَنْ ذَا الَّذِي يَشْفَعُ عِنْدَهُ إِلَّا بِإِذْنِهِ`.\n     5) Rima *Hum* (`ورزقهم، وفقهم، وشرفهم، وعذبهم`) → ditutup `سُبْحَانَهُ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ`.\n     6) Rima *Syā'a* (`ما شاء، كما شاء، بما شاء، كيف شاء، ما يشاء`) → ditutup `سُبْحَانَهُ وَلَا يُحِيطُونَ بِشَيْءٍ مِنْ عِلْمِهِ إِلَّا بِمَا شَاءَ`.\n     7) Rima *Humā* (`وخالقهما، ومالكهما، وما بينهما`) → ditutup `سُبْحَانَهُ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ وَلَا يَئُودُهُ حِفْظُهُمَا`.\n     8) Rima *Mīm* (`الرحيم، العظيم، بالتنعيم، الكريم، بالجحيم، الأليم، مستقيم`) → ditutup `سُبْحَانَهُ وَهُوَ الْعَلِيُّ الْعَظِيمُ`.", "khus": "1. **Tiga Tingkatan Bilangan Wirid (`٧ أَوْ ١١ أَوْ ٤٩`)**:\n   - **7 kali**: Untuk wirid penjagaan harian, keberkahan rezeki, dan ketenangan kalbu.\n   - **11 kali**: Untuk membuka pintu *futūh* (penyingkapan cahaya ilmu dan rahasia ayat-ayat Al-Qur'an).\n   - **49 kali (`7 × 7`)**: Untuk hajat-hajat besar dan *riyādhah* khusus mendekatkan diri menuju maqam *hadhratus-sādāt*.\n2. **Syarat Utama (`Bihudhūri Qalbihī`)**:\n   - Syeikh al-Basyir menekankan bahwa kunci terbukanya *anwār sāthi'āt* (cahaya-cahaya yang memancar terang) dari doa ini adalah *mudāwamah* (konsistensi) disertai **kehadiran hati (`بِحُضُورِ قَلْبِهِ`)** saat meresapi makna setiap penggalan Ayat Kursi."}, {"hal": "43", "title": "HALAMAN 43 — دُرُوسُ عِلْمِ الْحَرْفِ وَالْأَوْفَاقِ الشَّيْخِ الْبَشِيرِ", "imgs": ["hal_43.png"], "arab": "دُرُوسُ عِلْمِ\nالْحَرْفِ وَالْأَوْفَاقِ\nالشَّيْخِ الْبَشِيرِ", "latin": "Durūsu 'ilmi\nal-harfi wal-aufāqi\nasy-Syaikhil-Basyīri", "terj": "Pelajaran-pelajaran ilmu\nhuruf dan wafaq-wafaq\nSyeikh al-Basyir", "syarah": "1. **Kedudukan Bagian Ketiga dalam Sistematika Kitab**:\n   - Kitab karya Syeikh al-Basyir ini terbagi menjadi tiga bagian besar:\n     1) **Bagian Pertama (Halaman 1–30)**: *Fawā'id* praktis dan *mujarrabāt* berbasis wafaq serta rajah untuk pembatalan sihir, pengobatan ruhani, penolakan kezaliman, dan *kasyf manāmī*.\n     2) **Bagian Kedua (Halaman 31–42)**: *Da'awāt wa Riyādhāt* (9 pasal doa-doa agung, SOP 10 langkah amalan, *Tanbīhul-Labīb*, *Ishrāful-'Ummār*, *Tahshīn*, hingga *Da'watu Āyatil-Kursī*).\n     3) **Bagian Ketiga (Mulai Halaman 43 ini)**: ***Durūsu 'Ilmil-Harfi wal-Aufāq*** — yaitu pengajaran teoretis dan kaidah-kaidah matematis cara menyusun wafaq, menghitung nilai huruf (*hisābul-jumal*), serta mengeluarkan jumlah bacaan wirid dan nama khadim ruhani secara mandiri sebagaimana telah dijanjikan pengarang pada Halaman 34.", "khus": "1. **Kunci Kemandirian Penuntut Ilmu Hikmah**:\n   - Bagian Ketiga yang dibuka pada Halaman 43 ini adalah inti keilmuan (*ushūlul-'ilm*) yang membedakan seorang *thālib* (murid yang memahami kaidah) dari sekadar *muqallid* (penyalin wafaq).\n2. **Urutan Belajar**:\n   - Setiap penuntut ilmu wajib mempelajari pelajaran-pelajaran di dalam bagian ini secara berurutan sesuai daftar isi pada Halaman 44, dimulai dari *Mabādi'ul-Aufāq* (Prinsip-Prinsip Dasar Wafaq) dan rahasia *Wafaq Musallas* (3×3)."}, {"hal": "44", "title": "HALAMAN 44 — فِهْرِسُ دُرُوسِ الشَّيْخِ الْبَشِيرِ", "imgs": ["hal_44.png"], "arab": "فِهْرِسُ دُرُوسِ الشَّيْخِ الْبَشِيرِ\n\n١. مَبَادِئُ الْأَوْفَاقِ\n٢. كَشْفُ السِّتَارِ عَنِ الْمُثَلَّثِ وَمَا يَحْمِلُهُ مِنْ أَسْرَارٍ\n٣. إِثْبَاتُ الْجُمْلَةِ لِاسْتِخْرَاجِ أَسْرَارِ الرِّيَاضَاتِ\n٤. إِثْبَاتُ الْجُمْلَةِ الزَّائِدَةِ لِاسْتِخْرَاجِ أَسْرَارِ الرِّيَاضَاتِ\n٥. قَاعِدَةُ اسْتِخْرَاجِ عَدَدِ التِّلَاوَةِ لِكُلِّ طَالِبٍ\n٦. التِّرْيَاقُ لِكُلِّ طَالِبٍ لِمَعْرِفَةِ أَسْمَاءِ الْخَالِقِ\n٧. الْقَاعِدَةُ الصَّارِمَةُ فِي اسْتِخْرَاجِ الْخَادِمِ السُّفْلِيِّ\n٨. أَسْرَارُ الرِّجَالِ فِي اسْتِعْمَالِ آيَاتِ الْقُرْآنِ لِطَرْدِ الْجِنِّ وَالشَّيْطَانِ\n٩. الْوَصْفُ الْمُبِينُ بَعْدَ تَمْوِيهِ الْمُدَّعِينَ فِي كَيْفِيَّةِ اسْتِخْرَاجِ الرُّوحَانِيِّ\n١٠. الْجَوَابُ الشَّافِي", "latin": "Fihrisu durūsisy-Syaikhil-Basyīri\n\n1. Mabādi'ul-aufāqi\n2. Kasyfus-sitāri 'anil-mutsallatsi wa mā yahmiluhū min asrārin\n3. Itsbātul-jumlati listikhrāji asrārir-riyādhāti\n4. Itsbātul-jumlatiz-zā'idati listikhrāji asrārir-riyādhāti\n5. Qā'idatu-stikhrāji 'adadit-tilāwati likulli thālibin\n6. At-tiryāqu likulli thālibin lima'rifati asmā'il-Khāliqi\n7. Al-qā'idatush-shārimatu fi-stikhrājil-khādimis-sufliyyi\n8. Asrārur-rijāli fi-sti'māli āyātil-Qur'āni lithardil-jinni wasy-syaithāni\n9. Al-washful-mubīnu ba'da tamwīhil-mudda'īna fī kaifiyyati-stikhrājir-rūhāniyyi\n10. Al-jawābusy-syāfī", "terj": "Daftar isi pelajaran-pelajaran Syeikh al-Basyir\n\n1. Prinsip-prinsip dasar ilmu wafaq\n2. Penyingkapan tabir tentang wafaq musallas (3×3) dan rahasia-rahasia yang dikandungnya\n3. Penetapan jumlah hisab untuk mengeluarkan rahasia-rahasia riyadhah\n4. Penetapan jumlah hisab tambahan (al-jumlatuz-zā'idah) untuk mengeluarkan rahasia-rahasia riyadhah\n5. Kaidah mengeluarkan (menghitung) jumlah bacaan wirid bagi setiap penuntut ilmu\n6. Penawar mujarab (at-tiryāq) bagi setiap penuntut ilmu untuk mengetahui Asma-Asma Sang Pencipta\n7. Kaidah yang tegas dalam mengeluarkan nama khadim suflī (bawah)\n8. Rahasia-rahasia para tokoh ahli hikmah (ar-rijāl) dalam menggunakan ayat-ayat Al-Qur'an untuk mengusir jin dan setan\n9. Penjelasan yang nyata — setelah pengaburan para pengaku-ngaku — tentang tata cara mengeluarkan nama khadim ruhani\n10. Jawaban yang memuaskan (menyembuhkan keraguan)", "syarah": "1. **Pemenuhan Janji Pengarang pada Halaman 34**:\n   - Ingat kembali bahwa pada Halaman 34 (*Tanbīhul-Labīb*), Syeikh al-Basyir berjanji: *\"Dan aku akan meletakkan untuk kalian, wahai saudara-saudaraku karena Allah, tata cara menghitung lama hari dan jumlah bacaan khusus dalam hal ini...\"* (`وَسَأَضَعُ لَكُمْ إِخْوَتِي فِي اللهِ طَرِيقَةَ حِسَابِ الْمُدَّةِ وَعَدَدِ التِّلَاوَةِ بِهَذَا الْخُصُوصِ`).\n   - Janji tersebut ditepati secara sistematis pada Poin 3, 4, 5, dan 6 dalam daftar isi Halaman 44 ini (`إِثْبَاتُ الْجُمْلَةِ`, `إِثْبَاتُ الْجُمْلَةِ الزَّائِدَةِ`, `قَاعِدَةُ اسْتِخْرَاجِ عَدَدِ التِّلَاوَةِ لِكُلِّ طَالِبٍ`, dan `التِّرْيَاقُ لِكُلِّ طَالِبٍ لِمَعْرِفَةِ أَسْمَاءِ الْخَالِقِ`).", "khus": "1. **Kurikulum Berjenjang 10 Pelajaran (*Durūs*)**:\n   - **Pelajaran 1–2**: Fondasi teoretis *'Ilmul-Aufāq* dan anatomi *Wafaq Musallas* (3×3).\n   - **Pelajaran 3–6**: Rumus matematis menghitung durasi riyadhah, jumlah bacaan wirid harian (*'adadut-tilāwah*), dan Asmaul Husna yang selaras dengan nilai hisab nama setiap murid.\n   - **Pelajaran 7 & 9**: Kaidah *istikhrāj* (ekstraksi huruf) untuk mengetahui nama khadim ruhani (*'ulwī* maupun *suflī*) secara sahih tanpa terjebak pengaburan (*tamwīh*) kitab-kitab palsu.\n   - **Pelajaran 8 & 10**: Rahasia penggunaan ayat-ayat Al-Qur'an untuk pengobatan/pengusiran jin serta rangkuman jawaban penutup (*al-Jawābusy-Syāfī*)."}, {"hal": "45", "title": "HALAMAN 45 — مَبَادِئُ الْأَوْفَاقِ", "imgs": ["hal_45.png"], "arab": "مَبَادِئُ الْأَوْفَاقِ\n\nالسَّلَامُ عَلَيْكُمْ وَرَحْمَةُ اللهِ وَبَرَكَاتُهُ\n\nإِخْوَتِي فِي اللهِ مَا دُمْنَا سَنَفْتَحُ مَوْضُوعَ الْأَوْفَاقِ وَجَبَ عَلَيْنَا أَوَّلًا الْوُقُوفُ عِنْدَ هَذِهِ الْأُمُورِ الَّتِي لَا تَخْلُو مِنْ فَائِدَةٍ وَكَثِيرًا مَا يَقَعُ الْإِخْوَةُ فِي شِرَاكِهَا الْمَنْصُوبَةِ مِنْ طَرَفِ الْجَهَلَةِ وَالْمُدَّعِينَ أَعَاذَنَا اللهُ وَإِيَّاكُمْ مِنْهُمْ .\n\nاعْلَمُوا إِخْوَتِي فِي اللهِ أَنَّ الْأَوْفَاقَ تَنْقَسِمُ إِلَى قِسْمَيْنِ حَرْفِيَّةٍ وَعَدَدِيَّةٍ وَلِكُلِّ قِسْمٍ مِنَ الْقِسْمَيْنِ ٦ طُرُقٍ مُخْتَلِفَةٍ لَكِنَّهَا تَلْتَقِي فِي مَرْتَبَةِ مَا قَبْلَ التَّصْرِيفِ ، وَالطُّرُقُ ٦ تَنْقَسِمُ إِلَى قِسْمَيْنِ قِسْمٍ ظَاهِرِيٍّ وَقِسْمٍ بَاطِنِيٍّ هُنَا يَقَعُ الِاخْتِلَافُ التَّامُّ وَفِيهِ تَزِلُّ الْأَقْدَامُ ، فَالْقِسْمُ الظَّاهِرِيُّ هُوَ فِي حَدِّ ذَاتِهِ ظَاهِرُ الْبَاطِنِ وَلَيْسَ مِنَ السَّهْلِ الْوُصُولُ إِلَيْهِ إِلَّا بَعْدَ دِرَايَةٍ شَامِلَةٍ ، لِأَنَّهُ يَجْمَعُ كُلَّ الْقَوَاعِدِ الْحَرْفِيَّةِ وَالْعَدَدِيَّةِ وَلَهُ مَنْفَذَانِ وَحِيدَانِ هُمَا مَعْرِفَةُ اسْتِبْدَالِ الْحُرُوفِ وَطَرِيقَةُ وَضْعِ الْهَرَمِ الْحَرْفِيِّ لِاسْتِخْلَاصِ الْعَدَدِ وَالْوَزْنِ بِالْمِيزَانِ الْفَلْسَفِيِّ الْمُتَدَاوَلِ وَالْمَعْرُوفِ إِلَّا أَنَّ هُنَاكَ فِيهِ اخْتِلَافٌ حَيْثُ تَكُونُ مَرَاتِبُهُ ٧ أَحَدُهَا سَالِبٌ وَأَحَدُهَا مُوجَبٌ أَيِ الزَّائِدُ وَالنَّاقِصُ وَذَلِكَ يَخْتَلِفُ بِاخْتِلَافِ الْعَمَلِ الْمَطْلُوبِ وَهَذِهِ قِمَّةُ الْعِلْمِ الْحَرْفِيِّ الظَّاهِرِ ، أَمَّا طَرِيقَةُ الْبَاطِنِ فَهِيَ كَذَلِكَ حَرْفِيَّةٌ وَعَدَدِيَّةٌ فَالْحَرْفِيَّةُ تَعْتَمِدُ عَلَى قَوَاعِدَ مُهِمَّةٍ لَا بُدَّ لِكُلِّ طَالِبٍ الْوُقُوفُ عَلَيْهَا وَهِيَ مَعْرِفَةُ الْحُرُوفِ عَلَى هَذَا التَّفْصِيلِ ، [ النَّارِيَّةُ التُّرَابِيَّةُ الْهَوَائِيَّةُ الْمَائِيَّةُ النُّورَانِيَّةُ الظُّلْمَانِيَّةُ الْعُلْوِيَّةُ السُّفْلِيَّةُ الذُّكُورُ الْإِنَاثُ التَّوَالُدُ الْأَبْنَاءُ الْأَحْفَادُ اسْتِبْدَالُ الْحَرْفِ بِالْحَرْفِ السَّالِبَةِ فِي الْأَصْلِ الْمُوجَبَةِ فِي الْأَصْلِ تَرْتِيبُ الْحُرُوفِ ثُمَّ الْوَضْعُ ثُمَّ لَقْطُ الْحُرُوفِ وَرَبْطُهَا ] وَهَذَا رُكْنٌ أَسَاسٌ مَخْفِيٌّ وَهُنَا تَبْدَأُ الْمَشَاكِلُ الصِّعَابُ وَهِيَ لَا تَحْتَاجُ إِلَّا لِتَدَبُّرٍ بِرَوِيَّةٍ وَتَأَنٍّ لِلْوُقُوفِ عَلَيْهَا ، أَمَّا الْأَوْفَاقُ الْعَدَدِيَّةُ لَهَا نَفْسُ الْمَطَالِبِ لِلْأَوْفَاقِ الْحَرْفِيَّةِ إِلَّا اخْتِلَافٌ وَاحِدٌ وَهُوَ انْقِلَابُ الْحَرْفِ إِلَى عَدَدٍ وَاسْتِنْطَاقُ الْعَدَدِ لِاسْتِخْلَاصِ طَبْعٍ مُعَيَّنٍ إِمَّا مِنْهُ أَوْ مِنْ تَوَالُدِهِ مَعَ مُرَاعَاةِ الْوَضْعِ وَالطَّبْعِ وَرَبْطِ الْبُيُوتِ لِيَتِمَّ الْوَفْقُ بِإِذْنِ اللهِ الْوَاحِدِ الْقَهَّارِ .\n\nوَالْأَعْمَالُ الْحَرْفِيَّةُ وَالْوَفْقِيَّةُ [ ٣ مَرَاتِبَ وَأَرْجُو الْوُقُوفَ عَلَى هَذِهِ الْجُمْلَةِ جَيِّدًا وَدِرَاسَتَهَا بِتَدَبُّرٍ ]\nإِذَا كَانَ الْعَمَلُ طَالِبٌ وَمَطْلُوبٌ ٣ نُورَانِيَّةٌ وَ ٢ ظُلْمَانِيَّةٌ\nإِذَا كَانَ الْعَمَلُ طَالِبٌ وَطَلَبٌ ٥ نُورَانِيَّةٌ\nإِذَا كَانَ الْعَمَلُ مَطْلُوبٌ وَطَلَبٌ ٥ ظُلْمَانِيَّةٌ\n\nانْتَبِهُوا وَتَمَعَّنُوا فَقَدْ كَشَفْتُ عَنْ أَسْرَارٍ مُهِمَّةٍ فِي تَرْتِيبِ مَرَاتِبِ الْأَعْمَالِ فَانْتَبِهُوا لَهَا ، وَالْإِشَارَةُ فِي الْمُثَلَّثِ الطَّبِيعِيِّ", "latin": "Mabādi'ul-aufāqi.\n\nAs-salāmu 'alaikum wa rahmatullāhi wa barakātuhū.\n\nIkhwatī fillāhi mā dumnā sanaftahu maudhū'al-aufāqi wajaba 'alainā awwalanil-wuqūfu 'inda hādzihil-umūril-latī lā takhlū min fā'idatin wa katsīran mā yaqa'ul-ikhwatu fī syirākihal-manshūbati min tharafil-jahalati wal-mudda'īna a'ādzanallāhu wa iyyākum minhum.\n\nI'lamū ikhwatī fillāhi annal-aufāqa tanqasimu ilā qismaini harfiyyatin wa 'adadiyyatin wa likulli qismin minal-qismaini 6 thuruqin mukhtalifatin lakinnahā taltaqī fī martabati mā qablat-tashrīfi, wath-thuruqu 6 tanqasimu ilal-qismaini qismin zhāhiriyyin wa qismin bāthiniyyin hunā yaqa'ul-ikhtilāfut-tāmmu wa fīhi tazillul-aqdāmu, fal-qismuzh-zhāhiriyyu huwa fī haddi dzātihī zhāhirul-bāthini wa laisa minas-sahlil-wushūlu ilaihi illā ba'da dirāyatin syāmilatin, li-annahū yajma'u kullal-qawā'idil-harfiyyati wal-'adadiyyati wa lahū manfadzāni wahīdāni humā ma'rifatu-stibdālil-hurūfi wa tharīqatu wadh'il-haramil-harfiyyi listikhlāshil-'adadi wal-wazni bil-mīzānil-falsafiyyil-mutadāwali wal-ma'rūfi illā anna hunāka fīhi-khtilāfun haitsu takūnu marātibuhū 7 ahaduhā sālibun wa ahaduhā mūjabun ayiz-zā'idu wan-nāqishu wa dzālika yakhtalifu bikhtilāfil-'amalil-mathlūbi wa hādzihī qimmatul-'ilmil-harfiyyizh-zhāhiri, ammā tharīqatul-bāthini fahiya kadzālika harfiyyatun wa 'adadiyyatun fal-harfiyyatu ta'tamidu 'alā qawā'ida muhimmatin lā budda likulli thālibinil-wuqūfu 'alaihā wa hiya ma'rifatul-hurūfi 'alā hādzat-tafshīli, [ an-nāriyyatu at-turābiyyatu al-hawā'iyyatu al-mā'iyyatu an-nūrāniyyatu azh-zhulmāniyyatu al-'ulwiyyatu as-sufliyyatu adz-dzukūru al-inātsu at-tawāludu al-abnā'u al-ahfādu istibdālul-harfi bil-harfi as-sālibatu fil-ashli al-mūjabatu fil-ashli tartībul-hurūfi tsummal-wadh'u tsumma laqthul-hurūfi wa rabthuhā ] wa hādzā ruknun asāsun makhfiyyun wa hunā tabda'ul-masyākilush-shi'ābu wa hiya lā tahtāju illā litadabburin birawiyyatin wa ta'annin lil-wuqūfi 'alaihā, ammal-aufāqul-'adadiyyatu lahā nafsul-mathālibi lil-aufāqil-harfiyyati illā-khtilāfun wāhidun wa huwa-nqilābul-harfi ilā 'adadin wastinhtāqul-'adadi listikhlāshi thab'in mu'ayyanin immā minhu au min tawāludihī ma'a murā'ātil-wadh'i wath-thab'i wa rabthil-buyūti liyatimmal-wafqu bi-idznillāhil-Wāhidil-Qahhāri.\n\nWal-a'mālul-harfiyyatu wal-wafqiyyatu [ 3 marātiba wa arjul-wuqūfa 'alā hādzihil-jumlati jayyidan wa dirāsatahā bitadabburin ]:\nIdzā kānal-'amalu thālibun wa mathlūbun: 3 nūrāniyyatun wa 2 zhulmāniyyatun.\nIdzā kānal-'amalu thālibun wa thalabun: 5 nūrāniyyatun.\nIdzā kānal-'amalu mathlūbun wa thalabun: 5 zhulmāniyyatun.\n\nIntabihū wa tama''anū faqad kasyaftu 'an asrārin muhimmatin fī tartībi marātibil-a'māli fantabihū lahā, wal-isyāratu fil-mutsallatsith-thabī'iyyi.", "terj": "Prinsip-prinsip dasar ilmu wafaq.\n\nAssalamu'alaikum warahmatullahi wabarakatuh.\n\nWahai saudara-saudaraku karena Allah, selama kita akan membuka pembahasan tentang ilmu wafaq, maka wajib atas kita terlebih dahulu berhenti (merenungkan) perkara-perkara ini yang tidak lepas dari faedah; karena sering kali para saudara kita terjatuh ke dalam jerat-jerat perangkap yang dipasang oleh orang-orang bodoh dan para pengaku-ngaku — semoga Allah melindungi kami dan kalian dari mereka.\n\nKetahuilah wahai saudara-saudaraku karena Allah, bahwa wafaq-wafaq itu terbagi menjadi dua bagian: wafaq huruf (harfiyyah) dan wafaq angka ('adadiyyah). Setiap bagian dari kedua bagian tersebut memiliki 6 metode (thuruq) yang berbeda-beda, namun keenamnya bertemu pada tingkatan sebelum pengaktifan daya guna (mā qablat-tashrīf). Keenam metode itu terbagi lagi menjadi dua bagian: bagian lahiriah (zhāhirī) dan bagian batiniah (bāthinī); di sinilah letak perbedaan yang menyeluruh dan di sinilah banyak kaki tergelincir. Adapun bagian lahiriah pada hakikatnya adalah sisi lahir dari yang batin, dan tidaklah mudah untuk sampai kepadanya kecuali setelah memiliki penguasaan ilmu (dirāyah) yang menyeluruh, karena ia menghimpun seluruh kaidah huruf maupun angka, serta hanya memiliki dua pintu masuk tunggal, yaitu: mengetahui pergantian huruf (istibdālul-hurūf) dan tata cara menyusun piramida huruf (al-haramul-harfī) untuk menyarikan nilai bilangan ('adad) serta timbangan bobot (al-wazn) dengan neraca filosofis (al-mīzānul-falsafī) yang telah beredar dan dikenal luas; hanya saja di sana terdapat perbedaan karena tingkatannya ada 7: salah satunya bernilai negatif (sālib) dan salah satunya bernilai positif (mūjab), yakni bertambah (zā'id) dan berkurang (nāqish), yang berbeda-beda sesuai perbedaan jenis amalan yang dituju; dan inilah puncak ilmu huruf lahiriah. Adapun metode batiniah, maka ia juga terbagi menjadi huruf (harfiyyah) dan angka ('adadiyyah). Bagian hurufnya bertumpu pada kaidah-kaidah penting yang wajib dipahami oleh setiap penuntut ilmu, yaitu mengenal sifat-sifat huruf berdasarkan perincian berikut: [ huruf-huruf api (nāriyyah), tanah (turābiyyah), udara (hawā'iyyah), air (mā'iyyah), cahaya (nūrāniyyah), kegelapan (zhulmāniyyah), atas ('ulwiyyah), bawah (sufliyyah), jantan (dzukūr), betina (ināts), perkembangbiakan huruf (at-tawālud), huruf anak (al-abnā'), huruf cucu (al-ahfād), pergantian huruf dengan huruf (istibdālul-harf bil-harf), huruf yang negatif pada asalnya, huruf yang positif pada asalnya, penyusunan urutan huruf (tartībul-hurūf), kemudian peletakan dalam kamar wafaq (al-wadh'), kemudian pemungutan huruf (laqthul-hurūf) serta pengikatannya (rabthuhā) ]. Ini adalah rukun pokok yang tersembunyi dan di sinilah bermula persoalan-persoalan yang rumit, yang tidak membutuhkan selain perenungan mendalam dengan ketenangan dan ketelitian untuk memahaminya. Adapun wafaq-wafaq angka ('adadiyyah), ia memiliki tuntutan kaidah yang sama dengan wafaq huruf, kecuali satu perbedaan saja: yaitu perubahan wujud huruf menjadi angka (inqilābul-harf ilā 'adad) dan pelafalan angka menjadi huruf (istinthāqul-'adad) guna menyarikan tabiat unsur tertentu, baik dari angka itu sendiri maupun dari hasil turunannya (tawālud), disertai perhatian terhadap cara peletakan (al-wadh'), kesesuaian tabiat unsur (ath-thab'), dan pengikatan kamar-kamar wafaq (rabthul-buyūt) agar wafaq tersebut sempurna dengan izin Allah Yang Maha Esa lagi Maha Menundukkan.\n\nAdapun amalan-amalan huruf dan wafaq itu memiliki [ 3 tingkatan (marātib), dan aku sangat mengharapkan kalian mencermati kalimat ini dengan sebaik-baiknya serta mempelajarinya dengan penuh perenungan ]:\nApabila amalan tersebut terdiri dari Thālib (pemohon) dan Mathlūb (orang yang dituju): maka gunakan 3 huruf nūrāniyyah dan 2 huruf zhulmāniyyah.\nApabila amalan tersebut terdiri dari Thālib (pemohon) dan Thalab (hajat/permintaan): maka gunakan 5 huruf nūrāniyyah.\nApabila amalan tersebut terdiri dari Mathlūb (orang yang dituju) dan Thalab (tuntutan/hukuman): maka gunakan 5 huruf zhulmāniyyah.\n\nPerhatikanlah dan cermatilah sungguh-sungguh, karena aku telah menyingkapkan rahasia-rahasia yang sangat penting dalam penyusunan tingkatan-tingkatan amalan, maka perhatikanlah baik-baik; dan isyarat kuncinya terdapat pada Wafaq Musallas Thabī'ī (3×3 alami, lihat Halaman 46).", "syarah": "1. **Peta Besar Ilmu Huruf & Wafaq Menurut Syeikh al-Basyir**:\n   - **Dua Jenis Wafaq**: *Harfiyyah* (kamar-kamarnya diisi huruf/kata) dan *'Adadiyyah* (kamar-kamarnya diisi angka hasil hisab).\n   - **Dua Jalur Metode**:\n     1) **Jalur Zhāhirī**: Bertumpu pada *Istibdālul-Hurūf* (substitusi huruf melalui kaidah *nazhīrah/taraf'*) dan *Al-Haramul-Harfī* (piramida pelipatan huruf *taksīr*) dengan *Al-Mīzānul-Falsafī* (7 martabat positif *mūjab/zā'id* dan negatif *sālib/nāqish*).\n     2) **Jalur Bāthinī**: Bertumpu pada klasifikasi kosmologis huruf: 4 unsur (*Nāriyyah, Turābiyyah, Hawā'iyyah, Mā'iyyah*), *Nūrāniyyah* vs *Zhulmāniyyah*, *'Ulwiyyah* vs *Sufliyyah*, *Dzukūr* (jantan/ganjil) vs *Ināts* (betina/genap), serta silsilah turunan huruf (*Tawālud: Abnā' & Ahfād*), diikuti 4 tahapan kerja: *Tartīb* (pengurutan) → *Wadh'* (pengisian ke kamar wafaq) → *Laqth* (pemungutan huruf dari kamar) → *Rabth* (pengikatan menjadi nama khadim/azimah).\n\n2. **Rahasia Agung Tiga Rumus *Marātibul-A'māl* (Kunci 5 Kamar Pokok Musallas)**:\n   - Di akhir halaman, Syeikh al-Basyir membuka rahasia besar yang jarang ditulis secara terang-terangan dalam kitab lain: di dalam Wafaq Musallas 3×3 terdapat **5 kamar pokok (*al-Afrād*)** yang menjadi poros pengisian amalan:\n     1) **Jika amalan melibatkan `طَالِبٌ وَمَطْلُوبٌ` (Pemohon + Orang yang dituju, misalnya mahabbah/islah antara dua orang)**: maka komposisi kuncinya adalah **3 Huruf Nūrāniyyah + 2 Huruf Zhulmāniyyah**.\n     2) **Jika amalan melibatkan `طَالِبٌ وَطَلَبٌ` (Pemohon + Hajat murni kepada Allah, misalnya keluasan rezeki, ilmu, kasyf, atau kesembuhan diri)**: maka seluruh 5 kuncinya adalah **5 Huruf Nūrāniyyah** murni.\n     3) **Jika amalan melibatkan `مَطْلُوبٌ وَطَلَبٌ` (Target + Tuntutan/hukuman atas kezaliman atau pembatalan sihir pada pelaku)**: maka seluruh 5 kuncinya adalah **5 Huruf Zhulmāniyyah**.", "khus": "1. **Kewajiban Menghafal Klasifikasi Huruf**: Sebelum melangkah ke pelajaran ekstraksi (*istikhrāj*) pada halaman-halaman berikutnya, penuntut ilmu wajib menguasai pembagian 28 huruf Hijaiyah (dan secara khusus 9 huruf pokok *Abjad Hawwaz Huthī* pada Musallas) ke dalam kategori *Nūrāniyyah* dan *Zhulmāniyyah*.\n2. **Keterkaitan dengan Halaman 46 & 47**: Kalimat penutup Halaman 45 (`وَالْإِشَارَةُ فِي الْمُثَلَّثِ الطَّبِيعِيِّ`) langsung menunjuk pada diagram *Wafaq Musallas Thabī'ī* di Halaman 46 dan uraian rahasianya di Halaman 47."}, {"hal": "46", "title": "HALAMAN 46 — مَبَادِئُ الْأَوْفَاقِ", "imgs": ["rajah_anwar_FINAL_300DPI/IMG_20261025_110735.jpg"], "arab": "مَبَادِئُ الْأَوْفَاقِ\n\nوَالْمُثَلَّثُ هُوَ\n\n| ٢ | ٩ | ٤ |\n|---|---|---|\n| ٧ | ٥ | ٣ |\n| ٦ | ١ | ٨ |", "latin": "Mabādi'ul-aufāqi\n\nWal-mutsallatsu huwa:\n\n| ٢ | ٩ | ٤ |\n|---|---|---|\n| ٧ | ٥ | ٣ |\n| ٦ | ١ | ٨ |\n\n[Wafaq Musallas Thabī'ī 3×3 — Asror Angka Arab, tidak dilatinkan]", "terj": "Prinsip-prinsip dasar ilmu wafaq\n\nAdapun wafaq musallas (3×3 alami) itu adalah:\n\n| ٢ | ٩ | ٤ |\n|---|---|---|\n| ٧ | ٥ | ٣ |\n| ٦ | ١ | ٨ |\n\n[Wafaq Musallas Thabī'ī 3×3 — Asror Angka Arab, tidak diterjemahkan]", "syarah": "1. **Hisab Matriks *Al-Mutsallatsuth-Thabī'ī* (Konstanta 15)**:\n     - **Baris 1 (kanan→kiri)**: `٢ | ٩ | ٤` = **١٥ (15)**\n     - **Baris 2 (kanan→kiri)**: `٧ | ٥ | ٣` = **١٥ (15)**\n     - **Baris 3 (kanan→kiri)**: `٦ | ١ | ٨` = **١٥ (15)**\n     - **Kolom Kanan**: `٢ + ٧ + ٦ = ١٥`\n     - **Kolom Tengah**: `٩ + ٥ + ١ = ١٥`\n     - **Kolom Kiri**: `٤ + ٣ + ٨ = ١٥`\n     - **Diagonal 1**: `٢ + ٥ + ٨ = ١٥`\n     - **Diagonal 2**: `٤ + ٥ + ٦ = ١٥`\n\n2. **Kedudukan *Al-Mutsallatsuth-Thabī'ī* sebagai Ibu Seluruh Wafaq**:\n   - Sembilan angka (`١` s.d. `٩`) di dalam Musallas Thabī'ī ini mewakili 9 huruf pertama susunan *Abjad*:\n     - **`١`** = `ا` (*Alif*), **`٢`** = `ب` (*Bā'*), **`٣`** = `ج` (*Jīm*), **`٤`** = `د` (*Dāl*), **`٥`** = `ه` (*Hā'* — titik pusat/qalb), **`٦`** = `و` (*Wāw*), **`٧`** = `ز` (*Zāy*), **`٨`** = `ح` (*Hā'*), **`٩`** = `ط` (*Thā'*).\n   - Empat sudutnya diisi oleh angka-angka genap (`٢، ٤، ٦، ٨` = **`ب د و ح`** / *Budūh*), sedangkan palang tengah vertikal dan horizontalnya diisi oleh angka-angka ganjil (`١، ٣، ٥، ٧، ٩` = **`ا ج ه ز ط`**), yang rahasia penciptaannya segera disingkapkan oleh Syeikh al-Basyir pada Halaman 47.", "khus": "1. **Acuan Urutan Pengisian Kamar (*Tartībul-Buyūt*)**:\n   - Urutan angka `١` sampai `٩` pada *Musallas Thabī'ī* di Halaman 46 ini adalah **peta urutan pengisian baku (*sairul-mutsallats*)** untuk seluruh wafaq 3×3 di dalam kitab:\n     - Kamar 1 (*Miftāh*): Bawah-Tengah (`١`)\n     - Kamar 2: Atas-Kanan (`٢`)\n     - Kamar 3: Tengah-Kiri (`٣`)\n     - Kamar 4: Atas-Kiri (`٤`)\n     - Kamar 5 (*Qalb*): Pusat/Tengah (`٥`)\n     - Kamar 6: Bawah-Kanan (`٦`)\n     - Kamar 7: Tengah-Kanan (`٧`)\n     - Kamar 8: Bawah-Kiri (`٨`)\n     - Kamar 9 (*Maghlāq*): Atas-Tengah (`٩`)"}, {"hal": "47", "title": "HALAMAN 47 — كَشْفُ السِّتَارِ عَنِ الْمُثَلَّثِ وَمَا يَحْمِلُهُ مِنْ أَسْرَارٍ", "imgs": ["hal_47.png"], "arab": "كَشْفُ السِّتَارِ عَنِ الْمُثَلَّثِ وَمَا يَحْمِلُهُ مِنْ أَسْرَارٍ\n\nالسَّلَامُ عَلَيْكُمْ وَرَحْمَةُ اللهِ وَبَرَكَاتُهُ ، إِخْوَتِي فِي اللهِ نَبْدَأُ عَلَى بَرَكَةِ اللهِ فِي الدَّرْسِ الْأَوَّلِ الْخَاصِّ بِالْوَفْقِ الْمُثَلَّثِ .\nنَعْلَمُ جَمِيعًا أَنَّ الْمُثَلَّثَ يَحْتَوِي عَلَى ٩ حُرُوفٍ مِنْهَا نُورَانِيَّةٌ وَظُلْمَانِيَّةٌ وَأَفْرَادٌ وَأَزْوَاجٌ وَخَفِيفَةٌ وَثَقِيلَةٌ .\n\nالنُّورَانِيَّةُ [ ا ه ط ح ]\nالظُّلْمَانِيَّةُ [ ب ج د و ز ]\nالْأَفْرَادُ [ ا ج ه ز ط ]\nالْأَزْوَاجُ [ ب د و ح ]\nالْخَفِيفَةُ [ هِيَ الْحُرُوفُ النَّارِيَّةُ وَالْهَوَائِيَّةُ ]\nالثَّقِيلَةُ [ هِيَ الْحُرُوفُ التُّرَابِيَّةُ وَالْمَائِيَّةُ ]\n\nوَاعْلَمُوا إِخْوَتِي فِي اللهِ أَنَّ الْحُرُوفَ الْأَفْرَادَ أَصْلٌ فِي الْمُثَلَّثِ وَالْحُرُوفَ الْأَزْوَاجَ فَرْعٌ فِي الْمُثَلَّثِ تُسْتَخْرَجُ وَتَتَوَلَّدُ مِنَ الْحُرُوفِ الْأَفْرَادِ ، وَأَرْجُو تَحْكِيمَ عُقُولِكُمْ وَأَنْ تَتَمَعَّنُوا فِي آيَاتِ اللهِ وَفِي بَدْءِ خَلْقِ آدَمَ وَأُمِّنَا حَوَّاءَ عَلَيْهِمَا السَّلَامُ ، فَكَثِيرٌ مِنَ الطُّلَّابِ يَمُرُّ عَلَى هَذِهِ الْمَسْأَلَةِ مَرَّ الْكِرَامِ مَعَ أَنَّهُ يَعْلَمُ أَنَّ اللهَ سُبْحَانَهُ وَتَعَالَى خَلَقَ آدَمَ عَلَيْهِ السَّلَامُ مِنْ تُرَابٍ وَخَلَقَ حَوَّاءَ مِنْ ضِلْعِ آدَمَ فَهَذِهِ الْآيَةُ سِرُّ اللهِ سُبْحَانَهُ وَتَعَالَى فِي هَذَا الْعِلْمِ الَّذِي نَحْنُ بِصَدَدِهِ ، قُلْتُ الْأَزْوَاجُ تُسْتَخْرَجُ مِنَ الْأَفْرَادِ وَإِلَيْكُمُ التَّفْصِيلُ .", "latin": "Kasyfus-sitāri 'anil-mutsallatsi wa mā yahmiluhū min asrārin.\n\nAs-salāmu 'alaikum wa rahmatullāhi wa barakātuhū, ikhwatī fillāhi nabda'u 'alā barakatillāhi fid-darsil-awwalil-khāshshi bil-wafqil-mutsallatsi.\nNa'lamu jamī'an annal-mutsallatsa yahtawī 'alā 9 hurūfin minhā nūrāniyyatun wa zhulmāniyyatun wa afrādun wa azwājun wa khafīfatun wa tsaqīlatun.\n\nAn-nūrāniyyatu [ ا ه ط ح ]\nAzh-zhulmāniyyatu [ ب ج د و ز ]\nAl-afrādu [ ا ج ه ز ط ]\nAl-azwāju [ ب د و ح ]\nAl-khafīfatu [ hiyal-hurūfun-nāriyyatu wal-hawā'iyyatu ]\nAts-tsaqīlatu [ hiyal-hurūfut-turābiyyatu wal-mā'iyyatu ]\n\nWa'lamū ikhwatī fillāhi annal-hurūfal-afrāda ashlun fil-mutsallatsi wal-hurūfal-azwāja far'un fil-mutsallatsi tustakhraju wa tatawalladu minal-hurūfil-afrādi, wa arjū tahkīma 'uqūlikum wa an tatama''anū fī āyātillāhi wa fī bad'i khalqi Ādama wa umminā Hawwā'a 'alaihimās-salāmu, fakatsīrun minath-thullābi yamurru 'alā hādzihil-mas'alati marral-kirāmi ma'a annahū ya'lamu annallāha Subhānahū wa Ta'ālā khalaqa Ādama 'alaihis-salāmu min turābin wa khalaqa Hawwā'a min dhil'i Ādama fahādzihil-āyatu sirrullāhi Subhānahū wa Ta'ālā fī hādzal-'ilmil-ladzī nahnu bishadadihī, qultul-azwāju tustakhraju minal-afrādi wa ilaikumut-tafshīlu.", "terj": "Penyingkapan tabir tentang wafaq musallas (3×3) dan rahasia-rahasia yang dikandungnya.\n\nAssalamu'alaikum warahmatullahi wabarakatuh. Wahai saudara-saudaraku karena Allah, kita mulai dengan keberkahan Allah pada pelajaran pertama yang khusus membahas tentang Wafaq Musallas (3×3).\nKita semua mengetahui bahwa Wafaq Musallas itu mengandung 9 huruf, yang di antaranya terdapat huruf-huruf nūrāniyyah (cahaya), zhulmāniyyah (kegelapan), afrād (ganjil/tunggal), azwāj (genap/berpasangan), khafīfah (ringan), dan tsaqīlah (berat).\n\nHuruf-huruf Nūrāniyyah (cahaya): [ ا ه ط ح ] [Rajah Huruf — tidak diterjemahkan]\nHuruf-huruf Zhulmāniyyah (kegelapan): [ ب ج د و ز ] [Rajah Huruf — tidak diterjemahkan]\nHuruf-huruf Afrād (ganjil/pokok): [ ا ج ه ز ط ] [Rajah Huruf — tidak diterjemahkan]\nHuruf-huruf Azwāj (genap/cabang): [ ب د و ح ] [Rajah Huruf — tidak diterjemahkan]\nHuruf-huruf Khafīfah (ringan): [ yaitu huruf-huruf berelemen api (nāriyyah) dan udara (hawā'iyyah) ]\nHuruf-huruf Tsaqīlah (berat): [ yaitu huruf-huruf berelemen tanah (turābiyyah) dan air (mā'iyyah) ]\n\nDan ketahuilah wahai saudara-saudaraku karena Allah, bahwa huruf-huruf Afrād (ganjil) itu adalah pokok (asal) di dalam Wafaq Musallas, sedangkan huruf-huruf Azwāj (genap) adalah cabang di dalam Wafaq Musallas yang dikeluarkan serta dilahirkan dari huruf-huruf Afrād tersebut. Aku sangat mengharapkan kalian menggunakan akal pikiran kalian dengan sebaik-baiknya serta merenungkan tanda-tanda kekuasaan Allah dan awal mula penciptaan Nabi Adam serta ibu kita Hawa 'alaihimās-salām. Sebab banyak sekali dari kalangan penuntut ilmu yang melewati persoalan ini begitu saja sambil lalu, padahal ia mengetahui bahwa Allah Subhanahu wa Ta'ala menciptakan Nabi Adam 'alaihis-salām dari tanah dan menciptakan Hawa dari tulang rusuk Nabi Adam; maka tanda kekuasaan (ayat) ini adalah rahasia Allah Subhanahu wa Ta'ala di dalam ilmu yang sedang kita bahas ini. Aku katakan: huruf-huruf Azwāj (genap) itu dikeluarkan dari huruf-huruf Afrād (ganjil), dan berikut ini perinciannya untuk kalian (bersambung ke Halaman 48).", "syarah": "1. **Anatomi 9 Huruf Wafaq Musallas (`أَبْجَدْ هَوَّزْ حُطِّي`)**:\n   - Sembilan huruf pembentuk Musallas (`ا ب ج د ه و ز ح ط` = nilai `١` s.d. `٩`) terbagi menjadi enam pasangan sifat:\n     1) **Nūrāniyyah (`[ ا ه ط ح ]` = 1, 5, 9, 8)**: Tiga huruf api (`ا ه ط`) ditambah satu huruf air yang memantulkan cahaya (`ح`).\n     2) **Zhulmāniyyah (`[ ب ج د و ز ]` = 2, 3, 4, 6, 7)**: Lima huruf selainnya yang mewakili kepadatan materi/kegelapan.\n     3) **Afrād (`[ ا ج ه ز ط ]` = 1, 3, 5, 7, 9)**: Lima huruf bernilai ganjil yang menempati **palang tengah vertikal dan horizontal** pada Wafaq Musallas (melambangkan tulang punggung/pokok/Adam 'alaihis-salām).\n     4) **Azwāj (`[ ب د و ح ]` = 2, 4, 6, 8)**: Empat huruf bernilai genap yang menempati **empat sudut** Wafaq Musallas (melambangkan cabang/tulang rusuk/Hawa 'alaihās-salām).\n     5) **Khafīfah (Ringan)**: Huruf-huruf berelemen Api (*Nāriyyah*: `ا ه ط`) dan Udara (*Hawā'iyyah*: `ج ز`) karena sifat api dan udara yang selalu bergerak naik ke atas.\n     6) **Tsaqīlah (Berat)**: Huruf-huruf berelemen Tanah (*Turābiyyah*: `ب و`) dan Air (*Mā'iyyah*: `د ح`) karena sifat tanah dan air yang cenderung turun dan menetap di bawah.\n\n2. **Falsafah Penciptaan Nabi Adam & Hawa dalam Matriks Musallas**:\n   - Syeikh al-Basyir mengaitkan struktur matematis Wafaq Musallas dengan ayat kauniyah penciptaan manusia pertama: sebagaimana Siti Hawa (`حَوَّاء` — yang huruf-hurufnya senada dengan unsur kehidupan dan pasangan genap) diciptakan dari tulang rusuk Nabi Adam (`آدَم` — yang merupakan pokok/asal), demikian pula keempat kamar sudut genap (`[ ب د و ح ]`) dalam Wafaq Musallas **dilahirkan (*tatawalladu*) dan diekstraksi (*tustakhraju*)** dari penjumlahan/pengurangan kelima kamar pokok ganjil (`[ ا ج ه ز ط ]`).", "khus": "1. **Kunci Memahami Rumus 5 Huruf pada Halaman 45**:\n   - Penjelasan bahwa **Afrād (`[ ا ج ه ز ط ]` = 5 huruf)** adalah **pokok (*ashl*)** dalam Wafaq Musallas menjawab mengapa pada Halaman 45 Syeikh al-Basyir menetapkan rumus amalan selalu berjumlah **5 huruf** (`3 nūrāniyyah + 2 zhulmāniyyah = 5`, atau `5 nūrāniyyah`, atau `5 zhulmāniyyah`): karena seorang ahli wafaq cukup memasukkan **5 huruf pokok (*Afrād*)** terlebih dahulu, lalu **4 huruf cabang (*Azwāj*)** di keempat sudut wafaq akan lahir secara otomatis dari kelima huruf pokok tersebut!\n2. **Persiapan ke Halaman 48**:\n   - Cara matematis melahirkan 4 huruf *Azwāj* dari 5 huruf *Afrād* ini akan diuraikan rincian rumusnya (`وَإِلَيْكُمُ التَّفْصِيلُ`) pada halaman berikutnya (Halaman 48)."}, {"hal": "48", "title": "HALAMAN 48 — كَشْفُ السِّتَارِ عَنِ الْمُثَلَّثِ وَمَا يَحْمِلُهُ مِنْ أَسْرَارٍ (٢)", "imgs": ["rajah_anwar_FINAL_300DPI/IMG_20261025_110522.jpg", "hal_48.png"], "arab": "كَشْفُ السِّتَارِ عَنِ الْمُثَلَّثِ وَمَا يَحْمِلُهُ مِنْ أَسْرَارٍ\n\n|   | ط |   |\n|---|---|---|\n| ز | ه | ج |\n|   | أ |   |\n\nط + ج = ١٢ مَقْسُومٌ ٢ = ٦ [ و ]\nط + ز = ١٦ مَقْسُومٌ ٢ = ٨ [ ح ]\nج + ا = ٤ مَقْسُومٌ ٢ = ٢ [ ب ]\nا + ز = ٨ مَقْسُومٌ ٢ = ٤ [ د ]\nهُنَا اكْتَمَلَ اسْتِخْرَاجُ الْأَزْوَاجِ مِنَ الْأَفْرَادِ ، فَلَا تَمُرُّوا مَرَّ الْكِرَامِ فَمَا وَضَعْتُهُ لَكُمْ هُوَ الْقَاعِدَةُ الْأُولَى فِي الطَّرِيقَةِ الَّتِي نَحْنُ بِصَدَدِهَا وَلَا بُدَّ مِنَ الِاعْتِمَادِ عَلَى هَذِهِ الْقَاعِدَةِ فِي الْوَضْعِ الْأَوَّلِ مِنَ الْمُثَلَّثِ ، وَاعْلَمُوا أَنَّ هَذِهِ طَرِيقَةٌ لِمَدْخَلِ الْخَيْرِ .\nأَمَّا مَدْخَلُ الدَّفْعِ بِعَكْسِ الْأُولَى أَيْ يَكُونُ الْوَضْعُ بِالْأَزْوَاجِ وَتُسْتَخْرَجُ الْأَفْرَادُ مِنَ الْأَزْوَاجِ فَيَخْرُجُ بَيْتُ الْقَلَمِ وَاللَّوْحِ مِنْ ظَاهِرِ بُيُوتِ النَّارِ وَالتُّرَابِ وَالْمَاءِ وَالْهَوَاءِ ، وَالْكُرْسِيُّ وَالْعَرْشُ يَخْرُجَانِ مِنْ بَاطِنِ بُيُوتِ الْمَاءِ وَالتُّرَابِ وَالْقُطْبِ وَذَلِكَ لِشَرَفِ الْبَيْتَيْنِ وَقِيمَتِهِمَا وَإِلَيْكُمُ التَّفْصِيلُ إِخْوَتِي فِي اللهِ ،\nأَوَدُّ الْإِشَارَةَ قَبْلَ ذَلِكَ أَنَّ مُعْظَمَ الطُّلَّابِ تَرَسَّخَتْ فِي أَذْهَانِهِمْ هَذِهِ الْجُمْلَةُ [ اجهزط لِلشَّرِّ ، فَكَيْفَ يَكُونُ ذَلِكَ وَهِيَ حُرُوفُ جَلَالٍ ] وَ [ بدوح لِلْخَيْرِ ] وَهَذَا لَيْسَ بِصَحِيحٍ إِذْ أَنَّ اجهزط لِلْخَيْرِ وَ بدوح لِلشَّرِّ", "latin": "Kasyfus-sitāri 'anil-mutsallatsi wa mā yahmiluhū min asrārin.\n\n|   | ط |   |\n|---|---|---|\n| ز | ه | ج |\n|   | أ |   |\n\n[Wafaq Musallas Palang al-Afrād 3×3 — Asror Huruf Arab, tidak dilatinkan]\n\n[ ط ] + [ ج ] = 12 maqsūmun 2 = 6 [ و ]\n[ ط ] + [ ز ] = 16 maqsūmun 2 = 8 [ ح ]\n[ ج ] + [ ا ] = 4 maqsūmun 2 = 2 [ ب ]\n[ ا ] + [ ز ] = 8 maqsūmun 2 = 4 [ د ]\nHunā-ktamala-stikhrājul-azwāji minal-afrādi, falā tamurrū marral-kirāmi famā wadha'tuhū lakum huwal-qā'idatul-ūlā fith-tharīqatil-latī nahnu bishadadihā wa lā budda minal-i'timādi 'alā hādzihil-qā'idati fil-wadh'il-awwali minal-mutsallatsi, wa'lamū anna hādzihī tharīqatun limadkhalil-khairi.\nAmmā madkhalud-daf'i bi'aksil-ūlā ai yakūnul-wadh'u bil-azwāji wa tustakhrajul-afrādu minal-azwāji fayakhruju baitul-Qalami wal-Lauhi min zhāhiri buyūtin-nāri wat-turābi wal-mā'i wal-hawā'i, wal-Kursiyyu wal-'Arsyu yakhrujāni min bāthini buyūtil-mā'i wat-turābi wal-quthbi wa dzālika lisyarafil-baitaini wa qīmatihimā wa ilaikumut-tafshīlu ikhwatī fillāhi,\nAwaddul-isyārata qabla dzālika anna mu'zhamath-thullābi tarassakhat fī adzhānihim hādzihil-jumlatu [ اجهزط lisy-syarri, fakaifa yakūnu dzālika wa hiya hurūfu jalālin ] wa [ بدوح lil-khairi ] wa hādzā laisa bishahīhin idz anna [ اجهزط ] lil-khairi wa [ بدوح ] lisy-syarri.", "terj": "Penyingkapan tabir tentang wafaq musallas (3×3) dan rahasia-rahasia yang dikandungnya.\n\n|   | ط |   |\n|---|---|---|\n| ز | ه | ج |\n|   | أ |   |\n\n[Wafaq Musallas Palang al-Afrād 3×3 — Asror Huruf Arab, tidak diterjemahkan]\n\n[ ط ] (9) + [ ج ] (3) = 12 dibagi 2 = 6 [ و ] [Rajah Huruf — tidak diterjemahkan]\n[ ط ] (9) + [ ز ] (7) = 16 dibagi 2 = 8 [ ح ] [Rajah Huruf — tidak diterjemahkan]\n[ ج ] (3) + [ ا ] (1) = 4 dibagi 2 = 2 [ ب ] [Rajah Huruf — tidak diterjemahkan]\n[ ا ] (1) + [ ز ] (7) = 8 dibagi 2 = 4 [ د ] [Rajah Huruf — tidak diterjemahkan]\nDi sinilah telah sempurna pengeluaran (ekstraksi) huruf-huruf Azwāj (genap) dari huruf-huruf Afrād (ganjil). Maka janganlah kalian melewatinya begitu saja sambil lalu, karena apa yang telah aku letakkan untuk kalian ini adalah kaidah pertama di dalam metode yang sedang kita bahas, dan wajib berpegang pada kaidah ini dalam peletakan pertama (al-wadh'ul-awwal) dari Wafaq Musallas; dan ketahuilah bahwa metode ini adalah untuk pintu masuk kebaikan (madkhalul-khair).\nAdapun pintu masuk penolakan/penangkisan (madkhalud-daf') adalah kebalikan dari yang pertama, yakni peletakannya dimulai dengan huruf-huruf Azwāj (genap), lalu huruf-huruf Afrād (ganjil) dikeluarkan dari huruf-huruf Azwāj tersebut. Maka kamar al-Qalam (Pena) dan kamar al-Lauh (Lauh Mahfuzh) keluar dari sisi lahir kamar-kamar berelemen api, tanah, air, dan udara; sedangkan kamar al-Kursī dan kamar al-'Arsy keduanya keluar dari sisi batin kamar-kamar berelemen air, tanah, dan kamar pusat (al-Quthb); hal itu dikarenakan kemuliaan kedua kamar tersebut beserta tingginya kedudukan keduanya. Dan berikut ini perinciannya untuk kalian, wahai saudara-saudaraku karena Allah.\nSebelum itu, aku ingin memberikan isyarat penting bahwa sebagian besar penuntut ilmu telah tertancap kuat di dalam benak mereka ungkapan ini: [ اجهزط adalah untuk keburukan (syarr) — padahal bagaimana mungkin demikian sedangkan ia adalah huruf-huruf keagungan (hurūfu jalāl)? ] dan [ بدوح adalah untuk kebaikan (khair) ]. Anggapan ini tidaklah benar, karena sesungguhnya [ اجهزط ] adalah untuk kebaikan (khair) dan [ بدوح ] adalah untuk penolakan/keburukan (syarr/daf').", "syarah": "1. **Rumus Matematis Melahirkan 4 Sudut *Azwāj* (`ب د و ح`) dari 5 Palang *Afrād* (`ا ج ه ز ط`)**:\n   - Inilah pembuktian matematis dari perumpamaan Nabi Adam (*Afrād*) dan Siti Hawa (*Azwāj*) yang disampaikan Syeikh al-Basyir pada Halaman 47:\n     1) **`ط` (9, atas-tengah) + `ج` (3, kiri-tengah) = 12 ÷ 2 = `6 [ و ]`** (lahirlah sudut kanan-bawah).\n     2) **`ط` (9, atas-tengah) + `ز` (7, kanan-tengah) = 16 ÷ 2 = `8 [ ح ]`** (lahirlah sudut kiri-bawah).\n     3) **`ج` (3, kiri-tengah) + `ا` (1, bawah-tengah) = 4 ÷ 2 = `2 [ ب ]`** (lahirlah sudut kanan-atas).\n     4) **`ا` (1, bawah-tengah) + `ز` (7, kanan-tengah) = 8 ÷ 2 = `4 [ د ]`** (lahirlah sudut kiri-atas).\n\n2. **Koreksi Besar Syeikh al-Basyir atas Kesalahpahaman Umum (`اجهزط` vs `بدوح`)**:\n   - Syeikh al-Basyir meluruskan doktrin keliru yang banyak beredar di kalangan pelajar ilmu hikmah yang mengira `اجهزط` untuk *syarr* dan `بدوح` untuk *khair*:\n     - Justru **`اجهزط` (*al-Afrād* / huruf-huruf ganjil *Jalāl*) adalah pintu masuk kebaikan (*Madkhalul-Khair*)**, karena Allah itu Witir (Ganjil/Esa) dan menyukai yang ganjil, serta huruf-huruf *Afrād* merupakan pokok (*ashl*).\n     - Sedangkan **`بدوح` (*al-Azwāj* / huruf-huruf genap)** digunakan sebagai **pintu masuk penolakan/penangkisan (*Madkhalud-Daf' / asy-Syarr*)**, yaitu ketika seorang ahli hikmah memulai pengisian wafaq dari keempat sudut genap terlebih dahulu untuk menolak kezaliman atau menghancurkan sihir.", "khus": "1. **Terminologi Kosmologis 5 Kamar *Afrād* pada Wafaq Musallas**:\n   - Perhatikan istilah khusus yang digunakan Syeikh al-Basyir untuk menyebut 5 kamar palang tengah (*Afrād*):\n     - **Kamar `ا` (1 — Bawah-Tengah)**: disebut **Baitul-Kursī (`بَيْتُ الْكُرْسِيِّ`)**.\n     - **Kamar `ط` (9 — Atas-Tengah)**: disebut **Baitul-'Arsy (`بَيْتُ الْعَرْشِ`)**.\n     - **Kamar `ه` (5 — Pusat/Tengah)**: disebut **Al-Quthb (`الْقُطْبُ`)**.\n     - **Kamar `ج` (3 — Kiri-Tengah) & Kamar `ز` (7 — Kanan-Tengah)**: disebut **Baitul-Qalam wal-Lauh (`بَيْتُ الْقَلَمِ وَاللَّوْحِ`)**.\n2. **Penerapan Praktis**:\n   - Untuk seluruh amalan **kebaikan (*Madkhalul-Khair*)**: letakkan 5 huruf pokok di palang *Afrād* (`ا ج ه ز ط`), lalu lahirkan 4 huruf sudut *Azwāj* dengan rumus rata-rata (`÷ 2`) di atas.\n   - Untuk amalan **penolakan/penangkisan (*Madkhalud-Daf'*)**: gunakan rumus kebalikannya yang dijabarkan pada Halaman 49."}, {"hal": "49", "title": "HALAMAN 49 — كَشْفُ السِّتَارِ عَنِ الْمُثَلَّثِ وَمَا يَحْمِلُهُ مِنْ أَسْرَارٍ (٣)", "imgs": ["rajah_anwar_FINAL_300DPI/IMG_20261025_153252.jpg", "hal_49.png"], "arab": "كَشْفُ السِّتَارِ عَنِ الْمُثَلَّثِ وَمَا يَحْمِلُهُ مِنْ أَسْرَارٍ\n\n| ب |   | د |\n|---|---|---|\n|   | ه |   |\n| و |   | ح |\n\nح + و = ١٤ مَقْسُومٌ ٢ = ٧ [ ز ]\nب + د = ٦ مَقْسُومٌ ٢ = ٣ [ ج ] بَقِيَ لَنَا بَيْتُ الْكُرْسِيِّ وَالْعَرْشِ فَهُمَا يَخْرُجَانِ مِنْ بَاطِنِ التُّرَابِ وَالْمَاءِ وَالْقُطْبِ أَيْ مِنْ تَوَالُدِهِمْ ، [ ه + ابْنُهَا ] نَاقِصٌ حَفِيدُ الْمَاءِ = الْكُرْسِيُّ\n[ د + ح ] نَاقِصٌ ابْنُ الْقُطْبِ = الْعَرْشُ\nه + ١ = ٢ نَاقِصٌ ١ حَفِيدُ الْمَاءِ = ١ [ أ ] الْكُرْسِيُّ\nد + ح = ١٠ نَاقِص
