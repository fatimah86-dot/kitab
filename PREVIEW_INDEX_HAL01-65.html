a wa jalla.\n\nAs'alullāha an yasyfiya kulla marīdhin bisyifā'ihil-ladzī lā yughādiru saqaman innahū waliyyu dzālika wal-qādiru 'alaihi.", "terj": "Sepuluh ayat pembatal hembusan dan sihir.\n\n| ٣١٣ | ١٢٧٢ | ٦٠٥ |\n|---|---|---|\n| ١٠٢٢ | ٧٣٠ | ٤٣٨ |\n| ٨٥٥ | ١٨٨ | ١١٤٧ |\n\n[Wafaq Musallas 3×3 — Asror Angka Arab, tidak diterjemahkan]\n\nDan setelah semuanya ditulis, dihapus (dilebur) dengan air yang suci dan dibacakan atasnya sepuluh ayat tersebut sebanyak 9 kali, lalu orang yang sakit membalurkan (mengusapkan) air itu ke seluruh tubuhnya, niscaya hilanglah darinya segala sihir yang ada padanya dengan izin Allah dan dengan keberkahan firman Allah 'azza wa jalla.\n\nAku memohon kepada Allah agar menyembuhkan setiap orang yang sakit dengan kesembuhan-Nya yang tidak meninggalkan penyakit sedikit pun; sesungguhnya Dia adalah Pelindung dalam hal itu dan Maha Kuasa atasnya.", "syarah": "1. **Hisab Matriks Wafaq Musallas 3×3 (Konstanta 2190)**:\n     - **Baris 1**: `٣١٣` (kanan) + `١٢٧٢` (tengah) + `٦٠٥` (kiri) = **٢١٩٠ (2190)**\n     - **Baris 2**: `١٠٢٢` (kanan) + `٧٣٠` (qalb/tengah) + `٤٣٨` (kiri) = **٢١٩٠ (2190)**\n     - **Baris 3**: `٨٥٥` (kanan) + `١٨٨` (tengah) + `١١٤٧` (kiri) = **٢١٩٠ (2190)**\n     - **Kolom Kanan**: `٣١٣ + ١٠٢٢ + ٨٥٥ = ٢١٩٠`\n     - **Kolom Tengah**: `١٢٧٢ + ٧٣٠ + ١٨٨ = ٢١٩٠`\n     - **Kolom Kiri**: `٦٠٥ + ٤٣٨ + ١١٤٧ = ٢١٩٠`\n     - **Diagonal 1**: `٣١٣ + ٧٣٠ + ١١٤٧ = ٢١٩٠`\n     - **Diagonal 2**: `٦٠٥ + ٧٣٠ + ٨٥٥ = ٢١٩٠`\n   - Sel pusat (*qalbul-wafq*) bernilai **٧٣٠ (730)**, sehingga konstanta *dhl'* (jumlah setiap baris/kolom/diagonal) adalah `730 × 3 = 2190`. Seluruh angka dalam wafaq merupakan *asror huruf* dan wajib ditulis dengan angka Arab tanpa dilatinkan.\n\n2. **Struktur Bingkai Basmalah & Thauq Lingkaran 10 Qālāt**:\n   - Empat sisi garis hijau pembatas wafaq merupakan kaligrafi **Basmalah** (`بِسْمِ اللهِ الرَّحْمَنِ الرَّحِيمِ`) yang dimulai dari sudut kanan-bawah (`بـ ... ـسم` di garis bawah menuju kiri, `الله` di sisi kiri, `الرحمن` di sisi atas, dan `الرحيم` di sisi kanan) sebagaimana dijelaskan pada Halaman 27.\n   - Lingkaran luar (*dā'irah*) yang memagari wafaq berisi rangkaian **10 Ayat Qālāt** (9 ayat QS. asy-Syu'arā': 23–31 dan 1 ayat QS. Yūnus: 81) yang ditulis melingkar tanpa putus sebagai benteng pembatal sihir.", "khus": "1. **Penulisan pada Sā'atul-Qamar**: Wafaq 3×3 beserta bingkai Basmalah dan lingkaran 10 ayat ditulis pada wadah suci (piring porselen putih tanpa corak) menggunakan tinta ruhani (*midād rūhānī*: campuran za'faran dan air mawar) pada jam Bulan (*sā'atul-qamar*) sebagaimana kaidah Halaman 27.\n2. **Peleburan (`Yumhā bimā'in thāhirin`)**: Setelah seluruh komponen wafaq dan lingkaran 10 ayat selesai ditulis, lebur/larutkan tulisan tersebut menggunakan air suci yang bersih.\n3. **Pembacaan Kunci 9 Kali (`Yuqra'u 'alaihil-āyātul-'asyru 9 marrātin`)**: Bacakan ke-10 ayat Pembatal Sihir (*al-'Asyr Qālāt*) tepat sebanyak **9 kali** di atas air leburan tersebut (angka 9 bersesuaian dengan 9 petak wafaq tsulātsī dan 9 ayat dialog Nabi Musa di Surah asy-Syu'arā').\n4. **Pembaluran Seluruh Jasad (`Wa yaddahinu bihil-marīdhu jamī'a jasadihī`)**: Air yang telah dibacakan 10 ayat sebanyak 9 kali tersebut dibalurkan/diusapkan secara merata ke seluruh tubuh orang yang terkena sihir (dan sebagian dapat diminum). Dengan izin Allah dan keberkahan kalam-Nya, ikatan buhul hembusan (*an-nafts*) maupun sihir yang menempel pada jasad akan luruh seketika."}, {"hal": "29", "title": "HALAMAN 29 — فَائِدَةٌ فِي الْكَشْفِ الْمَنَامِيِّ", "imgs": ["hal_29.png"], "arab": "فَائِدَةٌ فِي الْكَشْفِ الْمَنَامِيِّ\n\nإِخْوَتِي فِي اللهِ أَضَعُ لَكُمْ هَذِهِ الْفَائِدَةَ الْجَلِيلَةَ وَهِيَ فَائِدَةٌ فِي الْكَشْفِ الْمَنَامِيِّ وَهِيَ نَافِعَةٌ بِإِذْنِ اللهِ عَزَّ وَجَلَّ فِي الْكَشْفِ عَنِ الْأُمُورِ الْمَخْفِيَّةِ بِمَا فِي ذَلِكَ الْخَبَايَا وَالسِّحْرِ الْمَدْفُونِ ،،،،، إلخ وَطَرِيقَةُ عَمَلِهَا هِيَ كَالتَّالِي ،\n\nاُكْتُبِ الْوَفْقَ فِي وَرَقَةٍ بَيْضَاءَ بِمِدَادٍ رُوحَانِيٍّ طَاهِرٍ وَبَخِّرْهُ بِطِيبِ الرَّائِحَةِ وَذَلِكَ يَكُونُ بَعْدَ صَلَاةِ الْعِشَاءِ طَبْعًا وَالْقِيَامِ بِمَا ذَكَرْتُهُ سَابِقًا فِي فَائِدَةِ الْأَعْمَالِ الرُّوحَانِيَّةِ الَّتِي تَسْبِقُ أَيَّ عَمَلٍ رُوحَانِيٍّ ، ثُمَّ بَعْدَ الْكِتَابَةِ وَالْبَخُورِ تَضَعُ الْوَرَقَةَ أَمَامَكَ فَوْقَ سَجَّادَتِكَ وَتَجْلِسُ جُلُوسَ الصَّلَاةِ وَأَنْتَ نَاظِرٌ إِلَى الْوَفْقِ ثُمَّ تَشْرَعُ فِي تِلَاوَةِ الْأَسْمَاءِ الْحُسْنَى الْآتِي ذِكْرُهَا بِيَاءِ النِّدَاءِ هَكَذَا ( يَا اللهُ يَا لَطِيفُ يَا خَبِيرُ ) عَدَدَ ١٠٧٠ مَرَّةً وَعَلَى رَأْسِ الْمَرَاتِبِ تَقْرَأُ الْآيَةَ الْكَرِيمَةَ ﴿ أَلَا يَعْلَمُ مَنْ خَلَقَ وَهُوَ اللَّطِيفُ الْخَبِيرُ ﴾ ١٠ مَرَّاتٍ وَالدُّعَاءَ مَرَّةً وَاحِدَةً وَهُوَ\n\n( اللَّهُمَّ إِنِّي أَسْأَلُكَ يَا اللهُ يَا لَطِيفُ يَا خَبِيرُ يَا مَنْ عَظُمَتْ هَيْبَتُهُ فِي جَمِيعِ الْقُلُوبِ وَأَحَاطَ عِلْمُهُ بِمَرَاتِبِ الْغُيُوبِ اللَّهُمَّ إِنِّي أَسْأَلُكَ وَأَطْلُبُ مِنْكَ الْوُصُولَ إِلَيْكَ فَإِنِّي بِكَ أَسْتَدِلُّ عَلَيْكَ اللَّهُمَّ اهْدِنِي بِنُورِكَ إِلَيْكَ وَأَقِمْنِي بِصِدْقِ الْعُبُودِيَّةِ بَيْنَ يَدَيْكَ اللَّهُمَّ إِنِّي أَسْأَلُكَ بِخَفِيِّ خَفِيِّ لُطْفِكَ وَبِعَظِيمِ عَظِيمِ عَظَمَتِكَ وَبِسِرِّ أَسْرَارِ قُدْرَتِكَ وَبِمَكْنُونِ مَكْنُونِ غَيْبِكَ أَنْ تُسَخِّرَ لِي خَادِمًا مُطِيعًا مِنْ خُدَّامِ اسْمِكَ اللهِ اللَّطِيفِ الْخَبِيرِ تَكْشِفُ لِي بِهِ مَا غَابَ عَنِّي ( الطَّلَبُ ) يَا اللهُ يَا مَنْ قُلْتَ وَقَوْلُكَ الْحَقُّ ﴿ إِنَّ اللهَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ ﴾ ) تَمَّ الدُّعَاءُ .\n\nوَعِنْدَ تَمَامِ الْعَمَلِ تُصَلِّي عَلَى رَسُولِ اللهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ ١١ مَرَّةً ، ثُمَّ تَضَعُ الْوَرَقَةَ تَحْتَ وِسَادَتِكَ وَتَكُونُ الْكِتَابَةُ إِلَى أَعْلَى ثُمَّ تَنَامُ مَكَانَكَ عَلَى شِقِّكَ الْيَمِينِ ، فَبِإِذْنِ اللهِ تَرَى فِي مَنَامِكَ مَا يَسُرُّكَ ، وَلَا تُخْبِرْ أَحَدًا بِمَا رَأَيْتَ . وَهَذَا هُوَ الْوَفْقُ تُحِيطُهُ بِالْآيَةِ ﴿ قَوْلُهُ الْحَقُّ وَلَهُ الْمُلْكُ ﴾ مِنْ جِهَاتِهِ الْأَرْبَعِ وَتَدُورُ بِهِ الْآيَةُ مِنْ جِهَاتِهِ الْأَرْبَعِ كَذَلِكَ ﴿ أَلَا يَعْلَمُ مَنْ خَلَقَ وَهُوَ اللَّطِيفُ الْخَبِيرُ ﴾ وَالدُّعَاءُ مُبْتَدِئًا مِنْ فَوْقِ الْيَمِينِ عَكْسَ عَقَارِبِ السَّاعَةِ", "latin": "Fā'idatun fil-kasyfil-manāmiyyi.\n\nIkhwatī fillāhi adha'u lakum hādzihil-fā'idatal-jalīlata wa hiya fā'idatun fil-kasyfil-manāmiyyi wa hiya nāfi'atun bi-idznillāhi 'azza wa jalla fil-kasyfi 'anil-umūril-makhfiyyati bimā fī dzālikal-khabāyā was-sihril-madfūni ... ilā ākhirihī, wa tharīqatu 'amalihā hiya kat-tālī:\n\nUktubil-wafqa fī waraqatin baidhā'a bimidādin rūhāniyyin thāhirin wa bakhkhirhu bithībir-rā'ihati wa dzālika yakūnu ba'da shalātil-'isyā'i thab'an wal-qiyāmi bimā dzakartuhū sābiqan fī fā'idatil-a'mālir-rūhāniyyatil-latī tasbiqu ayya 'amalin rūhāniyyin, tsumma ba'dal-kitābati wal-bakhūri tadha'ul-waraqata amāmaka fauqa sajjādatika wa tajlisu julūsash-shalāti wa anta nāzhirun ilal-wafqi tsumma tasyra'u fī tilāwatil-asmā'il-husnal-ātī dzikruhā biyā'in-nidā'i hākadzā ( Yā Allāhu Yā Lathīfu Yā Khabīru ) 'adada 1070 marratan wa 'alā ra'sil-marātibi taqra'ul-āyatal-karīmata ( Alā ya'lamu man khalaqa wa huwal-Lathīful-Khabīru ) 10 marrātin wad-du'ā'a marratan wāhidatan wa huwa:\n\n( Allāhumma innī as'aluka Yā Allāhu Yā Lathīfu Yā Khabīru yā man 'azhumat haibatuhū fī jamī'il-qulūbi wa ahātha 'ilmuhū bimarātibil-ghuyūbi, Allāhumma innī as'aluka wa athlubu minkal-wushūla ilaika fa-innī bika astadillu 'alaika, Allāhummahdinī binūrika ilaika wa aqimnī bishidqil-'ubūdiyyati baina yadaika, Allāhumma innī as'aluka bikhafiyyi khafiyyi luthfika wa bi'azhīmi 'azhīmi 'azhamatika wa bisirri asrāri qudratika wa bimaknūni maknūni ghaibika an tusakhkhira lī khādiman muthī'an min khuddāmismikallāhil-Lathīfil-Khabīri taksyifu lī bihī mā ghāba 'annī ( ath-thalabu ) Yā Allāhu yā man qulta wa qaulukal-haqqu ( Innallāha 'alā kulli syai'in qadīrun ) ) tammad-du'ā'u.\n\nWa 'inda tamāmil-'amali tushallī 'alā Rasūlillāhi shallallāhu 'alaihi wa sallama 11 marratan, tsumma tadha'ul-waraqata tahta wisādatika wa takūnul-kitābatu ilā a'lā tsumma tanāmu makānaka 'alā syiqqikal-yamīni, fabi-idznillāhi tarā fī manāmika mā yasurruka, wa lā tukhbir ahadan bimā ra'aita. Wa hādzā huwal-wafqu tuhīthuhū bil-āyati ( Qauluhul-haqqu wa lahul-mulku ) min jihātihil-arba'i wa tadūru bihil-āyatu min jihātihil-arba'i kadzālika ( Alā ya'lamu man khalaqa wa huwal-Lathīful-Khabīru ) wad-du'ā'u mubtadi'an min fauqil-yamīni 'aksa 'aqāribis-sā'ati.", "terj": "Faedah tentang penyingkapan melalui mimpi (al-kasyful-manāmī).\n\nWahai saudara-saudaraku karena Allah, aku letakkan untuk kalian faedah yang agung ini, yaitu faedah dalam penyingkapan melalui mimpi, dan ia bermanfaat dengan izin Allah 'azza wa jalla dalam menyingkap perkara-perkara yang tersembunyi, termasuk di dalamnya barang-barang yang terpendam dan sihir yang dikubur, dan seterusnya. Adapun tata cara pengamalannya adalah sebagai berikut:\n\nTulislah wafaq tersebut pada selembar kertas putih dengan tinta ruhani yang suci, dan asapilah dengan wewangian yang harum; hal itu tentu dilakukan setelah shalat Isya serta setelah melaksanakan apa yang telah aku sebutkan sebelumnya pada faedah amalan-amalan ruhani yang mendahului setiap amalan ruhani. Kemudian setelah penulisan dan pengasapan, engkau meletakkan kertas itu di hadapanmu di atas sajadahmu dan engkau duduk sebagaimana duduk dalam shalat seraya memandang ke arah wafaq tersebut. Kemudian engkau mulai membaca Asmaul Husna yang akan disebutkan berikut ini dengan menggunakan yā' nidā' (kata seru) seperti ini: (Yā Allāhu Yā Lathīfu Yā Khabīru — Wahai Allah, Wahai Yang Maha Halus, Wahai Yang Maha Mengetahui secara mendalam) sebanyak 1070 kali; dan pada setiap penghujung tingkatan bilangan (70, 100, 200, dst. hingga 1070) engkau membaca ayat yang mulia: (Apakah Tuhan yang menciptakan itu tidak mengetahui; sedangkan Dia Maha Halus lagi Maha Mengetahui? — QS. al-Mulk: 14) sebanyak 10 kali, serta membaca doa berikut satu kali, yaitu:\n\n(Ya Allah, sesungguhnya aku memohon kepada-Mu, wahai Allah, wahai Yang Maha Halus, wahai Yang Maha Mengetahui, wahai Dzat yang keagungan wibawa-Nya memenuhi seluruh hati dan ilmu-Nya meliputi seluruh tingkatan alam gaib. Ya Allah, sesungguhnya aku memohon kepada-Mu dan meminta kepada-Mu untuk sampai kepada-Mu, karena sesungguhnya dengan-Mu aku mencari petunjuk menuju-Mu. Ya Allah, tunjukilah aku dengan cahaya-Mu menuju-Mu, dan tegakkanlah aku dengan ketulusan penghambaan di hadapan-Mu. Ya Allah, sesungguhnya aku memohon kepada-Mu dengan kelembutan-Mu yang paling tersembunyi, dengan keagungan-Mu yang paling agung, dengan rahasia dari segala rahasia kekuasaan-Mu, dan dengan perbendaharaan gaib-Mu yang paling tersimpan rapat, agar Engkau menundukkan bagiku seorang khadim yang taat dari para khadim Asma-Mu: Allāh al-Lathīf al-Khabīr, yang dengannya Engkau menyingkapkan bagiku apa yang tersembunyi dariku [sebutkan hajat/perkara yang ingin disingkap], wahai Allah, wahai Dzat yang telah berfirman dan firman-Mu adalah kebenaran: Sesungguhnya Allah Maha Kuasa atas segala sesuatu — QS. al-Baqarah: 20). Selesailah doa tersebut.\n\nDan ketika seluruh amalan telah sempurna, engkau bershalawat atas Rasulullah shallallahu 'alaihi wa sallam sebanyak 11 kali, kemudian engkau meletakkan kertas tersebut di bawah bantalmu dengan posisi tulisan menghadap ke atas, lalu engkau tidur di tempatmu di atas lambung (sisi tubuh) kananmu; maka dengan izin Allah engkau akan melihat di dalam mimpimu apa yang menggembirakanmu (menunjukkan jawaban yang dicari), dan janganlah engkau memberitahukan kepada siapa pun tentang apa yang telah engkau lihat. Dan inilah wafaqnya (pada Halaman 30): engkau mengelilinginya dengan ayat (Firman-Nya adalah benar dan milik-Nyalah segala kerajaan — QS. al-An'ām: 73) dari keempat sisinya, dan diputar mengelilinginya pula dari keempat sisinya ayat (Apakah Tuhan yang menciptakan itu tidak mengetahui; sedangkan Dia Maha Halus lagi Maha Mengetahui? — QS. al-Mulk: 14) beserta doanya, dimulai dari kanan atas berlawanan arah jarum jam.", "syarah": "1. **Rahasia Bilangan 1070 (`عَدَدَ ١٠٧٠ مَرَّةً`) & `رَأْسُ الْمَرَاتِبِ`**:\n   - Tiga Asmaul Husna yang dipanggil dengan huruf seruan (`يَا اللهُ يَا لَطِيفُ يَا خَبِيرُ`) memiliki nilai hisab Jumal Kabir:\n     - `الله` = **66**\n     - `لطيف` = **129**\n     - `خبير` = **812**\n     - Jumlah ketiganya = `66 + 129 + 812 = 1007`, dan apabila dihitung bersama huruf seruan / penggenapan thabaqāt mukhammas menjadi **1070**.\n   - Istilah **`عَلَى رَأْسِ الْمَرَاتِبِ`** (*di setiap kepala tingkatan bilangan*) dalam disiplin ilmu hikmah berarti: ketika membaca 1070 kali, bacaan dijeda pada kepala satuan/puluhan pertama (**70**), lalu setiap genap ratusan (**100, 200, 300, 400, 500, 600, 700, 800, 900, 1000** — total 11 jeda) untuk membaca QS. al-Mulk: 14 sebanyak 10× dan Doa Kasyf 1×.\n2. **Kesesuaian Ayat Kunci QS. al-Mulk: 14 & QS. al-An'ām: 73**:\n   - QS. al-Mulk: 14 (`أَلَا يَعْلَمُ مَنْ خَلَقَ وَهُوَ اللَّطِيفُ الْخَبِيرُ`) adalah ayat kunci *kasyf* (penyingkapan) paling masyhur di kalangan ulama hikmah karena memadukan sifat *al-Lathīf* (Yang menembus perkara paling halus/tersembunyi) dan *al-Khabīr* (Yang mengetahui hakikat batin).\n   - Adapun bingkai dalam wafaq menggunakan potongan QS. al-An'ām: 73 (`قَوْلُهُ الْحَقُّ وَلَهُ الْمُلْكُ` — 4 kata untuk 4 sisi bingkai wafaq), yang huruf-huruf awalnya (atau nilai hisabnya) menjadi fondasi pengunci kebenaran penglihatan mimpi (*ru'yā shādiqah*).", "khus": "1. **Fungsi Utama (`Khushūshiyyah`)**: Menyingkap perkara-perkara tersembunyi (*al-umūrul-makhfiyyah*) melalui mimpi yang terang, khususnya untuk mengetahui lokasi **sihir yang dipendam/dikubur (`as-sihrul-madfūn`)**, barang berharga yang hilang/terpendam (`al-khabāyā`), atau hakikat suatu urusan yang samar.\n2. **Syarat Pendahuluan**: Wajib dikerjakan setelah shalat Isya dalam keadaan suci lahir batin, serta terlebih dahulu melakukan *tahshīn* (benteng diri) dan *ishrāful-'ummār* sebagaimana kaidah umum amalan ruhani yang telah dijelaskan Syeikh al-Basyir pada halaman-halaman awal kitab.\n3. **Adab Fokus Pandangan (`Nāzhirun ilal-wafqi`)**: Selama berzikir 1070×, kertas wafaq yang telah diasapi bukhur wangi diletakkan di atas sajadah di depan pengamal, dan mata memandang tenang ke arah pusat wafaq agar bentuk geometris angka asror terekam dalam batin sebelum tidur.\n4. **Adab Tidur & Pantangan Membocorkan Rahasia (`Wa lā tukhbir ahadan bimā ra'aita`)**:\n   - Setelah menutup wirid dengan shalawat 11×, letakkan kertas wafaq di bawah bantal dengan permukaan tulisan menghadap ke atas (`الْكِتَابَةُ إِلَى أَعْلَى`), lalu langsung tidur di tempat shalat tersebut dengan posisi miring ke lambung kanan (`عَلَى شِقِّكَ الْيَمِينِ`) tanpa berbicara urusan duniawi lagi.\n   - **Syarat mutlak**: Apa yang tampak di dalam mimpi tidak boleh diceritakan kepada siapa pun agar pintu *kasyf* tidak tertutup."}, {"hal": "30", "title": "HALAMAN 30 — فَائِدَةٌ فِي الْكَشْفِ الْمَنَامِيِّ", "imgs": ["rajah_anwar_FINAL_300DPI/IMG_20261025_102900.jpg", "hal_30.png"], "arab": "فَائِدَةٌ فِي الْكَشْفِ الْمَنَامِيِّ\n\n| ١٤٢ | ٢٣٠ | ٣٠٧ | ٩١٠ | ١٦٧٧ |\n|---|---|---|---|---|\n| ٩١١ | ١٦٧٨ | ١٤٣ | ٢٢٦ | ٣٠٨ |\n| ٢٢٧ | ٣٠٤ | ٩١٢ | ١٦٧٩ | ١٤٤ |\n| ١٦٨٠ | ١٤٥ | ٢٢٨ | ٣٠٥ | ٩٠٨ |\n| ٣٠٦ | ٩٠٩ | ١٦٧٦ | ١٤٦ | ٢٢٩ |\n\n[الإِطَارُ الدَّاخِلِيُّ الْأَخْضَرُ حَوْلَ الْوَفْقِ مِنْ جِهَاتِهِ الْأَرْبَعِ]: قَوْلُهُ الْحَقُّ وَلَهُ الْمُلْكُ\n\n[الدَّائِرَةُ الْخَارِجِيَّةُ الْمُحِيطَةُ بِالْوَفْقِ مِنْ فَوْقِ الْيَمِينِ عَكْسَ عَقَارِبِ السَّاعَةِ]: أَلَا يَعْلَمُ مَنْ خَلَقَ وَهُوَ اللَّطِيفُ الْخَبِيرُ اللَّهُمَّ إِنِّي أَسْأَلُكَ يَا اللهُ يَا لَطِيفُ يَا خَبِيرُ يَا مَنْ عَظُمَتْ هَيْبَتُهُ فِي جَمِيعِ الْقُلُوبِ وَأَحَاطَ عِلْمُهُ بِمَرَاتِبِ الْغُيُوبِ اللَّهُمَّ إِنِّي أَسْأَلُكَ وَأَطْلُبُ مِنْكَ الْوُصُولَ إِلَيْكَ فَإِنِّي بِكَ أَسْتَدِلُّ عَلَيْكَ اللَّهُمَّ اهْدِنِي بِنُورِكَ إِلَيْكَ وَأَقِمْنِي بِصِدْقِ الْعُبُودِيَّةِ بَيْنَ يَدَيْكَ اللَّهُمَّ إِنِّي أَسْأَلُكَ بِخَفِيِّ خَفِيِّ لُطْفِكَ وَبِعَظِيمِ عَظِيمِ عَظَمَتِكَ وَبِسِرِّ أَسْرَارِ قُدْرَتِكَ وَبِمَكْنُونِ مَكْنُونِ غَيْبِكَ أَنْ تُسَخِّرَ لِي خَادِمًا مُطِيعًا مِنْ خُدَّامِ اسْمِكَ اللهِ اللَّطِيفِ الْخَبِيرِ تَكْشِفُ لِي بِهِ مَا غَابَ عَنِّي ( الطَّلَبُ ) يَا اللهُ يَا مَنْ قُلْتَ وَقَوْلُكَ الْحَقُّ إِنَّ اللهَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ", "latin": "Fā'idatun fil-kasyfil-manāmiyyi.\n\n| ١٤٢ | ٢٣٠ | ٣٠٧ | ٩١٠ | ١٦٧٧ |\n|---|---|---|---|---|\n| ٩١١ | ١٦٧٨ | ١٤٣ | ٢٢٦ | ٣٠٨ |\n| ٢٢٧ | ٣٠٤ | ٩١٢ | ١٦٧٩ | ١٤٤ |\n| ١٦٨٠ | ١٤٥ | ٢٢٨ | ٣٠٥ | ٩٠٨ |\n| ٣٠٦ | ٩٠٩ | ١٦٧٦ | ١٤٦ | ٢٢٩ |\n\n[Wafaq Mukhammas 5×5 — Asror Angka Arab, tidak dilatinkan]", "terj": "Faedah tentang penyingkapan melalui mimpi (al-kasyful-manāmī).\n\n| ١٤٢ | ٢٣٠ | ٣٠٧ | ٩١٠ | ١٦٧٧ |\n|---|---|---|---|---|\n| ٩١١ | ١٦٧٨ | ١٤٣ | ٢٢٦ | ٣٠٨ |\n| ٢٢٧ | ٣٠٤ | ٩١٢ | ١٦٧٩ | ١٤٤ |\n| ١٦٨٠ | ١٤٥ | ٢٢٨ | ٣٠٥ | ٩٠٨ |\n| ٣٠٦ | ٩٠٩ | ١٦٧٦ | ١٤٦ | ٢٢٩ |\n\n[Wafaq Mukhammas 5×5 — Asror Angka Arab, tidak diterjemahkan]", "syarah": "1. **Hisab Matriks Wafaq Mukhammas 5×5 (Konstanta 3266)**:\n     - **Baris 1 (kanan→kiri)**: `١٤٢ + ٢٣٠ + ٣٠٧ + ٩١٠ + ١٦٧٧ = ٣٢٦٦`\n     - **Baris 2 (kanan→kiri)**: `٩١١ + ١٦٧٨ + ١٤٣ + ٢٢٦ + ٣٠٨ = ٣٢٦٦`\n     - **Baris 3 (kanan→kiri)**: `٢٢٧ + ٣٠٤ + ٩١٢ + ١٦٧٩ + ١٤٤ = ٣٢٦٦`\n     - **Baris 4 (kanan→kiri)**: `١٦٨٠ + ١٤٥ + ٢٢٨ + ٣٠٥ + ٩٠٨ = ٣٢٦٦`\n     - **Baris 5 (kanan→kiri)**: `٣٠٦ + ٩٠٩ + ١٦٧٦ + ١٤٦ + ٢٢٩ = ٣٢٦٦`\n     - **Kolom 1 s.d. 5**: masing-masing tepat berjumlah **٣٢٦٦ (3266)**.\n     - **Diagonal 1**: `١٤٢ + ١٦٧٨ + ٩١٢ + ٣٠٥ + ٢٢٩ = ٣٢٦٦`\n     - **Diagonal 2**: `١٦٧٧ + ٢٢٦ + ٩١٢ + ١٤٥ + ٣٠٦ = ٣٢٦٦`\n\n2. **Rahasia Deret Langkah (*Tarqī*) Wafaq 5×5**:\n   - Wafaq ini disusun dalam 5 kelompok deret berurutan (*khamsu marātib*), masing-masing terdiri dari 5 angka berurutan (+1):\n     - Kelompok 1 (*Miftāh*): `١٤٢، ١٤٣، ١٤٤، ١٤٥، ١٤٦` (142–146)\n     - Kelompok 2: `٢٢٦، ٢٢٧، ٢٢٨، ٢٢٩، ٢٣٠` (226–230)\n     - Kelompok 3: `٣٠٤، ٣٠٥، ٣٠٦، ٣٠٧، ٣٠٨` (304–308)\n     - Kelompok 4: `٩٠٨، ٩٠٩، ٩١٠، ٩١١، ٩١٢` (908–912; sel pusat/qalb = **`٩١٢`**)\n     - Kelompok 5 (*Maghlāq*): `١٦٧٦، ١٦٧٧، ١٦٧٨، ١٦٧٩، ١٦٨٠` (1676–1680)\n   - Sesuai kaidah yang ditetapkan, seluruh angka di dalam wafaq merupakan *asror* dan wajib ditulis dengan angka Arab tanpa dilatinkan maupun diterjemahkan.\n\n3. **Bingkai Hijau `قَوْلُهُ الْحَقُّ وَلَهُ الْمُلْكُ` & Lingkaran Doa**:\n   - Keempat sisi bingkai hijau yang memagari kisi 5×5 adalah kaligrafi `قَوْلُهُ الْحَقُّ وَلَهُ الْمُلْكُ` (`قوله` di sisi kanan, `الحق` di sisi atas, `وله` di sisi kiri, `الملك` di sisi bawah).\n   - Adapun lingkaran luar yang mengelilingi bingkai dimulai dari kanan atas bergerak berlawanan arah jarum jam (`عَكْسَ عَقَارِبِ السَّاعَةِ`), memuat QS. al-Mulk: 14 dilanjutkan Doa Kasyf lengkap hingga `إِنَّ اللهَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ`.", "khus": "1. **Urutan Penulisan Wafaq Mukhammas**: Ditulis pada kertas putih polos tanpa garis menggunakan tinta za'faran dan air mawar selepas shalat Isya. Penulisan sel mengikuti urutan nilai dari terkecil (*Miftāh* `١٤٢` di pojok kanan atas) hingga terbesar (*Maghlāq* `١٦٨٠` di baris ke-4 kolom kanan), lalu ditutup dengan bingkai `قَوْلُهُ الْحَقُّ وَلَهُ الْمُلْكُ` pada keempat sisinya serta lingkaran ayat dan doa berlawanan arah jarum jam.\n2. **Pengisian Hajat (`الطَّلَبُ`)**: Pada bagian lingkaran doa yang bertanda `( الطَّلَبُ )`, pengamal menuliskan atau menyebutkan secara spesifik perkara gaib/tersembunyi yang ingin disingkap (misalnya letak sihir yang ditanam atau barang yang hilang).\n3. **Penyimpanan di Bawah Bantal**: Setelah diasapi bukhur yang harum dan dibacakan zikir `يَا اللهُ يَا لَطِيفُ يَا خَبِيرُ` 1070× beserta ayat dan doanya pada tiap kepala tingkatan (sebagaimana rincian Halaman 29), kertas wafaq ini diletakkan di bawah bantal dengan tulisan menghadap ke atas sebelum tidur miring ke kanan."}, {"hal": "31", "title": "HALAMAN 31 — دَعَوَاتُ وَرِيَاضَاتُ الشَّيْخِ الْبَشِيرِ", "imgs": ["hal_31.png"], "arab": "دَعَوَاتُ وَرِيَاضَاتُ\nالشَّيْخِ الْبَشِيرِ", "latin": "Da'awātu wa riyādhātu\nasy-Syaikhil-Basyīri", "terj": "Doa-doa dan riyadhah-riyadhah\nSyeikh al-Basyir", "syarah": "1. **Makna Istilah *Da'awāt* & *Riyādhāt***:\n   - ***Da'awāt*** (jamak dari *da'wah*): untaian doa-doa agung, *'azīmah*, dan *qasam* yang bersumber dari ayat-ayat Al-Qur'an serta Asmaul Husna untuk memohon pertolongan Allah dalam berbagai hajat besar.\n   - ***Riyādhāt*** (jamak dari *riyādhah*): latihan penempaan jiwa, penyucian batin, dan kedisiplinan wirid dalam jangka waktu tertentu (seperti 3, 7, atau 41 hari) guna mematangkan kesiapan ruhani pengamal.", "khus": "1. **Peralihan Tingkatan Amalan**: Jika bagian pertama kitab (Halaman 1–30) menitikberatkan pada *fawā'id* praktis berbasis *wafaq* dan *rajah* penyembuhan/penolak sihir, maka mulai Halaman 31 ini Syeikh al-Basyir membuka bagian kedua yang berfokus pada *da'wah* (doa-doa pengundang keberkahan/penundukan) dan *riyādhah* (tirakat ruhani).\n2. **Kewajiban Mempelajari Muqaddimah & Tanbīh**: Sebelum mengamalkan satu pun *da'wah* pada bagian kedua ini, setiap pengamal diwajibkan membaca dengan saksama pasal *Muqaddimah Hāmmah* dan *Tanbīhul-Labīb* yang tercantum pada daftar isi halaman berikutnya (Halaman 32)."}, {"hal": "32", "title": "HALAMAN 32 — فِهْرِسُ دَعَوَاتِ وَرِيَاضَاتِ الشَّيْخِ الْبَشِيرِ", "imgs": ["hal_32.png"], "arab": "فِهْرِسُ دَعَوَاتِ وَرِيَاضَاتِ الشَّيْخِ الْبَشِيرِ\n\n١. مُقَدِّمَةٌ هَامَّةٌ خَاصَّةٌ بِالْأَعْمَالِ الرُّوحَانِيَّةِ\n٢. تَنْبِيهُ اللَّبِيبِ فِي مَا يَخُصُّ الدَّعَوَاتِ وَالرِّيَاضَاتِ\n٣. دَعْوَةُ التَّفْوِيضِ\n٤. إِصْرَافُ الْعُمَّارِ الْمَشْهُودُ بِصِحَّتِهِ\n٥. الدُّرَّةُ النَّافِعَةُ الدَّافِعَةُ لِلسِّحْرِ وَرَدِّهِ عَلَى فَاعِلِهِ\n٦. دَعْوَةُ التَّسْخِيرِ نَسْأَلُ اللهَ الْإِجَابَةَ\n٧. الدَّعْوَةُ الْقَاهِرَةُ\n٨. وَإِلَيْكُمُ التَّحْصِينُ الْمَوْعُودُ بِهِ\n٩. دَعْوَةُ آيَةِ الْكُرْسِيِّ الشَّرِيفَةِ", "latin": "Fihrisu da'awāti wa riyādhātisy-Syaikhil-Basyīri\n\n1. Muqaddimatun hāmmatun khāshshatun bil-a'mālir-rūhāniyyati\n2. Tanbīhul-labībi fī mā yakhushshud-da'awāti war-riyādhāti\n3. Da'watut-tafwīdhi\n4. Ishrāful-'ummāril-masyhūdu bishihhatihī\n5. Ad-durratun-nāfi'atud-dāfi'atu lis-sihri wa raddihī 'alā fā'ilihī\n6. Da'watut-taskhīri nas'alullāhal-ijābata\n7. Ad-da'watul-qāhiratu\n8. Wa ilaikumut-tahshīnul-mau'ūdu bihī\n9. Da'watu āyatil-kursiyyisy-syarīfati", "terj": "Daftar isi doa-doa dan riyadhah-riyadhah Syeikh al-Basyir\n\n1. Mukadimah penting yang khusus berkaitan dengan amalan-amalan ruhani\n2. Peringatan bagi orang yang berakal cerdas mengenai hal-hal yang berkaitan dengan doa-doa dan riyadhah-riyadhah\n3. Doa Tafwīdh (penyerahan diri sepenuhnya kepada Allah)\n4. Ishrāful-'Ummār (pemindahan penghuni halus tempat) yang telah disaksikan kesahihannya\n5. Mutiara yang bermanfaat lagi menolak sihir serta mengembalikannya kepada pelakunya\n6. Doa Taskhīr (penundukan), kami memohon kepada Allah pengabulannya\n7. Doa al-Qāhirah (yang menundukkan dengan perkasa)\n8. Dan inilah untuk kalian Tahshīn (benteng penjagaan diri) yang telah dijanjikan\n9. Doa Ayat Kursi yang mulia", "syarah": "1. **Sistematika 9 Bab Bagian Kedua Kitab**:\n   - Syeikh al-Basyir menyusun bagian kedua ini dengan urutan metodologis yang sangat rapi:\n     - **Fondasi Ilmu & Adab (Bab 1–2)**: *Muqaddimah Hāmmah* dan *Tanbīhul-Labīb* sebagai pedoman syarat, adab, serta rambu-rambu bagi pengamal *da'wah* dan *riyādhah*.\n     - **Kesiapan Batin & Tempat (Bab 3–4 & 8)**: *Da'watut-Tafwīdh* (penyerahan urusan kepada Allah), *Ishrāful-'Ummār* (sterilisasi tempat amalan dari gangguan jin penghuni ruang), serta *at-Tahshīn al-Mau'ūd bih* (benteng penjagaan diri yang telah dijanjikan pengarang pada bagian pertama kitab).\n     - **Amalan Inti Pengobatan, Penundukan & Kewibawaan (Bab 5, 6, 7, 9)**: *Ad-Durratun-Nāfi'ah* (penolak dan pembalik sihir), *Da'watut-Taskhīr*, *Ad-Da'watul-Qāhirah*, hingga puncaknya *Da'watu Āyatil-Kursī asy-Syarīfah*.", "khus": "1. **Keterkaitan Antar-Bab**: Daftar isi ini menjadi peta jalan (*roadmap*) bagi praktisi: seorang pengamal tidak dibenarkan langsung mengamalkan *Da'watut-Taskhīr* (Bab 6) atau *Ad-Da'watul-Qāhirah* (Bab 7) sebelum memahami *Muqaddimah* (Bab 1), *Tanbīhul-Labīb* (Bab 2), serta menguasai *Ishrāful-'Ummār* (Bab 4) dan *Tahshīn* (Bab 8).\n2. **Rujukan Silang (*Cross-Reference*)**: Ketika pada halaman-halaman sebelumnya (termasuk Halaman 29) Syeikh al-Basyir menyebutkan *\"melaksanakan apa yang telah aku sebutkan sebelumnya pada faedah amalan-amalan ruhani\"*, rincian lengkap tentang *Ishrāful-'Ummār* dan *Tahshīn* tersebut dipaparkan secara tuntas dalam bab-bab yang terdaftar pada Halaman 32 ini."}, {"hal": "33", "title": "HALAMAN 33 — مُقَدِّمَةٌ هَامَّةٌ خَاصَّةٌ بِالْأَعْمَالِ الرُّوحَانِيَّةِ", "imgs": ["hal_33.png"], "arab": "مُقَدِّمَةٌ هَامَّةٌ خَاصَّةٌ بِالْأَعْمَالِ الرُّوحَانِيَّةِ\n\nالسَّلَامُ عَلَيْكُمْ وَرَحْمَةُ اللهِ وَبَرَكَاتُهُ ، إِخْوَتِي فِي اللهِ كَثِيرًا مَا يَقَعُ طُلَّابُ الرُّوحَانِيِّ فِي مُعْضِلَةٍ عُظْمَى أَلَا وَهِيَ انْعِدَامُ الْإِجَابَةِ وَالتَّصْرِيفِ فِي هَذَا الْبَابِ وَذَلِكَ نَاتِجٌ إِمَّا لِغَفْلَةِ الطَّالِبِ عَنْ كَيْفِيَّةِ الْعَمَلِ وَإِمَّا لِعَوَارِضَ تَمْنَعُ عَنْهُ الِاتِّصَالَ بِطَلَبِهِ ، وَلَا أُخْفِي عَلَيْكُمْ أَنِّي مَا رَغِبْتُ التَّحَدُّثَ عَنْ هَذَا الْبَابِ إِلَّا شَفَقَةً عَلَى طُلَّابِ هَذَا الْعِلْمِ الرُّوحَانِيِّ لِمَا رَأَيْتُ مَا يُعَانِيهِ الطَّلَبَةُ مِنْ مَشَقَّةٍ وَعَنَاءٍ فِي هَذَا الْبَابِ وَإِلَيْكُمْ تَرْتِيبُ الْأَعْمَالِ\n\n١ الطَّهَارَةُ الْكَامِلَةُ بَدَنًا وَلِبَاسًا وَمَجْلِسًا\n٢ صَلَاةُ رَكْعَتَيْنِ لِلَّهِ بِنِيَّةِ الْعِبَادَةِ\n٣ الِاسْتِغْفَارُ لِلَّهِ تَعَالَى ١٠٠٠ مَرَّةٍ\n٤ الصَّلَاةُ عَلَى الْحَبِيبِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ ٤٠٦ مَرَّةً\n٥ تِلَاوَةُ التَّحْصِينِ\n٦ إِصْرَافُ الْعُمَّارِ\n٧ تِلَاوَةُ دَعْوَةِ التَّسْخِيرِ\n٨ الْقِيَامُ بِالْعَمَلِ الْمُرَادِ\n٩ الِاسْتِغْفَارُ قَدْرَ مُسْتَطَاعِ الطُّلَّابِ\n١٠ الصَّلَاةُ عَلَى سَيِّدِنَا رَسُولِ اللهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ", "latin": "Muqaddimatun hāmmatun khāshshatun bil-a'mālir-rūhāniyyati.\n\nAs-salāmu 'alaikum wa rahmatullāhi wa barakātuhū, ikhwatī fillāhi katsīran mā yaqa'u thullābur-rūhāniyyi fī mu'dhilatin 'uzhmā alā wa hiyan-'idāmul-ijābati wat-tashrīfi fī hādzal-bābi wa dzālika nātijun immā lighaflatith-thālibi 'an kaifiyyatil-'amali wa immā li'awāridha tamna'u 'anhul-ittishāla bithalabihī, wa lā ukhfī 'alaikum annī mā raghibtut-tahaddutsa 'an hādzal-bābi illā syafaqatan 'alā thullābi hādzal-'ilmir-rūhāniyyi limā ra'aitu mā yu'ānīhith-thalabatu min masyaqqatin wa 'anā'in fī hādzal-bābi wa ilaikum tartībul-a'māli:\n\n1. Ath-thahāratul-kāmilatu badanan wa libāsan wa majlisan\n2. Shalātu rak'ataini lillāhi biniyyatil-'ibādati\n3. Al-istighfāru lillāhi ta'ālā 1000 marratin\n4. Ash-shalātu 'alal-habībi shallallāhu 'alaihi wa sallama 406 marratan\n5. Tilāwatut-tahshīni\n6. Ishrāful-'ummāri\n7. Tilāwatu da'watit-taskhīri\n8. Al-qiyāmu bil-'amalil-murādi\n9. Al-istighfāru qadra mustathā'ith-thullābi\n10. Ash-shalātu 'alā sayyidinā Rasūlillāhi shallallāhu 'alaihi wa sallama", "terj": "Mukadimah penting yang khusus berkaitan dengan amalan-amalan ruhani.\n\nAssalamu'alaikum warahmatullahi wabarakatuh. Wahai saudara-saudaraku karena Allah, sering kali para penuntut ilmu ruhani terjatuh ke dalam permasalahan yang sangat besar, yaitu tidak adanya pengabulan (ijābah) dan daya guna (tashrīf) dalam bab ini. Hal itu disebabkan adakalanya karena kelalaian sang penuntut ilmu dari tata cara pengamalan yang benar, dan adakalanya karena berbagai penghalang ('awāridh) yang menghalanginya untuk terhubung dengan hajat yang dicarinya. Dan tidak aku sembunyikan dari kalian bahwa aku tidak terdorong untuk membicarakan bab ini melainkan karena rasa kasih sayang (iba) terhadap para penuntut ilmu ruhani ini, karena aku melihat beratnya kesulitan dan kepayahan yang dialami para penuntut ilmu dalam bab ini. Dan inilah untuk kalian urutan tata tertib amalan:\n\n1. Kesucian yang sempurna pada badan, pakaian, dan tempat duduk (majelis)\n2. Shalat dua rakaat karena Allah dengan niat ibadah\n3. Membaca istighfar kepada Allah Ta'ala 1000 kali\n4. Membaca shalawat atas al-Habib shallallahu 'alaihi wa sallam 406 kali\n5. Membaca Tahshīn (benteng penjagaan diri)\n6. Melakukan Ishrāful-'Ummār (pemindahan penghuni halus tempat)\n7. Membaca Doa Taskhīr (penundukan)\n8. Melaksanakan amalan yang dimaksud (yang dituju)\n9. Membaca istighfar seukuran kemampuan para penuntut ilmu\n10. Membaca shalawat atas junjungan kita Rasulullah shallallahu 'alaihi wa sallam", "syarah": "1. **Dua Penyebab Kegagalan Amalan (`In'idāmul-Ijābah wat-Tashrīf`)**:\n   - Syeikh al-Basyir mendiagnosis secara tajam mengapa banyak pengamal kitab hikmah gagal memperoleh hasil:\n     1) **Faktor Metodologis (`Ghaflatuth-Thālib 'an Kaifiyyatil-'Amal`)**: Pengamal langsung membaca *'azīmah* atau menulis *wafaq* tanpa menjalankan urutan pembuka dan penutup yang baku.\n     2) **Faktor Gangguan Ruhani (`'Awāridh`)**: Adanya penghalang pada diri pengamal atau tempat amalan yang memutus hubungan batin (*al-ittishāl*) dengan hajatnya.\n\n2. **Rahasia Bilangan Istighfar 1000× & Shalawat 406×**:\n   - **Istighfar 1000×** adalah bilangan *kulliyyah* (kesempurnaan pembersihan) untuk menggugurkan karat dosa yang menghalangi *ijābah*.\n   - **Shalawat 406×**: Dalam disiplin hisab Abjad (*Jumal Kabīr*), angka **406** adalah nilai huruf **`ت`** (*Tā'* = 400) + **`و`** (6) yang mengisyaratkan *Taubah* dan *Tawajjuh*, serta nilai kalimat-kalimat pembuka nurani yang menyambungkan ruh pengamal dengan syafaat Rasulullah ﷺ.", "khus": "1. **Sepuluh Rukun Baku (*Tartībul-A'māl*) Sebelum Setiap Amalan Ruhani**:\n   - Sepuluh urutan pada Halaman 33 ini merupakan **Fondasi Wajib (SOP Utama)** bagi seluruh amalan di dalam kitab *Anwārul-Mujarrabāt* (baik ketika menulis wafaq pada Bagian Pertama maupun ketika mengamalkan *Da'wah* pada Bagian Kedua).\n   - Ketika pada Halaman 29 pengarang menulis *\"melaksanakan apa yang telah aku sebutkan pada faedah amalan-amalan ruhani yang mendahului setiap amalan ruhani\"*, maka yang dimaksud adalah ke-10 langkah ini.\n2. **Urutan Penjagaan Diri yang Tidak Boleh Terbalik (Poin 5, 6, 7)**:\n   - Perhatikan bahwa **Poin 5 (`تِلَاوَةُ التَّحْصِينِ` — membaca benteng diri)** wajib dilakukan **sebelum** **Poin 6 (`إِصْرَافُ الْعُمَّارِ` — memindahkan jin penghuni tempat)** dan **Poin 7 (`تِلَاوَةُ دَعْوَةِ التَّسْخِيرِ`)**. Membentengi diri terlebih dahulu sebelum melakukan *ishrāf* menjamin pengamal sepenuhnya terlindung saat berinteraksi dengan dimensi ruhani."}, {"hal": "34", "title": "HALAMAN 34 — تَنْبِيهُ اللَّبِيبِ فِي مَا يَخُصُّ الدَّعَوَاتِ وَالرِّيَاضَاتِ", "imgs": ["hal_34.png"], "arab": "تَنْبِيهُ اللَّبِيبِ فِي مَا يَخُصُّ الدَّعَوَاتِ وَالرِّيَاضَاتِ\n\nإِخْوَتِي فِي اللهِ أُرِيدُ التَّنْبِيهَ عَلَى أُمُورٍ إِنْ عَلِمَهَا بَعْضُكُمْ رُبَّمَا غَابَتْ عَنِ الْبَعْضِ الْآخَرِ وَهِيَ بِخُصُوصِ الدَّعَوَاتِ وَالرِّيَاضَاتِ وَكُلِّ مَا يَتَعَلَّقُ بِهَذَا الْبَابِ ،\n\nفَاعْلَمْ أَيُّهَا الطَّالِبُ أَنَّهُ لَا بُدَّ لَكَ مِنَ الْمُرُورِ مِنْ مَرَاحِلَ لِلْوُصُولِ إِلَى مَقَامِ السَّادَاتِ ذَوِي التَّصْرِيفِ ، فَكَثِيرًا مَا رَأَيْتُ طُلَّابًا يَتَخَبَّطُونَ فِي هَذَا الْبَابِ تَخَبُّطَ الْعَشْوَاءِ وَلَا يَعْلَمُونَ مَاذَا يَفْعَلُونَ ، فَبِمُجَرَّدِ وُقُوفِهِمْ عَلَى دَعْوَةٍ أَوِ اسْتِخْدَامٍ يَشْرَعُونَ فِيهِ دُونَ أَنْ يُدْرِكُوا أَنَّ الْعَجَلَةَ سَتَقِفُ بِهِمْ يَوْمًا عَلَى أَمْرٍ لَا تُحْمَدُ عُقْبَاهُ وَذَلِكَ يَرْجِعُ لِأَصْلِ الطَّرِيقِ مِنْ أَيْنَ بَدَأَ بِنَاؤُهُ فِي هَذَا الْبَابِ فَإِنْ كَانَ بِنَاؤُهُ قَوِيًّا مَتِينًا وَصَامِدًا خَاضَ الطَّالِبُ فِي الْعَالَمِ الرُّوحَانِيِّ وَبَسَطَ سَطْوَتَهُ بِإِذْنِ رَبِّهِ عَزَّ وَجَلَّ وَإِنْ كَانَ غَيْرَ ذَلِكَ هَوَى بِهِ وَأَوْقَعَهُ فِي الْمَشَقَّةِ وَالْعَنَاءِ ، فَلَا بُدَّ لِكُلِّ طَالِبٍ مِنِ ابْتِدَائِهِ بِرِيَاضَاتٍ مُعَيَّنَةٍ مُتَتَالِيَةٍ لِتَقْوِيَةِ رُوحِهِ وَقَهْرِ نَفْسِهِ حَتَّى لَا يَتْرُكَ فِي جَسَدِهِ وَرُوحِهِ وَنَفْسِهِ وَعَقْلِهِ مَكَانًا لِلْمَرَدَةِ وَالشَّيَاطِينِ يَتَخَبَّطُونَ بِهِ حَفِظَنَا اللهُ وَإِيَّاكُمْ وَالْمُسْلِمِينَ أَجْمَعِينَ ، وَأَوَّلُ شَيْءٍ يَقُومُ بِهِ الطَّالِبُ كَثْرَةُ الِاسْتِغْفَارِ وَالصَّلَاةُ عَلَى نَبِيِّ الرَّحْمَةِ سَيِّدِنَا مُحَمَّدٍ وَعَلَى آلِهِ وَصَحْبِهِ ثُمَّ بَعْدَ ذَلِكَ يَعْمَلُ رِيَاضَةً مُدَّتُهَا ٤٠ يَوْمًا بِدُونِ صِيَامٍ إِلَّا تَرْكَ مَا لَهُ رُوحٌ أَوْ خَرَجَ مِنَ الرُّوحِ وَالرِّيَاضَةُ لِأَسْمَاءِ اللهِ [ حَيٌّ قَيُّومٌ ] خُصُوصًا وَهَذَا شَرْطٌ مُؤَكَّدٌ إِنْ كَانَ الطَّالِبُ أَعْزَبًا لِأَنَّ فِي هَذِهِ الرِّيَاضَةِ تَنْكَسِرُ الْعَوَارِضُ مِنْ إِنَاثِ الْجِنِّ وَرُبَّمَا صَادَفَ أَحَدُكُمْ هَذِهِ الْحَالَةَ وَالسِّرُّ فِيهَا عَدَدُ التِّلَاوَةِ لِأَنَّهُ يَخْرُجُ مِنِ اسْمِ الطَّالِبِ ، وَالرِّيَاضَةُ الثَّانِيَةُ لِأَسْمَاءِ اللهِ [ حَيٌّ قَوِيٌّ ] وَعَدَدُ التِّلَاوَةِ وَمُدَّةُ الْعَمَلِ تَخْرُجُ مِنِ اسْمِ الطَّالِبِ ، وَالرِّيَاضَةُ الثَّالِثَةُ لِأَسْمَاءِ اللهِ [ قَوِيٌّ شَدِيدٌ ] وَهِيَ تَجْمَعُ عَدَدَ التِّلَاوَتَيْنِ الْأُولَى وَالثَّانِيَةِ وَالْمُدَّةُ تَخْرُجُ مِنِ اسْمِ الطَّالِبِ ، مَثَلًا كَانَ عَدَدُ التِّلَاوَةِ فِي الرِّيَاضَةِ ١ ، ١٠٠ دُبُرَ كُلِّ صَلَاةٍ وَالتِّلَاوَةُ فِي الرِّيَاضَةِ ٢ ، ١٧٠ دُبُرَ كُلِّ صَلَاةٍ تَكُونُ التِّلَاوَةُ فِي الرِّيَاضَةِ الثَّالِثَةِ ٢٧٠ دُبُرَ كُلِّ صَلَاةٍ ، وَبَعْدَ إِتْمَامِ الرِّيَاضَةِ ٣ لِلطَّالِبِ حِينَذَاكَ الدُّخُولُ مِنْ بَابٍ فَسِيحٍ مُنِيرٍ إِلَى هَذَا الْعَالَمِ بِدُونِ أَنْ يَخْشَى عَلَى نَفْسِهِ شَيْئًا ، وَسَأَضَعُ لَكُمْ إِخْوَتِي فِي اللهِ طَرِيقَةَ حِسَابِ الْمُدَّةِ وَعَدَدِ التِّلَاوَةِ بِهَذَا الْخُصُوصِ لِتَسْتَفِيدُوا مِنْهَا وَتَسْتَنِيرَ طَرِيقُكُمْ ، وَفَّقَكُمُ اللهُ وَأَعَانَكُمْ عَلَى الْخَيْرِ وَفِعْلِهِ وَأَنَارَ طَرِيقَكُمْ وَأَعَاذَكُمْ مِنَ الْجَهْلِ وَأَهْلِهِ ، وَتَذَكَّرُوا قَوْلَ اللهِ عَزَّ وَجَلَّ فِي سُورَةِ الْبَقَرَةِ [ وَلَيْسَ الْبِرُّ بِأَنْ تَأْتُوا الْبُيُوتَ مِنْ ظُهُورِهَا وَلَكِنَّ الْبِرَّ مَنِ اتَّقَى وَأْتُوا الْبُيُوتَ مِنْ أَبْوَابِهَا وَاتَّقُوا اللهَ لَعَلَّكُمْ تُفْلِحُونَ ] صَدَقَ اللهُ الْعَظِيمُ\n\nفَتَدَبَّرْ أَيُّهَا الطَّالِبُ وَاعْتَبِرْ وَالسَّلَامُ", "latin": "Tanbīhul-labībi fī mā yakhushshud-da'awāti war-riyādhāti.\n\nIkhwatī fillāhi urīdut-tanbīha 'alā umūrin in 'alimahā ba'dhukum rubbamā ghābat 'anil-ba'dhil-ākhari wa hiya bikhushūshid-da'awāti war-riyādhāti wa kulli mā yata'allaqu bihādzal-bābi,\n\nFa'lam ayyuhath-thālibu annahū lā budda laka minal-murūri min marāhila lil-wushūli ilā maqāmis-sādāti dzawit-tashrīfi, fakatsīran mā ra'aitu thullāban yatakhabbathūna fī hādzal-bābi takhabbuthal-'asywā'i wa lā ya'lamūna mādzā yaf'alūna, fabimujarradi wuqūfihim 'alā da'watin awi-stikhdāmin yasyra'ūna fīhi dūna an yudrikū annal-'ajalata sataqifu bihim yauman 'alā amrin lā tuhmadu 'uqbāhu wa dzālika yarji'u li-ashlith-tharīqi min aina bada'a binā'uhū fī hādzal-bābi fa-in kāna binā'uhū qawiyyan matīnan wa shāmidan khādhath-thālibu fil-'ālamir-rūhāniyyi wa basatha sathwatahū bi-idzni rabbihī 'azza wa jalla wa in kāna ghaira dzālika hawā bihī wa auqa'ahū fil-masyaqqati wal-'anā'i, falā budda likulli thālibin mini-btidā'ihī biriyādhātin mu'ayyanatin mutatāliyatin litaqwiyati rūhihī wa qahri nafsihī hattā lā yatruka fī jasadihī wa rūhihī wa nafsihī wa 'aqlihī makānan lil-maradati wasy-syayāthīni yatakhabbathūna bihī hafizhanallāhu wa iyyākum wal-muslimīna ajma'īna, wa awwalu syai'in yaqūmu bihith-thālibu katsratul-istighfāri wash-shalātu 'alā nabiyyir-rahmati sayyidinā Muhammadin wa 'alā ālihī wa shahbihī tsumma ba'da dzālika ya'malu riyādhatan muddatuhā 40 yauman bidūni shiyāmin illā tarka mā lahū rūhun au kharaja minar-rūhi war-riyādhatu li-asmā'illāhi [ Hayyun Qayyūmun ] khushūshan wa hādzā syarthun mu'akkadun in kānath-thālibu a'zaban li-anna fī hādzihir-riyādhati tankasirul-'awāridhu min inātsil-jinni wa rubbamā shādafa ahadukum hādzihil-hālata was-sirru fīhā 'adadut-tilāwati li-annahū yakhruju minismith-thālibi, war-riyādhatuts-tsāniyatu li-asmā'illāhi [ Hayyun Qawiyyun ] wa 'adadut-tilāwati wa muddatul-'amali takhruju minismith-thālibi, war-riyādhatuts-tsālitsatu li-asmā'illāhi [ Qawiyyun Syadīdun ] wa hiya tajma'u 'adadat-tilāwatainil-ūlā wats-tsāniyati wal-muddatu takhruju minismith-thālibi, matsalan kāna 'adadut-tilāwati fir-riyādhati 1, 100 dubura kulli shalātin wat-tilāwatu fir-riyādhati 2, 170 dubura kulli shalātin takūnut-tilāwatu fir-riyādhatits-tsālitsati 270 dubura kulli shalātin, wa ba'da itmāmir-riyādhati 3 lith-thālibi hīnadzākad-dukhūlu min bābin fasīhin munīrin ilā hādzal-'ālami bidūni an yakhsyā 'alā nafsihī syai'an, wa sa-adha'u lakum ikhwatī fillāhi tharīqata hisābil-muddati wa 'adadit-tilāwati bihādzal-khushūshi litastafīdū minhā wa tastanīra tharīqukum, waffaqakumullāhu wa a'ānakum 'alal-khairi wa fi'lihī wa anāra tharīqakum wa a'ādzakum minal-jahli wa ahlihī, wa tadzakkarū qaulallāhi 'azza wa jalla fī sūratil-Baqarati [ Wa laisal-birru bi-an ta'tul-buyūta min zhuhūrihā wa lākinnal-birra manittaqā wa'tul-buyūta min abwābihā wattaqullāha la'allakum tuflihūna ] shadaqallāhul-'azhīmu.\n\nFatadabbar ayyuhath-thālibu wa'tabir was-salāmu.", "terj": "Peringatan bagi orang yang berakal cerdas mengenai hal-hal yang berkaitan dengan doa-doa dan riyadhah-riyadhah.\n\nWahai saudara-saudaraku karena Allah, aku ingin mengingatkan tentang beberapa perkara yang jika sebagian dari kalian telah mengetahuinya, boleh jadi perkara itu luput dari sebagian yang lain; yaitu khususnya mengenai doa-doa dan riyadhah-riyadhah serta segala hal yang berkaitan dengan bab ini.\n\nMaka ketahuilah wahai penuntut ilmu, bahwa engkau harus melewati tahapan-tahapan untuk sampai ke maqam para pemimpin pemilik daya guna (tashrīf). Sungguh sering kali aku melihat para penuntut ilmu berjalan membabi buta dalam bab ini bagaikan unta rabun di malam gelap dan mereka tidak mengetahui apa yang sedang mereka perbuat; begitu mereka menemukan suatu doa (da'wah) atau amalan penundukan khadim (istikhdām), mereka langsung memulainya tanpa menyadari bahwa ketergesa-gesaan itu suatu hari akan menghentikan mereka pada perkara yang akibatnya tidak terpuji. Hal itu kembali pada pokok jalannya: dari mana ia memulai fondasi bangunannya dalam bab ini. Apabila fondasi bangunannya kuat, kokoh, dan teguh, niscaya sang penuntut ilmu dapat menyelami alam ruhani dan membentangkan wibawanya dengan izin Tuhannya 'azza wa jalla; namun apabila tidak demikian, niscaya bangunan itu runtuh menimpanya dan menjerumuskannya ke dalam kesulitan serta kepayahan. Oleh karena itu, setiap penuntut ilmu harus memulai dengan riyadhah-riyadhah tertentu secara berurutan untuk menguatkan ruhnya dan menundukkan hawa nafsunya, sehingga ia tidak menyisakan di dalam jasad, ruh, jiwa, dan akalnya satu tempat pun bagi jin-jin durhaka (maradah) dan setan-setan untuk mempermainkannya — semoga Allah menjaga kami, kalian, dan seluruh kaum muslimin. Dan hal pertama yang wajib dilakukan oleh penuntut ilmu adalah memperbanyak istighfar dan shalawat atas Nabi pembawa rahmat, junjungan kita Muhammad beserta keluarga dan para sahabatnya. Kemudian setelah itu ia mengerjakan riyadhah yang lamanya 40 hari tanpa berpuasa, kecuali meninggalkan memakan segala yang bernyawa atau yang keluar dari makhluk bernyawa; dan riyadhah tersebut adalah membaca Asma Allah [ Hayyun Qayyūmun ] secara khusus. Ini adalah syarat yang sangat ditekankan apabila sang penuntut ilmu masih bujangan (belum menikah), karena di dalam riyadhah ini akan hancur segala gangguan ('awāridh) dari kalangan jin betina, dan boleh jadi salah seorang di antara kalian pernah mengalami kondisi tersebut; adapun rahasia di dalamnya terletak pada jumlah bacaannya karena jumlah itu dikeluarkan dari perhitungan nama sang penuntut ilmu. Kemudian riyadhah kedua adalah membaca Asma Allah [ Hayyun Qawiyyun ], sedangkan jumlah bacaan dan lama hari pengamalannya dikeluarkan dari nama sang penuntut ilmu. Dan riyadhah ketiga adalah membaca Asma Allah [ Qawiyyun Syadīdun ], yang menggabungkan jumlah bacaan riyadhah pertama dan kedua, sedangkan lama harinya dikeluarkan dari nama sang penuntut ilmu; sebagai contoh: apabila jumlah bacaan pada riyadhah pertama adalah 100 kali setiap selesai shalat fardhu, dan bacaan pada riyadhah kedua adalah 170 kali setiap selesai shalat fardhu, maka jumlah bacaan pada riyadhah ketiga menjadi 270 kali setiap selesai shalat fardhu. Dan setelah menyempurnakan riyadhah ketiga ini, barulah saat itu sang penuntut ilmu dapat masuk melalui pintu yang lapang lagi bercahaya menuju alam ini tanpa perlu merasa takut sedikit pun atas dirinya. Dan aku akan meletakkan untuk kalian, wahai saudara-saudaraku karena Allah, tata cara menghitung lama hari dan jumlah bacaan khusus dalam hal ini agar kalian dapat mengambil manfaat darinya dan jalan kalian menjadi terang. Semoga Allah memberi taufik kepada kalian, menolong kalian atas kebaikan dan pengamalannya, menerangi jalan kalian, serta melindungi kalian dari kebodohan dan para pengikutnya. Dan ingatlah firman Allah 'azza wa jalla dalam Surah al-Baqarah: [ Dan bukanlah kebajikan memasuki rumah-rumah dari bagian belakangnya, akan tetapi kebajikan itu ialah kebajikan orang yang bertakwa; dan masukilah rumah-rumah itu dari pintu-pintunya, serta bertakwalah kepada Allah agar kalian beruntung — QS. al-Baqarah: 189 ]. Maha Benar Allah Yang Maha Agung.\n\nMaka renungkanlah wahai penuntut ilmu dan ambillah pelajaran, wassalam.", "syarah": "1. **Kurikulum Tiga Jenjang Riyadhah Pembentukan Ruh (*Taqwiyatul-Arwāh*)**:\n   - Syeikh al-Basyir memaparkan kurikulum wajib 3 tahap sebelum seorang murid mengamalkan *Da'wah* atau *Istikhdām*:\n     - **Tahap 1 (`حَيٌّ قَيُّومٌ` — 40 Hari)**: Menghidupkan kesadaran ruh (*Hayyun*) dan kemandirian batin (*Qayyūmun*) disertai *tarku mā lahū rūh* (pantang memakan daging/produk hewani tanpa harus berpuasa di siang hari) guna memutus ikatan syahwat jasmani serta menghancurkan gangguan jin betina (*'awāridh min inātsil-jinn*), terutama bagi penuntut ilmu yang belum menikah (*a'zab*).\n     - **Tahap 2 (`حَيٌّ قَوِيٌّ`)**: Memadukan kehidupan ruh (*Hayyun*) dengan kekuatan batin (*Qawiyyun*); jumlah bacaan (*'adadut-tilāwah*) dan lama harinya (*muddatul-'amal*) dihitung berdasarkan hisab nama murid.\n     - **Tahap 3 (`قَوِيٌّ شَدِيدٌ`)**: Memadukan kekuatan (*Qawiyyun*) dan keteguhan daya tahan (*Syadīdun*); jumlah bacaannya setiap selesai shalat lima waktu adalah hasil penjumlahan wirid Tahap 1 + Tahap 2 (contoh: `100 + 170 = 270` kali setiap *dubura kulli shalāh*).", "khus": "1. **Pembersihan Pendahuluan**: Sebelum memasuki Riyadhah 40 hari pertama, murid wajib terlebih dahulu membiasakan diri memperbanyak istighfar dan shalawat atas Nabi Muhammad ﷺ.\n2. **Aturan Pantang Bernyawa Tanpa Puasa (`Bidūni Shiyāmin illā Tarka Mā Lahū Rūh`)**: Pada riyadhah pertama selama 40 hari, pengamal tetap diperbolehkan makan dan minum di siang hari (tidak wajib puasa menahan lapar/haus), namun wajib menghindari segala makanan yang berasal dari makhluk bernyawa (daging merah, unggas, ikan) maupun yang keluar darinya (telur, susu, keju, lemak hewani), dan mencukupkan diri dengan tumbuh-tumbuhan/biji-bijian.\n3. **Kedisiplinan Waktu Wirid (`Dubura Kulli Shalāh`)**: Seluruh jumlah wirid yang diperoleh dari hisab nama murid dibaca secara istiqamah setiap selesai shalat fardhu lima waktu tanpa terputus."}, {"hal": "35", "title": "HALAMAN 35 — دَعْوَةُ التَّفْوِيضِ", "imgs": ["hal_35.png"], "arab": "دَعْوَةُ التَّفْوِيضِ\n\nإِخْوَتِي فِي اللهِ أَضَعُ لَكُمْ هَذِهِ الدَّعْوَةَ الْمُبَارَكَةَ النَّافِعَةَ بِإِذْنِ اللهِ فِي دَفْعِ الْأَهْوَالِ وَالْأُمُورِ الصِّعَابِ ، وَهِيَ دَعْوَةُ التَّفْوِيضِ وَمَنْ أَرَادَ اسْتِعْمَالَهَا فَلْيَقْرَأْهَا كَمَا نَشْرَحُهَا بِإِذْنِ اللهِ الْعَزِيزِ الْوَهَّابِ ،\n\nيَبْدَأُ بِصَلَاةِ رَكْعَتَيْنِ لِلَّهِ تَعَالَى بَعْدَ صَلَاةِ الْعِشَاءِ وَإِنْ كَانَتْ فِي جَوْفِ اللَّيْلِ كَانَتْ أَجْوَدَ ، ثُمَّ الِاسْتِغْفَارُ ١٠٠ مَرَّةٍ ثُمَّ الصَّلَاةُ عَلَى سَيِّدِنَا مُحَمَّدٍ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ ١٠٠ مَرَّةٍ ثُمَّ لَا إِلَهَ إِلَّا اللهُ ١٠٠ مَرَّةٍ ثُمَّ لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللهِ ١٠٠ مَرَّةٍ ثُمَّ الْآيَةُ [ إِنَّ أَوَّلَ بَيْتٍ وُضِعَ لِلنَّاسِ لَلَّذِي بِبَكَّةَ مُبَارَكًا وَهُدًى لِلْعَالَمِينَ فِيهِ آيَاتٌ بَيِّنَاتٌ مَقَامُ إِبْرَاهِيمَ وَمَنْ دَخَلَهُ كَانَ آمِنًا ] ٧ مَرَّاتٍ ثُمَّ بَعْدَ ذَلِكَ يَقْرَأُ الْآيَةَ [ وَأُفَوِّضُ أَمْرِي إِلَى اللهِ إِنَّ اللهَ بَصِيرٌ بِالْعِبَادِ ] ٣٣ مَرَّةً ثُمَّ يَقْرَأُ الدَّعْوَةَ الْمُبَارَكَةَ ٣ أَوْ ٧ مَرَّاتٍ وَهِيَ هَذِهِ ،\n\n[ بِسْمِ اللهِ الرَّحْمَنِ الرَّحِيمِ اللَّهُمَّ إِنِّي أَسْتَدْفِعُ بِأَسْرَارِ أَنْوَارِ بَوَارِقِ لَوَامِعِ صَوْلَةِ كَلَامِكَ الْقَدِيمِ وَأَسْتَدْرِئُ بِطَعَنَاتِ جَلَالِ سُلْطَانِكَ الْعَظِيمِ فِي بَحْرِ صُرُوفِ الدَّهْرِ حَوَادِثَ الْقَهْرِ وَسُوءَ الْقَضَاءِ وَجَذْبَ الْبَلَاءِ وَشَمَاتَةَ الْأَعْدَاءِ وَأَتَحَصَّنُ بِنُورِ وَجْهِكَ الْعَظِيمِ مِنْ شَرِّ كُلِّ ذِي شَرٍّ وَمَكْرِ كُلِّ ذِي مَكْرٍ وَالشَّرِيكِ مِنَ الْأَرْوَاحِ الْحَاضِرَةِ وَالْغَائِبَةِ وَهَوْلِ مَا تَجْرِي بِهِ الْأَفْلَاكُ وَتَحْمِلُهُ الْأَمْلَاكُ يَا عَفُوُّ يَا عَفُوُّ يَا عَفُوُّ يَا كَهيعص اِكْفِنِي مَا أَهَمَّنِي يَا حمعسق اِحْمِنِي مِمَّا أَلَمَّ بِي يَا اللهُ يَا بَصِيرُ فَإِنِّي أَعُوذُ بِكَ مِنَ الذُّنُوبِ الَّتِي بِهَا تُزِيلُ النِّعَمَ وَأَعُوذُ بِكَ مِنَ الذُّنُوبِ الَّتِي بِهَا تُحِلُّ النِّقَمَ وَأَعُوذُ بِكَ مِنَ الذُّنُوبِ الَّتِي بِهَا تُمْسِكُ الْقَطْرَ وَأَعُوذُ بِكَ مِنَ الذُّنُوبِ الَّتِي بِهَا تُثِيرُ الْأَعَادِيَ وَأَعُوذُ بِكَ مِنَ الذُّنُوبِ الَّتِي بِهَا تُمْسِكُ رَحْمَتَكَ يَا أَرْحَمَ الرَّاحِمِينَ يَا حَفِيظُ احْفَظْنِي حِفْظَ الصِّيَانَةِ وَالرِّعَايَةِ وَالْوِقَايَةِ بِأَلْفِ أَلْفِ لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللهِ الْعَلِيِّ الْعَظِيمِ وَبِقُوَّةِ رَحَمَاتِ بِسْمِ اللهِ الرَّحْمَنِ الرَّحِيمِ وَبِحُصُونِ دُرُوعِ اللهُ أَكْبَرُ مِنْ كُلِّ مَا يُخْشَى مِنْهُ وَيُحْذَرُ وَبِسُتُورِ وِقَايَةِ حِمَايَةِ وَأُفَوِّضُ أَمْرِي إِلَى اللهِ إِنَّ اللهَ بَصِيرٌ بِالْعِبَادِ ] تَمَّتِ الدَّعْوَةُ ،\n\nثُمَّ اخْتِمْ بِفَاتِحَةِ الْكِتَابِ وَالصَّلَاةِ عَلَى الْحَبِيبِ مُحَمَّدٍ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ .\n\nأَسْأَلُ اللهَ عَزَّ وَجَلَّ أَنْ يَنْفَعَنِي وَإِيَّاكُمْ بِالْقُرْآنِ الْعَظِيمِ وَيَهْدِيَنِي وَإِيَّاكُمْ إِلَى صِرَاطِ الْحَقِّ الْمُبِينِ وَيَرْزُقَنِي وَإِيَّاكُمْ شَفَاعَةَ سَيِّدِنَا مُحَمَّدٍ عَلَيْهِ أَفْضَلُ الصَّلَاةِ وَالتَّسْلِيمِ آمِينَ", "latin": "Da'watut-tafwīdhi.\n\nIkhwatī fillāhi adha'u lakum hādzihid-da'watal-mubārakatan-nāfi'ata bi-idznillāhi fī daf'il-ahwāli wal-umūrish-shi'ābi, wa hiya da'watut-tafwīdhi wa man arāda-sti'mālahā falyaqra'hā kamā nasyrahuhā bi-idznillāhil-'Azīzil-Wahhābi,\n\nYabda'u bishalāti rak'ataini lillāhi ta'ālā ba'da shalātil-'isyā'i wa in kānat fī jaufil-laili kānat ajwada, tsummal-istighfāru 100 marratin tsummash-shalātu 'alā sayyidinā Muhammadin shallallāhu 'alaihi wa sallama 100 marratin tsumma lā ilāha illallāhu 100 marratin tsumma lā haula wa lā quwwata illā billāhi 100 marratin tsummal-āyatu [ Inna awwala baitin wudhi'a lin-nāsi lalladzī bibakkata mubārakan wa hudan lil-'ālamīna fīhi āyātun bayyinātun maqāmu Ibrāhīma wa man dakhalahū kāna āminan ] 7 marrātin tsumma ba'da dzālika yaqra'ul-āyata [ Wa ufawwidhu amrī ilallāhi innallāha bashīrun bil-'ibādi ] 33 marratan tsumma yaqra'ud-da'watal-mubārakata 3 au 7 marrātin wa hiya hādzihī,\n\n[ Bismillāhir-rahmānir-rahīmi Allāhumma innī astadfi'u bi-asrāri anwāri bawāriqi lawāmi'i shaulati kalāmikal-qadīmi wa astadri'u bitha'anāti jalāli sulthānikal-'azhīmi fī bahri shurūfid-dahri hawāditsal-qahri wa sū'al-qadhā'i wa jadzbal-balā'i wa syamātatal-a'dā'i wa atahashshanu binūri wajhikal-'azhīmi min syarri kulli dzī syarrin wa makri kulli dzī makrin wasy-syarīki minal-arwāhil-hādhirati wal-ghā'ibati wa hauli mā tajrī bihil-aflāku wa tahmiluhul-amlāku yā 'Afuwwu yā 'Afuwwu yā 'Afuwwu yā [ كهيعص ] [Rajah Huruf — tidak diterjemahkan] ikfinī mā ahammanī yā [ حم عسق ] [Rajah Huruf — tidak diterjemahkan] ihminī mimmā alamma bī yā Allāhu yā Bashīru fa-innī a'ūdzu bika minadz-dzunūbil-latī bihā tuzīlun-ni'ama wa a'ūdzu bika minadz-dzunūbil-latī bihā tuhillun-niqama wa a'ūdzu bika minadz-dzunūbil-latī bihā tumsikul-qathra wa a'ūdzu bika minadz-dzunūbil-latī bihā tutsīrul-a'ādiya wa a'ūdzu bika minadz-dzunūbil-latī bihā tumsiku rahmataka yā Arhamar-rāhimīna yā Hafīzhu ihfazhnī hifzhash-shiyānati war-ri'āyati wal-wiqāyati bi-alfi alfi lā haula wa lā quwwata illā billāhil-'Aliyyil-'Azhīmi wa biquwwati rahamāti bismillāhir-rahmānir-rahīmi wa bihushūni durū'i Allāhu akbaru min kulli mā yukhsyā minhu wa yuhdzaru wa bisutūri wiqāyati himāyati wa ufawwidhu amrī ilallāhi innallāha bashīrun bil-'ibādi ] tammatid-da'watu,\n\nTsummakhtim bifātihatil-kitābi wash-shalāti 'alal-habībi Muhammadin shallallāhu 'alaihi wa sallama.\n\nAs'alullāha 'azza wa jalla an yanfa'anī wa iyyākum bil-Qur'ānil-'azhīmi wa yahdiyanī wa iyyākum ilā shirāthil-haqqil-mubīni wa yarzuqanī wa iyyākum syafā'ata sayyidinā Muhammadin 'alaihi afdhalush-shalāti wat-taslīmi āmīna.", "terj": "Doa Tafwīdh (penyerahan urusan kepada Allah).\n\nWahai saudara-saudaraku karena Allah, aku letakkan untuk kalian doa yang diberkahi lagi bermanfaat ini dengan izin Allah dalam menolak berbagai kengerian dan urusan-urusan yang sulit, yaitu Doa Tafwīdh; barang siapa hendak mengamalkannya maka hendaklah ia membacanya sebagaimana kami jelaskan dengan izin Allah Yang Maha Perkasa lagi Maha Pemberi karunia.\n\nDimulai dengan melaksanakan shalat dua rakaat karena Allah Ta'ala setelah shalat Isya — dan apabila dikerjakan di tengah malam niscaya lebih utama —, kemudian membaca istighfar 100 kali, kemudian membaca shalawat atas junjungan kita Muhammad shallallahu 'alaihi wa sallam 100 kali, kemudian membaca Lā ilāha illallāh 100 kali, kemudian membaca Lā haula wa lā quwwata illā billāh 100 kali, kemudian membaca ayat: [ Sesungguhnya rumah yang mula-mula dibangun untuk (tempat beribadah) manusia, ialah Baitullah yang di Bakkah (Mekah) yang diberkahi dan menjadi petunjuk bagi semua manusia. Padanya terdapat tanda-tanda yang nyata, (di antaranya) maqam Ibrahim; barang siapa memasukinya (Baitullah itu) menjadi amanlah dia — QS. Āli 'Imrān: 96–97 ] sebanyak 7 kali, kemudian setelah itu membaca ayat: [ Dan aku menyerahkan urusanku kepada Allah; sesungguhnya Allah Maha Melihat akan hamba-hamba-Nya — QS. Ghāfir: 44 ] sebanyak 33 kali, kemudian membaca doa yang diberkahi ini sebanyak 3 atau 7 kali, yaitu:\n\n[ Dengan menyebut nama Allah Yang Maha Pengasih lagi Maha Penyayang. Ya Allah, sesungguhnya aku memohon penolakan — dengan rahasia-rahasia cahaya kilatan kemilau keperkasaan firman-Mu yang qadim, dan aku berlindung dengan hujaman keagungan kekuasaan-Mu yang agung di tengah samudra pergantian zaman — dari berbagai bencana penindasan, buruknya ketetapan takdir, tarikan malapetaka, serta kegembiraan musuh di atas penderitaanku. Dan aku membentengi diri dengan cahaya Wajah-Mu yang agung dari kejahatan setiap pemilik kejahatan, tipu daya setiap pemilik makar, dan persekutuan dari ruh-ruh yang hadir maupun yang gaib, serta dari kengerian apa yang beredar bersama falak-falak dan yang dibawa oleh para malaikat. Wahai Yang Maha Pemaaf, wahai Yang Maha Pemaaf, wahai Yang Maha Pemaaf; wahai [ كهيعص ] [Rajah Huruf — tidak diterjemahkan], cukupkanlah (lindungilah) aku dari apa yang menyusahkanku; wahai [ حم عسق ] [Rajah Huruf — tidak diterjemahkan], lindungilah aku dari apa yang menimpaku; wahai Allah, wahai Yang Maha Melihat. Sesungguhnya aku berlindung kepada-Mu dari dosa-dosa yang dengannya Engkau melenyapkan nikmat-nikmat, aku berlindung kepada-Mu dari dosa-dosa yang dengannya Engkau menurunkan bencana-bencana pembalasan, aku berlindung kepada-Mu dari dosa-dosa yang dengannya Engkau menahan turunnya hujan, aku berlindung kepada-Mu dari dosa-dosa yang dengannya Engkau membangkitkan musuh-musuh, dan aku berlindung kepada-Mu dari dosa-dosa yang dengannya Engkau menahan rahmat-Mu, wahai Dzat Yang Paling Penyayang di antara para penyayang. Wahai Yang Maha Menjaga, jagalah aku dengan penjagaan pemeliharaan, pengayoman, dan perlindungan, dengan sejuta (seribu kali seribu) Lā haula wa lā quwwata illā billāhil-'Aliyyil-'Azhīm, dengan kekuatan rahmat-rahmat Bismillāhir-rahmānir-rahīm, dengan benteng-benteng baju zirah Allāhu Akbar dari segala apa yang ditakuti dan dikhawatirkan darinya, serta dengan tirai-tirai penjagaan dan perlindungan: Dan aku menyerahkan urusanku kepada Allah; sesungguhnya Allah Maha Melihat akan hamba-hamba-Nya ]. Selesailah doa tersebut.\n\nKemudian tutuplah dengan Surah al-Fatihah dan shalawat atas al-Habib Muhammad shallallahu 'alaihi wa sallam.\n\nAku memohon kepada Allah 'azza wa jalla agar memberikan manfaat kepadaku dan kepada kalian dengan Al-Qur'an yang agung, menunjuki aku dan kalian ke jalan kebenaran yang nyata, serta menganugerahkan kepadaku dan kepada kalian syafaat junjungan kita Muhammad — semoga tercurah atas beliau seutama-utama shalawat dan salam —, Āmīn.", "syarah": "1. **Rahasia Dua Ayat Kunci Keamanan & Tafwīdh**:\n   - **QS. Āli 'Imrān: 96–97 (`وَمَنْ دَخَلَهُ كَانَ آمِنًا` — dibaca 7×)**: Menarik energi keamanan Baitullah (*al-amnu*) ke dalam ruang batin pengamal dari ketakutan di ketujuh arah (depan, belakang, kanan, kiri, atas, bawah, dan dalam diri).\n   - **QS. Ghāfir: 44 (`وَأُفَوِّضُ أَمْرِي إِلَى اللهِ إِنَّ اللهَ بَصِيرٌ بِالْعِبَادِ` — dibaca 33×)**: Merupakan ayat *tafwīdh* (penyerahan urusan secara total) yang diucapkan oleh mukmin keluarga Fir'aun, yang langsung disambung oleh firman Allah pada ayat 45: *“Maka Allah memeliharanya dari kejahatan tipu daya mereka”* (`فَوَقَاهُ اللهُ سَيِّئَاتِ مَا مَكَرُوا`).\n\n2. **Kunci Huruf Muqaththa'ah `كهيعص` & `حمعسق` serta Lima Isti'ādzah Dosa**:\n   - Doa ini menggabungkan tawassul dengan **10 huruf nuraniyyah** (`كهيعص` untuk kecukupan: *ikfinī mā ahammanī*, dan `حمعسق` untuk penjagaan: *ihminī mimmā alamma bī*) serta lima permohonan perlindungan dari dosa-dosa yang menjadi sebab dicabutnya nikmat, turunnya murka, tertahannya hujan, berkuasanya musuh, dan terhalangnya rahmat—sebagaimana warid dalam doa-doa ma'tsur Ahlul Bait dan ulama salaf.", "khus": "1. **Waktu Utama Pengamalan**: Dikerjakan setelah shalat Isya, dan waktu yang paling mustajab (*ajwad*) adalah di tengah malam (*jauful-lail* / sepertiga malam terakhir).\n2. **Urutan Wirid Pembuka (4 × 100)**:\n   - Shalat sunnah hajat/mutlak 2 rakaat karena Allah Ta'ala.\n   - Istighfar **100×**, Shalawat Nabi ﷺ **100×**, Tahlil (`لَا إِلَهَ إِلَّا اللهُ`) **100×**, dan Hauqalah (`لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللهِ`) **100×**.\n   - Membaca QS. Āli 'Imrān: 96–97 sebanyak **7×** dan QS. Ghāfir: 44 sebanyak **33×**.\n3. **Pembacaan Doa Tafwīdh (3× atau 7×) & Penutup**:\n   - Membaca teks *Da'watut-Tafwīdh* sebanyak **3 kali** (untuk penjagaan rutin) atau **7 kali** (saat menghadapi bahaya besar, makar musuh, atau kesulitan berat), lalu ditutup dengan membaca Surah al-Fatihah dan shalawat atas Nabi Muhammad ﷺ."}, {"hal": "36", "title": "HALAMAN 36 — إِصْرَافُ الْعُمَّارِ الْمَشْهُودُ بِصِحَّتِهِ", "imgs": ["hal_36.png"], "arab": "إِصْرَافُ الْعُمَّارِ الْمَشْهُودُ بِصِحَّتِهِ\n\nالسَّلَامُ عَلَيْكُمْ وَرَحْمَةُ اللهِ وَبَرَكَاتُهُ ،\n\nإِخْوَتِي فِي اللهِ إِلَيْكُمْ إِصْرَافَ الْعُمَّارِ الْمَشْهُودَ بِصِحَّتِهِ وَالَّذِي اعْتَمَدْتُ عَلَيْهِ فِي الْأَعْمَالِ الرُّوحَانِيَّةِ ،\n\n[ هَوْهٍ ٢ يَا هَوْهٍ ٢ أَهُوشٍ ٢ أَشْمَخٍ شَمَاخٍ ٢ أَيَالٍ ٢ اِنْصَرِفُوا خِفَافًا وَثِقَالًا يَا عُمَّارَ هَذَا الْمَكَانِ حَتَّى أُنْهِيَ عَمَلِي بِسُهُولَةٍ وَعُودُوا كَمَا كُنْتُمْ بِحَقِّ آهِيًّا شَرَاهِيًّا آدُونَايَ أَصْبَاؤُوتَ آلِ شَدَّايَ وَبِحَقِّ نَفْخَةِ إِسْرَافِيلَ وَقَبْضَةِ عِزْرَائِيلَ وَمَطْرَةِ مِيكَائِيلَ وَهَبْطَةِ جَبْرَائِيلَ الْهَرَبَ الْهَرَبَ بَخٍ بَخٍ بِسَلَامٍ آمِنِينَ يَا عُمَّارَ هَذَا الْمَكَانِ بِحَقِّ إِذَا زُلْزِلَتِ الْأَرْضُ زِلْزَالَهَا إِلَى أَشْتَاتًا أَشْتَاتًا أَشْتَاتًا ]\n\nيُتْلَى ٧ مَرَّاتٍ قَبْلَ كُلِّ عَمَلٍ\n\nوَبَخُورُهُ لُبَانُ الذَّكَرِ أَوْ حَصَا لُبَانٍ أَحْمَرَ [ صُلْبَانُ الْحَمْرَاءِ ] أَوْ عِلْكُ السِّدْرِ فَهُوَ أَجْوَدُ\n\nوَاللهُ الْمُوَفِّقُ", "latin": "Ishrāful-'ummāril-masyhūdu bishihhatihī.\n\nAs-salāmu 'alaikum wa rahmatullāhi wa barakātuhū,\n\nIkhwatī fillāhi ilaikum ishrāfal-'ummāril-masyhūda bishihhatihī wal-ladzi'tamadtu 'alaihi fil-a'mālir-rūhāniyyati,\n\n[ Hauhin 2 Yā Hauhin 2 Ahūsyin 2 Asymakhin Syamākhin 2 Ayālin 2 insharifū khifāfan wa tsiqālan yā 'ummāra hādzal-makāni hattā unhiya 'amalī bisuhūlatin wa 'ūdū kamā kuntum bihaqqi Āhiyyan Syarāhiyyan Ādūnāya Ashbā'ūta Āli Syaddāya wa bihaqqi nafkhati Isrāfīla wa qabdhati 'Izrā'īla wa mathrati Mīkā'īla wa habthati Jabrā'īla al-haraba al-haraba bakhin bakhin bisalāmin āminīna yā 'ummāra hādzal-makāni bihaqqi idzā zulzilatil-ardhu zilzālahā ilā asytātan asytātan asytātan ]\n\nYutlā 7 marrātin qabla kulli 'amalin.\n\nWa bakhūruhū lubānudz-dzakari au hashā lubānin ahmara [ shulbānul-hamrā'i ] au 'ilkus-sidri fahuwa ajwadu.\n\nWallāhul-muwaffiqu.", "terj": "Ishrāful-'Ummār (pemindahan penghuni halus tempat) yang telah disaksikan kesahihannya.\n\nAssalamu'alaikum warahmatullahi wabarakatuh,\n\nWahai saudara-saudaraku karena Allah, inilah untuk kalian bacaan Ishrāful-'Ummār yang telah disaksikan kesahihannya dan yang selalu aku jadikan pegangan dalam amalan-amalan ruhani:\n\n[ Hauhin 2×, Yā Hauhin 2×, Ahūsyin 2×, Asymakhin Syamākhin 2×, Ayālin 2×; berpindahlah kalian baik dalam keadaan ringan maupun berat, wahai para penghuni halus ('ummār) tempat ini, hingga aku menyelesaikan amalanku dengan mudah, dan kembalilah kalian sebagaimana keadaan kalian semula, dengan hak Āhiyyan Syarāhiyyan Ādūnāya Ashbā'ūta Āli Syaddāya, dan dengan hak tiupan sangkakala Israfil, genggaman pencabutan Izrail, curahan hujan Mikail, serta turunnya Jibril; menyingkirlah, menyingkirlah, بَخٍ بَخٍ (dengan penuh kerelaan/kemuliaan), dengan keselamatan lagi dalam keadaan aman wahai para penghuni tempat ini, dengan hak: Apabila bumi diguncangkan dengan guncangannya yang dahsyat (QS. az-Zalzalah: 1) ... dibaca hingga firman-Nya: dalam keadaan terpencar-pencar (asytātan), terpencar-pencar (asytātan), terpencar-pencar (asytātan) (QS. az-Zalzalah: 6) ].\n\nDibaca sebanyak 7 kali sebelum setiap amalan.\n\nAdapun bukhurnya (wewangian asapnya) adalah lubān dzakar (kemenyan Arab jantan), atau hashā lubān merah [ shulbān merah ], atau getah pohon bidara ('ilkus-sidr) maka itu lebih utama.\n\nDan Allah-lah Yang Maha Memberi taufik.", "syarah": "1. **Makna Asma Suryaniyyah/Ibraniyyah & Empat Tugas Malaikat Muqarrabin**:\n   - **`أَشْمَخٍ شَمَاخٍ`** (*Asymakhin Syamākhin*): Dalam literatur hikmah klasik bermakna *al-'Aliyyul-'Azhīm* (Dzat Yang Maha Tinggi lagi Maha Agung).\n   - **`آهِيًّا شَرَاهِيًّا آدُونَايَ أَصْبَاؤُوتَ آلِ شَدَّايَ`**: Merupakan rangkaian Asma Agung (*al-Hayyul-Qayyūm, Rabbush-Shabā'ūt, al-Qādirul-Kāfī*) yang menjadi sumpah pengikat (*qasam*) paling dihormati oleh para penghuni halus ruangan (*'ummārul-makān*).\n   - Empat sifat malaikat utama: *Nafkhatu Isrāfīl* (tiupan sangkakala), *Qabdhatu 'Izrā'īl* (genggaman pencabut ruh), *Mathratu Mīkā'īl* (curahan hujan/rezeki), dan *Habthatu Jabrā'īl* (turunnya wahyu) melambangkan empat unsur dan empat penjuru kekuasaan malaikat yang menjaga ruang amalan.\n\n2. **Adab Pemindahan Sementara & Pengembalian (`Wa 'Ūdū Kamā Kuntum`)**:\n   - Perhatikan bahwa di dalam teks *ishrāf* ini sudah terdapat kalimat izin kembali setelah amalan usai (`حَتَّى أُنْهِيَ عَمَلِي بِسُهُولَةٍ وَعُودُوا كَمَا كُنْتُمْ... بِسَلَامٍ آمِنِينَ` — *hingga aku menyelesaikan amalanku dengan mudah, dan kembalilah kalian sebagaimana keadaan kalian semula... dengan selamat dan aman*). Hal ini menjadikan formula *ishrāf* Syeikh al-Basyir ini aman: para *'ummār* (jin mukmin penghuni rumah) tidak disakiti, melainkan diminta menyingkir sementara selama proses penulisan wafaq atau pembacaan *da'wah* berlangsung, lalu kembali dengan damai setelah selesai.", "khus": "1. **Cara Membaca Surah az-Zalzalah dalam Ishrāf**:\n   - Ketika bacaan sampai pada kalimat `بِحَقِّ إِذَا زُلْزِلَتِ الْأَرْضُ زِلْزَالَهَا إِلَى أَشْتَاتًا أَشْتَاتًا أَشْتَاتًا`, pengamal membaca Surah az-Zalzalah dari ayat 1 (`إِذَا زُلْزِلَتِ الْأَرْضُ زِلْزَالَهَا`) hingga akhir ayat 6 (`يَوْمَئِذٍ يَصْدُرُ النَّاسُ أَشْتَاتًا`), lalu mengulangi kata **`أَشْتَاتًا`** sebanyak **3 kali** (*asytātan, asytātan, asytātan*), dan menghentikan bacaan di situ (tidak melanjutkan ke ayat 7–8 `فَمَنْ يَعْمَلْ...`).\n   - Toàn rangkaian *ishrāf* ini dibaca sebanyak **7 kali** tepat pada urutan ke-6 dari 10 tata tertib amalan (sebagaimana tercantum di Halaman 33).\n2. **Pilihan Tiga Bukhur Khusus Ishrāf**:\n   - Nyalakan salah satu dari tiga jenis getah wewangian berikut saat membaca *ishrāf*:\n     1) **Lubān Dzakar** (kemenyan Arab / *frankincense* putih kekuningan),\n     2) **Hashā Lubān Ahmar / Shulbānul-Hamrā'** (kemenyan batu merah), atau\n     3) **'Ilkus-Sidr** (getah/resin pohon bidara), yang ditegaskan oleh Syeikh al-Basyir sebagai bahan bukhur terbaik (*ajwad*) untuk mensterilkan ruang amalan."}, {"hal": "37", "title": "HALAMAN 37 — الدُّرَّةُ النَّافِعَةُ الدَّافِعَةُ لِلسِّحْرِ وَرَدِّهِ عَلَى فَاعِلِهِ", "imgs": ["hal_37.png"], "arab": "الدُّرَّةُ النَّافِعَةُ الدَّافِعَةُ لِلسِّحْرِ وَرَدِّهِ عَلَى فَاعِلِهِ\n\nالسَّلَامُ عَلَيْكُمْ وَرَحْمَةُ اللهِ وَبَرَكَاتُهُ\n\nإِخْوَتِي فِي اللهِ أَضَعُ بَيْنَ أَيْدِيكُمُ الْكَرِيمَةِ هَذِهِ الدَّعْوَةَ الْمُبَارَكَةَ النَّافِعَةَ بِإِذْنِ اللهِ فِي دَفْعِ السِّحْرِ وَرَدِّهِ عَلَى السَّاحِرِ فَمَنْ أَرَادَ الْعَمَلَ بِهَا فَلْيُصَلِّ رَكْعَتَيْنِ لِلَّهِ عَزَّ وَجَلَّ مِنْ بَعْدِ صَلَاةِ الْمَغْرِبِ مُعْتَزِلًا فِي مَكَانٍ وَحْدَهُ وَيُطْلِقُ قَلِيلًا مِنْ بَخُورٍ طَيِّبٍ وَإِنْ كَانَ لُبَانًا كَانَ أَجْوَدَ وَيَتْلُو الدَّعْوَةَ سَبْعَ مَرَّاتٍ ، وَإِنْ كَانَ يَعْرِفُ مَنْ سَحَرَهُ فَلْيُحَكِّمْ عَقْلَهُ فِيهِ وَيَشْرَعُ فِي التِّلَاوَةِ وَلَسَوْفَ يَرَى حُكْمَ اللهِ فِي السَّاحِرِ ، وَإِنْ كَانَ الْمَرْءُ مَسْحُورًا وَتَلَاهَا زَالَ سِحْرُهُ بِإِذْنِ اللهِ عَزَّ وَجَلَّ ، أَسْأَلُ اللهَ الشِّفَاءَ وَالْعَافِيَةَ لِكُلِّ مُبْتَلًى وَأَسْأَلُهُ عَزَّ وَجَلَّ الدَّمَارَ وَالنَّكَالَ لِكُلِّ سَاحِرٍ ،\n\nوَالدَّعْوَةُ هِيَ كَالتَّالِي ،", "latin": "Ad-durratun-nāfi'atud-dāfi'atu lis-sihri wa raddihī 'alā fā'ilihī.\n\nAs-salāmu 'alaikum wa rahmatullāhi wa barakātuhū.\n\nIkhwatī fillāhi adha'u baina aidīkumul-karīmati hādzihid-da'watal-mubārakatan-nāfi'ata bi-idznillāhi fī daf'is-sihri wa raddihī 'alas-sāhiri faman arādal-'amala bihā falyushalli rak'ataini lillāhi 'azza wa jalla min ba'di shalātil-maghribi mu'tazilan fī makānin wahdahū wa yuthliqu qalīlan min bakhūrin thayyibin wa in kāna lubānan kāna ajwada wa yatlud-da'wata sab'a marrātin, wa in kāna ya'rifu man saharahū falyuhakkim 'aqlahū fīhi wa yasyra'u fit-tilāwati wa lasaufa yarā hukmallāhi fis-sāhiri, wa in kānal-mar'u mas-hūran wa talāhā zāla sihruhū bi-idznillāhi 'azza wa jalla, as'alullāhasy-syifā'a wal-'āfiyata likulli mubtalan wa as'aluhū 'azza wa jallad-damāra wan-nakāla likulli sāhirin,\n\nWad-da'watu hiya kat-tālī,", "terj": "Mutiara yang bermanfaat lagi menolak sihir serta mengembalikannya kepada pelakunya.\n\nAssalamu'alaikum warahmatullahi wabarakatuh.\n\nWahai saudara-saudaraku karena Allah, aku letakkan di hadapan tangan kalian yang mulia doa yang diberkahi lagi bermanfaat ini dengan izin Allah dalam menolak sihir serta mengembalikannya kepada penyihirnya. Barang siapa hendak mengamalkannya, maka hendaklah ia melaksanakan shalat dua rakaat karena Allah 'azza wa jalla setelah shalat Maghrib dengan menyendiri di suatu tempat seorang diri, lalu menyalakan sedikit bukhur (wewangian) yang harum — dan apabila menggunakan lubān (kemenyan Arab) maka itu lebih utama —, kemudian membaca doa tersebut sebanyak tujuh kali. Dan apabila ia mengetahui siapa orang yang menyihirnya, maka hendaklah ia memusatkan akalnya (ingatannya) pada orang tersebut lalu mulai membaca doa ini; niscaya ia benar-benar akan melihat ketetapan hukuman Allah pada penyihir tersebut. Dan apabila seseorang terkena sihir lalu ia membacanya, niscaya hilanglah sihirnya dengan izin Allah 'azza wa jalla. Aku memohon kepada Allah kesembuhan dan afiat bagi setiap orang yang tertimpa ujian, dan aku memohon kepada-Nya 'azza wa jalla kehancuran serta siksaan pembalasan bagi setiap penyihir.\n\nAdapun doanya adalah sebagai berikut:", "syarah": "1. **Makna `فَلْيُحَكِّمْ عَقْلَهُ فِيهِ` (Memfokuskan Akal/Batin pada Pelaku)**:\n   - Ungkapan Syeikh al-Basyir `وَإِنْ كَانَ يَعْرِفُ مَنْ سَحَرَهُ فَلْيُحَكِّمْ عَقْلَهُ فِيهِ` bermakna: apabila korban telah mengetahui secara yakin (misalnya melalui *kasyf manāmī* pada Halaman 29–30 atau bukti nyata) siapa pelaku sihirnya, maka saat membaca *Da'wah* ini sebanyak 7 kali, ia mengikat fokus pikirannya (*tahkīmul-'aql* / *tawajjuh*) pada sosok penyihir tersebut agar pantulan *raddus-sihr* tepat mengarah kepada sumber pengirimnya. Namun jika tidak mengetahui pelakunya, cukup membaca doa ini dengan niat kesembuhan dan pengembalian sihir kepada siapa pun pembuatnya dalam ilmu Allah.", "khus": "1. **Waktu Khusus: Ba'da Shalat Maghrib (`مِنْ بَعْدِ صَلَاةِ الْمَغْرِبِ`)**:\n   - Berbeda dengan *Kasyf Manāmī* (Hal. 29) dan *Da'watut-Tafwīdh* (Hal. 35) yang diamalkan setelah shalat Isya, *Ad-Durratun-Nāfi'ah* ini secara khusus diamalkan **setelah shalat Maghrib**, yaitu saat pergantian waktu siang menuju malam ketika gelombang kiriman sihir lazim bergerak.\n2. **Syarat Khalwat Ringan (`مُعْتَزِلًا فِي مَكَانٍ وَحْدَهُ`)**:\n   - Pengamal mengerjakan shalat sunnah 2 rakaat dan membaca doa ini **7 kali** (teks doanya termuat pada Halaman 38) di dalam kamar atau ruangan yang tenang seorang diri (*mu'tazilan wahdahū*) sambil menyalakan bukhur yang harum, terutama *lubān dzakar* (kemenyan Arab).\n3. **Dua Khasiat Sekaligus**:\n   - **Syifā' (Penyembuhan)**: Melunturkan buhul dan pengaruh sihir dari tubuh orang yang tersihir (*mas-hūr*).\n   - **Radd (Pembalikan)**: Mengembalikan dampak buruk sihir tersebut kepada penyihirnya (*sāhir*) dengan izin dan keadilan Allah 'azza wa jalla."}, {"hal": "38", "title": "HALAMAN 38 — الدُّرَّةُ النَّافِعَةُ الدَّافِعَةُ لِلسِّحْرِ وَرَدِّهِ عَلَى فَاعِلِهِ", "imgs": ["hal_38.png"], "arab": "الدُّرَّةُ النَّافِعَةُ الدَّافِعَةُ لِلسِّحْرِ وَرَدِّهِ عَلَى فَاعِلِهِ\n\n[ بِسْمِ اللهِ الرَّحْمَنِ الرَّحِيمِ بِسْمِ اللهِ الْحَيِّ الْقَيُّومِ الْعَلِيِّ الْعَظِيمِ الْفَاطِرِ الْقَاهِرِ الْقَادِرِ الْمُقْتَدِرِ أَسْأَلُكَ اللَّهُمَّ الثَّبَاتَ فِي الْأَمْرِ وَالْعَزِيمَةَ عَلَى الرُّشْدِ وَالشُّكْرَ عَلَى النِّعْمَةِ وَأَسْأَلُكَ حُسْنَ عِبَادَتِكَ وَأَسْأَلُكَ مِنْ خَيْرِ مَا تَعْلَمُ وَأَعُوذُ بِكَ مِنْ شَرِّ مَا تَعْلَمُ وَأَسْتَغْفِرُكَ مِنْ شَرِّ كُلِّ مَا تَعْلَمُ إِنَّكَ أَنْتَ عَلَّامُ الْغُيُوبِ وَأَسْأَلُكَ أَمْنًا وَأَمَانًا وَأَعُوذُ بِكَ مِنْ جَوْرِ كُلِّ جَائِرٍ وَمَكْرِ كُلِّ مَاكِرٍ وَظُلْمِ كُلِّ ظَالِمٍ وَسِحْرِ كُلِّ سَاحِرٍ وَبَغْيِ كُلِّ بَاغٍ وَحَسَدِ كُلِّ حَاسِدٍ وَغَدْرِ كُلِّ غَادِرٍ وَكَيْدِ كُلِّ كَائِدٍ وَعَدَاوَةِ كُلِّ عَدُوٍّ وَطَعْنِ كُلِّ طَاعِنٍ وَقَدْحِ كُلِّ قَادِحٍ وَحِيَلِ كُلِّ مُحِيلٍ وَشَمَاتَةِ كُلِّ شَامِتٍ وَكَشْحِ كُلِّ كَاشِحٍ اللَّهُمَّ بِكَ أَصُولُ عَلَى الْأَعْدَاءِ وَالْقُرَنَاءِ وَإِيَّاكَ أَرْجُو وِلَايَةَ الْأَوْلِيَاءِ فَلَكَ الْحَمْدُ عَلَى مَا لَا أَسْتَطِيعُ إِحْصَاءَهُ اللَّهُمَّ إِنَّهُ لَيْسَ فِي الرِّيَاحِ مَرَّةٌ وَلَا فِي السَّحَابِ قَطْرَةٌ وَلَا فِي الْبَرْقِ لَمْعَةٌ وَلَا فِي الرَّعْدِ زَجْرَةٌ وَلَا فِي الْعَرْشِ وَالْكُرْسِيِّ وَسْعَةٌ وَلَا فِي الْمُلْكِ وَالْمَلَكُوتِ آيَةٌ إِلَّا وَهِيَ لَكَ آهِلَةٌ شَاهِدَةٌ بِأَنَّكَ أَنْتَ اللهُ لَا إِلَهَ إِلَّا أَنْتَ رَبُّ الْأَرَضِينَ وَالسَّمَاوَاتِ وَمَا عَلَيْهِنَّ وَمَا فِيهِنَّ وَمَا بَيْنَهُنَّ عَلَّامُ الْغُيُوبِ غَفَّارُ الذُّنُوبِ سَتَّارُ الْعُيُوبِ صَرِيخُ الْمُسْتَصْرِخِينَ نَاصِرُ الْمُسْتَضْعَفِينَ سُبْحَانَكَ لَا إِلَهَ إِلَّا أَنْتَ وَحْدَكَ لَا شَرِيكَ لَكَ أَنْتَ وَلِيُّ مَنْ كَانَ مَظْلُومًا حَتَّى يَعُودَ مُنْتَصِرًا بِهَبُوبٍ هَبُوبٍ بِمَهْبُوبٍ مَهْبُوبٍ ذِي لُطْفٍ خَفِيٍّ يَا اللهُ يَا اللهُ يَا اللهُ بِصَعْصَعٍ صَعْصَعٍ ذِي الْبَهَاءِ وَالنُّورِ التَّامِّ بِسَهْسَهُوبٍ سَهْسَهُوبٍ ذِي الْعِزِّ الشَّامِخِ بِطَهْطَهُوبٍ طَهْطَهُوبٍ لَهُوبٍ لَهُوبٍ يَا اللهُ يَا اللهُ يَا اللهُ حم حم حم حم حم حم حم كَهُوبٍ كَهُوبٍ الَّذِي بِنُورِهِ احْتَرَقَ كُلُّ شَيْطَانٍ مَارِدٍ وَبِصَوَاعِقِ انْتِقَامِهِ خَسَفَ الْأَرْضَ بِكُلِّ جَبَّارٍ عَنِيدٍ وَبِآيَاتِهِ هَزَمَ كُلَّ سَاحِرٍ وَكَافِرٍ أَسْأَلُكَ اللَّهُمَّ بِنُورِ وَجْهِكَ الَّذِي مَلَأَ أَرْكَانَ عَرْشِكَ وَأَسْأَلُكَ اللَّهُمَّ بِصَوَاعِقِ انْتِقَامِكَ الَّذِي لَا يُطَاقُ وَأَسْأَلُكَ اللَّهُمَّ بِكُلِّ آيَةٍ فِي كِتَابِكَ الْكَرِيمِ وَبِكُلِّ اسْمٍ هُوَ لَكَ سَمَّيْتَ بِهِ نَفْسَكَ أَوْ yuthāqu wa as'alukallāhumma bikulli āyatin fī kitābikal-karīmi wa bikulli-smin huwa laka sammaita bihī nafsaka au anzaltahū fī muhkami kitābika au 'allamtahū ahadan min khalqika awi-sta'tsarta bihī fī 'ilmil-ghaibi 'indaka wa as'aluka bismikal-'azhīmil-a'zhamil-makhzūnil-maknūni an taqtha'a ajala amali a'dā'ī wa syattitillāhumma syamlahum wa nakkis a'lāmahum wasyghalhum bi-abdānihim wa ruddallāhumma 'alaihim sihrahum hattā yadzūqul-'adzābal-alīma min af'ālihim fa-innā yā rabbanā naj'aluka fī nuhūrihim wa na'ūdzu bika min syurūrihim yā Mālika yaumid-dīni iyyāka na'budu wa iyyāka nasta'īnu Allāhumma bika nasta'īnu 'alaihim yā sharīkhal-mustashrikhīna yā nāshiral-mazhlūmīna famā lanā siwāka wa lā ma'aka wa lā ghairuka subhānaka lā ilāha illā anta wahdaka lā syarīka laka wa lā mu'īna yā Rabbal-'ālamīna innaka 'alā kulli syai'in qadīrun wā ghautsāhu yā Allāhu wā ghautsāhu yā Allāhu wā ghautsāhu yā Allāhu yā Bāri'u lā bad'a laka yā Dā'imu lā nafāda laka yā Hayyu yā Qayyūmu yā Muhyiyal-mautā yā Qā'imun 'alā kulli nafsin bimā kasabat antallāhul-ladzī lā ilāha illā anta Wāhidun Ahadun Fardun Shamadun as'aluka bikalimātikat-tāmmāti an taksyifa 'annī mā nazala bī min dhararin [ kadzā wa kadzā ] wa as'alukal-amna wal-'āfiyata fid-dīni wad-dunyā wal-ākhirati yā Rabbal-'ālamīna farhamnī birahmatika yā Arhamar-rāhimīna falā haula lī wa lā quwwata illā bika yā Rabbal-'ālamīna innaka 'alā kulli syai'in qadīrun wa shalli wa sallim 'alā sayyidinā Muhammadin khātamil-anbiyā'i wal-mursalīna wa 'alā ālihith-thayyibīnath-thāhirīna wa sallim taslīman ]\n\nTammatid-da'watu nafa'aniyallāhu wa iyyākum bil-Qur'ānil-'azhīmi wa ja'alahū lanā hujjatan yaumal-'ardhi 'alā wajhihil-karīmi wa shallallāhu wa sallama 'alā sayyidil-mursalīna.", "terj": "Mutiara yang bermanfaat lagi menolak sihir serta mengembalikannya kepada pelakunya.\n\n[ Dengan menyebut nama Allah Yang Maha Pengasih lagi Maha Penyayang. Dengan menyebut nama Allah Yang Maha Hidup, Yang Maha Berdiri Sendiri mengurus makhluk-Nya, Yang Maha Tinggi, Yang Maha Agung, Pencipta, Yang Maha Menundukkan, Yang Maha Kuasa, lagi Yang Maha Memegang kekuasaan mutlak. Aku memohon kepada-Mu, ya Allah, keteguhan dalam urusan, tekad yang bulat di atas petunjuk kebenaran, dan rasa syukur atas nikmat; aku memohon kepada-Mu kebaikan dalam beribadah kepada-Mu; aku memohon kepada-Mu dari kebaikan apa yang Engkau ketahui; aku berlindung kepada-Mu dari kejahatan apa yang Engkau ketahui; dan aku memohon ampun kepada-Mu dari kejahatan segala apa yang Engkau ketahui; sesungguhnya Engkau adalah Dzat Yang Maha Mengetahui segala yang gaib. Dan aku memohon kepada-Mu rasa aman dan keselamatan; serta aku berlindung kepada-Mu dari kelaliman setiap orang yang bertindak sewenang-wenang, tipu daya setiap pembuat makar, kezaliman setiap orang yang zalim, sihir setiap penyihir, keangkuhan melampaui batas dari setiap pelanggar, kedengkian setiap pendengki, pengkhianatan setiap pengkhianat, muslihat jahat setiap pembuat tipu daya, permusuhan setiap musuh, tikaman celaan setiap pencela, hujatan setiap penghujat, akal bulus setiap perekayasa, kegembiraan di atas penderitaan dari setiap orang yang senang melihat musibah orang lain, serta dendam tersembunyi dari setiap pemendam permusuhan. Ya Allah, dengan-Mu aku menerjang para musuh dan para qarin (pendamping buruk), dan hanya kepada-Mu aku mengharapkan perwalian para wali; maka bagi-Mu segala puji atas nikmat yang tidak mampu aku hitung. Ya Allah, sesungguhnya tidak ada satu hembusan pun pada angin, tidak ada satu tetes pun pada awan, tidak ada satu kilatan pun pada kilat, tidak ada satu bentakan gemuruh pun pada guntur, tidak ada satu keluasan pun pada 'Arsy dan Kursi, serta tidak ada satu tanda kekuasaan pun di alam mulk (nyata) dan malakut (gaib), melainkan semuanya tunduk menjadi saksi bagi-Mu bahwa Engkaulah Allah, tidak ada tuhan yang berhak disembah selain Engkau, Tuhan tujuh lapis bumi dan langit beserta segala yang ada di atasnya, yang ada di dalamnya, dan yang ada di antara semuanya; Yang Maha Mengetahui segala yang gaib, Yang Maha Pengampun dosa-dosa, Yang Maha Penutup aib-aib, Penolong bagi orang-orang yang berteriak meminta pertolongan, dan Pembela bagi orang-orang yang tertindas. Mahasuci Engkau, tidak ada tuhan selain Engkau semata, tidak ada sekutu bagi-Mu; Engkaulah Pelindung bagi siapa saja yang dizalimi hingga ia kembali meraih kemenangan; dengan hak Habūbin Habūbin, dengan Mahbūbin Mahbūbin pemilik kelembutan yang tersembunyi, wahai Allah, wahai Allah, wahai Allah; dengan Sha'sha'in Sha'sha'in pemilik keagungan keindahan dan cahaya yang sempurna; dengan Sahsahūbin Sahsahūbin pemilik kemuliaan yang menjulang tinggi; dengan Thahthahūbin Thahthahūbin Lahūbin Lahūbin, wahai Allah, wahai Allah, wahai Allah; [ حم حم حم حم حم حم حم ] [Rajah Huruf — tidak diterjemahkan]; Kahūbin Kahūbin, Dzat yang dengan cahaya-Nya terbakar hangus setiap setan yang membangkang, dengan petir-petir pembalasan-Nya membenamkan bumi atas setiap penguasa sombong lagi keras kepala, dan dengan ayat-ayat-Nya mengalahkan setiap penyihir dan orang kafir. Aku memohon kepada-Mu ya Allah dengan cahaya Wajah-Mu yang memenuhi tiang-tiang 'Arsy-Mu, aku memohon kepada-Mu ya Allah dengan petir-petir pembalasan-Mu yang tidak sanggup ditahan, dan aku memohon kepada-Mu ya Allah dengan setiap ayat di dalam Kitab-Mu yang mulia, dan dengan setiap Nama milik-Mu yang Engkau namakan diri-Mu dengannya, atau yang Engkau turunkan di dalam Kitab-Mu yang muhkam, atau yang Engkau ajarkan kepada salah seorang dari makhluk-Mu, atau yang Engkau khususkan penyimpanannya dalam ilmu gaib di sisi-Mu; serta aku memohon kepada-Mu dengan Nama-Mu Yang Maha Agung lagi Paling Agung (al-Ismul-'Azhīmul-A'zham) yang tersimpan lagi terjaga rapat, agar Engkau memutuskan batas harapan musuh-musuhku; cerai-beraikanlah ya Allah persatuan mereka, jungkir-balikkanlah bendera-bendera mereka, sibukkanlah mereka dengan penyakit pada tubuh-tubuh mereka sendiri, dan kembalikanlah ya Allah kepada mereka sihir mereka sendiri hingga mereka merasakan azab yang pedih akibat perbuatan-perbuatan mereka! Sesungguhnya kami, wahai Tuhan kami, menjadikan Engkau di hadapan leher-leher mereka dan kami berlindung kepada-Mu dari kejahatan-kejahatan mereka; wahai Penguasa Hari Pembalasan, hanya kepada-Mu kami menyembah dan hanya kepada-Mu kami memohon pertolongan. Ya Allah, hanya kepada-Mu kami memohon pertolongan dalam menghadapi mereka, wahai Penolong orang-orang yang menjerit meminta pertolongan, wahai Pembela orang-orang yang dizalimi; maka tidak ada bagi kami penolong selain-Mu, tidak ada yang menyertai-Mu, dan tidak ada tuhan selain-Mu; Mahasuci Engkau, tidak ada tuhan selain Engkau semata, tidak ada sekutu bagi-Mu dan tidak ada pembantu bagi-Mu, wahai Tuhan semesta alam; sesungguhnya Engkau Maha Kuasa atas segala sesuatu. Wahai pertolongan, ya Allah! Wahai pertolongan, ya Allah! Wahai pertolongan, ya Allah! Wahai Sang Pencipta yang tiada permulaan bagi-Mu, wahai Yang Maha Kekal yang tiada habis bagi-Mu, wahai Yang Maha Hidup, wahai Yang Maha Berdiri Sendiri, wahai Yang Menghidupkan orang-orang mati, wahai Yang Mengawasi setiap jiwa atas apa yang diperbuatnya; Engkaulah Allah yang tiada tuhan selain Engkau, Yang Maha Esa, Maha Tunggal, Maha Sendiri, lagi Tempat bergantung segala makhluk; aku memohon kepada-Mu dengan kalimat-kalimat-Mu yang sempurna agar Engkau menyingkapkan (menghilangkan) dariku bahaya yang turun menimpaku berupa [ sebutkan bentuk bahaya/sihir yang dialami ], dan aku memohon kepada-Mu keamanan serta afiat dalam urusan agama, dunia, dan akhirat, wahai Tuhan semesta alam; maka rahmatilah aku dengan rahmat-Mu, wahai Dzat Yang Paling Penyayang di antara para penyayang; karena tiada daya bagiku dan tiada kekuatan melainkan dengan pertolongan-Mu, wahai Tuhan semesta alam; sesungguhnya Engkau Maha Kuasa atas segala sesuatu. Dan limpahkanlah shalawat serta salam atas junjungan kita Muhammad, penutup para nabi dan rasul, beserta keluarga beliau yang baik lagi suci, dan limpahkanlah keselamatan yang sebenar-benarnya ].\n\nSelesailah doa tersebut. Semoga Allah memberikan manfaat kepadaku dan kepada kalian dengan Al-Qur'an yang agung, serta menjadikannya hujjah (pembela) bagi kita pada hari penghadapan di hadapan Wajah-Nya Yang Mulia; dan semoga Allah melimpahkan shalawat serta salam atas penghulu para rasul.", "syarah": "1. **Tiga Poros Kekuatan *Ad-Durratun-Nāfi'ah***:\n   - **Poros Pertama (14 *Isti'ādzah* Berlapis)**: Memagari pengamal dari segala bentuk serangan lahir maupun batin: *jaur* (kelaliman penguasa), *makr* (tipu daya halus), *zhulm* (kezaliman), *sihr* (sihir), *baghy* (تعدي/melampaui batas), *hasad* (dengki), *ghadr* (pengkhianatan), *kaid* (muslihat), *'adāwah* (permusuhan), *tha'n* (tikaman fitnah), *qadh* (pencemaran nama baik), *hiyal* (rekayasa), *syamātah* (sorak-sorai musuh atas musibah), dan *kasyh* (kebencian yang dipendam di dalam dada).\n   - **Poros Kedua (Asma *Jalāliyyah* & Tujuh `[ حم ]`)**: Rangkaian asma *Habūb, Mahbūb, Sha'sha' (Dzul-Bahā' wan-Nūrit-Tāmm), Sahsahūb (Dzul-'Izzisy-Syāmikh), Thahthahūb, Lahūb, Kahūb* yang dipadukan dengan tujuh `[ حم ]` (`حم` × 7 — isyarat kepada tujuh Surah *Al-Hawāmīm* dalam Al-Qur'an: Ghāfir, Fushshilat, asy-Syūrā, az-Zukhruf, ad-Dukhān, al-Jātsiyah, al-Ahqāf) merupakan benteng api nurani yang membakar setan pembangkang (*syaithān mārid*) dan mematahkan kekuatan tukang sihir.\n   - **Poros Ketiga (Inti *Raddus-Sihr*)**: Kalimat `وَاشْغَلْهُمْ بِأَبْدَانِهِمْ وَرُدَّ اللَّهُمَّ عَلَيْهِمْ سِحْرَهُمْ حَتَّى يَذُوقُوا الْعَذَابَ الْأَلِيمَ مِنْ أَفْعَالِهِمْ` memohon kepada Allah agar kesibukan penyihir berbalik kepada penyakit tubuhnya sendiri dan racun sihirnya kembali mengenai dirinya.", "khus": "1. **Penyambungan dengan Tatacara Halaman 37**:\n   - Doa pada Halaman 38 ini adalah teks lengkap dari *Ad-Durratun-Nāfi'ah* yang kaidah pengamalannya telah dijelaskan pada Halaman 37: dikerjakan setelah shalat Maghrib, diawali shalat sunnah 2 rakaat di tempat tersendiri (*mu'tazilan wahdahū*), menyalakan bukhur *lubān dzakar*, lalu membaca doa ini sebanyak **7 kali**.\n2. **Pengisian Hajat pada Lafaz `[ كَذَا وَكَذَا ]`**:\n   - Ketika bacaan sampai pada kalimat `أَنْ تَكْشِفَ عَنِّي مَا نَزَلَ بِي مِنْ ضَرَرٍ [ كَذَا وَكَذَا ]`, kata `كَذَا وَكَذَا` diganti dengan menyebutkan secara spesifik gangguan sihir, penyakit, atau mudarat yang sedang menimpa diri atau keluarga pengamal."}, {"hal": "39", "title": "HALAMAN 39 — دَعْوَةُ التَّسْخِيرِ نَسْأَلُ اللهَ الْإِجَابَةَ", "imgs": ["hal_39.png"], "arab": "دَعْوَةُ التَّسْخِيرِ نَسْأَلُ اللهَ الْإِجَابَةَ\n\nالسَّلَامُ عَلَيْكُمْ وَرَحْمَةُ اللهِ وَبَرَكَاتُهُ\n\nهَذِهِ دَعْوَةُ التَّسْخِيرِ تُتْلَى مَرَّةً وَاحِدَةً قَبْلَ كُلِّ عَمَلٍ\n\n( اللَّهُمَّ يَا مُسَخِّرَ السَّمَاوَاتِ السَّبْعِ وَالْأَرَضِينَ السَّبْعِ وَمَنْ فِيهِنَّ وَمَنْ عَلَيْهِنَّ سَخِّرْ لِي كُلَّ عِبَادِكَ مِمَّا فِي بَرِّكَ وَبَحْرِكَ يَا رَبَّ الْعَالَمِينَ حَتَّى لَا يَكُونَ فِي الْكَوْنِ شَيْءٌ مُتَحَرِّكٌ أَوْ سَاكِنٌ نَاطِقٌ أَوْ صَامِتٌ ظَاهِرٌ أَوْ بَاطِنٌ إِلَّا سَخَّرْتَهُ لِي وَيَكُونَ طَوْعَ أَمْرِي بِبَرَكَةِ اسْمِكَ الْمَخْزُونِ الْمَكْنُونِ يَا اللهُ يَا حَيُّ يَا قَيُّومُ إِنَّمَا أَمْرُهُ إِذَا أَرَادَ شَيْئًا أَنْ يَقُولَ لَهُ كُنْ فَيَكُونُ إِلَهِي جُودُكَ دَلَّنِي عَلَيْكَ وَإِحْسَانُكَ قَرَّبَنِي إِلَيْكَ أَشْكُو إِلَيْكَ مَا لَا يَخْفَى عَلَيْكَ وَأَسْأَلُكَ مَا لَا يَعْسُرُ عَلَيْكَ إِذْ عِلْمُكَ بِحَالِي يُغْنِي عَنْ سُؤَالِي يَا مُفَرِّجًا عَنْ كُلِّ مَكْرُوبٍ كَرْبَهُ وَمُنْجِيَهُ فَرِّجْ عَنِّي كَرْبِي وَمَا أَنَا فِيهِ يَا مَنْ لَيْسَ بِغَائِبٍ فَأَنْتَظِرَهُ وَلَا بِنَائِمٍ فَأُوقِظَهُ وَلَا بِغَافِلٍ فَأُنَبِّهَهُ وَلَا بِنَاسٍ فَأُذَكِّرَهُ وَلَا بِعَاجِزٍ فَأُمْهِلَهُ يَا عَالِمًا بِالْجُمْلَةِ وَغَنِيًّا عَنِ التَّفْصِيلِ وَيَا سَامِعًا لِلْقَائِلِ وَالْقِيلِ كَفَى عِلْمُكَ عَنِ الْمَقَالِ وَانْقَطَعَ الرَّجَاءُ إِلَّا مِنْكَ يَا مُتَعَالِ وَخَابَتِ الْآمَالُ إِلَّا فِيكَ يَا ذَا الْجَلَالِ وَالْإِكْرَامِ وَسُدَّتِ الطُّرُقُ إِلَّا إِلَيْكَ يَا مِفْضَالُ يَا اللهُ يَا سَمِيعُ يَا مُجِيبُ يَا قَ
