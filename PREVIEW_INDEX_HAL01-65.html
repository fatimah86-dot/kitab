lūsy bin Aghlaghal, di bawah kekuasaan Abū Thārish malik al-‘ummār (raja jin ‘ummār/‘āmir — penghuni bangunan/empat penjuru). Penjelasan rinci: ‘Athlūsy bukan jin marabahaya yang merasuki jasad, melainkan *khādim mufsid* — parasit halus yang khusus merusak frekuensi amalan (membuat wirid tidak naik, wafaq tidak berfungsi, doa terpental). Penguasa Abū Thārish adalah raja ‘ummār yang netral — dengan menyebut namanya, praktisi meminta izin hierarkis agar ‘Athlūsy dilepaskan dari tugas merusak. Media *shamgh* (jelaga bulu domba) dipilih karena tinta ini bersifat *bārid yābis* (dingin-kering) yang menetralisir sifat panas-lembab jin ‘Athlūsy; *quzburah* (ketumbar/biji ketumbar kering) adalah bukhūr penolak ‘ummār yang dibenci mereka karena aromanya menusuk namun tidak menyengat manusia. *Ishrāf al-‘ummār* wajib didahulukan — memindahkan ‘ummār baik agar tidak terkena dampak pengusiran ‘Athlūsy (adab Qādiriyyah: jangan mengusir tetangga ghaib yang baik saat mengusir parasit). Azimah terdiri dari tiga lapis: (1) Qasam pencipta — *billadzī khalaqakum wa shawwarakum* — mengingatkan asal kejadian jin, (2) Enam nama muḥriqah masing-masing 2× (Jaljal, Jalnīsy, Qahr, Barhah, Syathīsy, Syah) — adalah *asmā’ qahriyyah* yang membakar, diulang 2× untuk penekanan (*ta’kīd*), (3) Ayat *fa-ainamā tuwallū fatsamma wajhullāh* (QS Al-Baqarah:115) — pengingat bahwa Allah mengawasi ke mana pun jin melarikan diri, (4) Delapan nama ḥākim (Salhūb ... Qarmūsy) — rantai komando Abū Thārish, (5) *Infirū khifāfan wa tsiqālan* (At-Taubah:41) + *Idzā zulzilat* (Az-Zalzalah) dengan repetisi *Asytātan* 3× — perintah mobilisasi paksa dan guncangan bumi yang memporak-porandakan sarang jin. Angka 21× ‘azīmah pada tangan adalah 3×7 — 7 untuk hari, 3 untuk lapis azimah — menyatukan *mabda’* (tangan), *wāsithah* (azimah), dan *ghāyah* (penguburan).", "khus": "Kegunaan: menetralisir gangguan ‘Athlūsy yang membuat amalan apapun (wirid, wafaq, hizib) selalu gagal/terbalik. Syarat sah: (1) Lakukan *ishrāf al-‘ummār* terlebih dahulu (bacaan ishrāf umum, tidak dirinci di sini — pakai ishrāf Qādiriyyah standar), (2) Tinta harus *shamgh* asli — jelaga bulu domba yang dibakar lalu dicampur minyak/air mawar hingga jadi pasta hitam, bukan spidol/tinta kimia, (3) Tulisan di telapak kanan (bukan kiri), (4) Pembukhuran *quzburah* kering — tabur di atas bara, asapi tangan 1-2 menit, (5) ‘Azīmah 21× dengan tangan terangkat menghadap kiblat, (6) Tidur dengan tangan di bawah kepala — posisi *taḥannuth* (seperti tidur Rasul), bukan di atas bantal, (7) Pagi harinya hapus dengan air suci (air hujan/sumur yang tidak terkena matahari lebih utama — lihat Hal11), masukkan ke botol kaca bening (bukan plastik), (8) Ulangi 7 hari — jangan terputus; jika terputus karena haid/safar, ulang dari hari 1, (9) Hari ke-7 setelah penggalian lubang, baca Ayat Kursi 1× (sampai *khālidūn* — QS Al-Baqarah:255 mencakup *hum fīhā khālidūn* dalam riwayat, maksudnya baca sampai akhir ayat) dan al-Mulk 3× (surah pelindung kubur), (10) Pantangan mutlak: *lā taltafit abadan* — jangan menoleh ke belakang setelah mengubur; menoleh membatalkan *hijab* (penutup) dan ‘Athlūsy kembali. Waktu: tidak terikat hari Rabu/Sabtu (berbeda dengan faedah mass), tetapi dianjurkan malam hari setelah Isya agar frekuensi ‘Athlūsy aktif."}, {"hal": "16", "title": "HALAMAN 16 — فَائِدَةٌ لِطَرْدِ عَطْلُوشٍ مُفْسِدِ الْأَعْمَالِ الرُّوحَانِيَّةِ (٢ — الْوَفْقُ)", "imgs": ["rajah_anwar_FINAL_300DPI/IMG_20261025_092532.jpg"], "arab": "وَالْوَفْقُ هُوَ هَكَذَا\n\n| ١ | ١١١١ | ٣ |\n|---|---|---|\n| ٥ | عَطْلُوشٌ | ١١١٠ |\n| ١١٠٩ | ٤ | ٢ |\n\nثُمَّ بَعْدَ الدَّفْنِ تَقْرَأُ كَمَا تَقَدَّمَ آيَةَ الْكُرْسِيِّ إِلَى ﴿ خَالِدُونَ ﴾ وَسُورَةَ الْمُلْكِ ، وَلَا تَلْتَفِتْ", "latin": "Wal-wafqu huwa hākadzā:\n\n| ١ | ١١١١ | ٣ |\n|---|---|---|\n| ٥ | عَطْلُوشٌ | ١١١٠ |\n| ١١٠٩ | ٤ | ٢ |\n\n[Wafaq Musallas 3×3 — Asror Angka & Huruf Arab, tidak dilatinkan]\n\nTsumma ba'dad-dafni taqra'u kamā taqaddama Āyatal-Kursiyyi ilā ﴿ khālidūna ﴾ wa Sūratal-Mulki, wa lā taltafit.", "terj": "Dan wafaqnya adalah seperti ini:\n\n| ١ | ١١١١ | ٣ |\n|---|---|---|\n| ٥ | عَطْلُوشٌ | ١١١٠ |\n| ١١٠٩ | ٤ | ٢ |\n\n[Wafaq Musallas 3×3 — Asror Angka & Huruf Arab, tidak diterjemahkan]\n\nKemudian setelah penguburan (botol air hapusan tersebut), bacalah sebagaimana telah dijelaskan terdahulu Ayat Kursi hingga firman-Nya ﴿ khālidūn ﴾ (QS. al-Baqarah: 255–257) dan Surah al-Mulk (3 kali), lalu kembalilah dan jangan menoleh ke belakang.", "syarah": "1. **Hisab Matriks Wafaq Musallas 3×3 *Hishār 'Athlūsyin* (Konstanta 1115)**:\n   - Wafaq 3×3 ini merupakan *wafqul-hishār* (wafaq pengepungan) yang menempatkan nama jin pengganggu **`[ عَطْلُوشٌ ]`** tepat di kamar tengah (*qalbul-wafq*), dikepung oleh 8 angka *asror* yang mengunci keempat penjuru dengan jumlah konstanta **١١١٥ (1115)**:\n     - **Baris 1**: `١ (kanan) + ١١١١ (tengah) + ٣ (kiri) = ١١١٥`\n     - **Baris 3**: `١١٠٩ (kanan) + ٤ (tengah) + ٢ (kiri) = ١١١٥`\n     - **Kolom Kanan**: `١ + ٥ + ١١٠٩ = ١١١٥`\n     - **Kolom Kiri**: `٣ + ١١١٠ + ٢ = ١١١٥`\n     - **Pengapit Horizontal (Baris 2)**: `٥ (kanan) + ١١١٠ (kiri) = ١١١٥`\n     - **Pengapit Vertikal (Kolom Tengah)**: `١١١١ (atas) + ٤ (bawah) = ١١١٥`\n     - **Pengapit Diagonal 1**: `١ (kanan-atas) + ٢ (kiri-bawah) = ٣` (seimbang dengan sudut kiri-atas `٣`)\n     - **Pengapit Diagonal 2**: `٣ (kiri-atas) + ١١٠٩ (kanan-bawah) = ١١١٢` (`1115 - 3`).", "khus": "1. **Tata Cara Penulisan & Penguburan**:\n   - Setelah melakukan *ishrāful-'ummār*, tulislah Wafaq 3×3 ini di telapak tangan kanan menggunakan *shamgh* (jelaga/tinta hitam dari bulu domba), asapi dengan ketumbar (*quzburah*), dan bacakan *'azīmah* (pada Halaman 15) sebanyak 21 kali sebelum tidur selama 7 malam.\n   - Setiap pagi, lebur tulisan di telapak tangan dengan air suci dan tampung di dalam botol bersih. Setelah genap 7 hari, kuburlah botol tersebut di tanah yang sepi, letakkan tangan di atas tanah kuburannya sambil membaca Ayat Kursi hingga `خَالِدُونَ` (1×) dan Surah al-Mulk (3×), lalu pulang tanpa menoleh ke belakang."}, {"hal": "17", "title": "HALAMAN 17 — AD-DURRAH AN-NŪRĀNIYYAH 1/2 — الدُّرَّةُ النُّورَانِيَّةُ فِي عِلَاجِ الْأَعْرَاضِ الرَّوْحَانِيَّةِ", "imgs": ["hal_17.png"], "arab": "الدُّرَّةُ النُّورَانِيَّةُ فِي عِلَاجِ الْأَعْرَاضِ الرَّوْحَانِيَّةِ\n\nالسَّلَامُ عَلَيْكُمْ وَرَحْمَةُ اللهِ وَبَرَكَاتُهُ، إِخْوَتِي فِي اللهِ، أَضَعُ لَكُمْ هَذِهِ الْفَائِدَةَ بِإِذْنِ اللهِ عَزَّ وَجَلَّ فِي عِلَاجِ الْأَمْرَاضِ وَالْأَعْرَاضِ الرَّوْحَانِيَّةِ، وَهُوَ مُرَبَّعٌ لِاسْمِ الْجَلَالَةِ [اللهُ جَلَّ جَلَالُهُ] يُكْتَبُ الْمُرَبَّعُ بِمَاءِ وَرْدٍ وَزَعْفَرَانٍ فِي صَحْنٍ أَبْيَضَ وَيَدُورُ عَلَيْهِ الْأَسْمَاءُ الَّتِي ذَكَرَهَا وَسُورَةُ الْإِخْلَاصِ، ثُمَّ بَعْدَ ذَلِكَ تُمْحَى الْكِتَابَةُ بِمَاءٍ طَاهِرٍ وَيُقْرَأُ عَلَى الْمَاءِ بَعْدَ الْمَحْوِ الْأَسْمَاءُ كَمَا ذَكَرَهَا سَبْعِينَ مَرَّةً ثُمَّ سُورَةُ الْإِخْلَاصِ كَذَلِكَ سَبْعِينَ مَرَّةً وَيَشْرَبُ مِنْهُ الْمَرِيضُ كُلَّ يَوْمٍ عَلَى الرِّيقِ فِي الصَّبَاحِ وَكَذَلِكَ عِنْدَ نَوْمِهِ مُدَّةَ سَبْعَةِ أَيَّامٍ يَشْفَى بِإِذْنِ اللهِ وَبِبَرَكَةِ أَسْمَائِهِ الْحُسْنَى، وَالْوَفْقُ كَمَا فِي الصَّفْحَةِ التَّالِيَةِ\n\nوَالْأَسْمَاءُ الَّتِي تُكْتَبُ دَائِرَةً عَلَى الْوَفْقِ وَكَذَلِكَ السُّورَةُ الْكَرِيمَةُ كَمَا يَلِي، [لَا إِلَهَ إِلَّا اللهُ الْمَلِكُ الْمُهَيْمِنُ مَالِكُ الْمُلْكِ الْمُحْصِي الْمُحْيِي الْمَنَّانُ الْحَكَمُ الْحَلِيمُ الْحَكِيمُ الْحَقُّ الْحَيُّ الْحَنَّانُ بِسْمِ اللهِ الرَّحْمَنِ الرَّحِيمِ قُلْ هُوَ اللهُ أَحَدٌ اللهُ الصَّمَدُ لَمْ يَلِدْ وَلَمْ يُولَدْ وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ] صَدَقَ اللهُ الْعَظِيمُ،\n\nوَلِلتَّذْكِيرِ سُورَةُ الْإِخْلَاصِ تُكَرَّرُ كِتَابَتُهَا إِحْدَى عَشْرَةَ مَرَّةً\n\nأَسْأَلُ اللهَ الْعَظِيمَ أَنْ يَنْفَعَنِي وَإِيَّاكُمْ بِالْقُرْآنِ الْكَرِيمِ وَيَهْدِيَنِي وَإِيَّاكُمْ إِلَى طَرِيقِ الْحَقِّ الْمُبِينِ إِنَّهُ وَلِيُّ ذَلِكَ وَالْقَادِرُ عَلَيْهِ", "latin": "Ad-Durratun-Nūrāniyyatu fī ‘ilājil-a‘rādhir-rūḥāniyyah\n\nAs-salāmu ‘alaikum wa raḥmatullāhi wa barakātuh, ikhwatī fillāh, aḍa‘u lakum hādzihil-fā’idata bi-idznillāhi ‘azza wa jalla fī ‘ilājil-amrāḍi wal-a‘rāḍir-rūḥāniyyati, wa huwa murabba‘un li-smil-jalālati [Allāhu jalla jalāluh] yuktabul-murabba‘u bimā’i wardin wa za‘farānin fī ṣaḥnin abyaḍa wa yadūru ‘alaihil-asmā’ul-latī dzakarahā wa sūratul-Ikhlāṣi, tsumma ba‘da dzālika tumḥal-kitābatu bimā’in ṭāhirin wa yuqra’u ‘alal-mā’i ba‘dal-maḥwi al-asmā’u kamā dzakarahā sab‘īna marratan tsumma sūratul-Ikhlāṣi ka-dzālika sab‘īna marratan wa yasyrabu minhul-marīḍu kulla yawmin ‘alar-rīqi fish-shabāḥi wa ka-dzālika ‘inda naumihi muddata sab‘ati ayyāmin yasyfā bi-idznillāhi wa bi-barakati asmā’ihil-ḥusnā, wal-wafqu kamā fish-shafḥatit-tāliyah.\n\nWal-asmā’ul-latī tuktabu dā’iratan ‘alal-wafqi wa ka-dzālikas-sūratul-karīmatu kamā yalī, [Lā ilāha illallāhul-Malikul-Muhaiminu Mālikul-Mulki al-Muḥshī al-Muḥyī al-Mannān al-Ḥakam al-Ḥalīm al-Ḥakīm al-Ḥaqq al-Ḥayy al-Ḥannān bismillāhir-raḥmānir-raḥīmi qul huwallāhu aḥadun Allāhush-shamadu lam yalid wa lam yūlad wa lam yakul-lahū kufuwan aḥad] shadaqallāhul-‘aẓīm,\n\nWa lit-tadzkīri sūratul-Ikhlāṣi tukarraru kitābatuhā iḥdā ‘asyrata marratan.\n\nAs’alullāhal-‘aẓīma an yanfa‘anī wa iyyākum bil-Qur’ānil-karīmi wa yahdiyanī wa iyyākum ilā ṭarīqil-ḥaqqil-mubīni innahū waliyyu dzālika wal-qādiru ‘alaih.", "terj": "Al-Durrah al-Nūrāniyyah (Mutiara Bercahaya) dalam pengobatan gejala-gejala ruhaniyyah:\n\n“Assalāmu‘alaikum warahmatullāhi wabarakātuh, wahai saudara-saudaraku karena Allah, aku persembahkan kepada kalian faedah ini — dengan izin Allah ‘Azza wa Jalla — untuk mengobati penyakit-penyakit dan gejala-gejala ruhaniyyah. Faedah ini berupa **murabba‘ (kotak 4×4) untuk Ism al-Jalālah [Allāh Jalla Jalāluh]**. Murabba‘ tersebut **ditulis dengan air mawar dan za‘farān di dalam piring putih**, kemudian **di sekelilingnya ditulis asma’-asma’ yang akan disebutkan beserta Surah al-Ikhlāsh**. Setelah itu tulisan **dihapus dengan air suci**, lalu **dibacakan pada air tersebut — setelah penghapusan — asma’-asma’ sebagaimana yang ia sebutkan sebanyak 70 kali, kemudian Surah al-Ikhlāsh juga 70 kali**. Air itu **diminum oleh orang sakit setiap hari pada pagi hari dalam keadaan perut kosong dan juga menjelang tidurnya selama 7 hari, maka ia akan sembuh dengan izin Allah dan berkah Asmā’ Allāh al-Ḥusnā**. Dan wafaqnya sebagaimana pada halaman berikutnya.\n\nAdapun asma’-asma’ yang ditulis **mengelilingi wafaq** dan juga Surah yang mulia tersebut adalah sebagai berikut: **[Lā ilāha illallāh, al-Malik, al-Muhaimin, Mālik al-Mulk, al-Muḥshī, al-Muḥyī, al-Mannān, al-Ḥakam, al-Ḥalīm, al-Ḥakīm, al-Ḥaqq, al-Ḥayy, al-Ḥannān, Bismillāhir-Raḥmānir-Raḥīm, Qul Huwallāhu Aḥad, Allāhush-Shamad, Lam yalid wa lam yūlad, wa lam yakul-lahū kufuwan aḥad]** — *Shadaqallāhul-‘Aẓīm*.\n\nDan sebagai pengingat: **Surah al-Ikhlāsh diulang penulisannya sebanyak 11 kali** (mengelilingi wafaq).\n\nAku memohon kepada Allah Yang Maha Agung semoga Dia memberiku manfaat — dan kalian — dengan al-Qur’ān al-Karīm, serta memberi petunjuk kepadaku dan kepada kalian menuju jalan kebenaran yang nyata. Sesungguhnya Dialah penolongnya dan Yang Maha Kuasa atasnya.”", "syarah": "Halaman ini adalah **bagian 1/2 Durrah Nūrāniyyah — faedah ‘ilāj a‘rāḍ ruhaniyyah dengan murabba‘ al-Jalālah**.", "khus": "Kegunaan: syifā’ bi-idznillāh untuk `الأمراض والأعراض الروحانية` — mencakup gangguan ‘ain, mass khafīf, waswas, insomnia ruhaniyyah, dan gejala psikosomatik akibat siḥr — bukan untuk ‘Athlūsyin (perusak amal) melainkan untuk pasien. Tatacara rinci: (1) Siapkan piring porselen putih bersih (bukan logam) — cuci dengan air dan garam, (2) Tinta: air mawar ṭahūr + za‘faran asli (saffron stigma, bukan pewarna) — larutkan hingga warna keemasan, (3) Tulis murabba‘ 4×4 (16 sel) dengan angka Arab di tengah — lihat Hal18 untuk angka persis — dengan qalam bambu, (4) Kelilingi murabba‘ dengan 12 Asmā’ `[Lā ilāha illallāh ... al-Ḥannān]` + Basmalah + Ikhlāsh — Ikhlāsh ditulis 11× berturutan tanpa putus di sekeliling (seperti lingkaran), (5) Hapus tulisan dengan air ṭāhir (air hujan yang belum menyentuh tanah lebih utama, atau air zamzam) — tuang ke gelas kaca, (6) Bacakan pada air: 12 Asmā’ `[Lā ilāha illallāh ... al-Ḥannān]` + Basmalah + Ikhlāsh — masing-masing rangkaian 70× (bukan masing-masing asma’ 70×, melainkan keseluruhan bracket 70×), kemudian Surah al-Ikhlāsh 70× terpisah — total 140 kali bacaan (70+70) — di atas air dengan nafas menyentuh permukaan, (7) Minum: setiap pagi ‘alar-rīq (sebelum makan/minum apapun) dan malam sebelum tidur — 1 gelas tiap waktu — selama 7 hari tanpa jeda — simpan air di kulkas suci (jangan bercampur makanan najis), (8) Pantangan: jaga wuḍū’, hindari makanan ḥarām dan ghibah selama 7 hari, (9) Tanda syifā’: mimpi cahaya, keringat dingin hilang, atau gejala mereda hari ke-3-4 — lanjutkan hingga 7 hari sempurna, (10) Peringatan: jangan menulis wafaq dengan tinta kimia/spidol — za‘farān bersifat ghizā’ ruhaniyyah, bukan sekadar pewarna — dan jangan membaca terbalik (urutan: Asma’ dulu 70× baru Ikhlāsh 70×)."}, {"hal": "18", "title": "HALAMAN 18 — الدُّرَّةُ النُّورَانِيَّةُ فِي عِلَاجِ الْأَعْرَاضِ الرُّوحَانِيَّةِ (٢ — وَفْقُ الْجَلَالَةِ ٤×٤)", "imgs": ["rajah_anwar_FINAL_300DPI/IMG_20261025_094727.jpg", "hal_18.png"], "arab": "الدُّرَّةُ النُّورَانِيَّةُ فِي عِلَاجِ الْأَعْرَاضِ الرُّوحَانِيَّةِ\n\n| ٧٨ | ٨٧ | ٣٤١ | ٦٩٢ |\n|---|---|---|---|\n| ٣٤٢ | ٦٩١ | ٧٩ | ٨٦ |\n| ٦٩٠ | ٣٣٩ | ٨٩ | ٨٠ |\n| ٨٨ | ٨١ | ٦٨٩ | ٣٤٠ |", "latin": "Ad-durratun-nūrāniyyatu fī 'ilājil-a'rādhir-rūhāniyyati.\n\n| ٧٨ | ٨٧ | ٣٤١ | ٦٩٢ |\n|---|---|---|---|\n| ٣٤٢ | ٦٩١ | ٧٩ | ٨٦ |\n| ٦٩٠ | ٣٣٩ | ٨٩ | ٨٠ |\n| ٨٨ | ٨١ | ٦٨٩ | ٣٤٠ |\n\n[Wafaq Murabba' 4×4 Lafzhul-Jalālah — Asror Angka Arab, tidak dilatinkan]", "terj": "Mutiara bercahaya dalam mengobati gejala-gejala gangguan ruhani.\n\n| ٧٨ | ٨٧ | ٣٤١ | ٦٩٢ |\n|---|---|---|---|\n| ٣٤٢ | ٦٩١ | ٧٩ | ٨٦ |\n| ٦٩٠ | ٣٣٩ | ٨٩ | ٨٠ |\n| ٨٨ | ٨١ | ٦٨٩ | ٣٤٠ |\n\n[Wafaq Murabba' 4×4 Lafzhul-Jalālah — Asror Angka Arab, tidak diterjemahkan]", "syarah": "1. **Hisab Matriks Wafaq Murabba' 4×4 *Al-Jalālah* (Konstanta 1198)**:\n   - Matriks Wafaq 4×4 pada Halaman 18 ini memiliki *miftāh* (angka terkecil) **`٧٨`** di sudut kanan-atas dan *maghlāq* (angka terbesar) **`٦٩٢`** di sudut kiri-atas, dengan jumlah konstanta setiap baris, kolom, dan diagonal tepat **١١٩٨ (1198)**:\n     - **Baris 1**: `٧٨ + ٨٧ + ٣٤١ + ٦٩٢ = ١١٩٨`\n     - **Baris 2**: `٣٤٢ + ٦٩١ + ٧٩ + ٨٦ = ١١٩٨`\n     - **Baris 3**: `٦٩٠ + ٣٣٩ + ٨٩ + ٨٠ = ١١٩٨`\n     - **Baris 4**: `٨٨ + ٨١ + ٦٨٩ + ٣٤٠ = ١١٩٨`\n     - **Kolom Kanan**: `٧٨ + ٣٤٢ + ٦٩٠ + ٨٨ = ١١٩٨`\n     - **Kolom ke-2**: `٨٧ + ٦٩١ + ٣٣٩ + ٨١ = ١١٩٨`\n     - **Kolom ke-3**: `٣٤١ + ٧٩ + ٨٩ + ٦٨٩ = ١١٩٨`\n     - **Kolom Kiri**: `٦٩٢ + ٨٦ + ٨٠ + ٣٤٠ = ١١٩٨`\n     - **Diagonal 1**: `٧٨ + ٦٩١ + ٨٩ + ٣٤٠ = ١١٩٨`\n     - **Diagonal 2**: `٦٩٢ + ٧٩ + ٣٣٩ + ٨٨ = ١١٩٨`", "khus": "1. **Tata Cara Penulisan & Terapi Air *Ad-Durratun-Nūrāniyyah***:\n   - Tulislah Wafaq Murabba' 4×4 ini dengan angka Arab asli di tengah piring putih bersih menggunakan tinta air mawar dan za'faran.\n   - Kelilingi wafaq dengan rangkaian 12 Asmā'ul-Husnā (`لَا إِلَهَ إِلَّا اللهُ الْمَلِكُ الْمُهَيْمِنُ مَالِكُ الْمُلْكِ الْمُحْصِي الْمُحْيِي الْمَنَّانُ الْحَكَمُ الْحَلِيمُ الْحَكِيمُ الْحَقُّ الْحَيُّ الْحَنَّانُ`) beserta Surah al-Ikhlāsh yang ditulis berulang sebanyak **11 kali** (sebagaimana rincian Halaman 17).\n   - Lebur tulisan dengan air suci, bacakan di atas air tersebut rangkaian Asmā' 70 kali dan Surah al-Ikhlāsh 70 kali, lalu diminum oleh pasien setiap pagi sebelum makan (*'alar-rīq*) dan setiap malam menjelang tidur selama 7 hari berturut-turut."}, {"hal": "19", "title": "HALAMAN 19 — فَائِدَةٌ فِي تَدْمِيرِ الظَّالِمِ", "imgs": ["hal_19.png"], "arab": "فَائِدَةٌ فِي تَدْمِيرِ الظَّالِمِ\n\nاَلسَّلَامُ عَلَيْكُمْ وَرَحْمَةُ اللهِ وَبَرَكَاتُهُ، إِخْوَتِي فِي اللهِ، ارْتَأَيْتُ أَنْ أَضَعَ بَيْنَ أَيْدِيكُمُ الْأَمِينَةِ هَذِهِ الْفَائِدَةَ فِي قَهْرِ الظَّالِمِ وَتَدْمِيرِهِ، وَهِيَ مِنْ بَعْضِ تَصَارِيفِ [حَسْبُنَا اللهُ وَنِعْمَ الْوَكِيلُ] النَّادِرَةِ وَالْقَوِيَّةِ، فَأَسْأَلُكُمْ بِاللهِ تَعَالَى أَنْ لَا تَظْلِمُوا بِهَا أَحَدًا، وَلَا تَفْعَلُوهَا إِلَّا لِمَنْ ظَلَمَ وَتَعَدَّى وَتَجَبَّرَ وَاسْتَكْبَرَ، وَقَدْ أَخْفَيْتُ فِيهَا سِرَّهَا، فَمَنْ فَتَحَ اللهُ عَنْ بَصِيرَتِهِ وَجَدَهَا كَالسُّمِّ الزُّعَافِ فِي دَحْضِ الظَّالِمِ وَتَدْمِيرِهِ، وَهَذِهِ طَرِيقَةُ عَمَلِهَا: تَأْخُذُ قِطْعَةً مِنْ نُحَاسٍ أَحْمَرَ تَكُونُ قَدْرَ رَاحَةِ الْيَدِ، وَتَنْقُشُ فِيهَا الْجَدْوَلَ الْآتِيَ ذِكْرُهُ بِمِسْمَارٍ مِنْ فُولَاذٍ، وَتُحَوِّطُهُ بِالْبَسْمَلَةِ تَبْدَأُ مِنْ سَطْرِ الْمُثَلَّثِ الْأَسْفَلِ حَيْثُ تَكُونُ الْكِتَابَةُ مُوَالِيَةً لِلْمُثَلَّثِ تَبْدَؤُهَا مِنَ الْيَمِينِ إِلَى الشِّمَالِ... إِلَخْ، وَتَأْتِي إِلَى تَقَاطُعِ الْأَرْكَانِ مِنَ الْمُثَلَّثِ وَتَكْتُبُ اسْمَ الْمَلِكِ الرُّوحَانِيِّ [أَنْفَايِيلَ] بِحَيْثُ تَكُونُ الْكِتَابَةُ مُوَالِيَةً لِلْوَفْقِ، أَمَّا مَا يُوضَعُ فِي الْقَلْبِ الْخَالِي فَهُوَ: تَأْخُذُ اسْمَ الظَّالِمِ وَاسْمَ أُمِّهِ وَتَمْزُجُهُ بِحُرُوفِ الْخَادِمِ [مَلُوبَايِيلَ] حَيْثُ يَكُونُ أَوَّلُ حَرْفٍ مِنَ الْخَادِمِ وَآخِرُ حَرْفٍ مِنْهُ أَيْضًا فِي سَطْرِ الْمَزْجِ، وَتَكْسِرُ الْجُمْلَةَ إِلَى الْمَخْرَجِ، ثُمَّ خُذْ مِنْ سَطْرِ الْمِيزَانِ حُرُوفَ الدَّفْعِ وَالَّتِي تَلِيهَا أَيْ كُلَّ حَرْفِ دَفْعٍ وَالَّذِي بَعْدَهُ، وَاجْمَعْ عَدَدَ الْحُرُوفِ وَأَدْخِلْهُ فِي قَلْبِ الْمُثَلَّثِ وَحَوِّطْ عَلَيْهِ دَائِرَةً، وَتَضَعُ الْقِطْعَةَ فَوْقَ نَارٍ حَامِيَةٍ بَعْدَ أَنْ تُبَخِّرَهَا بِقَلِيلٍ مِنَ الْقُسْطِ الْمُرِّ، وَاتْلُ عَلَيْهَا الْعَزِيمَةَ عَدَدَ [١٢٦٤]، وَالدُّعَاءَ عَلَى رَأْسِ الْعَقْدِ وَهُوَ: [اَللَّهُمَّ أَنْتَ حَسْبِي وَوَكِيلِي عَلَى الظَّالِمِ، اَللَّهُمَّ اقْطَعْ أَنْفَاسَهُ وَشَتِّتْ شَمْلَهُ وَفَرِّقْ جَمْعَهُ وَاقْلِبْ تَدْبِيرَهُ وَبَدِّلْ أَحْوَالَهُ وَقَرِّبْ آجَالَهُ وَزَلْزِلْ أَقْدَامَهُ وَاحْرِقْ عِظَامَهُ بِحَقِّ ﴿أَنَّ الَّذِينَ فَتَنُوا الْمُؤْمِنِينَ وَالْمُؤْمِنَاتِ ثُمَّ لَمْ يَتُوبُوا فَلَهُمْ عَذَابُ جَهَنَّمَ وَلَهُمْ عَذَابُ الْحَرِيقِ﴾ ﴿وَإِنْ يَسْتَغِيثُوا يُغَاثُوا بِمَاءٍ كَالْمُهْلِ يَشْوِي الْوُجُوهَ﴾ اَللَّهُمَّ وَاقْلَعْ آثَارَهُ حَتَّى لَا تَبْقَى لَهُ بَاقِيَةٌ وَلَا يَجِدْ مِنْ عَذَابِكَ لَهُ وَاقِيَةً، وَاشْغَلْهُ بِبَدَنِهِ وَارْمِهِ اَللَّهُمَّ بِصَوَاعِقِ انْتِقَامِكَ وَابْطِشْ بِهِ بَطْشًا شَدِيدًا، وَخُذْهُ اَللَّهُمَّ أَخْذًا عَزِيزًا وَدَمِّرْهُ تَدْمِيرًا وَتَبِّرْهُ تَتْبِيرًا وَاجْعَلْهُ هَبَاءً مَنْثُورًا، وَاقْطَعِ اَللَّهُمَّ ذِكْرَهُ فَأَنْتَ حَسْبِي وَوَكِيلِي عَلَيْهِ]\n\nتَمَّ الدُّعَاءُ، وَالْعَزِيمَةُ: [لَا إِلَهَ إِلَّا اللهُ الْحَسِيبُ الْوَكِيلُ]\n\nوَبَعْدَ تَمَامِ الْعَزِيمَةِ وَالدُّعَاءِ تَأْخُذُ الْقِطْعَةَ مِنْ عَلَى النَّارِ، تَضَعُهَا فِي قَارُورَةٍ زُجَاجٍ أَوْ مَعْدِنٍ فِيهَا مَاءٌ بَارِدٌ، وَتَسُدُّ عَلَيْهَا فِي مَكَانٍ مُظْلِمٍ، فَتَرَى سِرَّ اللهِ فِي الظَّالِمِ، فَإِنْ عَادَ عَنْ ظُلْمِهِ فَأَخْرِجْهَا مِنَ الْمَاءِ وَاقْرَأْ عَلَيْهَا الْفَاتِحَةَ ٧ مَرَّاتٍ، وَالْمُلْكَ ٧، وَالْإِخْلَاصَ ٧، وَاعْلَمُوا أَنِّي وَضَعْتُ هَذِهِ الْفَائِدَةَ فِي ذِمَّةِ مَنْ فَتَحَ اللهُ لَهُ سِرَّهَا، فَأَيُّهَا الطَّالِبُ رَاعِ حُرْمَةَ اللهِ فِي خَلْقِهِ، وَتَذَكَّرْ أَنَّ يَوْمَ الْحِسَابِ لَا رَيْبَ فِيهِ، وَهَذَا هُوَ الْوَفْقُ", "latin": "Fāidatun fī tadmirizh zhālim.\n\nAssalāmu 'alaikum wa rahmatullāhi wa barakātuh, ikhwatī fillāh, irta'aitu an adha'a baina aidīkumul amīnah hādzihil fāidata fī qahrizh zhālīmi wa tadmirih, wa hiya min ba'dhi tashārīfi [Hasbunallāhu wa ni'mal wakīl] an-nādirah wal qawiyyah, fa-as'alukum billāhi ta'ālā an lā tazhlimū bihā ahadan, wa lā taf'alūhā illā liman zhalama wa ta'addā wa tajabbara wastakbara, wa qad akhfaitu fīhā sirrahā, fa-man fatahallāhu 'an bashīratihi wajadahā kas-summiz zu'āfi fī dahdhizh zhālīmi wa tadmirih, wa hādzihi tharīqatu 'amalihā: Ta'khudzu qith'atan min nuhāsin ahmara takūnu qadra rāhatil yad, wa tanqusyu fīhal jadhwalal ātiya dzikruhū bi-mismārin min fūlādz, wa tuhawwithuhū bil basmalah tabda'u min sathril mutsallatsil asfal, haitsu takūnul kitābatu muwāliyatan lil mutsallatsi tabda'uhā minal yamīni ilas syimāli... ilakh, wa ta'tī ilā taqāthu'il arkāni minal mutsallatsi wa taktubu ismal malikir rūhāniyyi [Anfāyīla] bihaitsu takūnul kitābatu muwāliyatan lil wafqi, ammā mā yūdha'u fil-qalbil-khālī fa-huwa: Ta'khudzus-mazh-zhālimi wa isma ummihi wa tamzujuhū bi-hurūfil khādimi [Malūbāyīla] haitsu yakūnu awwalu harfin minal khādimi wa ākhiru harfin minhu aidhan fī sathril mazji, wa taksirul jumlah ilal makhraj, tsumma khudz min sathril mīzāni hurūfad daf'i wallatī talīhā ay kulla harfi daf'in walladzī ba'dahū, wajma' 'adadal hurūfi wa adkhilhu fī qalbil mutsallatsi wa hawwith 'alaihi dāirah, wa tadha'ul qith'ata fauqa nārin hāmiyatin ba'da an tubakhkhirahā bi-qalīlin minal qusthil murri, watlu 'alaihal 'azīmata 'adada [1264], wad du'ā'a 'alā ra'sil 'aqdi wa huwa: [Allāhumma Anta Hasbī wa Wakīlī 'alazh zhālim, Allāhummaqtha' anfāsahū wa syattit syamlahū wa farriq jam'ahū waqlib tadbīrahū wa baddil ahwālahū wa qarrib ājālahū wa zalzil aqdāmahū wahriq 'izhāmahū bihaqqi {Annalladzīna fatanul mu'minīna wal mu'mināti tsumma lam yatūbū fa-lahum 'adzābu jahannama wa lahum 'adzābul harīq} {Wa in yastaghītsū yughātsū bi-mā'in kal-muhli yasywil wujūh} Allāhumma waqla' ātsārahū hattā lā tabqā lahū bāqiyatun wa lā yajida min 'adzābika lahū wāqiyah, wasyghalhu bi-badanihī warmihi Allāhumma bi-shawā'iqi intiqāmika wabthisy bihi bathsyan syadīdan, wa-khudzhu Allāhumma akhdzan 'azīzan wa dammirhu tadmīran wa tabbirhu tatbīran waj'alhu habā'an mantsūrā, waqtha' Allāhumma dzikrahū fa-Anta Hasbī wa Wakīlī 'alaih]\n\nTammad du'ā', wal 'azīmah: [Lā ilāha illallāhul Hasībul Wakīl]\n\nWa ba'da tamāmil 'azīmati wad du'ā'i ta'khudhul qith'ata min 'alan nāri, tadha'uhā fī qārūratin zujājin au ma'danin fīhā mā'un bāridun, wa tasuddu 'alaihā fī makānin muzhlimin, fa-tarā sirrallāhi fizh zhālīm, fa-in 'āda 'an zhulmihī fa-akhrijhā minal mā'i waqra' 'alaihal Fātihata 7 marrāt, wal Mulka 7, wal Ikhlāsha 7, wa'lamū annī wadha'tu hādzihil fāidata fī dzimmati man fatahallāhu lahū sirrahā, fa-ayyuhath thālibu rā'i hurmatallāhi fī khalqihī, wa tadzakkar anna yaumal-hisābi lā raiba fīh, wa-hādzā huwal wafqu.", "terj": "Faedah dalam menghancurkan orang zalim.\n\nAssalamu'alaikum warahmatullahi wabarakatuh, wahai saudara-saudaraku karena Allah, aku memandang perlu meletakkan di antara tangan-tangan amanah kalian faedah ini dalam menundukkan orang zalim dan menghancurkannya. Ia termasuk sebagian dari tasharif [Hasbunallahu wa ni'mal wakil] yang langka dan kuat. Maka aku memohon kepada kalian demi Allah Ta'ala agar kalian tidak menzalimi seorang pun dengannya, dan jangan kalian melakukannya kecuali kepada orang yang telah menzalimi, melampaui batas, berlaku sewenang-wenang dan menyombongkan diri. Sungguh aku telah menyembunyikan rahasianya di dalamnya; barang siapa Allah bukakan mata hatinya niscaya ia mendapatinya seperti racun yang mematikan dalam membantah dan menghancurkan orang zalim. Adapun cara mengamalkannya: Ambillah sepotong tembaga merah sebesar telapak tangan, lalu ukirlah di dalamnya tabel yang akan disebutkan dengan paku dari baja, dan kelilingilah dengan basmalah; engkau mulai dari baris segitiga yang paling bawah, di mana tulisan beriringan dengan segitiga, engkau memulainya dari kanan ke kiri... dst. Kemudian engkau datangi perpotongan sudut-sudut segitiga lalu engkau tulis nama raja ruhaninya [Anfayail] dengan tulisan yang mengiringi wafaq. Adapun yang diletakkan di hati (tengah) yang kosong ialah: Engkau ambil nama orang zalim dan nama ibunya lalu engkau campurkan dengan huruf-huruf khadam [Malubayil] di mana huruf pertama dari khadam dan huruf terakhir darinya juga berada dalam baris pencampuran; engkau pecah jumlah (kalimat) hingga ke tempat keluarnya, kemudian ambillah dari baris mizan huruf-huruf daf' dan yang mengikutinya — yaitu setiap huruf daf' dan huruf sesudahnya — lalu kumpulkan bilangan huruf-huruf tersebut dan masukkan ke dalam jantung segitiga lalu buat lingkaran di sekelilingnya. Letakkan potongan itu di atas api yang menyala setelah engkau mengasapinya dengan sedikit qusth al-murr, lalu bacakan di atasnya azimah sebanyak [1264] kali dan doa pada simpul ikatan, yaitu: [Ya Allah, Engkaulah Yang Mencukupiku dan Pelindungku atas orang zalim ini; Ya Allah putuskan napasnya, cerai-beraikan kesatuannya, pecah-belahkan persatuannya, balikkan tipu dayanya, ubahlah keadaannya, dekatkan ajalnya, guncangkan langkah-langkahnya dan bakarlah tulang-belulangnya dengan hak (kebenaran) firman: {Sesungguhnya orang-orang yang mendatangkan cobaan kepada orang-orang mukmin laki-laki dan perempuan kemudian mereka tidak bertobat, maka bagi mereka azab Jahanam dan bagi mereka azab neraka yang membakar} dan {Jika mereka meminta pertolongan (minum), mereka akan diberi air seperti besi yang mendidih yang menghanguskan muka}; Ya Allah cabutlah jejak-jejaknya hingga tidak tersisa baginya suatu sisa pun dan ia tidak mendapatkan perlindungan dari azab-Mu, sibukkan ia dengan badannya, lemparkan ia Ya Allah dengan petir-petir pembalasan-Mu dan serang ia dengan serangan yang keras, ambillah ia Ya Allah dengan pengambilan yang perkasa, hancurkan ia sehancur-hancurnya, binasakan ia se-binasanya dan jadikan ia debu yang beterbangan, dan putuskan Ya Allah penyebutannya, karena Engkaulah Yang Mencukupiku dan Pelindungku atasnya].\n\nSelesai doa. Adapun azimahnya: [Tidak ada tuhan selain Allah Yang Maha Mencukupi lagi Maha Melindungi].\n\nSetelah sempurna azimah dan doa, ambillah potongan tersebut dari atas api, letakkan dalam botol kaca atau logam yang berisi air dingin, lalu tutuplah dan simpan di tempat yang gelap; niscaya engkau akan melihat rahasia Allah pada orang zalim. Jika ia telah kembali (bertaubat) dari kezalimannya, keluarkan potongan itu dari air dan bacakan di atasnya Al-Fatihah 7 kali, Al-Mulk 7 kali dan Al-Ikhlas 7 kali. Ketahuilah, aku telah meletakkan faedah ini pada tanggungan orang yang Allah bukakan rahasianya baginya; wahai penuntut ilmu, jagalah kehormatan Allah pada makhluk-Nya dan ingatlah bahwa Hari Perhitungan tidak ada keraguan padanya. Dan inilah wafaqnya.", "syarah": "Faedah Tadmīr azh-Zhālim ini termasuk tashrīf langka dari wirid Hasbunallāh wa Ni‘mal-Wakīl. Penulis menegaskan syarat ketat: hanya untuk orang yang benar-benar zhalim, melampaui batas dan takabbur; penyalahgunaan untuk kezhaliman akan berbalik sebagai racun. Rahasia disembunyikan dalam hisab: tembaga merah ukuran telapak tangan diukir dengan paku baja, dibingkai basmalah dan empat sudut nama raja ruhaniyah Anfāyīl. Inti amalan adalah hisab jantung musallas: nama zhālim + nama ibunya dicampur huruf khādim Malūbāyīl, di-taksīr hingga makhraj, lalu diambil huruf-huruf daf‘ dari sathr al-mīzān beserta huruf sesudahnya, dijumlahkan dan dimasukkan ke qalbul-mutsallas dengan lingkaran. Pembakaran di atas api dengan bukhūr qisth al-murr dan pembacaan ‘azīmah 1264× serta du‘ā di atas ‘aqd menjadi kunci pengaktifan; pembalikan ke air dingin di tempat gelap sebagai penahan energi, dan cara pemulihan bila pelaku bertaubat (Fātihah, Mulk, Ikhlās 7×).", "khus": "Amalan ini bersifat darurat dan sangat keras; tidak boleh untuk dendam pribadi ringan. Kehati-hatian dalam hisab wajib: salah hitung merusak khasiat. Penempatan di air gelap menahan pengaruh; pencabutan dan pembacaan surat-surat penyejuk menjadi penawar. Penulis mengikat amanah pada pembaca: jaga kehormatan makhluk Allah dan ingat Hari Hisab."}, {"hal": "20", "title": "HALAMAN 20 — الْوَفْقُ الْمُثَلَّثُ (٣×٣) لِتَدْمِيرِ الظَّالِمِ", "imgs": ["rajah_anwar_FINAL_300DPI/IMG_20261025_094859.jpg"], "arab": "فَائِدَةٌ فِي تَدْمِيرِ الظَّالِمِ\n\n| ٥٢ | ١٢٣٠ | ٦١٤ |\n|---|---|---|\n| ١١٦٠ | [ الْقَلْبُ الْخَالِي ] | ٧٣٦ |\n| ٦٨٤ | ٦٦٦ | ٥٤٦ |\n\n[الإِطَارُ الدَّاخِلِيُّ الْأَخْضَرُ حَوْلَ الْمُثَلَّثِ]: بِسْمِ اللهِ الرَّحْمَنِ الرَّحِيمِ\n\n[تَقَاطُعُ الْأَرْكَانِ الْأَرْبَعَةِ]: أَنْفَايِيلَ", "latin": "Fā'idatun fī tadmīrizh-zhālimi.\n\n| ٥٢ | ١٢٣٠ | ٦١٤ |\n|---|---|---|\n| ١١٦٠ | [ الْقَلْبُ الْخَالِي ] | ٧٣٦ |\n| ٦٨٤ | ٦٦٦ | ٥٤٦ |\n\n[Wafaq Musallas 3×3 Khālid-Qalb — Asror Angka Arab, tidak dilatinkan]\n\n[Al-ithārud-dākhiliyyul-akhdharu haulal-mutsallatsi]: Bismillāhir-rahmānir-rahīmi.\n\n[Taqāthu'ul-arkānil-arba'ati]: Anfāyīla.", "terj": "Faedah dalam menghancurkan orang yang zalim.\n\n| ٥٢ | ١٢٣٠ | ٦١٤ |\n|---|---|---|\n| ١١٦٠ | [ الْقَلْبُ الْخَالِي ] | ٧٣٦ |\n| ٦٨٤ | ٦٦٦ | ٥٤٦ |\n\n[Wafaq Musallas 3×3 Tengah Kosong — Asror Angka Arab, tidak diterjemahkan]\n\n[Bingkai hijau di sekeliling wafaq mulai dari baris bawah kanan ke kiri]: Dengan menyebut nama Allah Yang Maha Pengasih lagi Maha Penyayang.\n\n[Perpotongan keempat sudut wafaq]: Anfāyīla.", "syarah": "1. **Hisab Matriks Wafaq Musallas 3×3 *Al-Qalbul-Khālī* (Konstanta 1896)**:\n   - Wafaq 3×3 pada Halaman 20 ini merupakan *mutsallats khālil-qalb* (wafaq segitiga dengan kamar tengah dikosongkan untuk diisi nilai hisab huruf *daf'* dari nama orang zalim yang dicampur dengan huruf khadim `مَلُوبَايِيلَ`), di mana keempat sisi luarnya berjumlah tepat **١٨٩٦ (1896)** (`1264 × 1,5`):\n     - **Baris 1 (Atas)**: `٥٢ (kanan) + ١٢٣٠ (tengah) + ٦١٤ (kiri) = ١٨٩٦`\n     - **Baris 3 (Bawah)**: `٦٨٤ (kanan) + ٦٦٦ (tengah) + ٥٤٦ (kiri) = ١٨٩٦`\n     - **Kolom Kanan**: `٥٢ + ١١٦٠ + ٦٨٤ = ١٨٩٦`\n     - **Kolom Kiri**: `٦١٤ + ٧٣٦ + ٥٤٦ = ١٨٩٦`\n     - **Pasangan Pengapit Horizontal (Baris 2)**: `١١٦٠ (kanan) + ٧٣٦ (kiri) = ١٨٩٦`\n     - **Pasangan Pengapit Vertikal (Kolom Tengah)**: `١٢٣٠ (atas) + ٦٦٦ (bawah) = ١٨٩٦`\n     - **Pasangan Diagonal 1**: `٥٢ (kanan-atas) + ٥٤٦ (kiri-bawah) = ٥٩٨`\n     - **Pasangan Diagonal 2**: `٦١٤ (kiri-atas) + ٦٨٤ (kanan-bawah) = ١٢٩٨` (`598 + 1298 = 1896`).", "khus": "1. **Pengukiran pada Lempeng Tembaga Merah**:\n   - Wafaq ini diukir di atas lempeng tembaga merah sebesar telapak tangan menggunakan paku baja, dikelilingi dengan Basmalah dari garis bawah kanan menuju kiri dan nama malaikat rūhānī **`أَنْفَايِيلَ`** secara melintang pada keempat perpotongan sudutnya, sedangkan kamar tengahnya diisi jumlah angka huruf *daf'* yang dilingkari, lalu diasapi *qusthul-murr* dan dibacakan *'azīmah* **`لَا إِلَهَ إِلَّا اللهُ الْحَسِيبُ الْوَكِيلُ`** sebanyak **1264 kali** beserta doanya pada setiap simpul bilangan (sebagaimana rincian Halaman 19)."}, {"hal": "21", "title": "HALAMAN 21 — فَائِدَةٌ مُجَرَّبَةٌ لِقَهْرِ الْقَرِينِ", "imgs": ["hal_21.png"], "arab": "فَائِدَةٌ مُجَرَّبَةٌ لِقَهْرِ الْقَرِينِ\n\nالسَّلَامُ عَلَيْكُمْ وَرَحْمَةُ اللهِ وَبَرَكَاتُهُ\n\nإِخْوَتِي فِي اللهِ، إِلَيْكُمْ فَائِدَةٌ مُهِمَّةٌ فِي قَهْرِ الْقَرِينِ الْمُؤْذِي لِصَاحِبِهِ، يُوَسْوِسُ لَهُ وَيَمْنَعُهُ مِنَ الْخَيْرِ وَفِعْلِهِ وَرُبَّمَا أَدَّى بِهِ لِلْهَلْوَسَةِ وَالتَّخَيُّلَاتِ الْمُزْعِجَةِ، حَفِظَنَا اللهُ وَإِيَّاكُمْ وَالْمُؤْمِنِينَ أَجْمَعِينَ مِنْ قَرِينِ السُّوءِ وَالشَّيْطَانِ، وَالْفَائِدَةُ هِيَ كَالتَّالِي يَعْمَلُهَا مَنْ كَانَ بِهِ أَذًى وَحَتَّى مَنْ لَمْ يَكُنْ بِهِ أَذًى فَهِيَ قَاهِرَةٌ زَاجِرَةٌ لِلْقَرِينِ بِإِذْنِ اللهِ وَبِبَرَكَةِ كَلَامِ اللهِ عَزَّ وَجَلَّ\n\nبَعْدَ صَلَاةِ الصُّبْحِ تَجْلِسُ فِي مُصَلَّاكَ وَاسْتَغْفِرِ اللهَ ١٥ مَرَّةً وَصَلِّ عَلَى رَسُولِ اللهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ ١٥ مَرَّةً، ثُمَّ اقْرَأْ سُورَةَ الرَّحْمٰنِ ١ مَرَّةً وَأَتْبِعْهَا بِآيَاتِ السَّجْدَةِ [آيَةُ الْأَعْرَافِ، آيَةُ الرَّعْدِ، آيَةُ النَّحْلِ، آيَةُ الْإِسْرَاءِ، آيَتَا الْحَجِّ، آيَةُ الْفُرْقَانِ، آيَةُ النَّمْلِ، آيَةُ السَّجْدَةِ، آيَةُ ص، آيَةُ فُصِّلَتْ، آيَةُ النَّجْمِ، آيَةُ الْإِنْشِقَاقِ، آيَةُ الْعَلَقِ]، ثُمَّ اسْجُدْ لِلّٰهِ تَعَالَى وَاقْرَأْ فِي سُجُودِكَ آيَةَ السَّجْدَةِ مِنْ سُورَةِ مَرْيَمَ وَادْعُ بِهٰذَا الدُّعَاءِ\n\n[اللَّهُمَّ إِنِّي أَسْأَلُكَ بِقَافِ قُدْرَتِكَ وَبِهَاءِ هِدَايَتِكَ وَبِأَلِفِ أَزَلِيَّتِكَ وَبِرَاءِ رَحْمَتِكَ وَأَسْأَلُكَ بِنُورِ وَجْهِكَ الَّذِي مَلَأَ أَرْكَانَ عَرْشِكَ يَا ذَا الْجَلَالِ وَالْإِكْرَامِ أَنْ تُعِيذَنِي مِنْ نَفْسِيَ الَّتِي اسْتَهْوَتْ وَغَوَتْ وَنَادَاهَا الْقَرِينُ وَالشَّيْطَانُ فَلَبَّتْ وَاسْتَجَابَتْ فَحَقَّ عَلَيْهَا الْقَهْرُ مِنْكَ يَا قَهَّارُ وَأَسْأَلُكَ أَنْ تُقَوِّيَ رُوحِيَ الَّتِي اسْتَمْسَكَتْ بِكَ وَأَبَتْ فَحَقَّ لَهَا النَّصْرُ مِنْكَ يَا قَدِيرُ يَا نِعْمَ الْمَوْلَى وَنِعْمَ النَّصِيرُ سُبْحَانَكَ اللَّهُمَّ وَبِحَمْدِكَ إِنَّكَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ]\n\nثُمَّ تَقُومُ مِنْ سُجُودِكَ وَاسْتَغْفِرِ اللهَ ١٥ مَرَّةً وَصَلِّ عَلَى رَسُولِ اللهِ ١٥ مَرَّةً\n\nتَمَّتْ، نَفَعَنِي اللهُ وَإِيَّاكُمْ بِالْقُرْآنِ الْعَظِيمِ وَجَعَلَنَا مِنَ الْمُتَّقِينَ وَهَدَانَا وَإِيَّاكُمْ إِلَى صِرَاطِهِ الْمُسْتَقِيمِ", "latin": "Fāidatun mujarrabatun li-qahril-qarīn.\n\nAs-salāmu 'alaikum wa rahmatullāhi wa barakātuh.\n\nIkhwatī fillāhi, ilaikum fāidatun muhimmatun fī qahril-qarīnil-mu'dzī li-shāhibihi, yuwaswisu lahū wa yamna'uhū minal-khairi wa fi'lihi wa rubbamā addā bihi lil-halwasati wat-takhayyulātil-muz'ijati, hafizhanallāhu wa iyyākum wal-mu'minīna ajma'īna min qarīnis-sū'i wasy-syaithāni, wal-fāidatu hiya kat-tālī ya'maluhā man kāna bihi adzan wa hattā man lam yakun bihi adzan fa-hiya qāhiratun zājiratun lil-qarīni bi-idznillāhi wa bi-barakati kalāmillāhi 'azza wa jalla:\n\nBa'da shalātish-shubhi tajlisu fī mushallāka wastaghfirillāha 15 marratan wa shalli 'alā rasūlillāhi shallallāhu 'alaihi wa sallama 15 marratan, tsummaqra' sūratar-rahmāni 1 marratan wa atbi'hā bi-āyātis-sajdati [āyatul-a'rāfi, āyatur-ra'di, āyatun-nahli, āyatul-isrā'i, āyatayil-hajji, āyatul-furqāni, āyatun-namli, āyatus-sajdati, āyatu [ ص ] [Rajah Huruf — tidak diterjemahkan], āyatu fushshilat, āyatun-najmi, āyatul-insyiqāqi, āyatul-'alaqi], tsummasjud lillāhi ta'ālā waqra' fī sujūdika āyat-as-sajdati min sūrati maryama wad'u bihādzad-du'ā'i:\n\n[Allāhumma innī as'aluka bi-qāfi qudratika wa bi-hā'i hidāyatika wa bi-alifi azaliyyatika wa bi-rā'i rahmatika wa as'aluka bi-nūri wajhikal-ladzī mala'a arkāna 'arsyika yā dzal-jalāli wal-ikrāmi an tu'īdzanī min nafsiyal-latīs-tahwat wa ghawat wa nādāhal-qarīnu wasy-syaithānu fa-labbāt wastajābāt fa-haqqa 'alaihal-qahru minka yā qahhāru wa as'aluka an tuqawwiya rūhiyal-latīs-tamsakat bika wa abat fa-haqqa lahan-nashru minka yā qadīru yā ni'mal-maulā wa ni'man-nashīru subhānakallāhumma wa bi-hamdika innaka 'alā kulli syai'in qadīr].\n\nTsumma taqūmu min sujūdika wastaghfirillāha 15 marratan wa shalli 'alā rasūlillāhi 15 marratan.\n\nTammat. Nafa'aniyallāhu wa iyyākum bil-qur'ānil-'azhīmi wa ja'alana minal-muttaqīna wa hadānā wa iyyākum ilā shirāthihil-mustaqīm.", "terj": "Faedah yang teruji untuk menundukkan qarin.\n\nAssalamu'alaikum warahmatullahi wabarakatuh.\n\nWahai saudara-saudaraku karena Allah, aku sampaikan kepada kalian faedah penting untuk menundukkan qarin yang mengganggu pemiliknya; ia membisikkan was-was kepadanya dan menghalanginya dari kebaikan serta perbuatannya, dan terkadang menyeretnya kepada halusinasi dan khayalan-khayalan yang mengganggu. Semoga Allah menjaga kami dan kalian serta seluruh kaum mukminin dari qarin yang buruk dan dari setan. Adapun faedah tersebut ialah sebagai berikut — diamalkan oleh siapa pun yang mengalami gangguan maupun yang tidak mengalami gangguan — maka ia bersifat menundukkan dan mencegah qarin dengan izin Allah dan dengan keberkahan kalam Allah azza wa jalla:\n\nSetelah salat Subuh, duduklah di tempat salatmu; mohon ampunlah kepada Allah 15 kali dan bershalawatlah kepada Rasulullah shallallahu 'alaihi wa sallam 15 kali, kemudian bacalah Surah ar-Rahman 1 kali dan ikutilah dengan ayat-ayat sajdah [ayat al-A'raf, ayat ar-Ra'd, ayat an-Nahl, ayat al-Isra', dua ayat al-Hajj, ayat al-Furqan, ayat an-Naml, ayat as-Sajdah, ayat Shad, ayat Fushshilat, ayat an-Najm, ayat al-Insyiqaq, ayat al-'Alaq], kemudian bersujudlah kepada Allah ta'ala dan bacalah dalam sujudmu ayat sajdah dari Surah Maryam serta berdoalah dengan doa ini:\n\n[Ya Allah, sesungguhnya aku memohon kepada-Mu dengan rahasia huruf [ ق ] [Rajah Huruf — tidak diterjemahkan] kekuasaan-Mu, dengan huruf [ هـ ] [Rajah Huruf — tidak diterjemahkan] petunjuk-Mu, dengan huruf [ ا ] [Rajah Huruf — tidak diterjemahkan] keabadian-Mu, dan dengan huruf [ ر ] [Rajah Huruf — tidak diterjemahkan] kasih sayang-Mu; dan aku memohon kepada-Mu dengan cahaya wajah-Mu yang memenuhi pilar-pilar Arasy-Mu, wahai Pemilik keagungan dan kemuliaan, agar Engkau melindungiku dari nafsuku yang telah condong kepada hawa nafsu dan tersesat, yang telah diseru oleh qarin dan setan lalu ia memenuhi dan menaatinya sehingga ia berhak mendapat penundukan dari-Mu wahai Yang Maha Menundukkan; dan aku memohon kepada-Mu agar Engkau menguatkan ruhku yang berpegang teguh kepada-Mu dan enggan (mengikuti bisikan) sehingga ia berhak mendapat pertolongan dari-Mu wahai Yang Maha Kuasa, wahai sebaik-baik Pelindung dan sebaik-baik Penolong. Maha Suci Engkau ya Allah dan dengan memuji-Mu, sesungguhnya Engkau Maha Kuasa atas segala sesuatu].\n\nKemudian bangkitlah dari sujudmu; mohon ampunlah kepada Allah 15 kali dan bershalawatlah kepada Rasulullah 15 kali.\n\nSelesai. Semoga Allah memberi manfaat kepada kami dan kalian dengan al-Qur'an yang agung, menjadikan kami termasuk orang-orang yang bertakwa, dan memberi petunjuk kepada kami dan kalian kepada jalan-Nya yang lurus.", "syarah": "Hakikat Qarin (al-Qarīn al-Mu'dzī): setiap manusia didampingi qarin jin sejak lahir; bila jiwa lemah, qarin menguasai dengan was-was, malas ibadah, halwasah. Bacaan ar-Rahmān + 13 ayat sajdah menciptakan puncak ketundukan; sujud saat ayat sajdah menghinakan syaitan yang enggan sujud dahulu. Rahasia huruf dalam doa sujud (`[ ق ]` qudratika, `[ هـ ]` hidāyatika, `[ ا ]` azaliyyatika, `[ ر ]` rahmatika) merangkai Q-H-A-R yang membentuk Ya Qahhār.", "khus": "Amalan tanpa rajah/wafaq, murni tilawah, sujud dan du‘ā, sehingga aman untuk siapa saja setelah Shubuh. Penguncian angka 15 (istighfār 15× + shalawat 15× di awal dan akhir) mengapit doa sujud di hadapan ‘Arsy; pembacaan ayat sajdah Maryam di dalam sujud menjadi inti qahr."}, {"hal": "22-24", "title": "HALAMAN 22-24 — السَّيْفُ الْبَتَّارُ لِدَفْعِ مَيْمُونٍ الْغَدَّارِ", "imgs": ["hal_22.png", "hal_23.png", "rajah_anwar_FINAL_300DPI/IMG_20261025_101416.jpg"], "arab": "السَّيْفُ الْبَتَّارُ لِدَفْعِ مَيْمُونٍ الْغَدَّارِ\n\nالسَّلَامُ عَلَيْكُمْ وَرَحْمَةُ اللهِ وَبَرَكَاتُهُ، إِخْوَتِي فِي اللهِ أُقَدِّمُ لَكُمْ هَذِهِ الْفَائِدَةَ الْقَاطِعَةَ النَّافِعَةَ بِإِذْنِ اللهِ فِي دَفْعِ أَذَى التَّسْلِيطِ وَالْإِرْسَالَاتِ الْخَاصَّةِ بِـ [مَيْمُونِ النِّكَاحِ الْمَلْعُونِ] نَسْأَلُ اللهَ تَعَالَى أَنْ يَحْفَظَكُمْ مِنْ شَرِّ أَذِيَّةِ هَذَا الْمَارِدِ الْمَجُوسِيِّ لَعَنَهُ اللهُ عَلَيْهِ إِلَى يَوْمِ الدِّينِ\n\nيُكْتَبُ الْوَفْقُ بِمَاءِ وَرْدٍ وَزَعْفَرَانٍ، وَتُحَوِّطُهُ بِالْآيَةِ [قَوْلُهُ الْحَقُّ وَلَهُ الْمُلْكُ] ثُمَّ تَدُورُ بِهِ الْآيَاتُ الْكَرِيمَاتُ ٢٩، لَكِنَّ الْكِتَابَةَ تَكُونُ عَلَى هَذِهِ الصِّفَةِ وَكَذَلِكَ التِّلَاوَةُ، لَا إِلَهَ إِلَّا اللهُ [آيَة ١] لَا إِلَهَ إِلَّا اللهُ [آيَة ٢] وَهَكَذَا إِلَى انْتِهَاءِ الْآيَاتِ الْكَرِيمَاتِ، ثُمَّ اقْرَأْ عَلَيْهِ اسْمَ اللهِ عَزَّ وَجَلَّ [الْحَكِيمُ] بِـ أَلْ التَّعْرِيفِ وَلَيْسَ بِيَاءِ النِّدَاءِ، ٥٨٢ مَرَّةً ثُمَّ الْآيَاتِ ٢٩ مَرَّةً\n\n١، لَا إِلَهَ إِلَّا اللهُ رَبَّنَا وَابْعَثْ فِيهِمْ رَسُولًا مِنْهُمْ يَتْلُو عَلَيْهِمْ آيَاتِكَ وَيُعَلِّمُهُمُ الْكِتَابَ وَالْحِكْمَةَ وَيُزَكِّيهِمْ إِنَّكَ أَنْتَ الْعَزِيزُ الْحَكِيمُ\n\n٢، لَا إِلَهَ إِلَّا اللهُ هُوَ الَّذِي يُصَوِّرُكُمْ فِي الْأَرْحَامِ كَيْفَ يَشَاءُ لَا إِلَهَ إِلَّا هُوَ الْعَزِيزُ الْحَكِيمُ\n\n٣، لَا إِلَهَ إِلَّا اللهُ شَهِدَ اللهُ أَنَّهُ لَا إِلَهَ إِلَّا هُوَ وَالْمَلَائِكَةُ وَأُولُو الْعِلْمِ قَائِمًا بِالْقِسْطِ لَا إِلَهَ إِلَّا هُوَ الْعَزِيزُ الْحَكِيمُ\n\n٤، لَا إِلَهَ إِلَّا اللهُ إِنَّ هَذَا لَهُوَ الْقَصَصُ الْحَقُّ وَمَا مِنْ إِلَهٍ إِلَّا اللهُ وَإِنَّ اللهَ لَهُوَ الْعَزِيزُ الْحَكِيمُ\n\n٥، لَا إِلَهَ إِلَّا اللهُ وَمَا جَعَلَهُ اللهُ إِلَّا بُشْرَى لَكُمْ وَلِتَطْمَئِنَّ قُلُوبُكُمْ بِهِ وَمَا النَّصْرُ إِلَّا مِنْ عِنْدِ اللهِ الْعَزِيزِ الْحَكِيمِ\n\n٦، لَا إِلَهَ إِلَّا اللهُ إِنْ تُعَذِّبْهُمْ فَإِنَّهُمْ عِبَادُكَ وَإِنْ تَغْفِرْ لَهُمْ فَإِنَّكَ أَنْتَ الْعَزِيزُ الْحَكِيمُ\n\n٧، لَا إِلَهَ إِلَّا اللهُ وَمَا أَرْسَلْنَا مِنْ رَسُولٍ إِلَّا بِلِسَانِ قَوْمِهِ لِيُبَيِّنَ لَهُمْ فَيُضِلُّ اللهُ مَنْ يَشَاءُ وَيَهْدِي مَنْ يَشَاءُ وَهُوَ الْعَزِيزُ الْحَكِيمُ\n\n٨، لَا إِلَهَ إِلَّا اللهُ لِلَّذِينَ لَا يُؤْمِنُونَ بِالْآخِرَةِ مَثَلُ السَّوْءِ وَلِلّٰهِ الْمَثَلُ الْأَعْلَى وَهُوَ الْعَزِيزُ الْحَكِيمُ\n\n٩، لَا إِلَهَ إِلَّا اللهُ يَا مُوسَى إِنَّهُ أَنَا اللهُ الْعَزِيزُ الْحَكِيمُ\n\n١٠، لَا إِلَهَ إِلَّا اللهُ فَآمَنَ لَهُ لُوطٌ وَقَالَ إِنِّي مُهَاجِرٌ إِلَى رَبِّي إِنَّهُ هُوَ الْعَزِيزُ الْحَكِيمُ\n\n١١، لَا إِلَهَ إِلَّا اللهُ إِنَّ اللهَ يَعْلَمُ مَا تَدْعُونَ مِنْ دُونِهِ مِنْ شَيْءٍ وَهُوَ الْعَزِيزُ الْحَكِيمُ\n\n١٢، لَا إِلَهَ إِلَّا اللهُ وَهُوَ الَّذِي يَبْدَؤُا الْخَلْقَ ثُمَّ يُعِيدُهُ وَهُوَ أَهْوَنُ عَلَيْهِ وَلَهُ الْمَثَلُ الْأَعْلَى فِي السَّمَاوَاتِ وَالْأَرْضِ وَهُوَ الْعَزِيزُ الْحَكِيمُ\n\n١٣، لَا إِلَهَ إِلَّا اللهُ خَالِدِينَ فِيهَا وَعْدَ اللهِ حَقًّا وَهُوَ الْعَزِيزُ الْحَكِيمُ\n\n١٤، لَا إِلَهَ إِلَّا اللهُ قُلْ أَرُونِيَ الَّذِينَ أَلْحَقْتُمْ بِهِ شُرَكَاءَ كَلَّا بَلْ هُوَ اللهُ الْعَزِيزُ الْحَكِيمُ\n\n١٥، لَا إِلَهَ إِلَّا اللهُ مَا يَفْتَحِ اللهُ لِلنَّاسِ مِنْ رَحْمَةٍ فَلَا مُمْسِكَ لَهَا وَمَا يُمْسِكْ فَلَا مُرْسِلَ لَهُ مِنْ بَعْدِهِ وَهُوَ الْعَزِيزُ الْحَكِيمُ\n\n١٦، لَا إِلَهَ إِلَّا اللهُ تَنْزِيلُ الْكِتَابِ مِنَ اللهِ الْعَزِيزِ الْحَكِيمِ\n\n١٧، لَا إِلَهَ إِلَّا اللهُ رَبَّنَا وَأَدْخِلْهُمْ جَنَّاتِ عَدْنٍ الَّتِي وَعَدْتَهُمْ وَمَنْ صَلَحَ مِنْ آبَائِهِمْ وَأَزْوَاجِهِمْ وَذُرِّيَّاتِهِمْ إِنَّكَ أَنْتَ الْعَزِيزُ الْحَكِيمُ\n\n١٨، لَا إِلَهَ إِلَّا اللهُ حم عسق كَذَلِكَ يُوحِي إِلَيْكَ وَإِلَى الَّذِينَ مِنْ قَبْلِكَ اللهُ الْعَزِيزُ الْحَكِيمُ\n\n١٩، لَا إِلَهَ إِلَّا اللهُ حم تَنْزِيلُ الْكِتَابِ مِنَ اللهِ الْعَزِيزِ الْحَكِيمِ [الْجَاثِيَةُ]\n\n٢٠، لَا إِلَهَ إِلَّا اللهُ وَلَهُ الْكِبْرِيَاءُ فِي السَّمَاوَاتِ وَالْأَرْضِ وَهُوَ الْعَزِيزُ الْحَكِيمُ\n\n٢١، لَا إِلَهَ إِلَّا اللهُ حم تَنْزِيلُ الْكِتَابِ مِنَ اللهِ الْعَزِيزِ الْحَكِيمِ [الْأَحْقَافُ]\n\n٢٢، لَا إِلَهَ إِلَّا اللهُ سَبَّحَ لِلّٰهِ مَا فِي السَّمَاوَاتِ وَالْأَرْضِ وَهُوَ الْعَزِيزُ الْحَكِيمُ [الْحَدِيدُ]\n\n٢٣، لَا إِلَهَ إِلَّا اللهُ سَبَّحَ لِلّٰهِ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ وَهُوَ الْعَزِيزُ الْحَكِيمُ [الْحَشْرُ]\n\n٢٤، لَا إِلَهَ إِلَّا اللهُ هُوَ اللهُ الْخَالِقُ الْبَارِئُ الْمُصَوِّرُ لَهُ الْأَسْمَاءُ الْحُسْنَى يُسَبِّحُ لَهُ مَا فِي السَّمَاوَاتِ وَالْأَرْضِ وَهُوَ الْعَزِيزُ الْحَكِيمُ\n\n٢٥، لَا إِلَهَ إِلَّا اللهُ رَبَّنَا لَا تَجْعَلْنَا فِتْنَةً لِلَّذِينَ كَفَرُوا وَاغْفِرْ لَنَا رَبَّنَا إِنَّكَ أَنْتَ الْعَزِيزُ الْحَكِيمُ\n\n٢٦، لَا إِلَهَ إِلَّا اللهُ سَبَّحَ لِلّٰهِ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ وَهُوَ الْعَزِيزُ الْحَكِيمُ [الصَّفُّ]\n\n٢٧، لَا إِلَهَ إِلَّا اللهُ يُسَبِّحُ لِلّٰهِ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ الْمَلِكُ الْقُدُّوسُ الْعَزِيزُ الْحَكِيمُ\n\n٢٨، لَا إِلَهَ إِلَّا اللهُ وَآخَرِينَ مِنْهُمْ لَمَّا يَلْحَقُوا بِهِمْ وَهُوَ الْعَزِيزُ الْحَكِيمُ\n\n٢٩، لَا إِلَهَ إِلَّا اللهُ عَالِمُ الْغَيْبِ وَالشَّهَادَةِ وَهُوَ الْعَزِيزُ الْحَكِيمُ\n\nتَمَّتْ أُخْوَتِي فِي اللهِ الْآيَاتُ الْكَرِيمَاتُ وَإِلَيْكُمُ الْوَفْقُ السَّالِفُ ذِكْرُهُ\n\nوَ هَذَا هُوَ الْوَفْقُ\n\n| ٢٧٤ | ١٤٣ | ١٦٥ |\n| ٨٥ | ١٩٤ | ٣٠٣ |\n| ٢٢٣ | ٢٤٥ | ١١٤ |", "latin": "As-saiful-battāru li-daf'i Maimūnil-ghaddār.\n\nAs-salāmu 'alaikum wa rahmatullāhi wa barakātuh, ikhwatī fillāhi uqaddimu lakum hādzihil-fāidatal-qāthi'atan-nāfi'ata bi-idznillāhi fī daf'i adzat-taslīthi wal-irsālātikh-khāshshati bi-[Maimūnin-nikāhil-mal'ūni] nas'alullāha ta'ālā an yahfazhakum min syarri adziyyati hādzal-māridil-majūsiyyi la'anahullāhu 'alaihi ilā yaumid-dīn.\n\nYuktabul-wafqu bi-mā'i wardin wa za'farānin, wa tuhawwithuhu bil-āyati [Qauluhul-haqqu wa lahul-mulku] tsumma tadūru bihil-āyātil-karīmāti 29, lākinnal-kitābata takūnu 'alā hādzihish-shifati wa kadzālikat-tilāwatu, Lā ilāha illallāhu [āyah 1] Lā ilāha illallāhu [āyah 2] wa hākadzā ilā intihā'il-āyātil-karīmāti, tsummaqra' 'alaihi ismallāhi 'azza wa jalla [Al-Hakīmu] bi-alit-ta'rīfi wa laisa bi-yā'in-nidā'i, 582 marratan tsumma al-āyāti 29 marratan:\n\n1, Lā ilāha illallāhu Rabbanā wab'ats fīhim rasūlan minhum yatlū 'alaihim āyātika wa yu'allimuhumul-kitāba wal-hikmata wa yuzakkīhim innaka Antal-'Azīzul-Hakīm.\n2, Lā ilāha illallāhu Huwal-ladzī yushawwirukum fil-arhāmi kaifa yasyā'u Lā ilāha illā Huwal-'Azīzul-Hakīm.\n3, Lā ilāha illallāhu Syahidallāhu annahu Lā ilāha illā Huwa wal-malāikatu wa ulul-'ilmi qā'iman bil-qisthi Lā ilāha illā Huwal-'Azīzul-Hakīm.\n4, Lā ilāha illallāhu Inna hādzā lahuwa al-qashashul-haqqu wa mā min ilāhin illallāhu wa innallāha lahuwa al-'Azīzul-Hakīm.\n5, Lā ilāha illallāhu wa mā ja'alahullāhu illā busyra lakum wa li-tathma'inna qulūbukum bihi wa man-nashru illā min 'indillāhil-'Azīzil-Hakīm.\n6, Lā ilāha illallāhu in tu'adzzibhum fa-innahum 'ibāduka wa in taghfir lahum fa-innaka Antal-'Azīzul-Hakīm.\n7, Lā ilāha illallāhu wa mā arsalnā min rasūlin illā bi-lisāni qaumihi li-yubayyina lahum fa-yudhillullāhu man yasyā'u wa yahdī man yasyā'u wa Huwal-'Azīzul-Hakīm.\n8, Lā ilāha illallāhu lil-ladzīna lā yu'minūna bil-ākhirati matsalu as-sau'i wa lillāhil-matsalul-a'lā wa Huwal-'Azīzul-Hakīm.\n9, Lā ilāha illallāhu yā Mūsā innahu Anal-lāhul-'Azīzul-Hakīm.\n10, Lā ilāha illallāhu fa-āmana lahu Lūthun wa qāla innī muhājirun ilā Rabbī innahu Huwal-'Azīzul-Hakīm.\n11, Lā ilāha illallāhu innallāha ya'lamu mā tad'ūna min dūnihi min syai'in wa Huwal-'Azīzul-Hakīm.\n12, Lā ilāha illallāhu wa Huwal-ladzī yabda'ul-khalqa tsumma yu'īduhu wa Huwa ahwanu 'alaihi wa lahul-matsalul-a'lā fis-samāwāti wal-ardhi wa Huwal-'Azīzul-Hakīm.\n13, Lā ilāha illallāhu khālidīna fīhā wa'dallāhi haqqan wa Huwal-'Azīzul-Hakīm.\n14, Lā ilāha illallāhu qul arūniyal-ladzīna alhaqtum bihi syurakā'a kallā bal Huwallāhul-'Azīzul-Hakīm.\n15, Lā ilāha illallāhu mā yaftahillāhu lin-nāsi min rahmatin fa-lā mumsika lahā wa mā yumsik fa-lā mursila lahu min ba'dihi wa Huwal-'Azīzul-Hakīm.\n16, Lā ilāha illallāhu tanzīlul-kitābi minallāhil-'Azīzil-Hakīm.\n17, Lā ilāha illallāhu Rabbanā wa adkhilhum jannāti 'adninil-latī wa'adtahum wa man shalaha min ābā'ihim wa azwājihim wa dzurriyyātihim innaka Antal-'Azīzul-Hakīm.\n18, Lā ilāha illallāhu [ حم عسق ] [Rajah Huruf — tidak diterjemahkan] kadzālika yūhī ilaika wa ilal-ladzīna min qablikallāhul-'Azīzul-Hakīm.\n19, Lā ilāha illallāhu [ حم ] [Rajah Huruf — tidak diterjemahkan] tanzīlul-kitābi minallāhil-'Azīzil-Hakīm [al-Jātsiyah].\n20, Lā ilāha illallāhu wa lahul-kibriyā'u fis-samāwāti wal-ardhi wa Huwal-'Azīzul-Hakīm.\n21, Lā ilāha illallāhu [ حم ] [Rajah Huruf — tidak diterjemahkan] tanzīlul-kitābi minallāhil-'Azīzil-Hakīm [al-Ahqāf].\n22, Lā ilāha illallāhu sabbaha lillāhi mā fis-samāwāti wal-ardhi wa Huwal-'Azīzul-Hakīm [al-Hadīd].\n23, Lā ilāha illallāhu sabbaha lillāhi mā fis-samāwāti wa mā fil-ardhi wa Huwal-'Azīzul-Hakīm [al-Hasyr].\n24, Lā ilāha illallāhu Huwallāhul-Khāliqul-Bāri'ul-Mushawwiru lahul-asmā'ul-husnā yusabbihu lahu mā fis-samāwāti wal-ardhi wa Huwal-'Azīzul-Hakīm.\n25, Lā ilāha illallāhu Rabbanā lā taj'alnā fitnatan lil-ladzīna kafarū waghfir lanā Rabbanā innaka Antal-'Azīzul-Hakīm.\n26, Lā ilāha illallāhu sabbaha lillāhi mā fis-samāwāti wa mā fil-ardhi wa Huwal-'Azīzul-Hakīm [ash-Shaff].\n27, Lā ilāha illallāhu yusabbihu lillāhi mā fis-samāwāti wa mā fil-ardhi al-Malikul-Quddūsul-'Azīzul-Hakīm.\n28, Lā ilāha illallāhu wa ākharīna minhum lammā yalhaqū bihim wa Huwal-'Azīzul-Hakīm.\n29, Lā ilāha illallāhu 'ālimul-ghaibi wasy-syahādati wa Huwal-'Azīzul-Hakīm.\n\nTammat ikhwatī fillāhi al-āyātul-karīmātu wa ilaikumul-wafqus-sālifu dzikruhū:\n\n| ٢٧٤ | ١٤٣ | ١٦٥ |\n|---|---|---|\n| ٨٥ | ١٩٤ | ٣٠٣ |\n| ٢٢٣ | ٢٤٥ | ١١٤ |\n\n[Wafaq Musallas 3×3 As-Saiful-Battār — Asror Angka Arab, tidak dilatinkan]\n\nWafaq musallas 3×3 (asror, tanpa latin/terjemah angka — simpan RTL agar dir=rtl): lihat tabel arab di atas.", "terj": "Pedang yang tajam untuk menolak Maimun yang berkhianat.\n\nAssalamu'alaikum warahmatullahi wabarakatuh, wahai saudara-saudaraku karena Allah, aku persembahkan kepada kalian faedah yang sangat ampuh dan bermanfaat ini — dengan izin Allah — dalam menolak gangguan penindasan dan kiriman-kiriman khusus yang berkaitan dengan [Maimun Nikah yang terlaknat]. Kami memohon kepada Allah Ta'ala semoga Dia menjaga kalian dari kejahatan gangguan makhluk durhaka yang berwatak Majusi ini — semoga Allah melaknatnya hingga hari Kiamat.\n\nWafaq ditulis dengan air mawar dan za'faran; kelilingilah ia dengan ayat [Firman-Nya adalah benar dan bagi-Nya kerajaan] kemudian putarilah ia dengan 29 ayat yang mulia. Namun penulisan hendaklah mengikuti tata cara ini dan demikian pula cara membacanya: Lā ilāha illallāh [ayat 1] Lā ilāha illallāh [ayat 2] demikian seterusnya hingga selesai semua ayat yang mulia, kemudian bacakanlah di atasnya nama Allah 'azza wa jalla [Al-Hakim] dengan memakai alif-lam ma'rifah dan bukan dengan ya' panggilan — sebanyak 582 kali kemudian ayat-ayat tersebut 29 kali:\n\n1, Tidak ada tuhan selain Allah — Wahai Tuhan kami, bangkitkanlah di tengah mereka seorang rasul dari kalangan mereka yang membacakan kepada mereka ayat-ayat-Mu, mengajarkan kepada mereka Kitab dan Hikmah, serta menyucikan mereka; sesungguhnya Engkaulah Yang Maha Perkasa lagi Maha Bijaksana.\n2, Tidak ada tuhan selain Allah — Dialah yang membentuk kamu dalam rahim sebagaimana Dia kehendaki; tidak ada tuhan selain Dia Yang Maha Perkasa lagi Maha Bijaksana.\n3, Tidak ada tuhan selain Allah — Allah bersaksi bahwa tidak ada tuhan selain Dia, demikian pula para malaikat dan orang-orang yang berilmu yang menegakkan keadilan; tidak ada tuhan selain Dia Yang Maha Perkasa lagi Maha Bijaksana.\n4, Tidak ada tuhan selain Allah — Sesungguhnya ini benar-benar kisah yang benar; tidak ada tuhan selain Allah; dan sesungguhnya Allah Dialah Yang Maha Perkasa lagi Maha Bijaksana.\n5, Tidak ada tuhan selain Allah — Dan tidaklah Allah menjadikannya melainkan sebagai kabar gembira bagi kalian dan agar hati kalian menjadi tenteram dengannya; dan tidak ada pertolongan melainkan dari sisi Allah Yang Maha Perkasa lagi Maha Bijaksana.\n6, Tidak ada tuhan selain Allah — Jika Engkau menyiksa mereka, maka sesungguhnya mereka adalah hamba-hamba-Mu; dan jika Engkau mengampuni mereka, maka sesungguhnya Engkaulah Yang Maha Perkasa lagi Maha Bijaksana.\n7, Tidak ada tuhan selain Allah — Dan tidaklah Kami mengutus seorang rasul melainkan dengan bahasa kaumnya agar ia menjelaskan kepada mereka; maka Allah menyesatkan siapa yang Dia kehendaki dan memberi petunjuk kepada siapa yang Dia kehendaki; dan Dialah Yang Maha Perkasa lagi Maha Bijaksana.\n8, Tidak ada tuhan selain Allah — Bagi orang-orang yang tidak beriman kepada akhirat terdapat perumpamaan yang buruk, dan bagi Allah perumpamaan yang tertinggi; dan Dialah Yang Maha Perkasa lagi Maha Bijaksana.\n9, Tidak ada tuhan selain Allah — Wahai Musa, sesungguhnya Aku adalah Allah Yang Maha Perkasa lagi Maha Bijaksana.\n10, Tidak ada tuhan selain Allah — Maka berimanlah Luth kepadanya dan berkata: Sesungguhnya aku akan berhijrah kepada Tuhanku; sesungguhnya Dialah Yang Maha Perkasa lagi Maha Bijaksana.\n11, Tidak ada tuhan selain Allah — Sesungguhnya Allah mengetahui apa yang kalian seru selain Dia berupa sesuatu apa pun; dan Dialah Yang Maha Perkasa lagi Maha Bijaksana.\n12, Tidak ada tuhan selain Allah — Dan Dialah yang memulai penciptaan kemudian mengulanginya, dan itu lebih mudah bagi-Nya; dan bagi-Nya perumpamaan yang tertinggi di langit dan di bumi; dan Dialah Yang Maha Perkasa lagi Maha Bijaksana.\n13, Tidak ada tuhan selain Allah — Mereka kekal di dalamnya; janji Allah adalah benar; dan Dialah Yang Maha Perkasa lagi Maha Bijaksana.\n14, Tidak ada tuhan selain Allah — Katakanlah: Perlihatkan kepadaku orang-orang yang kalian sekutukan dengan-Nya; sekali-kali tidak, bahkan Dialah Allah Yang Maha Perkasa lagi Maha Bijaksana.\n15, Tidak ada tuhan selain Allah — Apa saja yang Allah bukakan bagi manusia berupa rahmat, maka tidak ada yang dapat menahannya; dan apa saja yang Dia tahan, maka tidak ada yang dapat mengirimnya setelah-Nya; dan Dialah Yang Maha Perkasa lagi Maha Bijaksana.\n16, Tidak ada tuhan selain Allah — Turunnya Kitab ini dari Allah Yang Maha Perkasa lagi Maha Bijaksana.\n17, Tidak ada tuhan selain Allah — Wahai Tuhan kami, masukkanlah mereka ke dalam surga-surga 'Adn yang telah Engkau janjikan kepada mereka beserta orang-orang saleh dari bapak-bapak mereka, istri-istri mereka dan keturunan mereka; sesungguhnya Engkaulah Yang Maha Perkasa lagi Maha Bijaksana.\n18, Tidak ada tuhan selain Allah — [ حم عسق ] [Rajah Huruf — tidak diterjemahkan], demikianlah Allah Yang Maha Perkasa lagi Maha Bijaksana mewahyukan kepadamu dan kepada orang-orang sebelum kamu.\n19, Tidak ada tuhan selain Allah — [ حم ] [Rajah Huruf — tidak diterjemahkan], turunnya Kitab ini dari Allah Yang Maha Perkasa lagi Maha Bijaksana [Al-Jatsiyah].\n20, Tidak ada tuhan selain Allah — Dan bagi-Nya keagungan di langit dan di bumi; dan Dialah Yang Maha Perkasa lagi Maha Bijaksana.\n21, Tidak ada tuhan selain Allah — [ حم ] [Rajah Huruf — tidak diterjemahkan], turunnya Kitab ini dari Allah Yang Maha Perkasa lagi Maha Bijaksana [Al-Ahqaf].\n22, Tidak ada tuhan selain Allah — Bertasbih kepada Allah apa yang ada di langit dan di bumi; dan Dialah Yang Maha Perkasa lagi Maha Bijaksana [Al-Hadid].\n23, Tidak ada tuhan selain Allah — Bertasbih kepada Allah apa yang ada di langit dan apa yang ada di bumi; dan Dialah Yang Maha Perkasa lagi Maha Bijaksana [Al-Hasyr].\n24, Tidak ada tuhan selain Allah — Dialah Allah Yang Menciptakan, Yang Mengadakan, Yang Membentuk Rupa; bagi-Nya nama-nama yang paling baik; bertasbih kepada-Nya apa yang ada di langit dan di bumi; dan Dialah Yang Maha Perkasa lagi Maha Bijaksana.\n25, Tidak ada tuhan selain Allah — Wahai Tuhan kami, janganlah Engkau jadikan kami sebagai fitnah bagi orang-orang kafir; ampunilah kami wahai Tuhan kami; sesungguhnya Engkaulah Yang Maha Perkasa lagi Maha Bijaksana.\n26, Tidak ada tuhan selain Allah — Bertasbih kepada Allah apa yang ada di langit dan apa yang ada di bumi; dan Dialah Yang Maha Perkasa lagi Maha Bijaksana [Ash-Shaff].\n27, Tidak ada tuhan selain Allah — Bertasbih kepada Allah apa yang ada di langit dan apa yang ada di bumi; Raja Yang Maha Suci Yang Maha Perkasa lagi Maha Bijaksana.\n28, Tidak ada tuhan selain Allah — Dan orang-orang lain dari mereka yang belum bertemu dengan mereka; dan Dialah Yang Maha Perkasa lagi Maha Bijaksana.\n29, Tidak ada tuhan selain Allah — Yang mengetahui yang gaib dan yang nyata; dan Dialah Yang Maha Perkasa lagi Maha Bijaksana.\n\nTelah selesai, wahai saudara-saudaraku karena Allah, ayat-ayat yang mulia tersebut dan untuk kalian wafaq yang telah disebutkan terdahulu.\n\nDan inilah wafaqnya:\n\n| ٢٧٤ | ١٤٣ | ١٦٥ |\n|---|---|---|\n| ٨٥ | ١٩٤ | ٣٠٣ |\n| ٢٢٣ | ٢٤٥ | ١١٤ |\n\n[Wafaq Musallas 3×3 As-Saiful-Battār — Asror Angka Arab, tidak diterjemahkan]", "syarah": "Wafaq musallas 3×3 Saif al-Battār memiliki 9 kamar dengan konstanta 582 per baris/kolom/diagonal (165+143+274=582, 303+194+85=582, 114+245+223=582), selaras dengan hitungan wirid Al-Hakīm 582×. Keempat sisi bingkai hijau di sekeliling wafaq bertuliskan kaligrafi ayat `قَوْلُهُ الْحَقُّ وَلَهُ الْمُلْكُ` (`قوله` di kanan-atas, `الحق` di kiri-atas, `وله` di kiri-bawah, `الملك` di kanan-bawah), lalu di luarnya diputar diselingi 29 ayat Al-‘Azīz Al-Hakīm. Fungsi utamanya sebagai pemutus ikatan sihir/pelet Maimūn an-Nikāh (jin mārid Majūsī) yang merusak kehormatan suami-istri; mekanisme wirid Al-Hakīm 582× + ayat-ayat 29× menjadi pemantik pembakar energi sihir.", "khus": "Penulisan dengan air mawar + za‘faran, pembacaan terpisah (Lā ilāha illallāh per ayat) lalu wirid Al-Hakīm, cocok sebagai hirz pelindung kehormatan. Simetri 582 memancarkan daya hancur bergelombang yang memutus kiriman Maimūn secara instan."}, {"hal": "25", "title": "HALAMAN 25 — فَائِدَةٌ قَاطِعَةٌ لِرَدِّ الْخَادِمِ", "imgs": ["hal_25.png"], "arab": "فَائِدَةٌ قَاطِعَةٌ لِرَدِّ الْخَادِمِ\n\nاَلسَّلَامُ عَلَيْكُمْ وَرَحْمَةُ اللهِ وَبَرَكَاتُهُ، إِخْوَتِي فِي اللهِ أَضَعُ بَيْنَ أَيْدِيكُمْ فَائِدَةً قَاطِعَةً لِمَنْ تَعَطَّلَ عَنْهُ التَّصْرِيفُ وَمُنِعَ مِنْهُ وَلِمَنْ كَانَ لَهُ خَادِمٌ وَفَرَّ عَنْهُ، فَلْيَصُمْ لِلّٰهِ تَعَالَى يَوْمَ الْخَمِيسِ وَالْجُمُعَةِ بِنِيَّةِ الْعِبَادَةِ، وَيَقْرَأُ يَوْمَ الْخَمِيسِ دُبُرَ كُلِّ صَلَاةٍ الْآيَتَيْنِ مِنْ سُورَةِ يُوسُفَ ٧٥ مَرَّةً\n\n[وَقَالَ الْمَلِكُ ائْتُونِي بِهِ أَسْتَخْلِصْهُ لِنَفْسِي فَلَمَّا كَلَّمَهُ قَالَ إِنَّكَ الْيَوْمَ لَدَيْنَا مَكِينٌ أَمِينٌ ۝ قَالَ اجْعَلْنِي عَلَى خَزَائِنِ الْأَرْضِ إِنِّي حَفِيظٌ عَلِيمٌ ۝ وَكَذَلِكَ مَكَّنَّا لِيُوسُفَ فِي الْأَرْضِ يَتَبَوَّأُ مِنْهَا حَيْثُ يَشَاءُ نُصِيبُ بِرَحْمَتِنَا مَنْ نَشَاءُ وَلَا نُضِيعُ أَجْرَ الْمُحْسِنِينَ] صَدَقَ اللهُ الْعَظِيمُ\n\nوَفِي آخِرِ التِّلَاوَةِ يَدْعُو بِهَذَا الدُّعَاءِ ٧ مَرَّاتٍ\n\n[اللَّهُمَّ فَاطِرَ السَّمَاوَاتِ وَالْأَرْضِ عَالِمَ الْغَيْبِ وَالشَّهَادَةِ الْكَبِيرَ الْمُتَعَالَ أَشْهَدُ بِأَنَّكَ أَنْتَ اللهُ لَا إِلَهَ إِلَّا أَنْتَ رَبُّ السَّمَاوَاتِ السَّبْعِ وَالْأَرَضِينَ السَّبْعِ وَمَا بَيْنَهُمَا عَلَّامُ الْغُيُوبِ غَفَّارُ الذُّنُوبِ سَتَّارُ الْعُيُوبِ مُفَرِّجُ الْكُرُوبِ مُخْرِجُ الْحُبُوبِ مُسَخِّرُ الْقُلُوبِ لِمَنْ كَانَ مَهْجُورًا حَتَّى يَعُودَ مَحْبُوبًا أَسْأَلُكَ اللَّهُمَّ أَنْ تُسَخِّرَ لِي [اسْمَ الْخَادِمِ] كَمَا سَخَّرْتَ حَمَلَةَ عَرْشِكَ تَحْتَ عَرْشِكَ يَا حَامِلَ الْعَرْشِ عَنْ حَمَلَةِ الْعَرْشِ وَكَمَا سَخَّرْتَ الطَّيْرَ فِي جَوِّ السَّمَاءِ وَكَمَا سَخَّرْتَ الشَّمْسَ وَالْقَمَرَ كُلٌّ يَجْرِي إِلَى أَجَلٍ مُسَمًّى وَكَمَا سَخَّرْتَ الْبَحْرَ لِمُوسَى بْنِ عِمْرَانَ إِلَهِي أَنِّي بِأَمْرِكَ أَمَرْتُهُ وَبِدَعْوَتِكَ اسْتَجْلَبْتُهُ وَبِكَلِمَاتِكَ لَقَّنْتُهُ حَتَّى إِذَا دَعَوْتُهُ أَجَابَنِي وَإِنْ كُنْتُ مَعَهُ أَحَبَّنِي وَإِنْ غِبْتُ عَنْهُ اشْتَاقَنِي وَلَا يَعْصِي أَمْرِي وَلَا يَنْظُرُ لِمَجْلِسٍ غَيْرِي بِإِرَادَتِكَ وَإِذْنِكَ يَا اللهُ يَا اللهُ يَا اللهُ يَا حَيُّ يَا قَيُّومُ يَا بَدِيعَ السَّمَاوَاتِ وَالْأَرْضِ يَا ذَا الْجَلَالِ وَالْإِكْرَامِ]\n\nأَمَّا يَوْمُ الْجُمُعَةِ تَصُومُهُ بِدُونِ تِلَاوَةٍ إِلَّا بَعْدَ صَلَاةِ الْجُمُعَةِ فَتَكْتُبُ أَوَّلًا الْآيَاتِ وَالدُّعَاءَ فِي وَرَقٍ نَظِيفٍ أَبْيَضَ بِمَاءِ وَرْدٍ وَزَعْفَرَانٍ وَمِسْكٍ، وَتَتْلُو عَلَيْهَا الْآيَةَ ٧ مَرَّاتٍ وَالدُّعَاءَ بَعْدَ الْآيَةِ ١ مَرَّةً، وَتَتْرُكُهَا إِلَى اللَّيْلِ حَيْثُ تَضَعُهَا تَحْتَ وِسَادَتِكَ وَتَنَامُ وَتَنْوِي عَدَمَ أَذِيَّةِ خَلْقِ اللهِ، فِي الصَّبَاحِ تَأْخُذُ الْوَرَقَةَ وَتَطْوِيهَا وَتَجْعَلُهَا عِنْدَكَ فَإِنَّهُ لَا تَمُرُّ الْجُمُعَةُ الثَّانِيَةُ إِلَّا وَقَدْ حَضَرَ الْخَادِمُ بِإِذْنِ اللهِ وَبِبَرَكَةِ كَلَامِ اللهِ عَزَّ وَجَلَّ، فَلَا تَتَعَدَّى حُدُودَ اللهِ أَيُّهَا الطَّالِبُ، نَفَعَنِي اللهُ وَإِيَّاكُمْ بِالْقُرْآنِ الْعَظِيمِ وَهَدَانِي وَإِيَّاكُمْ إِلَى صِرَاطِهِ الْمُسْتَقِيمِ وَالسَّلَامُ", "latin": "Fāidatun qāthi'atun li-raddil-khādim.\n\nAs-salāmu 'alaikum wa rahmatullāhi wa barakātuh, ikhwatī fillāhi adha'u baina aidīkum fāidatan qāthi'atan li-man ta'aththala 'anhut-tashrīfu wa muni'a minhu wa li-man kāna lahū khādimun wa farra 'anhu, fa-l yashum lillāhi ta'ālā yaumal-khamīsi wal-jumu'ati bi-niyyatil-'ibādati, wa yaqra'u yaumal-khamīsi dubura kulli shalātin al-āyataini min sūrati Yūsufa 75 marratan:\n\n[Wa qālal-maliku'tūnī bihi astakhlishu linafsī fa-lammā kallamahū qāla innakal-yauma ladainā makīnun amīnun ۝ Qāla ij'alnī 'alā khazā'inil-ardhi innī hafīzhun 'alīmun ۝ Wa kadzālika makkannā li-Yūsufa fil-ardhi yatabawwa'u minhā haitsu yasyā'u nushību bi-rahmatinā man nasyā'u wa lā nudhī'u ajral-muhsinīna] shadaqallāhul-'azhīm.\n\nWa fī ākhir at-tilāwati yad'ū bihādzad-du'ā'i 7 marrātin:\n\n[Allāhumma fāthiras-samāwāti wal-ardhi, 'ālimal-ghaibi wasy-syahādati, al-kabīral-muta'āli, asyhadu bi-annaka antallāhu lā ilāha illā anta, rabbas-samāwātis-sab'i wal-aradhīnas-sab'i wa mā bainahumā, 'allāmal-ghuyūbi, ghaffāradz-dzunūbi, sattāral-'uyūbi, mufarrijal-kurūbi, mukhrijal-hubūbi, musakhkhiral-qulūbi li-man kāna mahjūran hattā ya'ūda mahbūban, as'alukallāhumma an tusakhkhira lī [ismal-khādimi] kamā sakhkharta hamalata 'arsyika tahta 'arsyika yā hāmilal-'arsyi 'an hamalatil-'arsyi, wa kamā sakhkharta ath-thaira fī jawwis-samā'i, wa kamā sakhkharta asy-syamsa wal-qamara kullun yajrī ilā ajalim-musamman, wa kamā sakhkharta al-bahra li-Mūsā bni 'Imrāna, ilāhī annī bi-amrika amartuhu wa bi-da'watika istajlabtuhu wa bi-kalimātika laqqantuhu hattā idzā da'awtuhu ajābanī wa in kuntu ma'ahu ahabbanī wa in ghibtu 'anhu isytāqanī wa lā ya'shī amrī wa lā yanzhuru li-majlisi ghairī bi-irādatika wa idznika yā Allāhu yā Allāhu yā Allāhu, yā Hayyu yā Qayyūmu, yā Badī'as-samāwāti wal-ardhi, yā Dzal-jalāli wal-ikrām].\n\nAmmā yaumal-jumu'ati tashūmuhu bidūni tilāwatin illā ba'da shalātil-jumu'ati fa-taktubu awwalan al-āyāti wad-du'ā'a fī waraqin nazhīfin abyadha bi-mā'i wardin wa za'farānin wa miskin, wa tatlū 'alaihal-āyata 7 marrātin wad-du'ā'a ba'dal-āyati 1 marratan, wa tatrukuhā ilal-laili haitsu tadha'uhā tahta wisādatika wa tanāmu wa tanwī 'adama adziyyati khalqillāhi, fish-shabāhi ta'khudhul-waraqata wa tathwīhā wa taj'aluhā 'indaka fa-innahū lā tamurrul-jumu'atuts-tsāniyatu illā wa qad hadharal-khādimu bi-idznillāhi wa bi-barakati kalāmillāhi 'azza wa jalla, fa-lā tata'addā hudūdallāhi ayyuhath-thālib, nafa'aniyallāhu wa iyyākum bil-qur'ānil-'azhīmi wa hadānī wa iyyākum ilā shirāthihil-mustaqīmi was-salām.", "terj": "Faedah yang pasti untuk mengembalikan khadam.\n\nAssalamu'alaikum warahmatullahi wabarakatuh, wahai saudara-saudaraku karena Allah, aku letakkan di antara tangan kalian faedah yang pasti bagi orang yang terhalang tashrifnya dan terhalang darinya serta bagi orang yang memiliki khadam lalu khadam itu pergi darinya. Maka hendaklah ia berpuasa karena Allah ta'ala pada hari Kamis dan Jumat dengan niat ibadah. Pada hari Kamis ia membaca setiap selesai salat dua ayat dari Surah Yusuf sebanyak 75 kali:\n\n[Dan raja berkata: Datangkanlah dia kepadaku agar aku memilihnya untuk diriku sendiri; maka tatkala ia telah bercakap-cakap dengannya, raja berkata: Sesungguhnya kamu pada hari ini di sisi kami berkedudukan tinggi lagi terpercaya. Dia (Yusuf) berkata: Jadikanlah aku bendahara negeri; sesungguhnya aku adalah orang yang pandai menjaga lagi berpengetahuan. Dan demikianlah Kami memberi kedudukan kepada Yusuf di negeri itu; ia bebas bertempat tinggal di mana saja yang ia kehendaki; Kami melimpahkan rahmat Kami kepada siapa yang Kami kehendaki dan Kami tidak menyia-nyiakan pahala orang-orang yang berbuat baik] Maha benar Allah yang Maha Agung.\n\nDan di akhir bacaan hendaklah ia berdoa dengan doa ini sebanyak 7 kali:\n\n[Ya Allah, Pencipta langit dan bumi, Yang Mengetahui yang gaib dan yang nyata, Yang Maha Besar lagi Maha Tinggi, aku bersaksi bahwa Engkaulah Allah, tidak ada tuhan selain Engkau, Tuhan langit yang tujuh dan bumi yang tujuh serta apa yang ada di antara keduanya, Yang Maha Mengetahui hal-hal gaib, Pengampun dosa-dosa, Penutup aib-aib, Penghilang kesusahan, Penumbuh biji-bijian, Penakluk hati bagi orang yang dijauhi hingga ia kembali dicintai, aku memohon kepada-Mu ya Allah agar Engkau tundukkan untukku [nama khadam] sebagaimana Engkau telah menundukkan para pemikul Arasy-Mu di bawah Arasy-Mu, wahai yang memikul Arasy dari para pemikul Arasy, dan sebagaimana Engkau menundukkan burung di udara langit, dan sebagaimana Engkau menundukkan matahari dan bulan — semuanya beredar hingga waktu yang ditentukan — dan sebagaimana Engkau menundukkan laut untuk Musa bin Imran; Tuhanku, sesungguhnya dengan perintah-Mu aku telah memerintahkannya, dengan seruan-Mu aku telah memanggilnya, dan dengan kalimat-kalimat-Mu aku telah mengajarinya, sehingga apabila aku memanggilnya ia menjawabku, dan jika aku bersamanya ia mencintaiku, dan jika aku jauh darinya ia merindukanku, ia tidak durhaka terhadap perintahku dan tidak memperhatikan majelis selainku, dengan kehendak-Mu dan izin-Mu, wahai Allah, wahai Allah, wahai Allah, wahai Yang Maha Hidup, wahai Yang Maha Berdiri Sendiri, wahai Pencipta langit dan bumi, wahai Pemilik keagungan dan kemuliaan].\n\nAdapun pada hari Jumat, berpuasalah tanpa bacaan kecuali setelah salat Jumat, lalu tulislah terlebih dahulu ayat-ayat dan doa tersebut pada kertas putih bersih dengan air mawar, za'faran dan misk; bacalah di atasnya ayat tersebut 7 kali dan doa setelah ayat 1 kali, lalu tinggalkanlah hingga malam di mana engkau meletakkannya di bawah bantalmu dan engkau tidur dengan niat tidak menyakiti makhluk Allah. Pada pagi harinya ambillah kertas tersebut, lipatlah dan jadikanlah di sisimu; maka tidak akan lewat Jumat kedua kecuali khadam tersebut telah hadir dengan izin Allah dan dengan keberkahan kalam Allah 'azza wa jalla. Maka janganlah engkau melampaui batas-batas Allah, wahai penuntut ilmu. Semoga Allah memberi manfaat kepadaku dan kepada kalian dengan Al-Qur'an yang agung, memberi petunjuk kepadaku dan kepada kalian kepada jalan-Nya yang lurus, dan salam sejahtera.", "syarah": "Konteks Masalah: Halaman ini memuat solusi spesifik dalam disiplin hikmah untuk mengatasi problem ketika seorang praktisi (as-sālik) mengalami pemutusan hubungan spiritual dengan khadam atau pendamping gaibnya akibat kesalahan prosedur, keteledoran, atau sanksi internal amalan.\n\nPendekatan Ritual: Menggabungkan ibadah mahdhah berupa puasa sunnah dua hari (Kamis–Jumat), pembacaan ayat khusus dari kisah Nabi Yusuf — simbol kemuliaan, penundukan pandangan, dan pengembalian posisi terhormat — serta doa tawasul tauhid yang kuat untuk memohon pemulihan ikatan batin amalan.", "khus": "Fungsi Utama: Digunakan secara khusus sebagai metode darurat untuk memanggil kembali (raddul-khādim) kekuatan, energi, atau entitas pengawal amalan yang kabur atau terputus koneksinya.\n\nPeringatan Ketat: Diingatkan oleh penyusun kitab agar pengamal senantiasa bertakwa, menjaga batasan syariat, dan tidak menyalahgunakan amalan ini untuk kezaliman."}, {"hal": "26", "title": "HALAMAN 26 — دُعَاءُ الْخَائِفِ", "imgs": ["hal_26.png"], "arab": "دُعَاءُ الْخَائِفِ\n\nاَلسَّلَامُ عَلَيْكُمْ وَرَحْمَةُ اللهِ وَبَرَكَاتُهُ\n\nإِخْوَتِي فِي اللهِ، إِلَيْكُمْ هَذَا الدُّعَاءَ النَّافِعَ بِإِذْنِ اللهِ لِلِاحْتِجَابِ مِنَ الْأَعْدَاءِ وَمِنْ كُلِّ مَنْ يَخَافُ مِنْهُ الْمَرْءُ مِنْ طُغَاةٍ\n\nتَقْرَأُ أَوَّلًا آيَةَ الْكُرْسِيِّ ثَلَاثَ مَرَّاتٍ، ثُمَّ تَدْعُو بِهَذَا الدُّعَاءِ\n\n[بِسْمِ اللهِ الرَّحْمٰنِ الرَّحِيمِ، اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ وَعَلَى آلِهِ أَجْمَعِينَ وَسَلِّمْ تَسْلِيمًا، اللَّهُمَّ يَا مَنْ حِجَابُهُ مَحْجُوبٌ وَكُرْسِيُّهُ مَنْصُوبٌ وَنَبِيُّهُ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ مَحْبُوبٌ، حُلْ بَيْنِي وَبَيْنَ مَنْ قَلْبِي مِنْهُ مَرْهُوبٌ يَا غَالِبًا غَيْرَ مَغْلُوبٍ إِنَّكَ قُلْتَ وَقَوْلُكَ الْحَقُّ ﴿فَسَيَكْفِيكَهُمُ اللهُ وَهُوَ السَّمِيعُ الْعَلِيمُ﴾ يَا اللهُ يَا حَفِيظُ يَا مَنْ نِعَمُهُ لَا تُحْصَى يَا مَنْ ذِكْرُهُ لَا يُنْسَى يَا مَنْ لَهُ الْأَسْمَاءُ الْحُسْنَى وَالصِّفَاتُ الْعُلَى احْفَظْنِي بِمَا حَفِظْتَ بِهِ الذِّكْرَ الْحَكِيمَ إِنَّكَ قُلْتَ وَقَوْلُكَ الْحَقُّ ﴿إِنَّا نَحْنُ نَزَّلْنَا الذِّكْرَ وَإِنَّا لَهُ لَحَافِظُونَ﴾ وَبِحَقِّ ﴿لَهُ مُعَقِّبَاتٌ مِنْ بَيْنِ يَدَيْهِ وَمِنْ خَلْفِهِ يَحْفَظُونَهُ مِنْ أَمْرِ اللهِ﴾ ﴿وَاللهُ مِنْ وَرَائِهِمْ مُحِيطٌ﴾ وَبِحَقِّ ﴿يس﴾ إِلَى ﴿فَهُمْ لَا يُبْصِرُونَ﴾، وَصَلِّ اللَّهُمَّ عَلَى سَيِّدِنَا مُحَمَّدٍ وَعَلَى آلِهِ أَجْمَعِينَ]\n\nوَفَّقَكُمُ اللهُ لِكُلِّ خَيْرٍ", "latin": "Du'ā'ul-khā'ifi.\n\nAs-salāmu 'alaikum wa rahmatullāhi wa barakātuh.\n\nIkhwatī fillāhi, ilaikum hādzad-du'ā'an-nāfi'a bi-idznillāhi lil-ihtijābi minal-a'dā'i wa min kulli man yakhāfu minhul-mar'u min thughātin.\n\nTaqra'u awwalan Āyatal-Kursiyyi tsalātsa marrātin, tsumma tad'ū bihādzad-du'ā'i:\n\n[Bismillāhir-rahmānir-rahīmi, Allāhumma shalli 'alā sayyidinā Muhammadin wa 'alā ālihi ajma'īna wa sallim taslīman, Allāhumma yā man hijābuhū mahjūbun wa kursiyyuhū manshūbun wa nabiyyuhū shallallāhu 'alaihi wa sallama mahbūbun, hul bainī wa baina man qalbī minhu marhūbun, yā ghāliban ghaira maghlūbin, innaka qulta wa qaulukal-haqqu: [Fa-sayakfīkahumullāhu wa Huwas-samī'ul-'alīmu] (QS. al-Baqarah: 137), yā Allāhu yā Hafīzhu, yā man ni'amuhū lā tuhshā, yā man dzikruhū lā yunsā, yā man lahul-asmā'ul-husnā wash-shifātul-'ulā, ihfazhnī bimā hafizhta bihidz-dzikral-hakīmi, innaka qulta wa qaulukal-haqqu: [Innā nahnu nazzalnādz-dzikra wa innā lahū lahāfizhūna] (QS. al-Hijr: 9), wa bi-haqqi: [Lahū mu'aqqibātun min baini yadaihi wa min khalfihi yahfazhūnahū min amrillāhi] (QS. ar-Ra'd: 11), [Wallāhu min warā'ihim muhīthun] (QS. al-Burūj: 20), wa bi-haqqi [ [ يس ] [Rajah Huruf — tidak diterjemahkan] ilā fahum lā yubshirūna ] (QS. Yā-Sīn: 1-9). Wa shallillāhumma 'alā sayyidinā Muhammadin wa 'alā ālihi ajma'īna].\n\nWaffaqakumullāhu li-kulli khairin.", "terj": "Doa orang yang takut.\n\nAssalamu'alaikum warahmatullahi wabarakatuh.\n\nWahai saudara-saudaraku karena Allah, aku sampaikan kepada kalian doa yang bermanfaat ini — dengan izin Allah — untuk berlindung dari musuh-musuh dan dari setiap penguasa zalim yang ditakuti seseorang.\n\nBacalah terlebih dahulu Ayat Kursi sebanyak tiga kali, kemudian berdoalah dengan doa ini:\n\n[Dengan menyebut nama Allah Yang Maha Pengasih lagi Maha Penyayang, ya Allah limpahkanlah shalawat kepada junjungan kami Nabi Muhammad dan kepada keluarganya semuanya serta berilah keselamatan dengan sebenar-benar keselamatan; ya Allah, wahai Zat yang hijab-Nya terjaga, Kursi-Nya terpancang dan Nabi-Nya — semoga Allah bershalawat kepadanya dan memberi keselamatan — adalah kekasih yang dicintai, halangilah antara aku dan orang yang hatiku merasa takut kepadanya, wahai Yang Maha Menang yang tidak terkalahkan, sesungguhnya Engkau telah berfirman dan firman-Mu adalah benar: {Maka Allah akan mencukupimu terhadap mereka dan Dialah Yang Maha Mendengar lagi Maha Mengetahui}; wahai Allah, wahai Yang Maha Memelihara, wahai Zat yang nikmat-nikmat-Nya tidak terhitung, wahai Zat yang mengingat-Nya tidak terlupakan, wahai Zat yang memiliki nama-nama yang paling baik dan sifat-sifat yang Maha Tinggi, jagalah aku sebagaimana Engkau menjaga Adz-Dzikir yang bijaksana; sesungguhnya Engkau telah berfirman dan firman-Mu benar: {Sesungguhnya Kamilah yang menurunkan Adz-Dzikir dan sesungguhnya Kamilah yang benar-benar memeliharanya}; dan demi hak {Baginya ada malaikat-malaikat pengiring dari depan dan belakangnya yang menjaganya atas perintah Allah} dan {Allah meliputi mereka dari belakang} serta demi hak Yasin hingga {maka mereka tidak dapat melihat}; dan limpahkanlah shalawat ya Allah kepada junjungan kami Nabi Muhammad dan kepada keluarganya semuanya].\n\nSemoga Allah memberi taufik kepada kalian untuk segala kebaikan.", "syarah": "Konstruksi Benteng Tak Terlihat (Ihtijāb): Amalan ini berfungsi membentuk perisai aura tak kasat mata di sekeliling praktisi. Ketika berhadapan dengan musuh, orang jahat, atau penguasa yang hendak berbuat zalim, musuh tidak akan memiliki daya untuk mencelakai atau bahkan pandangan mereka dikunci oleh Allah.\n\nKombinasi Ayat-Ayat Penjaga (Āyātul-Hifzh): Doa ini merajut lima pilar ayat perlindungan utama Al-Qur'an: (1) Ayat Kursi (3×) sebagai pondasi benteng tauhid; (2) QS. al-Baqarah: 137 (Fa-sayakfīkahumullāhu) — janji pengawalan langsung dari Allah; (3) QS. al-Hijr: 9 (Innā Nahnu Nazzalnādz-Dzikra) — memindahkan jaminan pemeliharaan Al-Qur'an ke keselamatan fisik dan jiwa pengamal; (4) QS. ar-Ra'd: 11 (Mu'aqqibāt) — mengaktifkan pengawalan Malaikat Mu'aqqibat di depan dan belakang tubuh; (5) QS. Yā-Sīn: 1–9 (Wa Ja'alnā min Baini Aidīhim) — mengunci mata musuh agar buta dari keberadaan pengamal.", "khus": "Kepraktisan Tanpa Sarat Berat: Tidak memerlukan tirakat puasa atau penulisan wafaq rumit; cukup dibaca saat merasa terancam atau hendak menemui orang zalim.\n\nKeamanan Mutlak Perjalanan dan Darurat: Sangat ampuh dibaca saat berada di daerah rawan kejahatan, ancaman tindak kekerasan, intimidasi penguasa, maupun gangguan makhluk halus."}, {"hal": "27", "title": "HALAMAN 27 — الْآيَاتُ الْعَشْرُ الْمُبْطِلَاتُ لِلنَّفْثِ وَالسِّحْرِ", "imgs": ["hal_27.png"], "arab": "الْآيَاتُ الْعَشْرُ الْمُبْطِلَاتُ لِلنَّفْثِ وَالسِّحْرِ\n\nإِخْوَتِي فِي اللهِ أَضَعُ لَكُمْ هَذِهِ الْفَائِدَةَ النَّافِعَةَ بِإِذْنِ اللهِ فِي إِبْطَالِ السِّحْرِ، وَهِيَ مِنَ الْأَعْمَالِ الْحَرْفِيَّةِ وَالْوَفْقِيَّةِ، وَهِيَ مَرْصُودَةٌ عَلَى سَاعَةٍ مُعَيَّنَةٍ وَذَلِكَ لِتَبْقَى الْفَائِدَةُ فَعَّالَةً مُسْتَمِرَّةً فِي عَمَلِهَا وَلَا تَنْحَلُّ إِلَى مَا شَاءَ اللهُ عَزَّ وَجَلَّ، وَوَقْتُ كِتَابَتِهَا هِيَ سَاعَةُ الْقَمَرِ فِي أَيِّ يَوْمٍ بِمِدَادٍ رُوحَانِيٍّ طَاهِرٍ\n\nيُكْتَبُ الْوَفْقُ الثُّلَاثِيُّ وَتُحَوِّطُهُ مِنْ جِهَاتِهِ الْأَرْبَعِ بِالْبَسْمَلَةِ الشَّرِيفَةِ مُبْتَدِئًا مِنْ يَمِينِ الْأَسْفَلِ مُتَّجِهًا إِلَى الْيَسَارِ، ثُمَّ تَدُورُ عَلَيْهِ الْآيَاتُ الْعَشْرُ وَالَّتِي يُرْمَزُ لَهَا بِالْعَشْرِ قَالَّاتٍ، تِسْعٌ مِنْهَا فِي سُورَةِ الشُّعَرَاءِ وَآيَةٌ وَاحِدَةٌ مِنْ سُورَةِ يُونُسَ، وَهِيَ هَذِهِ\n\n١، ﴿قَالَ فِرْعَوْنُ وَمَا رَبُّ الْعَالَمِينَ﴾ [الشُّعَرَاءِ: ٢٣]\n\n٢، ﴿قَالَ رَبُّ السَّمَاوَاتِ وَالْأَرْضِ وَمَا بَيْنَهُمَا إِنْ كُنْتُمْ مُوقِنِينَ﴾ [الشُّعَرَاءِ: ٢٤]\n\n٣، ﴿قَالَ لِمَنْ حَوْلَهُ أَلَا تَسْتَمِعُونَ﴾ [الشُّعَرَاءِ: ٢٥]\n\n٤، ﴿قَالَ رَبُّكُمْ وَرَبُّ آبَائِكُمُ الْأَوَّلِينَ﴾ [الشُّعَرَاءِ: ٢٦]\n\n٥، ﴿قَالَ إِنَّ رَسُولَكُمُ الَّذِي أُرْسِلَ إِلَيْكُمْ لَمَجْنُونٌ﴾ [الشُّعَرَاءِ: ٢٧]\n\n٦، ﴿قَالَ رَبُّ الْمَشْرِقِ وَالْمَغْرِبِ وَمَا بَيْنَهُمَا إِنْ كُنْتُمْ تَعْقِلُونَ﴾ [الشُّعَرَاءِ: ٢٨]\n\n٧، ﴿قَالَ لَئِنِ اتَّخَذْتَ إِلَهًا غَيْرِي لَأَجْعَلَنَّكَ مِنَ الْمَسْجُونِينَ﴾ [الشُّعَرَاءِ: ٢٩]\n\n٨، ﴿قَالَ أَوَلَوْ جِئْتُكَ بِشَيْءٍ مُبِينٍ﴾ [الشُّعَرَاءِ: ٣٠]\n\n٩، ﴿قَالَ فَأْتِ بِهِ إِنْ كُنْتَ مِنَ الصَّادِقِينَ﴾ [الشُّعَرَاءِ: ٣١]\n\n١٠، ﴿قَالَ مُوسَى مَا جِئْتُمْ بِهِ السِّحْرُ إِنَّ اللهَ سَيُبْطِلُهُ إِنَّ اللهَ لَا يُصْلِحُ عَمَلَ الْمُفْسِدِينَ﴾ [يُونُسَ: ٨١]\n\nوَهَذَا هُوَ الْوَفْقُ", "latin": "Al-āyātul-'asyrul-mubthilātu lin-naftsi was-sihri.\n\nIkhwatī fillāhi adha'u lakum hādzihil-fā'idatan-nāfi'ata bi-idznillāhi fī ibthālis-sihri, wa hiya minal-a'mālil-harfiyyati wal-wafqiyyati, wa hiya marshūdatun 'alā sā'atin mu'ayyanatin wa dzālika li-tabqal-fā'idatu fa''ālatan mustamirratan fī 'amalihā wa lā tanhallu ilā mā syā'allāhu 'azza wa jalla, wa waqtu kitābatihā hiya sā'atul-qamari fī ayyi yaumin bi-midādin rūhāniyyin thāhirin.\n\nYuktabul-wafquts-tsulātsiyyu wa tuhīthuhu min jihātihil-arba'i bil-basmalatisy-syarīfati mubtadi'an min yamīnil-asfali muttajihan ilal-yasāri, tsumma tadūru 'alaihil-āyātul-'asyru wal-latī yurmazu lahā bil-'asyri qāllātin, tis'un minhā fī sūratisy-syu'arā'i wa āyatun wāhidatun min sūrati Yūnusa, wa hiya hādzihī:\n\n1. Qāla Fir'aunu wa mā Rabbul-'ālamīna (QS. asy-Syu'arā': 23)\n2. Qāla Rabbus-samāwāti wal-ardhi wa mā bainahumā in kuntum mūqinīna (QS. asy-Syu'arā': 24)\n3. Qāla li-man haulahū alā tastami'ūna (QS. asy-Syu'arā': 25)\n4. Qāla rabbukum wa rabbu ābā'ikumul-awwalīna (QS. asy-Syu'arā': 26)\n5. Qāla inna rasūlakumul-ladzī ursila ilaikum lamajnūnun (QS. asy-Syu'arā': 27)\n6. Qāla Rabbul-masyriqi wal-maghribi wa mā bainahumā in kuntum ta'qilūna (QS. asy-Syu'arā': 28)\n7. Qāla la'init-takhadzta ilāhan ghairī la-aj'alannaka minal-masjūnīna (QS. asy-Syu'arā': 29)\n8. Qāla awalau ji'tuka bi-syai'im-mubīnin (QS. asy-Syu'arā': 30)\n9. Qāla fa'ti bihī in kunta minash-shādiqīna (QS. asy-Syu'arā': 31)\n10. Qāla Mūsā mā ji'tum bihis-sihru innallāha sayubthiluhū innallāha lā yushlihu 'amalal-mufsidīna (QS. Yūnus: 81)\n\nWa hādzā huwal-wafqu:\n\nWafaq musallas 3×3 (lihat Hal. 28) — ditulis dengan angka asror dan dibingkai basmalah.", "terj": "Sepuluh ayat pembatal hembusan dan sihir.\n\nWahai saudara-saudaraku karena Allah, aku letakkan untuk kalian faedah yang bermanfaat ini dengan izin Allah dalam membatalkan sihir. Ia termasuk amalan huruf dan wafaq yang telah diikat pada jam astrologi tertentu agar faedah tersebut tetap aktif berdaya guna (fa''ālah) secara terus-menerus dalam kerjanya dan tidak terlepas hingga Allah 'azza wa jalla menghendaki. Waktu penulisannya ialah pada jam Bulan (sā'atul-qamar) di hari apa pun dengan tinta ruhani yang suci.\n\nWafaq tsulātsī (3×3) ditulis dan dikelilingi dari empat arahnya dengan basmalah yang mulia, dimulai dari kanan bawah menuju ke kiri, kemudian sepuluh ayat tersebut — yang diistilahkan sebagai sepuluh “qālā” — diputar mengelilinginya; sembilan di antaranya dari Surah asy-Syu'arā' dan satu ayat dari Surah Yūnus, yaitu:\n\n1. Fir'aun berkata: Siapakah Tuhan semesta alam? (QS. asy-Syu'arā': 23)\n2. Musa menjawab: Tuhan langit dan bumi dan apa yang ada di antara keduanya, jika kamu orang-orang yang yakin. (QS. asy-Syu'arā': 24)\n3. Fir'aun berkata kepada orang di sekelilingnya: Apakah kalian tidak mendengarkan? (QS. asy-Syu'arā': 25)\n4. Musa berkata: Tuhanmu dan Tuhan nenek moyangmu yang terdahulu. (QS. asy-Syu'arā': 26)\n5. Fir'aun berkata: Sesungguhnya rasul kalian yang diutus kepada kalian benar-benar orang gila. (QS. asy-Syu'arā': 27)\n6. Musa berkata: Tuhan timur dan barat dan apa yang ada di antara keduanya, jika kalian berakal. (QS. asy-Syu'arā': 28)\n7. Fir'aun berkata: Sungguh jika kamu mengambil tuhan selain aku, pasti aku akan menjadikanmu termasuk orang yang dipenjara. (QS. asy-Syu'arā': 29)\n8. Musa berkata: Apakah seandainya aku datang kepadamu dengan sesuatu yang nyata? (QS. asy-Syu'arā': 30)\n9. Fir'aun berkata: Datangkanlah hal itu jika kamu termasuk orang yang benar. (QS. asy-Syu'arā': 31)\n10. Musa berkata: Apa yang kalian datangkan adalah sihir; sesungguhnya Allah akan membatalkannya; sesungguhnya Allah tidak memperbaiki perbuatan orang-orang yang berbuat kerusakan. (QS. Yūnus: 81)\n\nDan inilah wafaqnya (lihat Hal. 28).", "syarah": "Rahasia “al-‘Asyr Qālā t” — sepuluh dialog tauhid Nabi Musa melawan Fir‘aun: sembilan ayat asy-Syu‘arā’ membangun hujjah tauhid yang ditutup puncak QS. Yūnus 81 (innallāha sayubthiluhū), sehingga melahirkan gelombang penghancur buhul sihir apapun. Penulisan pada Sā‘atul-Qamar melambangkan cairan dan penerimaan materi, memastikan tinta za‘faran meresap permanen (marshūdah). Kombinasi minum & usap tubuh: wafaq dilebur dengan air suci lalu dibacakan 10 ayat 9×, airnya diminumkan dan diusapkan untuk melunturkan sihir dari kulit hingga organ dalam.", "khus": "Garansi permanen (lā tanhallu): dirancang pada jam Bulan agar tidak luntur oleh waktu. Spesifik penghancur sihir buhul hembusan (an-naffātsāti fil-‘uqad) — tali/ikatan yang ditiup mantra."}, {"hal": "28", "title": "HALAMAN 28 — الْآيَاتُ الْعَشْرُ الْمُبْطِلَاتُ لِلنَّفْثِ وَالسِّحْرِ", "imgs": ["rajah_anwar_FINAL_300DPI/IMG_20261025_233529.png", "hal_28.png"], "arab": "الْآيَاتُ الْعَشْرُ الْمُبْطِلَاتُ لِلنَّفْثِ وَالسِّحْرِ\n\n| ٣١٣ | ١٢٧٢ | ٦٠٥ |\n|---|---|---|\n| ١٠٢٢ | ٧٣٠ | ٤٣٨ |\n| ٨٥٥ | ١٨٨ | ١١٤٧ |\n\n[الإِطَارُ الدَّاخِلِيُّ الْأَخْضَرُ حَوْلَ الْوَفْقِ مِنَ الْيَمِينِ الْأَسْفَلِ إِلَى الْيَسَارِ]: بِسْمِ اللهِ الرَّحْمَنِ الرَّحِيمِ\n\n[الدَّائِرَةُ الْخَارِجِيَّةُ الْمُحِيطَةُ بِالْوَفْقِ]: قَالَ فِرْعَوْنُ وَمَا رَبُّ الْعَالَمِينَ . قَالَ رَبُّ السَّمَاوَاتِ وَالْأَرْضِ وَمَا بَيْنَهُمَا إِنْ كُنْتُمْ مُوقِنِينَ . قَالَ لِمَنْ حَوْلَهُ أَلَا تَسْتَمِعُونَ . قَالَ رَبُّكُمْ وَرَبُّ آبَائِكُمُ الْأَوَّلِينَ . قَالَ إِنَّ رَسُولَكُمُ الَّذِي أُرْسِلَ إِلَيْكُمْ لَمَجْنُونٌ . قَالَ رَبُّ الْمَشْرِقِ وَالْمَغْرِبِ وَمَا بَيْنَهُمَا إِنْ كُنْتُمْ تَعْقِلُونَ . قَالَ لَئِنِ اتَّخَذْتَ إِلَهًا غَيْرِي لَأَجْعَلَنَّكَ مِنَ الْمَسْجُونِينَ . قَالَ أَوَلَوْ جِئْتُكَ بِشَيْءٍ مُبِينٍ . قَالَ فَأْتِ بِهِ إِنْ كُنْتَ مِنَ الصَّادِقِينَ . قَالَ مُوسَى مَا جِئْتُمْ بِهِ السِّحْرُ إِنَّ اللهَ سَيُبْطِلُهُ إِنَّ اللهَ لَا يُصْلِحُ عَمَلَ الْمُفْسِدِينَ\n\nوَبَعْدَمَا يُكْتَبُ الْجَمِيعُ يُمْحَى بِمَاءٍ طَاهِرٍ وَيُقْرَأُ عَلَيْهِ الْآيَاتُ الْعَشْرُ ٩ مَرَّاتٍ وَيَدَّهِنُ بِهِ الْمَرِيضُ جَمِيعَ جَسَدِهِ يَذْهَبُ عَنْهُ مَا كَانَ بِهِ مِنْ سِحْرٍ بِإِذْنِ اللهِ وَبِبَرَكَةِ كَلَامِ اللهِ عَزَّ وَجَلَّ\n\nأَسْأَلُ اللهَ أَنْ يَشْفِيَ كُلَّ مَرِيضٍ بِشِفَائِهِ الَّذِي لَا يُغَادِرُ سَقَمًا إِنَّهُ وَلِيُّ ذَلِكَ وَالْقَادِرُ عَلَيْهِ", "latin": "Al-āyātul-'asyrul-mubthilātu lin-naftsi was-sihri.\n\n| ٣١٣ | ١٢٧٢ | ٦٠٥ |\n|---|---|---|\n| ١٠٢٢ | ٧٣٠ | ٤٣٨ |\n| ٨٥٥ | ١٨٨ | ١١٤٧ |\n\n[Wafaq Musallas 3×3 — Asror Angka Arab, tidak dilatinkan]\n\nWa ba'damā yuktabul-jamī'u yumhā bimā'in thāhirin wa yuqra'u 'alaihil-āyātul-'asyru 9 marrātin wa yaddahinu bihil-marīdhu jamī'a jasadihī yadzhabu 'anhu mā kāna bihī min sihrin bi-idznillāhi wa bibarakati kalāmillāhi 'azz
