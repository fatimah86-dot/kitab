 adalah:\n[ ط ك س م ] [Rajah Huruf — tidak diterjemahkan]; jumlah nilai hisab mereka adalah 129, pelafalan huruf (istinthāq)-nya adalah [ طكق ] [Rajah Huruf — tidak diterjemahkan], lalu kita beri akhiran [ آيِيل ] sehingga nama khadim rūhānī-nya menjadi: [ طَكْقَآيِيلُ ] (Thakqa'āyīlu); dan darinyalah dikeluarkan nama penguasa (al-hākim) atasnya.\nAku memohon kepada Allah Subhanahu wa Ta'ala agar mengilhamkan kepada kalian dan kepadaku jalan petunjuk yang lurus, membimbing kami dan kalian menuju jalan kebenaran, serta memberikan manfaat kepada kami dan kalian dengan Al-Qur'an yang agung; sesungguhnya Dia Mahakuasa atas segala sesuatu. Dan semoga Allah melimpahkan selawat serta salam kepada junjungan kita Nabi Muhammad beserta seluruh keluarga beliau.", "syarah": "1. **Bedah Matematis Ekstraksi Khadim Rūhānī `[ طَكْقَآيِيلُ ]`**:\n   - **Langkah 1 — Ambil Kamar ke-7 dan Kamar ke-2 dari Wafaq 4×4 (Hal 58–59)**:\n     - Kamar ke-7 (nilai `1666` di Baris 2 Kolom 2 kanan): berisi huruf **`[ س و خ غ ]`**.\n     - Kamar ke-2 (nilai `409` di Baris 2 Kolom 3 kanan): berisi huruf **`[ ط ت ]`**.\n   - **Langkah 2 — Saring Huruf *Nūrāniyyah***:\n     - Dari `[ س و خ غ ]` dan `[ ط ت ]`, huruf yang termasuk 14 huruf *Nūrāniyyah* (`ط س` — sebagaimana *Thā-Sīn* dalam Al-Qur'an) adalah **`[ ط س ]`** (sedangkan `و، خ، غ، ت` adalah *Zhulmāniyyah*).\n   - **Langkah 3 — *I'tilāf* dengan *Al-Mīzānuth-Thabī'ī***:\n     - Huruf `ط` berpasangan dengan `ك` (`ط ك`), dan huruf `س` berpasangan dengan `م` (`س م`), sehingga membentuk 4 huruf: **`[ ط ك س م ]`**.\n   - **Langkah 4 — Jumlahkan Hisab & *Istinthāq***:\n     - `ط (9) + ك (20) + س (60) + م (40)` = **`129`**.\n     - *Istinthāq* dari `129`: `9 = ط`, `20 = ك`, `100 = ق` → **`طكق`**.\n     - Ditambah akhiran malaikat `آيِيل` → **`[ طَكْقَآيِيلُ ]`** (*Thakqa'āyīlu*).", "khus": "1. **Kesempurnaan Rangkaian Pelajaran 8 (Hal 56–60)**:\n   - Pelajaran Kedelapan ini merangkum seluruh tahapan puncak ilmu wafaq Al-Qur'an: (1) Hisab kata demi kata ayat Al-Qur'an & ekstraksi 5 *Afrād* + 4 *Azwāj* (Hal 56) → (2) Wafaq Musallas Huruf 3×3 (Hal 57) → (3) Penjumlahan 8 arah & transformasi ke Wafaq Murabba' Angka 4×4 metode `[ ازلن ]` (Hal 58) → (4) *Wafqut-Tashrīf* Huruf 4×4 (Hal 59) → (5) Ekstraksi Khadim Rūhānī `[ طَكْقَآيِيلُ ]` (Hal 60)."}, {"hal": "61", "title": "HALAMAN 61 — الْوَصْفُ الْمُبِينُ بَعْدَ تَمْوِيهِ الْمُدَّعِينَ فِي كَيْفِيَّةِ اسْتِخْرَاجِ الرُّوحَانِيِّ", "imgs": ["hal_61.png"], "arab": "الْوَصْفُ الْمُبِينُ بَعْدَ تَمْوِيهِ الْمُدَّعِينَ فِي كَيْفِيَّةِ اسْتِخْرَاجِ الرُّوحَانِيِّ\n\nإِخْوَانِي فِي اللهِ هَذَا شَرْحٌ لِكَيْفِيَّةِ اسْتِخْرَاجِ الرُّوحَانِيِّ بِطَرِيقَةِ التَّكْعِيبِ ، شَاءَ اللهُ سُبْحَانَهُ وَتَعَالَى أَنْ يَكْشِفَ لَكُمْ عَنْ سِرٍّ أَعْلَمُ جَيِّدًا أَنَّهُ مَرَّ عَلَيْهِ وَرُبَّمَا اسْتَخْرَجَ الرُّوحَانِيَّ بِتِلْكَ الطَّرِيقَةِ الَّتِي لَا يَخْلُو كِتَابٌ مِنْهَا وَهِيَ كَاذِبَةٌ خَاطِئَةٌ لَا أَسَاسَ لَهَا وَلَا دَخْلَ لِعِلْمِ الْحَرْفِ بِهَا وَهِيَ [ طَرِيقَةُ اسْتِخْرَاجِ الرُّوحَانِيِّ مِنِ اسْمِ زَيْدٍ ] ، وَالطَّرِيقَةُ هِيَ كَالتَّالِي\nز ي د = ٣ حُرُوفٍ\nز ا ي ي ا د ا ل = ٨ حُرُوفٍ\n٣ فِي ٨ = ٢٤ [ ا ر ب ع ة و ع ش ر و ن ] بَسْطُ حُرُوفِهَا هَكَذَا ،\nا ل ف ر ا ب ا ع ي ن ت ا و ا و ع ي ن ش ي ن ر ا و ا و ن و ن ، نُزِيلُ حُرُوفَ الْمَدِّ ،\nا ل ف ر ا ب ا ع ن ت ا و و ع ن ش ن ر ا و و ن ن ، نَلْقُطُ الْحُرُوفَ بِالتَّثْلِيثِ ابْتِدَاءً مِنْ حَرْفِ [ ف ] ،\nف ا ا ن ا و ن ن ا و ن ، نُزِيلُ التَّكْرَارَ مِنْ هَذِهِ الْحُرُوفِ\nف ا ن و ، هَذِهِ هِيَ حُرُوفُ الرُّوحَانِيِّ لِاسْمِ زَيْدٍ وَعَلَيْهِ يَكُونُ الرُّوحَانِيُّ بَعْدَ إِضَافَةِ [ آيِيل ] هُوَ [ فَانَوَآيِيلُ ] .\nنَفَعَنِي اللهُ وَإِيَّاكُمْ وَهَدَانَا إِلَى طَرِيقِ الْحَقِّ وَنَوَّرَنَا وَإِيَّاكُمْ بِنُورِهِ إِنَّهُ عَلَى كُلِّ شَيْءٍ قَدِيرٌ", "latin": "Al-washful-mubīnu ba'da tamwīhil-mudda'īna fī kaifiyyati-stikhrājir-rūhāniyyi.\n\nIkhwānī fillāhi hādzā syarhun likaifiyyati-stikhrājir-rūhāniyyi bitharīqatit-tak'ībi, syā'allāhu Subhānahū wa Ta'ālā an yaksyifa lakum 'an sirrin a'lamu jayyidan annahū marra 'alaihi wa rubbamā-stakhrajar-rūhāniyya bitilkath-tharīqatil-latī lā yakhlū kitābun minhā wa hiya kādzibatun khāthi'atun lā asāsa lahā wa lā dakhla li'ilmil-harfi bihā wa hiya [ tharīqatu-stikhrājir-rūhāniyyi mini-smi Zaidin ], wath-tharīqatu hiya kattālī\n[ ز ي د ] = 3 hurūfin\n[ ز ا ي ي ا د ا ل ] = 8 hurūfin\n3 fī 8 = 24 [ ا ر ب ع ة و ع ش ر و ن ] basthu hurūfihā hākadzā,\n[ ا ل ف ر ا ب ا ع ي ن ت ا و ا و ع ي ن ش ي ن ر ا و ا و ن و ن ] , nuzīlu hurūfal-maddi,\n[ ا ل ف ر ا ب ا ع ن ت ا و و ع ن ش ن ر ا و و ن ن ] , nalquthul-hurūfa bit-tatslītsi-btidā'an min harfi [ ف ],\n[ ف ا ا ن ا و ن ن ا و ن ] , nuzīlut-tikrāra min hādzihil-hurūfi\n[ ف ا ن و ] , hādzihī hiya hurūfur-rūhāniyyi lismi Zaidin wa 'alaihi yakūnur-rūhāniyyu ba'da idhāfati [ āyīla ] huwa [ Fānawāyīlu ].\nNafa'aniyallāhu wa iyyākum wa hadānā ilā tharīqil-haqqi wa nawwaranā wa iyyākum binūrihī innahū 'alā kulli syai'in qadīrun.", "terj": "Penjelasan yang nyata — setelah pengaburan para pengaku-ngaku — tentang tata cara mengeluarkan nama khadim ruhani.\n\nWahai saudara-saudaraku karena Allah, ini adalah penjelasan tentang tata cara mengeluarkan nama khadim rūhānī (atas) dengan metode pelipatan (at-tak'īb). Allah Subhanahu wa Ta'ala berkehendak menyingkapkan bagi kalian sebuah rahasia yang aku ketahui dengan sangat baik bahwa banyak penuntut ilmu pernah melewatinya dan barangkali mencoba mengeluarkan nama khadim rūhānī dengan metode yang hampir tiada satu kitab pun yang luput darinya, padahal metode yang tersebar di kitab-kitab pasaran itu adalah dusta, keliru, tidak memiliki dasar sama sekali, dan tidak ada sangkut pautnya dengan Ilmu Huruf; adapun metode yang benar adalah [ metode mengeluarkan nama khadim rūhānī dari nama Zaid ], dan tata caranya adalah sebagai berikut:\n[ ز ي د ] [Rajah Huruf — tidak diterjemahkan] = 3 huruf\n[ ز ا ي ي ا د ا ل ] [Rajah Huruf — tidak diterjemahkan] = 8 huruf (hasil uraian lafal)\n3 dikalikan 8 = 24, ditulis dengan huruf: [ ا ر ب ع ة و ع ش ر و ن ] [Rajah Huruf — tidak diterjemahkan] (arba'atun wa 'isyrūna); uraian ejaan huruf-hurufnya adalah seperti ini:\n[ ا ل ف ر ا ب ا ع ي ن ت ا و ا و ع ي ن ش ي ن ر ا و ا و ن و ن ] [Rajah Huruf — tidak diterjemahkan]. Kita hilangkan huruf-huruf mad-nya (yakni huruf mad di tengah ejaan huruf seperti [ ي ] pada [ ع ي ن / ش ي ن ] dan [ ا ] pada [ و ا و / ن و ن ]), sehingga menjadi:\n[ ا ل ف ر ا ب ا ع ن ت ا و و ع ن ش ن ر ا و و ن ن ] [Rajah Huruf — tidak diterjemahkan]. Lalu kita pungut huruf-hurufnya dengan hitungan kelipatan tiga (bit-tatslīts) dimulai dari huruf [ ف ] [Rajah Huruf — tidak diterjemahkan], sehingga menghasilkan:\n[ ف ا ا ن ا و ن ن ا و ن ] [Rajah Huruf — tidak diterjemahkan]. Kemudian kita hilangkan huruf-huruf yang berulang (izālatut-tikrār) dari deret huruf ini, sehingga tersisa:\n[ ف ا ن و ] [Rajah Huruf — tidak diterjemahkan]; inilah huruf-huruf khadim rūhānī untuk nama Zaid. Berdasarkan hal itu, maka nama khadim rūhānī-nya setelah ditambahkan akhiran [ آيِيل ] (āyīl) adalah: [ فَانَوَآيِيلُ ] (Fānawāyīlu).\nSemoga Allah memberikan manfaat kepadaku dan kepada kalian, membimbing kita menuju jalan kebenaran, serta menerangi kita dan kalian dengan cahaya-Nya; sesungguhnya Dia Mahakuasa atas segala sesuatu.", "syarah": "1. **Perbandingan Presisi Ekstraksi *Rūhānī* (Hal 61) vs *Suflī* (Hal 55) pada Nama `زَيْد`**:\n   Halaman 61 ini melengkapi pasangan rahasia yang telah disinggung Syeikh al-Basyir pada Halaman 55:\n   - **Persamaan Awal (Langkah 1–4)**:\n     - `ز ي د` = **3 huruf**; uraian lafalnya `ز ا ي ي ا د ا ل` = **8 huruf**.\n     - `3 × 8 = 24` (`ا ر ب ع ة و ع ش ر و ن`), diuraikan menjadi 28 huruf:\n       `ا ل ف | ر ا | ب ا | ع ي ن | ت ا | و ا و | ع ي ن | ش ي ن | ر ا | و ا و | ن و ن`.\n   - **Jalur *Rūhānī* (Halaman 61 ini)**:\n     1) **Buang huruf *madd* tengah** (`ي` pada `عين، عين، شين` dan `ا` tengah pada `واو، واو، نون`) → tersisa 23 huruf: `ا ل ف ر ا ب ا ع ن ت ا و و ع ن ش ن ر ا و و ن ن`.\n     2) **Pungut secara *tatslīts* mulai dari `ف`**: menghasilkan `ف ا ا ن ا و ن ن ا و ن`.\n     3) **Buang huruf berulang (*izālatut-tikrār*)**: tersisa 4 huruf murni **`[ ف ا ن و ]`**.\n     4) **Beri akhiran `آيِيل` langsung pada hurufnya**: **`[ فَانَوَآيِيلُ ]`** (*Fānawāyīlu*).\n   - **Jalur *Suflī* (Halaman 55)**:\n     1) Buang huruf berulang terlebih dahulu (`[ ا ل ف ر ب ع ي ن ت و ش ]`).\n     2) Pungut secara *tatslīts* (`[ ف ب ي ت ش ]`).\n     3) Jumlahkan nilai angkanya (`792`) lalu di-*istinthāq* (`[ ب ص ذ ]`) + `طَيْش` → **`[ بَصَذْ طَيْشٍ ]`**.", "khus": "1. **Koreksi atas Metode *Tak'īb* Pasaran**:\n   - Kitab-kitab hikmah pasaran umumnya hanya mengalikan nilai hisab nama × 3 atau mengurangi dengan 51 tanpa melalui tahapan *basthul-lafzh* dan *laqthut-tatslīts* huruf. Syeikh al-Basyir menegaskan bahwa metode *basth* dan *laqth* di Halaman 61 inilah sanad Ilmu Huruf yang sahih dalam melahirkan nama khadim *Rūhānī*."}, {"hal": "62", "title": "HALAMAN 62 — الْجَوَابُ الشَّافِي (١)", "imgs": ["hal_62.png"], "arab": "الْجَوَابُ الشَّافِي\n\nالسُّؤَالُ الْأَوَّلُ ، الْأَمْلَاكُ سَمْكَيَائِيلُ وَشَرَنْطَيَائِيلُ وَنُويَائِيلُ وَمِيطَطْرُونُ الَّتِي تُكْتَبُ عَلَى الزَّوَايَا فِي الْوَفْقِ الطَّبِيعِيِّ هَلْ تَمَّ اسْتِخْرَاجُهَا مِنَ الْوَفْقِ الطَّبِيعِيِّ وَلِمَاذَا لَا يَتِمُّ التَّوْكِيلُ إِلَّا بِسَمْكَيَائِيلَ وَنَوَائِيلَ ؟\nاعْلَمْ أَخِي أَنَّ مَا وَضَعُوهُ دَائِرًا بِالْوَفْقِ الطَّبِيعِيِّ وَجَعَلُوهُ مُوَكَّلًا بِالْأَعْمَالِ كُلِّهَا مَا هُوَ إِلَّا تَمْوِيهٌ كَيْ تَبْقَى الْحَقِيقَةُ ضَائِعَةً بَيْنَ السُّطُورِ ، وَالْأَمْلَاكُ الَّتِي وَضَعْتَهَا مِنْهَا اثْنَانِ مِنَ الْمُسْتَخْرَجَةِ مِنَ الْوَفْقِ الطَّبِيعِيِّ وَلَيْسَتِ الْإِشَارَةُ هُنَا إِلَى بطد زهج واح ، بَلْ إِلَى [ كصم عهق سيح ] وَلِلْوُقُوفِ عَلَيْهِ لَا بُدَّ مِنِ اتِّبَاعِ طَرِيقَةِ الْهَدْمِ وَالتَّجْذِيرِ وَإِثْبَاتِ الْأَعْشَارِ الْكَامِلَةِ لِكُلِّ بَيْتٍ مِنْهُ وَهَذَا مَا أَخْفَتْهُ الْحُكَمَاءُ لِأَنَّهَا مَبْدَأُ اسْتِخْرَاجِ الِاسْمِ الْعَظِيمِ الْأَعْظَمِ ، أَمَّا سَمْكَايِيلُ فَصَحِيحٌ وَنُويَايِيلُ فَلَيْسَ كَذَلِكَ إِذْ وَقَعَ فِيهِ تَحْرِيفٌ وَحَقِيقَتُهُ هِيَ [ نُوفَايِيلُ ] . أَمَّا الْمَلَكَيْنِ شَرَنْطَيَايِيلَ وَمِيطَطْرُونَ لَا عَلَاقَةَ لَنَا بِهِمْ وَلَا حَاجَةَ لَنَا بِهِمْ فِي عِلْمِ الْحَرْفِ وَالْأَوْفَاقِ ، وَمَا عَرَفْنَاهُ عَنْهُمَا أَنَّ لِكُلِّ وَاحِدٍ مِنْهُمَا أَقْسَامٌ زَاجِرَةٌ عَلَى خُدَّامِ الدَّعَوَاتِ وَالِاسْتِخْدَامَاتِ وَمَا وَقَفْنَا لَهُمَا عَنْ طَرِيقَةٍ لَهُمَا فِي الْأَوْفَاقِ ، لِأَنَّ الْأَوْفَاقَ مُسْتَقِلَّةٌ بِنَفْسِهَا وَلَهَا دَوَائِرُهَا الَّتِي لَا يُمْكِنُ أَنْ يَتَعَدَّاهَا أَيُّ مُشْتَغِلٍ بِهَذَا الْعِلْمِ ، أَمَّا الْأَمْلَاكُ الرُّوحَانِيَّةُ الِاثْنَا عَشَرَ فَهِيَ مِنْ خُدَّامِ الْوَفْقِ وَلَهَا نُفُوذُهَا فِيهِ لِمَنْ أَطْلَعَهُ اللهُ عَلَى سِرِّهَا", "latin": "Al-jawābusy-syāfī.\n\nAs-su'ālul-awwalu, al-amlāku Samkayā'īlu wa Syaranthayā'īlu wa Nūyā'īlu wa Mīthathrūnu al-latī tuktabu 'alaz-zawāyā fil-wafqith-thabī'iyyi hal tamma-stikhrājuhā minal-wafqith-thabī'iyyi wa limādzā lā yatimmut-taukīlu illā bi-Samkayā'īla wa Nawā'īla?\nI'lam akhī anna mā wadha'ūhu dā'iran bil-wafqith-thabī'iyyi wa ja'alūhu muwakkalan bil-a'māli kullihā mā huwa illā tamwīhun kai tabqal-haqīqatu dhā'i'atan bainas-suthūri, wal-amlākul-latī wadha'tahā minhā-tsnāni minal-mustakhrajati minal-wafqith-thabī'iyyi wa laisatil-isyāratu hunā ilā [ بطد زهج واح ] , bal ilā [ كصم عهق سيح ] wa lil-wuqūfi 'alaihi lā budda mini-ttibā'i tharīqatil-hadmi wat-tajdzīri wa itsbātil-a'syāril-kāmilati likulli baitin minhu wa hādzā mā akhfathul-hukamā'u li-annahā mabda'u-stikhrājil-Ismil-'Azhīmil-A'zhami, ammā Samkāyīlu fashahīhun wa Nūyāyīlu falaisa kadzālika idz waqa'a fīhi tahrīfun wa haqīqatuhū hiya [ Nūfāyīlu ]. Ammal-malakaini Syaranthayāyīla wa Mīthathrūna lā 'alāqata lanā bihim wa lā hājata lanā bihim fī 'ilmil-harfi wal-aufāqi, wa mā 'arafnāhu 'anhumā anna likulli wāhidin minhumā aqsāmun zājiratun 'alā khuddāmid-da'awāti wal-istikhdamāti wa mā waqafnā lahumā 'an tharīqatin lahumā fil-aufāqi, li-annal-aufāqa mustaqillatun binafsihā wa lahā dawā'iruhal-latī lā yumkinu an yata'addāhā ayyu musytaghilin bihādzal-'ilmi, ammal-amlākur-rūhāniyyatul-itsnā 'asyara fahiya min khuddāmil-wafqi wa lahā nufūdzuhā fīhi liman athla'ahullāhu 'alā sirrihā.", "terj": "Jawaban yang memuaskan (menyembuhkan keraguan).\n\nPertanyaan Pertama: Nama-nama malaikat Samkayā'īl, Syaranthayā'īl, Nūyā'īl, dan Mīthathrūn yang biasa ditulis pada keempat sudut di dalam Wafaq Thabī'ī (3×3 alami), apakah nama-nama tersebut memang dikeluarkan (diekstraksi) dari Wafaq Thabī'ī itu, dan mengapa taukil (penugasan wafaq) tidak sempurna kecuali dengan menyebut Samkayā'īl dan Nawā'īl?\nKetahuilah wahai saudaraku, bahwa apa yang mereka letakkan mengelilingi Wafaq Thabī'ī dan mereka jadikan seolah-olah sebagai khadim yang ditugaskan atas seluruh amalan wafaq itu tiada lain hanyalah pengaburan (tamwīh) agar hakikat yang sebenarnya tetap hilang tersembunyi di balik baris-baris tulisan! Adapun nama-nama malaikat yang engkau sebutkan itu, hanya dua di antaranya yang memang dikeluarkan dari Wafaq Thabī'ī; namun yang dimaksud dengan Wafaq Thabī'ī di sini bukanlah susunan [ بطد زهج واح ] [Rajah Huruf — tidak diterjemahkan], melainkan susunan [ كصم عهق سيح ] [Rajah Huruf — tidak diterjemahkan]! Untuk dapat memahaminya, seseorang wajib mengikuti metode peruntuhan (al-hadm), penarikan akar (at-tajdzīr), dan penetapan puluhan sempurna (itsbātul-a'syāril-kāmilah) bagi setiap kamar darinya; dan inilah rahasia yang disembunyikan oleh para ahli hikmah (al-hukamā') karena ia merupakan prinsip dasar untuk mengeluarkan Ismul-'Azhīmul-A'zham (Nama Allah Yang Maha Agung). Adapun nama Samkāyīl (سَمْكَايِيلُ), maka ia memang benar; sedangkan nama Nūyāyīl (نُويَايِيلُ) tidaklah demikian karena telah terjadi perubahan huruf (tahrīf) di dalamnya, dan nama yang sebenarnya adalah [ نُوفَايِيلُ ] (Nūfāyīlu)! Adapun dua malaikat lainnya, yaitu Syaranthayāyīl dan Mīthathrūn, maka kita sama sekali tidak memiliki keterkaitan dan tidak memiliki keperluan dengan keduanya di dalam Ilmu Huruf dan Wafaq. Apa yang kami ketahui tentang keduanya hanyalah bahwa masing-masing dari keduanya memiliki qasam-qasam penunduk (aqsām zājirah) atas para khadim doa-doa (da'awāt) dan istikhdāmāt, dan kami tidak pernah mendapati adanya metode khusus bagi keduanya di dalam ilmu wafaq; karena ilmu wafaq itu berdiri sendiri secara mandiri serta memiliki lingkaran-lingkaran hukumnya sendiri yang tidak mungkin dilampaui oleh siapa pun yang berkecimpung di dalam ilmu ini. Adapun dua belas malaikat rūhāniyyah (al-amlākur-rūhāniyyatul-itsnā 'asyar), maka mereka memang termasuk para khadim wafaq dan memiliki daya pengaruh di dalamnya bagi siapa saja yang diperlihatkan oleh Allah atas rahasianya.", "syarah": "1. **Tiga Rahasia Besar yang Disingkap Syeikh al-Basyir pada Halaman 62**:\n   - **Rahasia 1 — Wafaq Thabī'ī Martabat Puluhan `[ كصم عهق سيح ]`**:\n     - Jika Wafaq Musallas satuan adalah `[ بطد زهج واح ]` (`2-9-4 / 7-5-3 / 6-1-8`, konstanta **15**), maka Wafaq Musallas martabat puluhan-ratusannya (*al-a'syār*) adalah **`[ كصم عهق سيح ]`**:\n       - Baris 1: `ك (20) | ص (90) | م (40)` = **150**\n       - Baris 2: `ع (70) | ه (5) / ن (50) | ق (100) / ل (30)`\n       - Dari ekstraksi kamar-kamar `[ كصم عهق سيح ]` inilah lahir nama malaikat **`سَمْكَايِيلُ`** (`س [60] + م [40] + ك [20]`) dan **`نُوفَايِيلُ`** (`ن [50] + و [6] + ف [80]`)!\n   - **Rahasia 2 — Koreksi *Tahrīf* Nama `نُويَايِيلُ` Menjadi `[ نُوفَايِيلُ ]`**:\n     - Banyak penyalin kitab salah membaca titik huruf *Fā'* (`ف`) menjadi *Yā'* (`ي`) sehingga menulis `نويائيل` (*Nūyā'īl*) atau `نوائيل` (*Nawā'īl*). Syeikh al-Basyir membuktikan dari hisab hurufnya bahwa nama yang sahih adalah **`[ نُوفَايِيلُ ]`** (*Nūfāyīlu*).\n   - **Rahasia 3 — Pemisahan Tegas antara Ilmu *Da'awāt/Istikhdāmāt* dan Ilmu *Aufāq***:\n     - Nama `شَرَنْطَيَائِيلُ` dan `مِيطَطْرُونُ` adalah penguasa *aqsām zājirah* dalam ilmu *da'awāt*, bukan hasil ekstraksi matematis dari matriks Wafaq Musallas.", "khus": "1. **Ketepatan Penulisan Taukil Wafaq Musallas**:\n   - Ketika menuliskan malaikat penjaga Wafaq Musallas dari jalur `[ كصم عهق سيح ]`, gunakan ejaan yang sahih **`سَمْكَايِيلُ`** dan **`نُوفَايِيلُ`** (bukan `نويائيل`)."}, {"hal": "63", "title": "HALAMAN 63 — الْجَوَابُ الشَّافِي (٢)", "imgs": ["hal_63.png"], "arab": "الْجَوَابُ الشَّافِي\n\nالسُّؤَالُ الثَّانِي ، جِبْرَائِيلُ وَعَزْرَائِيلُ وَمِيكَائِيلُ وَإِسْرَافِيلُ عَلَيْهِمُ السَّلَامُ مَلَائِكَةُ الْأَرْكَانِ هَلْ تَمَّ اسْتِخْرَاجُهُمْ مِنَ الْمُثَلَّثِ ؟\nأَوَّلًا الْمَلَائِكَةُ خَلْقٌ مِنْ خَلْقِ اللهِ عَزَّ وَجَلَّ لَا يَعْلَمُ عَدَدَهُمْ وَلَا يُحْصِيهِمْ إِلَّا هُوَ سُبْحَانَهُ ، وَقَدْ وَرَدَ فِي السُّنَّةِ بَيَانُ أَنَّهُمْ خُلِقُوا مِنْ نُورٍ كَمَا جَاءَ الْقَوْلُ الْفَصِيحُ أَنَّ الْجَانَّ خُلِقَتْ مِنْ مَارِجٍ مِنْ نَارٍ ، وَكَمَا قَالَ رَسُولُ اللهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ ، [ خُلِقَتِ الْمَلَائِكَةُ مِنْ نُورٍ وَخُلِقَ الْجَانُّ مِنْ مَارِجٍ مِنْ نَارٍ وَخُلِقَ آدَمُ مِمَّا وُصِفَ لَكُمْ ] وَقَدْ ثَبَتَ فِي السُّنَّةِ أَنَّ جِبْرِيلَ عَلَيْهِ السَّلَامُ لَهُ سِتُّمِائَةِ جَنَاحٍ وَقَدْ رَآهُ رَسُولُ اللهِ مَرَّتَيْنِ عَلَى هَيْئَتِهِ الَّتِي خَلَقَهُ اللهُ عَلَيْهَا مَرَّةً عِنْدَ سِدْرَةِ الْمُنْتَهَى وَمَرَّةً فِي الْأَرْضِ وَقَدْ سَدَّ الْأُفُقَ لِضَخَامَةِ حَجْمِهِ ، وَبِقُدْرَةِ اللهِ عَزَّ وَجَلَّ يَتَحَوَّلُ مِنْ هَذِهِ الْعَظَمَةِ إِلَى صُورَةِ إِنْسَانٍ وَهَذَا وَارِدٌ فِي الْأَحَادِيثِ الشَّرِيفَةِ ، فَسُبْحَانَ اللهِ إِنَّهُ عَلَى كُلِّ شَيْءٍ قَدِيرٌ ، نَأْتِي إِلَى الْإِيمَانِ بِالْمَلَائِكَةِ إِذْ وَجَبَ عَلَيْنَا الْإِيمَانُ بِمَنْ نَعْرِفُهُ بِاسْمِهِ وَمَنْ لَا نَعْرِفُهُ بِاسْمِهِ ، وَالثَّابِتُ بِاسْمِهِ [ جِبْرِيلُ وَمِيكَائِيلُ وَإِسْرَافِيلُ وَمَالِكٌ خَازِنُ النَّارِ ] وَاشْتُهِرَ أَنَّ خَازِنَ الْجَنَّةِ اسْمُهُ رِضْوَانُ وَمَلَكَ الْمَوْتِ اسْمُهُ عَزْرَائِيلُ وَلَا أَعْرِفُ شَيْئًا ثَابِتًا فِي ذَلِكَ وَالَّذِي ثَبَتَ فِي كِتَابِ اللهِ وَسُنَّةِ رَسُولِهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ هُمْ جِبْرِيلُ وَمِيكَائِيلُ وَإِسْرَافِيلُ وَمَالِكٌ خَازِنُ النَّارِ لَكِنْ وَجَبَ عَلَيْنَا الْإِيمَانُ بِمَنْ ذُكِرَ بِاسْمِهِ وَمَنْ لَمْ يُذْكَرِ اسْمُهُ ، وَكَذَلِكَ بِأَعْمَالِهِمُ الَّتِي كُلِّفُوا بِهَا ، وَوَرَدَ بَيَانٌ كَثِيرٌ فِي أَعْمَالِهِمْ فَمِنْهُمْ مُوَكَّلٌ بِالْوَحْيِ وَمِنْهُمْ مُوَكَّلٌ بِالْقَطْرِ وَمِنْهُمْ مُوَكَّلٌ بِالْمَوْتِ وَمِنْهُمْ مُوَكَّلٌ بِالْجِبَالِ وَمِنْهُمْ مُوَكَّلٌ بِالْأَرْحَامِ وَمِنْهُمْ مُوَكَّلٌ بِالْجَنَّةِ وَمِنْهُمْ مُوَكَّلٌ بِالنَّارِ إِلَى غَيْرِ ذَلِكَ مِنَ الْأَعْمَالِ وَهُمْ كَثْرَةٌ لَا يَعْلَمُ عَدَدَهُمْ إِلَّا اللهُ وَالدَّلِيلُ عَلَى كَثْرَتِهِمْ مَا جَاءَ عَنِ النَّبِيِّ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ [ مَا مِنْكُمْ مِنْ أَحَدٍ إِلَّا وَلَهُ قَرِينٌ مِنَ الْجِنِّ وَقَرِينٌ مِنَ الْمَلَائِكَةِ ] وَكَمَا جَاءَ عَنْهُ عَلَيْهِ الصَّلَاةُ وَالسَّلَامُ فِي خَبَرِ الْبَيْتِ الْمَعْمُورِ الَّذِي هُوَ فِي السَّمَاءِ السَّابِعَةِ فَوْقَ الْكَعْبَةِ الْمُشَرَّفَةِ يَدْخُلُهُ كُلَّ يَوْمٍ سَبْعُونَ أَلْفَ مَلَكٍ وَلَا يَعُودُ إِلَيْهِ وَهَذَا دَلِيلٌ قَاطِعٌ عَلَى كَثْرَةِ عَدَدِ الْمَلَائِكَةِ ، وَالْمَعْلُومُ عِنْدَنَا أَنَّ جِبْرِيلَ مُكَلَّفٌ بِالْوَحْيِ وَمِيكَائِيلَ مُكَلَّفٌ بِالْقَطْرِ وَإِسْرَافِيلَ مُكَلَّفٌ بِالنَّفْخِ فِي الصُّورِ وَمَالِكًا خَازِنَ النَّارِ وَمَلَكَ الْمَوْتِ مُكَلَّفٌ بِقَبْضِ الْأَرْوَاحِ ، وَعَلَيْهِ يَكُونُ الْجَوَابُ الشَّافِي أَنَّ هَؤُلَاءِ الْمَلَائِكَةَ عَلَيْهِمُ السَّلَامُ لَمْ يُسْتَخْرَجُوا مِنْ أَيِّ وَفْقٍ وَلَا عَلَاقَةَ لِأَيِّ وَفْقٍ بِهِمْ ، إِنَّمَا النَّاسُ تَأْخُذُ مَا هُوَ مَخْطُوطٌ بِأَقْلَامِ التَّمْوِيهِ ، فَإِنْ قَرَأَ أَحَدُكُمْ مَرَّةً أُخْرَى [ بَيْتَ جِبْرِيلَ فَهُوَ إِشَارَةٌ إِلَى أَنَّ ذَلِكَ الْبَيْتَ يَخْرُجُ مِنْهُ الرُّوحَانِيُّ الْمُكَلَّفُ بِجَلْبِ الْأَخْبَارِ ،،، إِلَخْ ]", "latin": "Al-jawābusy-syāfī.\n\nAs-su'āluts-tsānī, Jibrā'īlu wa 'Azrā'īlu wa Mīkā'īlu wa Isrāfīlu 'alaihimus-salāmu malā'ikatul-arkāni hal tamma-stikhrājuhum minal-mutsallatsi?\nAwwalanil-malā'ikatu khalqun min khalqillāhi 'Azza wa Jalla lā ya'lamu 'adadahum wa lā yuhshīhim illā Huwa Subhānahū, wa qad warada fis-sunnati bayānu annahum khuliqū min nūrin kamā jā'al-qaulul-fashīhu annal-jānna khuliqat min mārijin min nārin, wa kamā qāla Rasūlullāhi shallallāhu 'alaihi wa sallama, [ Khuliqatil-malā'ikatu min nūrin wa khuliqal-jānnu min mārijin min nārin wa khuliqa Ādamu mimmā wushifa lakum ] wa qad tsabata fis-sunnati anna Jibrīla 'alaihis-salāmu lahū sittumi'ati janāhin wa qad ra'āhu Rasūlullāhi marrataini 'alā hai'atihil-latī khalaqahullāhu 'alaihā marratan 'inda Sidratil-Muntahā wa marratan fil-ardhi wa qad saddal-ufuqa lidhakhāmati hajmihī, wa biqudratillāhi 'Azza wa Jalla yatahawwalu min hādzihil-'azhamati ilā shūrati insānin wa hādzā wāridun fil-ahādītsisy-syarīfati, fasubhānallāhi innahū 'alā kulli syai'in qadīrun, na'tī ilal-īmāni bil-malā'ikati idz wajaba 'alainal-īmānu biman na'rifuhū bismihī wa man lā na'rifuhū bismihī, wats-tsābitu bismihī [ Jibrīlu wa Mīkā'īlu wa Isrāfīlu wa Mālikun khāzinun-nāri ] wasytuhira anna khāzinal-jannati ismuhū Ridhwānu wa malakal-mauti ismuhū 'Azrā'īlu wa lā a'rifu syai'an tsābitan fī dzālika wal-ladzī tsabata fī kitābillāhi wa sunnati Rasūlihī shallallāhu 'alaihi wa sallama hum Jibrīlu wa Mīkā'īlu wa Isrāfīlu wa Mālikun khāzinun-nāri lakin wajaba 'alainal-īmānu biman dzukira bismihī wa man lam yudzkar-ismuhū, wa kadzālika bi-a'mālihimul-latī kullifū bihā, wa warada bayānun katsīrun fī a'mālihim faminhum muwakkalun bil-wahyi wa minhum muwakkalun bil-qathri wa minhum muwakkalun bil-mauti wa minhum muwakkalun bil-jibāli wa minhum muwakkalun bil-arhāmi wa minhum muwakkalun bil-jannati wa minhum muwakkalun bin-nāri ilā ghairi dzālika minal-a'māli wa hum katsratun lā ya'lamu 'adadahum illallāhu wad-dalīlu 'alā katsratihim mā jā'a 'anin-Nabiyyi shallallāhu 'alaihi wa sallama [ Mā minkum min ahadin illā wa lahū qarīnun minal-jinni wa qarīnun minal-malā'ikati ] wa kamā jā'a 'anhu 'alaihis-shalātu was-salāmu fī khabaril-Baitil-Ma'mūril-ladzī huwa fis-samā'is-sābi'ati fauqal-Ka'batil-musyarrafati yadkhuluhū kulla yaumin sab'ūna alfa malakin wa lā ya'ūdu ilaihi wa hādzā dalīlun qāthi'un 'alā katsrati 'adadil-malā'ikati, wal-ma'lūmu 'indanā anna Jibrīla mukallafun bil-wahyi wa Mīkā'īla mukallafun bil-qathri wa Isrāfīla mukallafun bin-nafkhi fish-shūri wa Mālikan khāzinan-nāri wa malakal-mauti mukallafun biqabdhil-arwāhi, wa 'alaihi yakūnul-jawābusy-syāfī anna hā'ulā'il-malā'ikata 'alaihimus-salāmu lam yustakhrajū min ayyi wafqin wa lā 'alāqata li-ayyi wafqin bihim, innamān-nāsu ta'khudzu mā huwa makhthūthun bi-aqlāmit-tamwīhi, fa-in qara'a ahadukum marratan ukhrā [ baita Jibrīla fahuwa isyāratun ilā anna dzālikal-baita yakhruju minhur-rūhāniyyul-mukallafu bijalbil-akhbāri... ilakh ].", "terj": "Jawaban yang memuaskan (menyembuhkan keraguan).\n\nPertanyaan Kedua: Apakah Malaikat Jibrā'īl, 'Azrā'īl, Mīkā'īl, dan Isrāfīl 'alaihimus-salām (yang sering ditulis di keempat penjuru sebagai malā'ikatul-arkān) memang dikeluarkan (diekstraksi) dari Wafaq Musallas (3×3)?\nPertama-tama: Malaikat adalah salah satu makhluk ciptaan Allah 'Azza wa Jalla yang tidak ada seorang pun yang mengetahui jumlah mereka dan tidak ada yang mampu menghitungnya selain Dia Subhanahu wa Ta'ala. Telah disebutkan penjelasannya di dalam As-Sunnah bahwa mereka diciptakan dari cahaya, sebagaimana telah datang pula sabda yang fasih bahwa jin diciptakan dari nyala api yang membara; yakni sebagaimana sabda Rasulullah shallallahu 'alaihi wa sallam: [ \"Malaikat itu diciptakan dari cahaya, jin diciptakan dari nyala api yang membara, dan Adam diciptakan dari apa yang telah dijelaskan kepada kalian (yakni tanah)\" — HR. Muslim ]. Dan sungguh telah tetap di dalam As-Sunnah bahwa Malaikat Jibril 'alaihis-salām memiliki enam ratus sayap, dan Rasulullah shallallahu 'alaihi wa sallam telah melihatnya dua kali dalam wujud aslinya sebagaimana Allah menciptakannya: sekali di dekat Sidratul-Muntaha dan sekali di bumi dalam keadaan menutup seluruh ufuk langit karena begitu besar ukuran tubuhnya; dan dengan kekuasaan Allah 'Azza wa Jalla, ia dapat berubah wujud dari keagungan tersebut menjadi rupa seorang manusia sebagaimana tercantum di dalam hadis-hadis yang mulia — maka Mahasuci Allah, sesungguhnya Dia Mahakuasa atas segala sesuatu. Selanjutnya kita beralih pada kewajiban beriman kepada para malaikat: wajib atas kita beriman kepada malaikat yang kita ketahui namanya maupun yang tidak kita ketahui namanya. Adapun malaikat yang telah tetap (sahih) penyebutan namanya adalah: [ Jibril, Mikail, Israfil, dan Malik penjaga neraka ]. Adapun yang masyhur di kalangan manusia bahwa penjaga surga namanya adalah Ridhwan dan malaikat maut namanya adalah 'Azra'il, maka aku tidak mengetahui adanya dalil yang sahih (tsābit) tentang penamaan tersebut; karena yang tetap di dalam Kitab Allah dan Sunnah Rasul-Nya shallallahu 'alaihi wa sallam hanyalah Jibril, Mikail, Israfil, dan Malik penjaga neraka. Kendati demikian, wajib atas kita mengimani malaikat yang disebutkan namanya maupun yang tidak disebutkan namanya, serta mengimani tugas-tugas yang dibebankan kepada mereka. Telah banyak penjelasan yang datang mengenai tugas-tugas mereka: di antara mereka ada yang ditugaskan menyampaikan wahyu, ada yang ditugaskan mengatur tetesan hujan, ada yang ditugaskan mencabut nyawa, ada yang ditugaskan menjaga gunung-gunung, ada yang ditugaskan menjaga rahim-rahim, ada yang ditugaskan menjaga surga, dan ada yang ditugaskan menjaga neraka, hingga berbagai tugas lainnya; jumlah mereka sangatlah banyak dan tiada yang mengetahui bilangan mereka selain Allah. Dalil atas banyaknya jumlah mereka adalah sabda Nabi shallallahu 'alaihi wa sallam: [ \"Tidaklah ada seorang pun di antara kalian melainkan telah ditetapkan baginya satu pendamping (qarīn) dari golongan jin dan satu pendamping (qarīn) dari golongan malaikat\" — HR. Muslim ]. Demikian pula sebagaimana diriwayatkan dari beliau 'alaihis-shalātu was-salām dalam hadis tentang Baitul-Ma'mūr yang berada di langit ketujuh tepat di atas Ka'bah yang mulia: setiap harinya masuk ke dalamnya tujuh puluh ribu malaikat dan mereka tidak pernah kembali lagi kepadanya (selamanya); ini adalah bukti yang pasti atas betapa banyaknya jumlah malaikat. Dan telah dimaklumi di sisi kita bahwa Jibril ditugaskan menyampaikan wahyu, Mikail ditugaskan mengatur hujan dan tumbuh-tumbuhan, Israfil ditugaskan meniup sangkakala, Malik sebagai penjaga neraka, dan Malaikat Maut ditugaskan mencabut nyawa. Berdasarkan hal itu semua, maka jawaban yang memuaskan (al-jawābusy-syāfī) adalah: sesungguhnya para malaikat agung tersebut ('alaihimus-salām) **sama sekali tidak dikeluarkan (diekstraksi) dari wafaq mana pun, dan tidak ada keterkaitan wafaq mana pun dengan mereka!** Hanya saja kebanyakan manusia menelan mentah-mentah apa yang ditulis dengan pena-pena pengaburan (aqlāmut-tamwīh). Maka apabila di kemudian hari salah seorang dari kalian membaca istilah [ \"Kamar Jibril\" (Baitu Jibrīl) di dalam kitab wafaq, ketahuilah bahwa itu hanyalah isyarat simbolis bahwa dari kamar tersebut dikeluarkan nama khadim rūhānī yang bertugas mendatangkan kabar/berita (jalbul-akhbār)... dan demikian seterusnya ].", "syarah": "1. **Penjelasan Akidah & Rahasia Istilah *Baitu Jibrīl* dalam Ilmu Wafaq**:\n   - Syeikh al-Basyir menegaskan akidah Ahlussunnah wal-Jama'ah tentang kemuliaan para Malaikat Muqarrabīn (*Jibrīl, Mīkā'īl, Isrāfīl, Mālik*, dan *Malakul-Maut*) serta meluruskan kesalahpahaman besar: nama-nama malaikat agung tersebut **bukanlah hasil hitungan wafaq dan tidak tunduk pada taukil wafaq manusia**.\n   - Adapun istilah para ahli hikmah yang menamai empat sisi wafaq atau kamar tertentu dengan sebutan *\"Baitu Jibrīl\"*, *\"Baitu Mīkā'īl\"*, *\"Baitu Isrāfīl\"*, atau *\"Baitu 'Azrā'īl\"* hanyalah **kode simbolis (*tamwīh / isyārah*)** terhadap **jenis fungsi khadim rūhānī** yang diekstraksi dari kamar tersebut:\n     - *Baitu Jibrīl* = kamar tempat mengekstraksi khadim rūhānī untuk fungsi **mendatangkan berita/kasyf (*jalbul-akhbār*)**, karena tugas Jibril adalah membawa wahyu/berita langit.\n     - *Baitu Mīkā'īl* = kamar untuk fungsi **keluasan rezeki (*jalbur-rizq*)**, karena tugas Mikail mengatur hujan dan rezeki.", "khus": "1. **Adab terhadap Malaikat Muqarrabīn**:\n   - Seorang pengamal ilmu hikmah tidak boleh menjadikan nama Jibril, Mikail, Israfil, dan Malakul-Maut sebagai objek perintah (*taukīl/zajr*) di dalam wafaq, melainkan memohon kepada Allah Ta'ala dan memahami istilah *\"Baitu Jibrīl\"* semata-mata sebagai petunjuk letak kamar ekstraksi khadim pembawa kabar."}, {"hal": "64", "title": "HALAMAN 64 — الْجَوَابُ الشَّافِي (٣)", "imgs": ["hal_64.png"], "arab": "الْجَوَابُ الشَّافِي\n\nالسُّؤَالُ الثَّالِثُ ، جِبْرَائِيلُ عَلَيْهِ السَّلَامُ رَغْمَ أَنَّهُ مِنَ الْمَلَائِكَةِ الْمُقَرَّبِينَ لِمَاذَا حُرُوفُهُ الْأُولَى (ج ، ب) حُرُوفٌ ظُلْمَانِيَّةٌ ؟\nنَعَمْ أَخِي فِي اللهِ لَا تُقَارِنْ بِمَنْ سَمَّاهُ اللهُ عَزَّ وَجَلَّ وَبِمَا نَفْعَلُهُ نَحْنُ بِحُرُوفِ الرُّوحَانِيِّ فَالْقَاعِدَةُ الَّتِي نَعْمَلُ عَلَيْهَا لِضَبْطِ حُرُوفِ الرُّوحَانِيِّ لِتَبْقَى حُرُوفُهُ نُورَانِيَّةً فِيهَا عَمَلَانِ ، الْأَوَّلُ نُحَقِّقُ حُرُوفَهُ النُّورَانِيَّةَ لِتَكُونَ مُحْرِقَةً عَلَى خَادِمِهِ ، وَالثَّانِي كَيْ لَا نَخْرُجَ عَنْ دَائِرَةِ الْأَرْوَاحِ الرُّوحَانِيَّةِ الْمُكَلَّفَةِ بِالْأَعْمَالِ الَّتِي يَكُونُ الْبَشَرُ سَبَبًا فِي حُصُولِهَا ، لِأَنَّهُ لَا يَجِبُ أَنْ نَتَجَاوَزَ الْحَدَّ الْمَسْمُوحَ لَنَا بِهِ لِأَنَّ عَقْلَنَا لَا يُطِيقُ ذَلِكَ ، فَرَحْمَةً مِنَ اللهِ بِنَا سَخَّرَ لَنَا هَذَا الْعِلْمَ فِي حُدُودِ قُدُرَاتِنَا ،\nوَ [ ج ب ] حَرْفَانِ ظُلْمَانِيَّانِ عُلْوِيَّانِ وَكَذَلِكَ حَرْفُ [ د ] مِنِ اسْمِ مُحَمَّدٍ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ حَرْفٌ ظُلْمَانِيٌّ عُلْوِيٌّ .\nأَمَّا بِخُصُوصِ الْقَوَاعِدِ الْحَرْفِيَّةِ فَمُعْظَمُهَا مَخْفِيٌّ وَحَتَّى وَإِنْ وَجَدْتَ قَاعِدَةً فِي كِتَابٍ تَجِدُهَا غَيْرَ تَامَّةٍ أَوْ مُحَرَّفَةً وَكُلٌّ مِنْكُمْ سَيَقُولُ لِمَاذَا فَعَلُوا هَذَا فَأَقُولُ لَكُمْ قَوْلًا صَادِقًا لَوْ لَمْ يَفْعَلُوا ذَلِكَ لَكُنَّا الْيَوْمَ نُحَارِبُ بَعْضُنَا الْبَعْضَ بِسِلَاحٍ لَا عِلَاجَ لَهُ إِلَّا مَنْ شَفَاهُ اللهُ عَزَّ وَجَلَّ فَسُبْحَانَ مَنْ وَضَعَ فِي حُرُوفِ كِتَابِهِ هَذِهِ الْقُدْرَةَ الْخَارِقَةَ بِإِذْنِهِ سُبْحَانَهُ مَا أَعْظَمَ شَأْنَهُ . وَأَوَدُّ التَّنْبِيهَ لِأُمُورٍ انْتَشَرَتْ فِي كُتُبِ الْقَوْمِ كُلُّ مَنْ قَالَ خُذِ اسْمًا مِنْ أَسْمَاءِ اللهِ وَكَسِّرْهَا فَقَدْ حَرَّفَ أَسْمَاءَ اللهِ عَزَّ وَجَلَّ وَكُلُّ مَنْ قَالَ خُذْ آيَةً وَكَسِّرْهَا فَقَدْ حَرَّفَ كَلَامَ اللهِ ، فَالْقَوَاعِدُ فِي حِسَابِ الْآيَةِ وَالْأَسْمَاءِ الْحُسْنَى مُخْتَلِفَةٌ تَمَامًا وَلَهَا طُرُقٌ خَاصَّةٌ بِهَا وَهِيَ فِي مَرْتَبَةٍ تُسَمَّى مَرْتَبَةَ الِاتِّصَالِ الْكَوْنِيِّ . فَالْأَسْرَارُ كُلُّهَا دَاخِلَ الْحُرُوفِ ٢٨ ، نَسْأَلُ اللهَ عَزَّ وَجَلَّ أَنْ يُعِينَنَا عَلَى الْأَخْذِ بِيَدِكُمْ حَتَّى يَتَّضِحَ لَكُمُ الْأَمْرُ وَكُلُّ مَا أَطْلُبُهُ مِنْكُمْ تَحْكِيمُ عُقُولِكُمْ وَقَارِنُوا بِالْعَقْلِ وَتَفَطَّنُوا بِمَا نَذْكُرُهُ وَنَضَعُهُ مِنْ قَوَاعِدَ فَإِنْ كُنْتُ قَدْ كَسَرْتُ سُنَّةَ الْمُتَعَاقِدِينَ عَلَى كَتْمِ هَذَا الْعِلْمِ فَلَنْ أَكْسِرَ كَلَامَ اللهِ عَزَّ وَجَلَّ ، الَّذِي أَنْزَلَهُ فِي كِتَابِهِ [ يُؤْتِي الْحِكْمَةَ مَنْ يَشَاءُ ] إِذْ لَا يَجُوزُ أَنْ أَتَعَدَّى هَذِهِ الْحُدُودَ وَسَنَضَعُ الْقَوَاعِدَ وَنَضَعُ أَمْثِلَةً جَمَّةً وَنُكْمِلُ بِالْإشَارَةِ فَاسْتَعِينُوا عَلَى أُمُورِكُمْ بِالِاسْتِغْفَارِ وَالصَّلَاةِ عَلَى رَسُولِ اللهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ حَتَّى يَفْتَحَ اللهُ لَكُمْ فَهُوَ الْفَتَّاحُ الْعَلِيمُ .", "latin": "Al-jawābusy-syāfī.\n\nAs-su'āluts-tsālitsu, Jibrā'īlu 'alaihis-salāmu raghma annahū minal-malā'ikatil-muqarrabīna limādzā hurūfuhul-ūlā [ ج ، ب ] hurūfun zhulmāniyyatun?\nNa'am akhī fillāhi lā tuqārin biman sammāhullāhu 'Azza wa Jalla wa bimā naf'aluhū nahnu bihurūfir-rūhāniyyi fal-qā'idatul-latī na'malu 'alaihā lidhabthi hurūfir-rūhāniyyi litabqā hurūfuhū nūrāniyyatan fīhā 'amalāni, al-awwalu nuhaqqiqu hurūfahun-nūrāniyyata litakūna muhriqatan 'alā khādimihī, wats-tsānī kai lā nakhruja 'an dā'iratil-arwāhir-rūhāniyyatil-mukallafati bil-a'mālil-latī yakūnul-basyaru sababan fī hushūlihā, li'annahū lā yajibu an natajāwazal-haddal-masmūha lanā bihī li'anna 'aqlanā lā yuthīqu dzālika, farahmatan minallāhi binā sakhkhara lanā hādzal-'ilma fī hudūdi qudurātinā,\nwa [ ج ب ] harfāni zhulmāniyyāni 'ulwiyyāni wa kadzālika harfu [ د ] min-ismi Muhammadin shallallāhu 'alaihi wa sallama harfun zhulmāniyyun 'ulwiyyun.\nAmmā bikhushūshil-qawā'idil-harfiyyati famu'zhamuhā makhfiyyun wa hattā wa in wajadta qā'idatan fī kitābin tajiduhā ghaira tāmmatin au muharrafatan wa kullun minkum sayaqūlu limādzā fa'alū hādzā fa'aqūlu lakum qaulan shādiqan lau lam yaf'alū dzālika lakunnāl-yauma nuhāribu ba'dhunāl-ba'dha bisilāhin lā 'ilāja lahū illā man syafāhullāhu 'Azza wa Jalla fasubhāna man wadha'a fī hurūfi kitābihī hādzihil-qudratal-khāriqata bi'idznihī Subhānahū mā a'zhama sya'nahū. Wa awaddut-tanbīha li'umūrin-tasyarat fī kutubil-qaumi kullu man qāla khudz-isman min asmā'illāhi wa kassirhā faqad harrafa asmā'allāhi 'Azza wa Jalla wa kullu man qāla khudz āyatan wa kassirhā faqad harrafa kalāmallāhi, fal-qawā'idu fī hisābil-āyati wal-asmā'il-husnā mukhtalifatun tamāman wa lahā thuruqun khāshshatun bihā wa hiya fī martabatin tusammā martabatal-ittishālil-kauniyyi. Fal-asrāru kulluhā dākhilal-hurūfi 28, nas'alullāha 'Azza wa Jalla an yu'īnanā 'alāl-akhdzi biyadikum hattā yattadhiha lakumul-amru wa kullu mā athlubuhū minkum tahkīmu 'uqūlikum wa qārinū bil-'aqli wa tafaththanū bimā nadzkuruhū wa nadha'uhū min qawā'ida fa'in kuntu qad kasartu sunnatal-muta'āqidīna 'alā katmi hādzal-'ilmi falan aksira kalāmallāhi 'Azza wa Jalla, alladzī anzalahū fī kitābihī [ Yu'til-hikmata man yasyā'u ] idz lā yajūzu an ata'addā hādzihil-hudūda wa sanadha'ul-qawā'ida wa nadha'u amtsilatan jammatan wa nukmilu bil-isyārati fasta'īnū 'alā umūrikum bil-istighfāri wash-shalāti 'alā Rasūlillāhi shallallāhu 'alaihi wa sallama hattā yaftahallāhu lakum fahuwal-Fattāhul-'Alīmu.", "terj": "Jawaban yang memuaskan (menyembuhkan keraguan).\n\nPertanyaan Ketiga: Malaikat Jibrā'īl 'alaihis-salām, meskipun beliau termasuk golongan Malaikat Muqarrabīn (yang didekatkan kepada Allah), mengapa huruf-huruf pertamanya `[ ج ، ب ]` `[Rajah Huruf — tidak diterjemahkan]` merupakan huruf-huruf Zhulmāniyyah?\nBenar wahai saudaraku karena Allah, janganlah engkau membandingkan antara makhluk yang dinamai langsung oleh Allah 'Azza wa Jalla dengan apa yang kita lakukan dalam menyusun huruf-huruf khadim rūhānī! Kaidah yang kita terapkan untuk menertibkan huruf-huruf khadim rūhānī agar tetap berupa huruf-huruf Nūrāniyyah (bercahaya) mengandung dua tujuan kerja: Pertama, kita menetapkan huruf-huruf Nūrāniyyah-nya agar bersifat membakar (menundukkan) terhadap khadim bawahnya; Kedua, agar kita tidak keluar dari lingkup arwah rūhāniyyah yang ditugaskan pada pekerjaan-pekerjaan yang manusia menjadi sebab terjadinya, karena kita tidak boleh melampaui batas yang diizinkan bagi kita, sebab akal kita tidak akan sanggup memikulnya. Maka sebagai rahmat dari Allah kepada kita, Dia menundukkan ilmu ini bagi kita sesuai batas kemampuan kita.\nAdapun huruf `[ ج ب ]` `[Rajah Huruf — tidak diterjemahkan]` keduanya adalah huruf *Zhulmāniyyah 'Ulwiyyah* (huruf Zhulmāniyyah yang berada pada martabat tinggi/langit), dan demikian pula huruf `[ د ]` `[Rajah Huruf — tidak diterjemahkan]` pada nama Nabi Muhammad shallallahu 'alaihi wa sallam adalah huruf *Zhulmāniyyun 'Ulwiyyun*.\nAdapun mengenai kaidah-kaidah ilmu huruf (*al-qawā'idul-harfiyyah*), maka sebagian besarnya disembunyikan; bahkan kalaupun engkau menemukan suatu kaidah di dalam sebuah kitab, niscaya engkau akan mendapatinya tidak lengkap atau telah diubah (dikaburkan). Setiap orang dari kalian tentu akan bertanya: \"Mengapa mereka (para ulama terdahulu) melakukan hal itu?\" Maka aku katakan kepada kalian dengan perkataan yang jujur: Seandainya mereka tidak menyembunyikan hal itu, niscaya pada hari ini kita akan saling memerangi satu sama lain dengan senjata yang tidak ada obat penawarnya kecuali orang yang disembuhkan langsung oleh Allah 'Azza wa Jalla! Maka Mahasuci Dzat yang telah meletakkan di dalam huruf-huruf Kitab-Nya kekuatan luar biasa ini dengan izin-Nya; Mahasuci Dia, betapa agung urusan-Nya. Dan aku ingin memberikan peringatan penting atas berbagai perkara yang banyak tersebar di dalam kitab-kitab kaum (ahli hikmah): barangsiapa berkata \"Ambillah satu nama dari Asmā'ul-Husnā lalu pecahkanlah huruf-hurufnya (*kassirhā* / *taksīr*)\", maka sungguh ia telah mengubah (*tahrīf*) nama-nama Allah 'Azza wa Jalla! Dan barangsiapa berkata \"Ambillah satu ayat Al-Qur'an lalu pecahkanlah huruf-hurufnya (*kassirhā*)\", maka sungguh ia telah mengubah (*tahrīf*) Kalam Allah! Sebab kaidah-kaidah dalam perhitungan (*hisāb*) ayat Al-Qur'an dan Asmā'ul-Husnā berbeda sama sekali dan memiliki metode-metode khusus tersendiri yang berada pada suatu tingkatan yang disebut **Martabatul-Ittishālil-Kaunī** (Tingkatan Keterhubungan Kosmis). Seluruh rahasia itu berada di dalam ke-28 huruf Hijaiyah. Kita memohon kepada Allah 'Azza wa Jalla agar menolong kita untuk membimbing tangan kalian hingga perkara ini menjadi terang benderang bagi kalian. Segala yang aku pinta dari kalian adalah gunakanlah akal pikiran kalian sebagai timbangan, bandingkanlah dengan akal sehat, dan cermatilah dengan cerdas apa yang kami sebutkan dan kami letakkan berupa kaidah-kaidah. Karena meskipun aku telah mendobrak tradisi para ulama yang bersepakat menyembunyikan ilmu ini, aku sekali-kali tidak akan melanggar Kalam Allah 'Azza wa Jalla yang telah Dia turunkan di dalam Kitab-Nya: [ \"Dia menganugerahkan hikmah kepada siapa yang Dia kehendaki\" (QS. Al-Baqarah: 269) ], sebab tidak halal bagiku melampaui batas-batas ini. Kami telah meletakkan kaidah-kaidah dan memberikan contoh-contoh yang sangat banyak, serta menyempurnakannya dengan isyarat bagi orang yang berakal. Maka mohonlah pertolongan dalam segala urusan kalian dengan memperbanyak istighfar dan shalawat atas Rasulullah shallallahu 'alaihi wa sallam hingga Allah membukakan pintu kefahaman bagi kalian, karena sesungguhnya Dia adalah Al-Fattāh (Maha Pembuka) lagi Al-'Alīm (Maha Mengetahui).", "syarah": "1. **Perbedaan Huruf *Zhulmāniyyah 'Ulwiyyah* pada Nama Ilahiah vs Kaidah Ekstraksi Khadim**:\n   - Syeikh al-Basyir menjelaskan mengapa nama Malaikat `جِبْرَائِيل` memuat huruf `[ ج ]` dan `[ ب ]` serta nama Nabi `مُحَمَّد` صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ memuat huruf `[ د ]` yang secara tabel termasuk 14 huruf *Zhulmāniyyah*:\n     1. Nama yang ditetapkan langsung oleh Allah Ta'ala (*tauqīfī*) tidak tunduk pada rekayasa *istinthāq* manusia; huruf `[ ج ب ]` dan `[ د ]` pada nama mulia tersebut berstatus **Huruf Zhulmāniyyah 'Ulwiyyah** (bermartabat tinggi/langit).\n     2. Adapun kaidah penyaringan huruf *Nūrāniyyah* (`صراط علي حق نمسكه`) yang diajarkan pada Pelajaran ke-8 dan ke-9 khusus diberlakukan ketika manusia mengekstraksi nama *khadim rūhānī* dari wafaq, dengan dua tujuan: (a) agar nama rūhānī itu membakar/menundukkan khadim suflī di bawahnya, dan (b) agar praktisi tidak keluar dari batas kemampuan akal manusia.\n\n2. **Larangan Keras Melakukan *Taksīr* (Pemecahan Huruf) pada Ayat Al-Qur'an & Asmā'ul-Husnā**:\n   - Syeikh al-Basyir memperingatkan bahwa metode *taksīr* (memecah dan mengacak urutan huruf) yang biasa diterapkan pada kalimat hajat manusia **haram diterapkan pada Asmā'ul-Husnā dan ayat-ayat Al-Qur'an**, karena tindakan itu mengubah susunan Kalamullah (*tahrīf*). Hisab ayat dan Asmā'ul-Husnā memiliki metode khusus tersendiri pada tingkatan ***Martabatul-Ittishālil-Kaunī***.", "khus": "1. **Kunci Pembuka Ilmu (*Miftāhul-Fath*) menurut Syeikh al-Basyir**:\n   - Menggabungkan ketajaman akal pikiran (*tahkīmul-'uqūl*) dalam mencermati kaidah dan isyarat kitab.\n   - Menjaga batas syariat dengan tidak melakukan *taksīr* atas ayat Al-Qur'an maupun Asmā'ul-Husnā.\n   - Memperbanyak **istighfar** dan **shalawat atas Rasulullah shallallahu 'alaihi wa sallam** sebagai kunci pembuka kefahaman (*fath*) dari Allah *Al-Fattāhul-'Alīm*."}, {"hal": "65", "title": "HALAMAN 65 — خَاتِمَةُ الْكِتَابِ", "imgs": ["hal_65.png"], "arab": "تَمَّ بِعَوْنِ اللهِ الِانْتِهَاءُ مِنْ جَمْعِ فَوَائِدَ وَمُجَرَّبَاتٍ وَرِيَاضَاتٍ\nوَدُرُوسِ\nشَيْخِنَا الْجَلِيلِ\nالْبَشِيرِ\nرَبِّي يُبَارِكُ فِيهِ وَيَحْفَظُهُ\nالْحُقُوقُ مَحْفُوظَةٌ\nلِمُنْتَدَيَاتِ الْأَنْوَارِ الْقَادِرِيَّةِ وَالْأَرْوَاحِ الرَّحْمَانِيَّةِ\nالرَّاجِيَةُ عَفْوَ رَبِّهَا\nخَادِمَتُكُمْ\nعَابِدَةُ اللهِ\nأَسْأَلُكُمُ الدُّعَاءَ بِالْخَيْرِ لِزَوْجِي وَأَوْلَادِي\nوَإِهْدَاءَ الْفَاتِحَةِ إِلَى رُوحِ أُمِّي وَأَبِي", "latin": "Tamma bi'aunillāhil-intihā'u min jam'i fawā'ida wa mujarrabātin wa riyādhātin\nwa durūsi\nSyaikhināl-Jalīli\nAl-Basyīri\nRabbī yubāriku fīhi wa yahfazhuhū\nAl-huqūqu mahfūzhatun\nLimuntadayātil-Anwāril-Qādiriyyati wal-Arwāhir-Rahmāniyyati\nAr-rājiyatu 'afwa Rabbihā\nKhādimatukum\n'Ābidatullāhi\nAs'alukumud-du'ā'a bil-khairi lizaujī wa aulādī\nWa ihdā'al-Fātihati ilā rūhi ummī wa abī.", "terj": "Telah sempurna dengan pertolongan Allah penyelesaian penghimpunan berbagai faidah, mujarrabat, riyadhah,\ndan pelajaran-pelajaran dari\nSyeikh kami yang mulia\nAl-Basyīr —\nsemoga Tuhanku memberkahi beliau dan senantiasa menjaga beliau.\nHak cipta dilindungi\nuntuk Forum Al-Anwār Al-Qādiriyyah wal-Arwāh Ar-Rahmāniyyah\nYang mengharapkan ampunan Tuhannya,\npelayan kalian:\n'Ābidatullāh.\nAku memohon kepada kalian doa kebaikan untuk suamiku dan anak-anakku,\nserta menghadiahkan bacaan Surah Al-Fatihah untuk ruh ibuku dan ayahku.", "syarah": "1. **Riyādhāt** (Halaman 29–39);\n     2. **Durūsusy-Syaikh al-Basyīr** — 10 Pelajaran Ilmu Wafaq, Istinthāq, dan Rahasia Huruf (Halaman 40–64).", "khus": "1. **Adab Penutup Pembaca & Pengamal Kitab (*Wasiat Penyusun*)**:\n   - Mendoakan keberkahan dan penjagaan Allah bagi mualif ilmu dalam kitab ini, **Asy-Syaikh al-Jalīl al-Basyīr**.\n   - Mendoakan kebaikan bagi penghimpun kitab (**'Ābidatullāh**), suami, dan anak-anak beliau.\n   - Membaca dan menghadiahkan **Surah Al-Fatihah** kepada ruh kedua orang tua beliau (ibu dan ayah beliau) serta seluruh masyayikh ilmu hikmah."}];
let currentIdx = 0;

function renderMdBlock(text, isArab) {
  if (!text) return '';
  const lines = text.split('\n');
  let html = '';
  let inTable = false;
  let tableRows = [];

  function flushTable() {
    if (!tableRows.length) return;
    html += '<table class="wafaq-tbl"><tbody>';
    tableRows.forEach((r, idx) => {
      if (r.every(c => /^[-:\s]+$/.test(c))) return;
      html += '<tr>' + r.map(c => '<td>' + escapeHtml(c.trim()) + '</td>').join('') + '</tr>';
    });
    html += '</tbody></table>';
    tableRows = [];
    inTable = false;
  }

  let textBuf = [];
  function flushText() {
    if (!textBuf.length) return;
    const raw = escapeHtml(textBuf.join('\n'))
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/`([^`]+)`/g, '<code>$1</code>');
    html += '<div class="' + (isArab ? 'arab-text' : 'body-text') + '">' + raw + '</div>';
    textBuf = [];
  }

  for (const ln of lines) {
    const t = ln.trim();
    if (t.startsWith('|') && t.endsWith('|')) {
      flushText();
      inTable = true;
      const cells = t.slice(1, -1).split('|');
      tableRows.push(cells);
    } else {
      if (inTable) flushTable();
      textBuf.push(ln);
    }
  }
  if (inTable) flushTable();
  flushText();
  return html;
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function selectPage(idx) {
  currentIdx = idx;
  const p = PAGES[idx];
  document.getElementById('pageTitle').textContent = p.title;
  document.getElementById('prevBtn').disabled = (idx === 0);
  document.getElementById('nextBtn').disabled = (idx === PAGES.length - 1);

  document.querySelectorAll('.nav-btn').forEach((b, i) => {
    b.classList.toggle('active', i === idx);
  });

  const scanBox = document.getElementById('scanBox');
  const mainGrid = document.getElementById('mainGrid');
  if (p.imgs && p.imgs.length > 0) {
    scanBox.style.display = 'block';
    mainGrid.style.gridTemplateColumns = '';
    scanBox.innerHTML = p.imgs.map(src => '<img src="' + src + '" alt="Hal ' + p.hal + '">').join('');
  } else {
    scanBox.style.display = 'none';
    mainGrid.style.gridTemplateColumns = '1fr';
  }

  const layers = [
    { label: 'arab', content: p.arab, isArab: true },
    { label: 'latin', content: p.latin, isArab: false },
    { label: 'Terjemahan', content: p.terj, isArab: false },
    { label: 'Syarah dan Penjelasan', content: p.syarah, isArab: false },
    { label: 'Khususiyah dan Tatacara Praktik', content: p.khus, isArab: false }
  ];

  document.getElementById('layersBox').innerHTML = layers.map(l =>
    '<div class="layer-card"><div class="layer-tag">' + l.label + '</div>' +
    renderMdBlock(l.content, l.isArab) + '</div>'
  ).join('');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function stepPage(delta) {
  const next = currentIdx + delta;
  if (next >= 0 && next < PAGES.length) selectPage(next);
}

const navBar = document.getElementById('navBar');
PAGES.forEach((p, idx) => {
  const btn = document.createElement('button');
  btn.className = 'nav-btn';
  btn.textContent = 'Hal ' + p.hal;
  btn.onclick = () => selectPage(idx);
  navBar.appendChild(btn);
});
selectPage(0);
</script>
